<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Семейный бюджет — интерактивная мастерская, 4 класс</title>
<style>
:root{--ink:#20303c;--muted:#607480;--teal:#167b70;--teal2:#e8f4f1;--line:#dbe5e8;--bg:#f3f6f8;--red:#a73d32;--redbg:#fff0ed;--gold:#8c631a;--goldbg:#fff8e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:950px;margin:25px auto;padding:0 18px 40px}.shell{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 45px #2439430b;overflow:hidden}.header{padding:26px 30px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.overline{color:var(--teal);font-size:13px;font-weight:750;letter-spacing:.055em;text-transform:uppercase}h1{font-size:29px;line-height:1.2;margin:5px 0 0}h2{font-size:24px;line-height:1.3;margin:0 0 12px}h3{font-size:17px;margin:0 0 9px}.small{font-size:13px;color:var(--muted)}p{margin:9px 0}.content{padding:26px 30px 34px}.steps{display:flex;gap:5px;padding:16px 30px;background:#fcfdfd;border-bottom:1px solid var(--line)}.step{flex:1;border-radius:7px;background:#edf2f4;text-align:center;font-size:12px;font-weight:650;padding:9px 2px;color:#627580}.step.active{background:var(--teal);color:#fff}.step.past{background:#d9efe7;color:#126251}.btn{background:var(--teal);color:white;border:1px solid var(--teal);padding:12px 18px;border-radius:11px;font-weight:700;min-height:46px}.btn.secondary{color:var(--ink);background:white;border:1px solid var(--line)}.btn:hover:not(:disabled){filter:brightness(.96)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.card{border:1px solid var(--line);background:white;border-radius:13px;padding:18px;margin-top:13px}.subtle{background:#f5f8f9}.question{font-weight:700;font-size:17px;margin-bottom:11px}.options{display:grid;gap:8px}.option{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:#4da496;background:var(--teal2)}.option input{accent-color:var(--teal);width:17px;height:17px}.option.locked{cursor:default}.feedback{margin-top:14px;border-radius:11px;border:1px solid #9ed1be;background:#eff9f4;padding:14px 15px}.feedback.warn{border-color:#ead49c;background:var(--goldbg)}.feedback.error{border-color:#ebb2aa;background:var(--redbg)}.feedback p{margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.score{font-size:28px;font-weight:800;color:var(--teal)}.bar{height:11px;border-radius:50px;background:#e4eded;overflow:hidden;margin:12px 0}.fill{background:var(--teal);height:100%;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.purchase{border:1px solid var(--line);border-radius:12px;min-height:158px;padding:15px;cursor:pointer;background:white;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;color:var(--ink);width:100%}.purchase:hover{border-color:#9abfb7}.purchase.selected{background:var(--teal2);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}.purchase .check{align-self:flex-end;font-size:17px;color:var(--teal)}.purchase .name{font-weight:650;line-height:1.35}.purchase .cost{font-size:19px;font-weight:800}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.numberbox{background:#f0f5f6;padding:14px;border-radius:12px}.numberbox .num{font-size:21px;font-weight:800;white-space:nowrap}.note{font-size:14px;color:var(--muted)}.badge{display:inline-block;border-radius:7px;font-size:12px;font-weight:750;padding:3px 7px;background:#e3f4ec;color:#176c4e}.bad{color:var(--red)}.good{color:#08764b}.report{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.report .card{margin:0}.resulttable{width:100%;border-collapse:collapse;margin-top:13px}.resulttable td{border-bottom:1px solid var(--line);padding:10px 3px}.resulttable td:last-child{text-align:right;white-space:nowrap;font-weight:650}.separator{border:0;border-top:1px solid var(--line);margin:18px 0}.footer{margin-top:18px;color:var(--muted);font-size:12px}.hidden{display:none}.analysis-lines{padding-left:19px;margin:10px 0}.analysis-lines li{padding:3px 0}.radio-result{margin-left:auto;font-size:14px;font-weight:750}.print-only{display:none}
@media(max-width:650px){.wrap{margin:0;padding:0}.shell{border:0;border-radius:0}.header,.content{padding:18px}.steps{padding:12px 18px}.step{font-size:10px;padding:8px 1px}.grid{grid-template-columns:1fr}.numbers{grid-template-columns:1fr 1fr}.numberbox .num{font-size:17px}.header h1{font-size:24px}.report{grid-template-columns:1fr}}
@media print{body{background:white}.wrap{margin:0;padding:0;max-width:none}.shell{border:0;box-shadow:none}.header{padding:7px 0 13px}.steps,.actions,.noprint{display:none!important}.content{padding:15px 0}.print-only{display:block}.card{break-inside:avoid}.report{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap"><div class="shell"><header class="header"><div><div class="overline">Познание мира · 4 класс</div><h1>Семейный бюджет</h1></div><button id="restart" class="btn secondary noprint">Начать заново</button></header><nav id="steps" class="steps" aria-label="Этапы работы"></nav><main class="content" id="app"></main></div></div>
<script>
'use strict';
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₸';
const diagnostic=[
 {q:'Что относится к доходам семьи?',o:['Покупка продуктов','Заработная плата','Оплата квартиры'],a:1,why:'Заработная плата пополняет семейный бюджет. Покупки и платежи уменьшают его.'},
 {q:'Семья получила 300 000 ₸ и потратила 240 000 ₸. Сколько осталось?',o:['60 000 ₸','140 000 ₸','540 000 ₸'],a:0,why:'300 000 − 240 000 = 60 000 ₸.'},
 {q:'Почему семье полезно заранее планировать расходы?',o:['Чтобы потратить все деньги без остатка','Чтобы покупать только товары со скидками','Чтобы соотносить расходы с доходами'],a:2,why:'План помогает учитывать возможности семьи и заранее обдумывать покупки.'}
];
const choices=[
 {id:'pipe',name:'Вода из крана попадает под кухонный шкаф. Вызов мастера',cost:26000},
 {id:'shoes',name:'У школьника порвалась единственная пара осенней обуви. Новая пара',cost:32000},
 {id:'cinema',name:'Семья давно хотела вместе сходить в кино',cost:18000},
 {id:'game',name:'Дети выбрали новую настольную игру',cost:14000},
 {id:'lamp',name:'Для гостиной понравилась новая настольная лампа',cost:22000},
 {id:'kettle',name:'В магазине появилась более современная модель чайника. Старый работает',cost:28000}
];
const rules=[
 {q:'Если планируемые расходы больше доходов семьи, что разумнее сделать?',o:['Пересмотреть некоторые покупки','Не учитывать небольшие расходы','Запланировать ещё несколько покупок'],a:0,h:'Сравни сумму расходов с деньгами, которыми располагает семья.'},
 {q:'Почему семье полезно оставлять часть денег на непредвиденные случаи?',o:['Чтобы не знать, сколько осталось денег','Чтобы справляться с неожиданными расходами','Чтобы не учитывать эту сумму в бюджете'],a:1,h:'Подумай, можно ли заранее предвидеть все расходы.'},
 {q:'Какое утверждение о семейном бюджете верно?',o:['Все желания нужно выполнять сразу','План расходов никогда нельзя менять','Бюджет можно пересматривать при изменении обстоятельств'],a:2,h:'Вспомни, что произошло после поломки стиральной машины.'}
];
const defaultState=()=>({stage:'diag',answers:[null,null,null],diagDone:false,picked:[],planReviews:0,planFeedback:false,firstPlan:null,history:[],eventAnswer:null,eventChecked:false,eventWrong:0,eventPassed:false,ruleIndex:0,ruleAnswer:null,ruleChecked:false,ruleWrong:0,ruleLogs:[]});
let state=defaultState();const root=document.getElementById('app');const STEP=['diag','plan','event','rules','end'];const TITLES=['Проверка','Бюджет','Событие','Правила','Итог'];
function score(){return diagnostic.filter((q,i)=>state.answers[i]===q.a).length}
function selected(){return choices.filter(c=>state.picked.includes(c.id))}
function used(){return selected().reduce((n,c)=>n+c.cost,0)}
function rest(){return 100000-used()}
function urgent(){return state.picked.includes('pipe')&&state.picked.includes('shoes')}
function canMove(){return state.picked.length>0&&rest()>=0}
function safe(){return rest()>=15000}
function expectation(){return safe()?'use':'revise'}
function feedbackLines(){const arr=[];if(rest()<0)arr.push('План превышает доступную сумму на '+money(-rest())+'. Подумай, какие покупки можно перенести.');else arr.push('Выбранные покупки укладываются в доступную сумму.');if(!state.picked.includes('pipe'))arr.push('Кран остаётся неисправным. Что может произойти с мебелью, если ремонт отложить?');if(!state.picked.includes('shoes'))arr.push('У школьника нет подходящей осенней обуви. Как это повлияет на повседневную жизнь?');if(urgent())arr.push('Ты предусмотрел решение двух ситуаций, которые уже мешают семье.');if(rest()>=15000)arr.push('После покупок остаётся '+money(rest())+'. Что произойдёт, если семье срочно потребуются дополнительные деньги?');else if(rest()>=0)arr.push('После покупок остаётся '+money(rest())+'. Хватит ли этой суммы на неожиданные расходы?');return arr}
function stepNav(){const i=STEP.indexOf(state.stage);document.getElementById('steps').innerHTML=TITLES.map((x,j)=>`<div class="step ${i===j?'active':i>j?'past':''}">${x}</div>`).join('')}
function options(group,selectedValue,disabled=false){return `<div class="options">${group.map((o,i)=>`<label class="option ${disabled?'locked':''}"><input type="radio" name="choice" value="${i}" ${selectedValue===i?'checked':''} ${disabled?'disabled':''}><span>${o}</span></label>`).join('')}</div>`}
function renderDiag(){root.innerHTML=`<h2>1. Проверь свои знания</h2><p class="note">Выбери один ответ в каждом задании.</p>${diagnostic.map((q,i)=>`<section class="card"><div class="row"><span class="small">Вопрос ${i+1}</span>${state.diagDone?`<span class="radio-result ${state.answers[i]===q.a?'good':'bad'}">${state.answers[i]===q.a?'✓ Верно':'✕ Ошибка'}</span>`:''}</div><div class="question">${q.q}</div><div class="options">${q.o.map((o,j)=>`<label class="option ${state.diagDone?'locked':''}"><input type="radio" name="diag${i}" value="${j}" ${state.answers[i]===j?'checked':''} ${state.diagDone?'disabled':''}><span>${o}</span></label>`).join('')}</div>${state.diagDone?`<div class="note" style="margin-top:10px">${q.why}</div>`:''}</section>`).join('')}${state.diagDone?`<div class="feedback"><div class="row"><strong>Твой результат</strong><span class="score">${score()} из 3</span></div><div class="bar"><div class="fill" style="width:${score()/3*100}%"></div></div><p>${score()===3?'Отлично! Теперь попробуй применить знания на практике.':score()===2?'Хорошее начало! Следующее задание поможет закрепить знания.':'В практической задаче ты сможешь проверить свои решения и при необходимости их изменить.'}</p></div><div class="actions"><button class="btn" data-act="toPlan">Составить бюджет →</button></div>`:`<div class="actions"><button class="btn" id="checkDiag" ${state.answers.some(x=>x===null)?'disabled':''}>Проверить ответы</button></div>`}`;
if(!state.diagDone){root.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{state.answers[Number(e.target.name.slice(4))]=Number(e.target.value);render()}));const btn=document.getElementById('checkDiag');btn?.addEventListener('click',()=>{state.diagDone=true;render()})}else{root.querySelector('[data-act=toPlan]').addEventListener('click',()=>{state.stage='plan';render()})}}
function renderPlan(){root.innerHTML=`<h2>2. Семья планирует расходы</h2><p>В этом месяце семья получила <strong>340 000 ₸</strong>. На питание, коммунальные услуги, транспорт и другие регулярные расходы уже предусмотрено <strong>240 000 ₸</strong>.</p><div class="numbers"><div class="numberbox"><div class="small">Доход</div><div class="num">340 000 ₸</div></div><div class="numberbox"><div class="small">Учтённые расходы</div><div class="num">240 000 ₸</div></div><div class="numberbox"><div class="small">Осталось</div><div class="num">100 000 ₸</div></div></div><p style="margin-top:18px">Семья обсудила несколько дел и покупок на этот месяц. <strong>Выбери, на что потратить деньги сейчас, а что можно отложить.</strong></p><div class="grid">${choices.map(c=>`<button class="purchase ${state.picked.includes(c.id)?'selected':''}" data-pick="${c.id}" aria-pressed="${state.picked.includes(c.id)}"><span class="check">${state.picked.includes(c.id)?'☑':'□'}</span><span class="name">${c.name}</span><span class="cost">${money(c.cost)}</span></button>`).join('')}</div><section class="card subtle"><div class="row"><strong>Запланированные расходы</strong><strong>${money(used())}</strong></div><div class="bar"><div class="fill" style="width:${Math.min(100,used()/1000)}%;background:${rest()<0?'#ba594f':'var(--teal)'}"></div></div><div class="row"><span>Остаток</span><strong class="${rest()<0?'bad':''}">${money(rest())}</strong></div></section><div class="actions"><button class="btn" id="checkPlan" ${!state.picked.length?'disabled':''}>Проверить мой план</button></div>${state.planFeedback?`<section class="feedback ${rest()<0?'error':(!urgent()||!safe())?'warn':''}"><h3>Что получилось?</h3><ul class="analysis-lines">${feedbackLines().map(s=>`<li>${s}</li>`).join('')}</ul><div class="actions">${canMove()?'<button class="btn" id="toEvent">Посмотреть, что случилось дальше →</button>':''}</div></section>`:''}`;
root.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.pick;state.picked=state.picked.includes(id)?state.picked.filter(x=>x!==id):[...state.picked,id];state.planFeedback=false;render()}));document.getElementById('checkPlan').addEventListener('click',()=>{state.planReviews++;state.planFeedback=true;if(state.firstPlan===null)state.firstPlan={overspent:rest()<0,urgent:urgent(),safe:safe()};state.history.push({spent:used(),remaining:rest(),urgent:urgent()});render()});document.getElementById('toEvent')?.addEventListener('click',()=>{state.stage='event';state.eventAnswer=null;state.eventChecked=false;render()})}
function renderEvent(){const outcome=expectation();root.innerHTML=`<h2>3. Неожиданное событие</h2><section class="card subtle"><h3>Сломалась стиральная машина</h3><p>На срочный ремонт требуется <strong>15 000 ₸</strong>.</p><hr class="separator"><div class="row"><span>Осталось по твоему плану</span><strong>${money(rest())}</strong></div></section><div class="card"><div class="question">Как теперь лучше поступить семье?</div><div class="options">${[{v:'use',t:'Оплатить ремонт из оставшихся денег'},{v:'debt',t:'Взять в долг 15 000 ₸, не меняя план'},{v:'revise',t:'Пересмотреть план покупок, чтобы найти деньги на ремонт'}].map(o=>`<label class="option"><input type="radio" name="event" value="${o.v}" ${state.eventAnswer===o.v?'checked':''}><span>${o.t}</span></label>`).join('')}</div></div><div class="actions"><button class="btn" id="checkEvent" ${state.eventAnswer===null?'disabled':''}>Проверить решение</button></div>${state.eventChecked?(state.eventAnswer===outcome?`<div class="feedback"><h3>✓ Разумное решение!</h3><p>${safe()?`После оплаты ремонта останется <strong>${money(rest()-15000)}</strong>. Семье не придётся занимать деньги.`:`В первоначальном плане на ремонт не хватает <strong>${money(15000-rest)}</strong>. Часть покупок нужно перенести.`}</p><div class="actions"><button class="btn" id="proceedEvent">${safe()?'Восстановить правила →':'Изменить план →'}</button></div></div>`:`<div class="feedback warn"><h3>Подумай ещё</h3><p>${safe()?'Сравни стоимость ремонта с деньгами, оставшимися у семьи. Нужен ли долг?':'Сравни стоимость ремонта с остатком денег. Можно ли сначала изменить будущие расходы, а не брать долг?'}</p></div>`):''}`;
root.querySelectorAll('input[name=event]').forEach(el=>el.addEventListener('change',e=>{state.eventAnswer=e.target.value;state.eventChecked=false;render()}));document.getElementById('checkEvent').addEventListener('click',()=>{state.eventChecked=true;if(state.eventAnswer!==outcome)state.eventWrong++;else state.eventPassed=true;render()});document.getElementById('proceedEvent')?.addEventListener('click',()=>{if(safe())state.stage='rules';else{state.stage='plan';state.planFeedback=false}render()})}
function renderRules(){const q=rules[state.ruleIndex];root.innerHTML=`<h2>4. Восстанови правила</h2><p class="small">Задание ${state.ruleIndex+1} из 3</p><section class="card"><div class="question">${q.q}</div><div class="options">${q.o.map((o,i)=>`<label class="option"><input type="radio" name="rule" value="${i}" ${state.ruleAnswer===i?'checked':''}><span>${o}</span></label>`).join('')}</div></section><div class="actions"><button class="btn" id="checkRule" ${state.ruleAnswer===null?'disabled':''}>Проверить ответ</button></div>${state.ruleChecked?(state.ruleAnswer===q.a?`<div class="feedback"><h3>✓ Верно!</h3><div class="actions"><button class="btn" id="nextRule">${state.ruleIndex===2?'Посмотреть результат →':'Следующее правило →'}</button></div></div>`:`<div class="feedback warn"><h3>Попробуй ещё раз</h3><p>${q.h}</p></div>`):''}`;
root.querySelectorAll('input[name=rule]').forEach(el=>el.addEventListener('change',e=>{state.ruleAnswer=Number(e.target.value);state.ruleChecked=false;render()}));document.getElementById('checkRule').addEventListener('click',()=>{state.ruleChecked=true;if(state.ruleAnswer!==q.a)state.ruleWrong++;render()});document.getElementById('nextRule')?.addEventListener('click',()=>{state.ruleLogs.push({first:state.ruleWrong===0});state.ruleWrong=0;state.ruleIndex++;state.ruleAnswer=null;state.ruleChecked=false;if(state.ruleIndex===3)state.stage='end';render()})}
function ruleScore(){return state.ruleLogs.filter(r=>r.first).length}
function reportText(){return ['ПОЗНАНИЕ МИРА — 4 КЛАСС','Тема: «Семейный бюджет»',`Начальная проверка: ${score()}/3`,`Проверок бюджета: ${state.planReviews}`,`Первоначальный план: ${state.firstPlan?.overspent?'превышен бюджет':'в пределах бюджета'}; срочные проблемы: ${state.firstPlan?.urgent?'учтены':'учтены не все'}; на непредвиденные расходы: ${state.firstPlan?.safe?'достаточно денег':'недостаточно денег'}`,`Расходы по окончательному плану: ${money(used())}`,`Остаток до ремонта машины: ${money(rest())}`,`Остаток после ремонта машины: ${money(rest()-15000)}`,`Ошибочных решений в неожиданной ситуации: ${state.eventWrong}`,`Восстановление правил с первого раза: ${ruleScore()}/3`,'Выбранные покупки:',...selected().map(x=>`• ${x.name}: ${money(x.cost)}`)].join('\n')}
function renderEnd(){root.innerHTML=`<div style="text-align:center;padding:5px 0 15px"><div style="color:var(--teal);font-size:35px">✓</div><h2>Работа завершена!</h2><p>Ты составил план семейного бюджета и проверил его в неожиданной ситуации.</p></div><div class="report"><div class="card"><div class="small">Начальная проверка</div><div class="score">${score()} из 3</div></div><div class="card"><div class="small">Правила с первого раза</div><div class="score">${ruleScore()} из 3</div></div><div class="card"><div class="small">Проверок плана</div><div class="score">${state.planReviews}</div></div><div class="card"><div class="small">Решение непредвиденной ситуации</div><strong>${state.eventWrong===0?'С первого раза':'После исправления'}</strong></div></div><section class="card"><h3>Твой семейный бюджет</h3><table class="resulttable"><tbody>${selected().map(x=>`<tr><td>${x.name}</td><td>${money(x.cost)}</td></tr>`).join('')}<tr><td><strong>Расходы по плану</strong></td><td>${money(used())}</td></tr><tr><td><strong>Остаток до ремонта</strong></td><td>${money(rest())}</td></tr><tr><td><strong>Остаток после ремонта</strong></td><td>${money(rest()-15000)}</td></tr></tbody></table></section><section class="feedback"><h3>Что показала работа</h3><p>${state.firstPlan?.overspent?'Сначала расходы превысили бюджет, но затем ты пересмотрел план.':'Ты составлял план в пределах имеющейся суммы.'} ${state.firstPlan?.urgent?'Ты учёл две важные потребности семьи.':'Твой первоначальный план не учитывал все важные потребности семьи.'} ${state.firstPlan?.safe?'В первом плане оставалось достаточно денег на неожиданный ремонт.':'При планировании пришлось учесть риск неожиданных расходов.'}</p></section><div class="actions noprint"><button class="btn" id="copy">Скопировать результат</button><button class="btn secondary" id="print">Распечатать результат</button><button class="btn secondary" id="again">Начать заново</button></div><p id="copyStatus" class="small" role="status"></p>`;document.getElementById('copy').addEventListener('click',async()=>{const msg=reportText();try{await navigator.clipboard.writeText(msg);document.getElementById('copyStatus').textContent='Результат скопирован.'}catch{const area=document.createElement('textarea');area.value=msg;document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();document.getElementById('copyStatus').textContent=ok?'Результат скопирован.':'Не удалось скопировать автоматически. Используй печать или скриншот.'}});document.getElementById('print').addEventListener('click',()=>window.print());document.getElementById('again').addEventListener('click',restart)}
function render(){stepNav();if(state.stage==='diag')renderDiag();if(state.stage==='plan')renderPlan();if(state.stage==='event')renderEvent();if(state.stage==='rules')renderRules();if(state.stage==='end')renderEnd()}
function restart(){state=defaultState();render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('restart').addEventListener('click',restart);render();
</script></body></html>
