<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Изменение экосистемы — Я познаю мир, 4 класс</title>
<style>
:root{--green:#19765e;--dark:#173e35;--light:#eaf6ee;--bg:#f5f8f4;--text:#23342e;--muted:#63766b;--line:#d5e2d7;--bad:#bc4545;--gold:#91631b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.48 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text)}main{max-width:940px;margin:24px auto;padding:0 15px 50px}.shell{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px #17473410;overflow:hidden}.top{background:linear-gradient(118deg,#155e4b,#32956b);color:#fff;padding:25px 30px}.top h1{font-size:clamp(23px,4vw,33px);line-height:1.15;margin:4px 0 10px}.top p{margin:0;color:#e3f8eb}.content{padding:24px 30px}.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--green);text-transform:uppercase}.muted{color:var(--muted)}.steps{display:flex;gap:6px;padding:16px 24px 2px;flex-wrap:wrap}.step{flex:1;min-width:95px;padding:9px;border-radius:9px;background:#edf2ee;text-align:center;font-size:12px;font-weight:700;color:#607367}.step.active{background:#156d56;color:white}.step.done{background:#d8f0e0;color:#175f46}.card{border:1px solid var(--line);border-radius:15px;padding:19px;margin:16px 0;background:#fff}.soft{background:var(--light)}h2{font-size:23px;line-height:1.3;margin:7px 0 12px}h3{font-size:18px;margin:0 0 12px}p{margin:9px 0}.choices{display:grid;gap:10px;margin-top:15px}.choice{display:flex;align-items:center;gap:12px;min-height:47px;padding:12px 14px;text-align:left;border:1.5px solid var(--line);border-radius:11px;background:white;cursor:pointer;color:var(--text);font:inherit}.choice:hover,.chip:hover{border-color:#58a887}.choice.sel{border-color:#438a85;background:#e7f0f3;box-shadow:inset 0 0 0 1px #438a85}.choice:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid #f1bb49;outline-offset:2px}.dot{width:19px;height:19px;border:2px solid #a8b7ad;border-radius:50%;flex-shrink:0}.sel .dot{border:6px solid var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.btn{border:0;border-radius:11px;padding:12px 19px;font:700 15px system-ui;cursor:pointer;background:var(--green);color:#fff}button.btn.secondary{background:#eaf2ed;color:#1b5e49}button.btn:disabled{opacity:.43;cursor:not-allowed}.notice{padding:14px 17px;border-radius:11px;margin-top:15px;background:#edf6f1;border-left:4px solid #35976d}.notice.bad{background:#fff0ee;border-color:#c85c4f}.notice.warn{background:#fff7e7;border-color:#dca14b}.progress{height:8px;background:#e4eee7;border-radius:12px;overflow:hidden;margin:10px 0 22px}.progress span{height:100%;display:block;background:#37a06d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stat{background:#eff6f1;border-radius:11px;padding:13px}.stat strong{font-size:24px;display:block;color:#176c50}.stat small{color:#54725f}.ecosystem{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:15px;border-radius:12px;background:#f4f8f0}.org{border:1px solid #b7d7bd;background:white;border-radius:10px;text-align:center;padding:10px;min-width:102px;flex:1}.org em{display:block;font-style:normal;font-size:27px}.arrow{font-weight:800;color:#367b56;font-size:23px}.pill{display:inline-block;background:#e1f2e7;border-radius:20px;padding:5px 12px;color:#236c53;font-weight:700;font-size:13px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid #dce7dd;text-align:left}th{background:#e7f2e9}td:not(:first-child),th:not(:first-child){text-align:center}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:600 15px system-ui;border:1.5px solid #bcd6c5;border-radius:9px;padding:10px 13px;background:white;color:#215e49;cursor:pointer}.chip.used{opacity:.4;cursor:default}.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:17px 0}.slot{min-height:65px;border:2px dashed #b9d2c0;border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}.slot.filled{background:#e4f4e8;border-style:solid;border-color:#66a989}.simgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.simbox{text-align:center;border:1px solid #d5e5d8;border-radius:10px;padding:10px;background:#fff}.simbox b{font-size:25px;color:var(--green);display:block}.meter{width:100%;accent-color:var(--green)}.hint{font-size:14px;color:#365b48}.ending{padding:20px;background:#edf7f0;border-radius:12px}.tag{font-weight:700;color:#1d6c4e}.footnote{font-size:12px;color:#748376;margin-top:10px}@media(max-width:650px){main{margin:8px auto;padding:0 8px 28px}.content{padding:17px}.top{padding:22px}.stats{grid-template-columns:1fr 1fr}.simgrid{grid-template-columns:1fr}.chain{grid-template-columns:1fr 1fr}.org{min-width:80px}.step{min-width:68px;font-size:10px}}
</style></head><body><main><div class="shell"><header class="top"><div style="font-size:13px;opacity:.9">Я ПОЗНАЮ МИР · 4 КЛАСС</div><h1>Изменение экосистемы</h1><p>Исследуй связи в природе. Узнай, как одно изменение влияет на другие.</p></header><nav id="steps" class="steps"></nav><section id="app" class="content" aria-live="polite"></section></div></main>
<script>
'use strict';
const app=document.getElementById('app'),nav=document.getElementById('steps');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const diagnostic=[
{q:'После уменьшения количества травы на лугу изменилось питание животных. Какое предположение лучше учитывает пищевые связи?',o:['Сначала может сократиться доступный корм зайцев, а затем измениться положение хищников','Уменьшение травы сначала может привести к сокращению лисиц, а уже потом — зайцев','При уменьшении травы сначала изменится численность хищников, а зайцы будут зависеть только от их количества'],a:0,why:'Изменение растений может затронуть травоядных, а затем животных, которые ими питаются. Но это прогноз, а не неизбежный результат.'},
{q:'Какое сравнение лучше поможет проверить, влияет ли недостаток воды на количество травы?',o:['Сравнить два участка, на одном из которых меньше дождей и больше вытаптывания','Сравнить два похожих участка с разным увлажнением, но одинаковой нагрузкой от людей','Сравнить два участка с одинаковым количеством осадков, но разным типом почвы'],a:1,why:'Чтобы проверить влияние воды, остальные существенные условия сравнения должны быть сходными.'},
{q:'После засухи мышей стало меньше. Какой вывод можно сделать на основании только этого наблюдения?',o:['Недостаток влаги мог уменьшить количество семян и корма, поэтому корм — уже доказанная причина','Сокращение мышей связано с ростом численности хищников, даже если их не подсчитывали','Сокращение могло быть связано с засухой, но следует проверить и другие факторы'],a:2,why:'Одновременное изменение двух показателей ещё не доказывает единственную причину.'}
];
const missions=[
{title:'Что показывают данные?',type:'choice',standard:{q:'Какое сравнение изменений численности организмов подтверждается таблицей?',o:['Доля сокращения зайцев и мышей одинакова','Доля сокращения лисиц больше доли сокращения зайцев','Доля сокращения травы меньше доли сокращения мышей'],a:0,h:['Для сравнения учитывай не только разницу, но и начальное количество.','Сравни доли уменьшения: (было − стало) относительно значения «до засухи».'],why:'Зайцев стало меньше на 16 из 40, мышей — на 20 из 50. В обоих случаях снижение составляет 40%.'},easy:{q:'На сколько уменьшилась численность зайцев по данным таблицы?',o:['На 24','На 16','На 40'],a:1,h:['Найди строку «Зайцы». Вычисли разность между значениями до и после.','Для уменьшения нужно вычесть из начального значения конечное.'],why:'Численность зайцев уменьшилась на 40 − 24 = 16.'},hard:{q:'Какой показатель сильнее всего сократился в процентах от первоначального значения?',o:['Численность мышей','Численность зайцев','Количество травы'],a:2,h:['Сравни уменьшение с первоначальным значением каждого объекта.','Трава: уменьшение на 55 из 100. У зайцев и мышей снижение меньше половины.'],why:'Травы стало меньше на 55% (100 → 45), а зайцев и мышей — на 40%.'}},
{title:'Найди прямое следствие',type:'choice',standard:{q:'На лугу после засухи стало меньше травы. Какое последствие можно ожидать прежде всего?',o:['Часть зайцев начнёт искать корм на других участках','Число лисиц обязательно уменьшится в тот же день','Число зайцев обязательно сократится ровно на такую же долю, как трава'],a:0,h:['Различай непосредственное изменение доступности пищи и отложенное изменение численности.','Оцени, какое следствие возможно без точного прогноза числа животных.'],why:'Недостаток травы может заставить зайцев искать другое место питания. Численность животных нельзя предсказать по одной доле уменьшения растений.'},easy:{q:'Если на участке стало меньше травы, что прежде всего меняется для зайцев?',o:['Доступность пищи','Потребность зайцев в укрытиях от хищников','Возможность других травоядных питаться на том же участке'],a:0,h:['Подумай, какой ресурс зайцы получают непосредственно от травы.','Нужно связать уменьшение растения с потребностью травоядного животного.'],why:'Трава служит пищей для зайцев, поэтому может сократиться доступный корм.'},hard:{q:'Через день после уменьшения травы численность лисиц пока не изменилась. Какое объяснение наиболее обоснованно?',o:['Лисицы не зависят от травоядных животных','Влияние изменений кормовой базы может проявиться позднее','Значит, засуха не повлияла на экосистему'],a:1,h:['Подумай, все ли последствия изменения экосистемы проявляются одновременно.','Изменение питания и изменение численности популяции могут происходить в разные сроки.'],why:'Изменение доступности добычи не обязательно сразу отражается на численности хищников.'}},
{title:'Построй цепочку последствий',type:'chain',steps:['Мало дождей','Уменьшилось количество травы','Зайцам стало труднее найти корм','У лисиц может стать меньше добычи'],why:'Изменение неживого условия влияет на растения, затем на травоядных и на хищников.',hint:'Найди исходное изменение среды. Затем свяжи организмы по тому, кто от кого зависит.'},
{title:'Какие доказательства убедительнее?',type:'multi',q:'Исследователи предполагают: трава стала хуже расти из-за недостатка влаги. Выбери ДВА наблюдения, которые помогут проверить это предположение.',o:['На участке одновременно уменьшились осадки и участилось вытаптывание, после чего трава стала ниже','На двух участках с одинаковой почвой и нагрузкой от людей, но разным поливом трава росла по-разному','Трава на сухом участке была ниже, но почва там оказалась беднее питательными веществами','При одинаковых освещении и почве растения с разным поливом показали разный прирост за четыре недели'],a:[1,3],h:['Лучше подходят сравнения, в которых можно отделить действие воды от других факторов.','Проверь, различаются ли сравниваемые условия только по количеству влаги.'],why:'Сравнения при сходных остальных условиях позволяют проверить влияние увлажнения на рост травы.'},
{title:'Что ещё нужно узнать?',type:'choice',standard:{q:'После засухи мышей стало меньше. Какой набор данных полезнее для проверки возможных причин?',o:['Численность мышей за два года, количество растительного корма и изменения числа хищников','Измерения влажности почвы за месяц и численность мышей только в конце месяца','Данные о численности мышей и количестве осадков, но без сведений о корме и хищниках'],a:0,h:['Проверь, позволяют ли сведения сопоставить изменения во времени и несколько возможных причин.','Нужны данные о питании, хищниках и численности мышей в разные периоды.'],why:'Изменение численности мышей может быть связано и с кормами, и с хищниками, поэтому требуется ряд наблюдений.'},easy:{q:'Число мышей уменьшилось. Что нужно для проверки причины, кроме одного подсчёта?',o:['Повторные наблюдения и сведения об условиях жизни','Повторные подсчёты мышей без учёта изменений кормовой базы','Несколько измерений температуры и влажности без данных о корме и хищниках'],a:0,h:['Одного наблюдения мало для установления причин.','Подумай, что могло измениться в питании и угрозах для мышей.'],why:'Повторные наблюдения и данные об условиях помогают отличать совпадение от возможной причины.'},hard:{q:'На лугу одновременно уменьшились осадки и увеличилось число сов. Как лучше проверить причины сокращения мышей?',o:['Сравнить участки с разными осадками, не учитывая сов','Наблюдать только количество мышей после засухи','Сопоставить данные с участков, где различия по осадкам и численности сов можно рассмотреть отдельно'],a:2,h:['Изменились сразу два возможных фактора.','Нужно организовать сравнения, позволяющие разделить их влияние.'],why:'Для оценки причин требуется отдельно учитывать доступность корма и воздействие хищников.'}},
{title:'Выбери обоснованное решение',type:'choice',standard:{q:'На лугу растения редеют. Известно, что осадков мало, а отдельные места сильно вытаптываются. Какую меру лучше сначала испытать, чтобы проверить влияние людей?',o:['Ограничить проход по части участка и сравнивать восстановление травы с похожим участком','Поливать весь луг и одновременно разрешить проход только по тропинкам','Посадить новые растения на всём лугу, не меняя движение людей'],a:0,h:['Нужно проверить действие одного фактора, а не менять сразу несколько.','Выбери действие, которое позволяет сравнить участки при сходных остальных условиях.'],why:'Ограничение вытаптывания на одном участке с последующим сравнением поможет оценить влияние человеческой нагрузки.'},easy:{q:'На одной части луга часто ходят люди, на другой — почти нет. Как проверить влияние вытаптывания?',o:['Сравнить состояние травы на этих участках при сходных прочих условиях','Полить один участок и сразу сравнить его с другим','Посчитать только количество людей за один день'],a:0,h:['Для достоверного сравнения другие условия должны быть похожи.','Важно наблюдать и траву, и нагрузку от посетителей.'],why:'Сравнение травы при близких остальных условиях помогает оценить влияние вытаптывания.'},hard:{q:'Восстановление луга планируют проверить двумя способами. Какой план позволит точнее оценить эффект ограничения прохода?',o:['Оградить участок и дополнительно поливать его, не фиксируя остальные условия','Сравнить два похожих участка, ограничив проход только на одном и наблюдая траву несколько недель','Оградить участок и измерить траву только в первый день'],a:1,h:['Проверь, есть ли сравнение и наблюдение изменений во времени.','Лучший план позволяет выделить влияние ограничения прохода.'],why:'Наблюдение двух похожих участков в течение нескольких недель позволяет оценить влияние ограничения вытаптывания.'}}
];
const dataTable=`<div class="tablewrap"><table><thead><tr><th>Объект</th><th>До засухи</th><th>После засухи</th></tr></thead><tbody><tr><td>Трава (условные единицы)</td><td>100</td><td>45</td></tr><tr><td>Зайцы</td><td>40</td><td>24</td></tr><tr><td>Мыши</td><td>50</td><td>30</td></tr><tr><td>Лисицы</td><td>12</td><td>9</td></tr></tbody></table></div><div class="footnote">Данные учебной модели вымышлены и приведены только для анализа связей, а не как результаты реального исследования.</div>`;
const chainVisual=`<div class="ecosystem"><div class="org"><em>🌱</em>Трава</div><span class="arrow">→</span><div class="org"><em>🐇</em>Заяц</div><span class="arrow">→</span><div class="org"><em>🦊</em>Лисица</div></div><p class="muted" style="font-size:13px">Стрелка показывает передачу пищи от того, кого едят, к тому, кто ест.</p>`;
let state={stage:'diagnosis',di:[null,null,null],diagChecked:false,level:1,idx:0,selected:[],tries:0,hints:0,checked:false,correct:false,answers:[],streak:0,chain:[],simRain:50,simTrample:false,simGuess:null,simRevealed:false};
const score=()=>state.di.filter((v,i)=>v===diagnostic[i].a).length;
const renderNav=()=>{let stages=[['diagnosis','Проверка'],['training','Исследование'],['sim','Модель'],['end','Результат']];let n=stages.findIndex(x=>x[0]===state.stage);nav.innerHTML=stages.map((x,i)=>`<div class="step ${i===n?'active':i<n?'done':''}">${x[1]}</div>`).join('')};
function btn(label,fn,cls='',disabled=false){return `<button class="btn ${cls}" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`}
function answerChoices(opts,multi=false){return `<div class="choices">${opts.map((o,i)=>`<button class="choice ${state.selected.includes(i)?'sel':''}" onclick="pick(${i},${multi?'true':'false'})" ${state.correct?'disabled':''}><span class="dot"></span>${esc(o)}</button>`).join('')}</div>`}
function render(){renderNav();if(state.stage==='diagnosis')return renderDiagnosis();if(state.stage==='training')return renderTraining();if(state.stage==='sim')return renderSim();renderEnd()}
function renderDiagnosis(){app.innerHTML=`<div class="kicker">Начало исследования</div><h2>1. Что ты уже знаешь?</h2><p class="muted">Выбери по одному ответу в каждом задании.</p>${chainVisual}${diagnostic.map((q,i)=>`<div class="card"><span class="pill">Вопрос ${i+1}</span><h3 style="margin-top:12px">${q.q}</h3><div class="choices">${q.o.map((o,j)=>`<button class="choice ${state.di[i]===j?'sel':''}" ${state.diagChecked?'disabled':''} onclick="diagPick(${i},${j})"><span class="dot"></span>${esc(o)}</button>`).join('')}</div>${state.diagChecked?`<div class="notice ${state.di[i]===q.a?'':'bad'}"><b>${state.di[i]===q.a?'Верно':'Есть ошибка'}</b>. ${esc(q.why)}</div>`:''}</div>`).join('')}${state.diagChecked?`<div class="card soft"><div class="kicker">Твой результат</div><h2 style="margin-bottom:7px">${score()} из 3</h2><p>${score()===3?'Ты уверенно определяешь связи. Дальше будут более сложные исследовательские задачи.':score()>=2?'Хорошее начало. В исследовании ты сможешь применять знания и получать помощь при затруднениях.':'Начнём с более доступных задач. Если понадобится, появятся подсказки.'}</p></div><div class="actions">${btn('Перейти к исследованию →','startTraining()')}</div>`:`<div class="actions">${btn('Проверить ответы','checkDiagnostic()', '',state.di.some(x=>x===null))}</div>`}`}
function diagPick(i,j){if(state.diagChecked)return;state.di[i]=j;render()}
function checkDiagnostic(){if(state.di.some(x=>x===null))return;state.diagChecked=true;render()}
function startTraining(){state.stage='training';state.level=score()===3?2:score()<=1?0:1;render()}
function taskDef(){const m=missions[state.idx];return m.type==='chain'||m.type==='multi'?m:m[['easy','standard','hard'][state.level]]}
function renderTraining(){let m=missions[state.idx],q=taskDef();let count=state.idx;let progress=Math.round(count/missions.length*100);let inner='';if(m.type==='chain'){let pool=m.steps.map((s,i)=>({text:s,i})).sort((a,b)=>[2,0,3,1][a.i]-[2,0,3,1][b.i]);inner=`<p>Нажимай на события в правильном порядке — от причины к последствиям.</p><div class="chips">${pool.map(x=>`<button class="chip ${state.chain.includes(x.i)?'used':''}" onclick="chainAdd(${x.i})" ${state.correct||state.chain.includes(x.i)?'disabled':''}>${esc(x.text)}</button>`).join('')}</div><div class="chain">${[0,1,2,3].map((v,i)=>`<div class="slot ${state.chain[i]!==undefined?'filled':''}">${state.chain[i]!==undefined?esc(m.steps[state.chain[i]]):'Шаг '+(i+1)}</div>`).join('')}</div><div class="actions">${btn('Очистить цепочку','chainClear()','secondary',state.correct||!state.chain.length)}</div>`}else if(m.type==='multi'){inner=`<p>${esc(m.q)}</p><span class="pill">Выбери два ответа</span>${answerChoices(m.o,true)}`}else{inner=`<p>${esc(q.q)}</p>${answerChoices(q.o)}`}
let feedback='';if(state.checked){if(state.correct)feedback=`<div class="notice"><b>Верно!</b> ${esc(q.why)}<p style="margin-top:10px">${state.tries||state.hints?'Ты справился после дополнительной попытки или подсказки.':'Ты справился самостоятельно.'}</p></div>`;else feedback=`<div class="notice bad"><b>Пока неверно.</b> Попробуй снова. ${state.tries>=2?'Обрати внимание на дополнительную подсказку.':''}</div>`}
let hintText=state.hints>0?(m.type==='chain'?m.hint:q.h[state.hints>1?1:0]):'';
app.innerHTML=`<div class="kicker">Исследование · задание ${state.idx+1} из ${missions.length}</div><h2>${esc(m.title)}</h2><div class="progress"><span style="width:${progress}%"></span></div>${state.idx===0?`<div class="card soft"><b>Ситуация</b><p>На учебном участке несколько недель было мало дождей. Исследователи наблюдали изменения.</p>${dataTable}</div>`:state.idx===1||state.idx===2?`<div class="card soft">${chainVisual}</div>`:''}<div class="card">${inner}</div>${feedback}${hintText?`<div class="notice warn"><b>Подсказка ${state.hints}</b><p class="hint">${esc(hintText)}</p></div>`:''}<div class="actions">${state.correct?btn(state.idx===missions.length-1?'Перейти к модели →':'Следующее задание →','nextMission()'):btn('Проверить','checkMission()','',m.type==='chain'?state.chain.length!==4:m.type==='multi'?state.selected.length!==2:state.selected.length!==1)}${!state.correct?btn('Нужна подсказка?','showHint()','secondary',state.hints>=2):''}</div><p class="footnote">После каждого ответа можно исправить решение. Подсказки не влияют на возможность завершить работу.</p>`}
function pick(i,multi){if(state.correct)return;if(multi){state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i];if(state.selected.length>2)state.selected.shift()}else state.selected=[i];state.checked=false;render()}
function chainAdd(i){if(state.correct||state.chain.includes(i)||state.chain.length>=4)return;state.chain.push(i);state.checked=false;render()}
function chainClear(){state.chain=[];state.checked=false;render()}
function showHint(){state.hints=Math.min(2,state.hints+1);render()}
function checkMission(){let m=missions[state.idx],q=taskDef(),correct;if(m.type==='chain')correct=state.chain.length===4&&state.chain.every((x,i)=>x===i);else if(m.type==='multi')correct=state.selected.length===2&&q.a.every(x=>state.selected.includes(x));else correct=state.selected[0]===q.a;state.checked=true;state.correct=correct;if(correct){const independent=state.tries===0&&state.hints===0;state.answers.push({title:m.title,independent,tries:state.tries,hints:state.hints});state.streak=independent?state.streak+1:0;if(state.streak>=3){state.level=Math.min(2,state.level+1);state.streak=0}}else{state.tries++;state.streak=0;if(state.tries>=2){state.hints=2;state.level=Math.max(0,state.level-1)}}render()}
function nextMission(){if(!state.correct)return;state.idx++;state.selected=[];state.tries=0;state.hints=0;state.checked=false;state.correct=false;state.chain=[];if(state.idx>=missions.length)state.stage='sim';render()}
function simModel(){const rain=state.simRain;const grass=Math.max(20,Math.min(115,Math.round(30+rain*0.8-(state.simTrample?25:0))));const hare=Math.round(12+grass*0.28);const fox=Math.round(4+hare*0.15);return {grass,hare,fox}}
function renderSim(){
 let d=simModel(), expected=d.grass<70?0:1, match=state.simGuess===expected;
 app.innerHTML=`<div class="kicker">Моделирование</div><h2>2. Что изменится при новых условиях?</h2><p>Измени условия на лугу. Сначала сделай прогноз, затем проверь его по учебной модели.</p>
 <div class="card soft"><label for="rain"><b>Количество осадков: <span id="rainv">${state.simRain}%</span></b></label><input id="rain" class="meter" type="range" min="10" max="100" step="10" value="${state.simRain}" oninput="updateRain(this.value)"><p><label><input id="trample" type="checkbox" ${state.simTrample?'checked':''} onchange="updateTrample(this.checked)"> На участке часто ходят люди и вытаптывают растения</label></p></div>
 <div class="card"><h3>Какое состояние травы покажет учебная модель при выбранных условиях?</h3><p class="muted">В этой модели значение травы ниже 70 условных единиц означает «мало», 70 и выше — «много».</p><div class="choices">${['Растений будет сравнительно мало','Растений будет сравнительно много','Этих двух условий недостаточно даже для упрощённой модели'].map((v,i)=>`<button class="choice ${state.simGuess===i?'sel':''}" ${state.simRevealed?'disabled':''} onclick="simPick(${i})"><span class="dot"></span>${v}</button>`).join('')}</div>${!state.simRevealed?`<div class="actions">${btn('Проверить прогноз','revealSim()','',state.simGuess===null)}</div>`:''}</div>
 ${state.simRevealed?`<div class="card"><h3>Данные учебной модели</h3><div class="simgrid"><div class="simbox">🌿<b>${d.grass}</b><small>Трава, условные единицы</small></div><div class="simbox">🐇<b>${d.hare}</b><small>Зайцы</small></div><div class="simbox">🦊<b>${d.fox}</b><small>Лисицы</small></div></div><div class="notice ${match?'':'bad'}"><b>${match?'Верно! Твой прогноз соответствует результату модели.':'Неверно. Прогноз не совпал с результатом модели.'}</b><p>${match?'Ты правильно учёл выбранные условия.':'Сравни количество осадков, вытаптывание и полученное значение травы. Вспомни, при каком значении в модели растений считается мало.'}</p></div><p class="footnote">Это условная учебная модель, а не точный прогноз численности реальных животных.</p></div><div class="actions">${match?btn('Посмотреть мой результат →','finish()'):btn('Исправить прогноз','retrySim()','secondary')}</div>`:''}`;
}
function updateRain(v){state.simRain=Number(v);state.simRevealed=false;state.simGuess=null;render()}
function updateTrample(v){state.simTrample=Boolean(v);state.simRevealed=false;state.simGuess=null;render()}
function simPick(v){state.simGuess=v;state.simRevealed=false;render()}
function revealSim(){if(state.simGuess===null)return;state.simRevealed=true;const correct=state.simGuess===(simModel().grass<70?0:1);if(!correct)state.simErrors=(state.simErrors||0)+1;else state.simCorrect=true;render()}
function retrySim(){state.simRevealed=false;state.simGuess=null;render()}
function finish(){if(!state.simRevealed||state.simGuess!==(simModel().grass<70?0:1))return;state.stage='end';render()}
function resultText(){const independent=state.answers.filter(x=>x.independent).length;return `Я ПОЗНАЮ МИР — 4 КЛАСС\nТема: Изменение экосистемы\nПервичная диагностика: ${score()} из 3\nИсследовательские задания: ${state.answers.length} из ${missions.length} выполнено\nСамостоятельно с первой попытки: ${independent} из ${missions.length}\nС подсказкой или после исправления: ${missions.length-independent}\n${state.answers.map((x,i)=>`${i+1}. ${x.title} — ${x.independent?'самостоятельно':'с помощью / повторной попыткой'}`).join('\n')}\nМодель условий: осадки ${state.simRain}%, вытаптывание ${state.simTrample?'да':'нет'}\nПрогноз в модели: ${state.simErrors===0?'верно с первой попытки':'верно после исправления'}\nИтог: работа завершена.`}
function renderEnd(){const independent=state.answers.filter(x=>x.independent).length;app.innerHTML=`<div class="kicker">Результаты</div><h2>Исследование завершено!</h2><p>Ты проследил, как изменение природных условий может повлиять на растения и животных, оценил доказательства и выбрал решение.</p><div class="stats"><div class="stat"><strong>${score()}/3</strong><small>Первичная проверка</small></div><div class="stat"><strong>${independent}/${missions.length}</strong><small>Самостоятельно</small></div><div class="stat"><strong>${missions.length-independent}</strong><small>С подсказками или исправлением</small></div></div><div class="card"><h3>Твои задания</h3>${state.answers.map(x=>`<div style="display:flex;justify-content:space-between;gap:13px;padding:9px 0;border-bottom:1px solid #e1eae3"><span>${esc(x.title)}</span><span class="tag" style="white-space:nowrap">${x.independent?'✓ Без помощи':'✓ Исправлено'}</span></div>`).join('')}</div><div class="card"><b>Прогноз по модели:</b> ${state.simErrors===0?'верно с первого раза':'верно после исправления'}.</div><div class="ending"><b>Что важно помнить?</b><p>Изменение экосистемы редко затрагивает только один организм. Чтобы сделать обоснованный вывод, нужно учитывать несколько взаимосвязанных факторов и проверять доказательства.</p></div><div class="actions">${btn('Скопировать результат','copyResult()')}${btn('Начать заново','restart()','secondary')}</div><div id="copied" class="footnote" aria-live="polite"></div>`}
async function copyResult(){const text=resultText();try{await navigator.clipboard.writeText(text);document.getElementById('copied').textContent='Результат скопирован.'}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();document.getElementById('copied').textContent=ok?'Результат скопирован.':'Не удалось скопировать. Выделите текст результата вручную.'}}
function restart(){state={stage:'diagnosis',di:[null,null,null],diagChecked:false,level:1,idx:0,selected:[],tries:0,hints:0,checked:false,correct:false,answers:[],streak:0,chain:[],simRain:50,simTrample:false,simGuess:null,simRevealed:false,simErrors:0,simCorrect:false};render()}
render();
</script></body></html>
