 else if(stage==='final'){fi++;if(fi<CFG.final.length)renderTask(CFG.final[fi]);else renderReport()}}
function reportText(){const diag=CFG.skills.map(s=>{const r=records.find(x=>x.stage==='diagnosis'&&x.skill===s);return `${s}: ${r?.outcome==='independent'?'самостоятельно':r?.outcome==='hint'?'после подсказки':'требуется закрепление'} (${r?.attempts||0} попыт.)`}).join('\n');const tr=records.filter(x=>x.stage==='training');const fin=records.filter(x=>x.stage==='final');const o={independent:'самостоятельно',hint:'после подсказки',help:'не выполнено после подсказок'};
 return `ЕСТЕСТВОЗНАНИЕ — ${CFG.grade} КЛАСС — УРОК 2\nТема: ${CFG.title}\nЦель: ${CFG.code} ${CFG.objective}\nУченик: ${student}\n\nДИАГНОСТИКА\n${diag}\n\nИНДИВИДУАЛЬНАЯ ТРЕНИРОВКА\n${tr.map(r=>`${r.title}: ${o[r.outcome]}, попыток: ${r.attempts}`).join('\n')||'—'}\n\nИТОГ\n${fin.map(r=>`${r.title}: ${o[r.outcome]}, попыток: ${r.attempts}`).join('\n')}\nСамостоятельно в тренировке: ${tr.filter(r=>r.outcome==='independent').length} из ${tr.length}\nИтог без ошибок с первой попытки: ${fin.filter(r=>r.outcome==='independent').length} из ${fin.length}\nВсего подсказок: ${records.reduce((sum,r)=>sum+Math.min(2,Math.max(0,r.attempts-1)),0)}\n\nРезультат сформирован в браузере. Для передачи учителю скопируйте отчёт.`}
function renderReport(){setStage('report');const tr=records.filter(x=>x.stage==='training');const fin=records.filter(x=>x.stage==='final');const independent=tr.filter(x=>x.outcome==='independent').length;const finalind=fin.filter(x=>x.outcome==='independent').length;let r=reportText();
 $('content').innerHTML=`<p class="smalltitle">Урок пройден</p><h2>Результат ученика: ${esc(student)}</h2><p class="lede">Здесь видно, какие умения удалось выполнить самостоятельно, а где потребовалась помощь.</p><div class="endgrid"><div class="metric"><strong>${independent}/${tr.length}</strong><span>Самостоятельно в тренировке</span></div><div class="metric"><strong>${finalind}/${fin.length}</strong><span>Итог с первой попытки</span></div><div class="metric"><strong>${records.filter(x=>x.outcome==='help').length}</strong><span>Заданий с затруднениями</span></div></div><div class="report" id="reporttext"></div><div class="actionrow"><button id="copy" class="btn primary">Скопировать результат</button><button id="download" class="btn">Скачать отчёт</button>${speakButtons()}</div><p id="copyfeedback" class="toast" aria-live="polite"></p>`;$('reporttext').textContent=r;bindSpeech('Урок завершён. '+student+'. Итоговых заданий, выполненных с первой попытки: '+finalind+' из '+fin.length+'.');$('copy').onclick=()=>copyReport(r);$('download').onclick=()=>{let b=new Blob([r],{type:'text/plain;charset=utf-8'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download=`естествознание_${CFG.grade}класс_урок2_результат.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
async function copyReport(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}if(!ok){const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.left='-9999px';document.body.append(el);el.select();try{ok=document.execCommand('copy')}catch(e){}el.remove()}$('copyfeedback').textContent=ok?'Результат скопирован.':'Не удалось скопировать — используйте «Скачать отчёт».'}
window.addEventListener('pagehide',stopSpeech);window.addEventListener('DOMContentLoaded',init);
</script></body></html>
