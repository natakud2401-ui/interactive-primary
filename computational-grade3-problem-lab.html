const $=sel=>document.querySelector(sel);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const box=(txt,cls='info')=>`<div class="feedback ${cls}">${txt}</div>`;
const button=(txt,fn,disabled=false,cls='primary full')=>`<button class="btn ${cls}" onclick="${fn}" ${disabled?'disabled':''}>${txt}</button>`;
function optionsHTML(options,value=S.selected,disabled=false){return `<div class="button-grid">${options.map(([v,label])=>`<button class="choice ${value===v?'selected':''} ${S.diagBad.includes(v)&&S.stage===1?'rejected':''}" ${disabled?'disabled':''} onclick="choose(${JSON.stringify(v).replaceAll('"','&quot;')})">${escapeHTML(label)}</button>`).join('')}</div>`}
function choose(val){S.selected=val;if(S.stage===1)S.diagWrong=false;persist();render()}
function goNext(){if(S.stage<11&&S.passed[S.stage]){S.stage++;S.selected='';S.diagWrong=false;persist();render();scrollToTop()}}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
function foot(){return `<div class="actions">${button('Следующее задание →','goNext()',!S.passed[S.stage],'primary')}</div>`}
function render(){const isFinish=S.stage===11;$('#heroPhase').textContent=isFinish?'Миссия выполнена':stepNames[S.stage];$('#heroProgress').textContent=isFinish?'Результаты':`Этап ${S.stage+1} из 11`;$('#progressBar').style.width=((isFinish?11:S.passed.filter(Boolean).length)/11*100)+'%';$('#screen').innerHTML=STAGES[S.stage]();persist()}
function theory(){return `<span class="kicker">РАЗБЕРИСЬ С ПРИЁМОМ</span><h2>Как алгоритм помогает решить проблему?</h2><p class="lead">Проблема — это ситуация, когда нужно получить результат, но пока непонятно, как это сделать. Помогает точный план действий — <b>алгоритм</b>.</p><div class="theory-grid"><div class="tile"><span class="icon">🔎</span><div><b>1. Разберись</b><p>Что не получается? Какую цель нужно достичь?</p></div></div><div class="tile"><span class="icon">🧩</span><div><b>2. Раздели</b><p>Разбей сложную задачу на небольшие понятные действия.</p></div></div><div class="tile"><span class="icon">✅</span><div><b>3. Проверь</b><p>Выполни алгоритм, найди ошибку и исправь её.</p></div></div></div><div class="demo"><h3>Пример: не хватает наборов для групп</h3><p>Нужно сделать три набора — по листу и карандашу, но готов только один. Как решить проблему?</p><div class="demo-steps"><div class="demo-step"><span class="n">1</span><span>Узнай, сколько наборов ещё нужно собрать.</span></div><div class="demo-step"><span class="n">2</span><span>Проверь, хватает ли бумаги и карандашей.</span></div><div class="demo-step"><span class="n">3</span><span>Собери недостающие наборы и проверь каждый.</span></div></div></div><div class="callout">Хороший алгоритм учитывает все условия задачи. Если результат не получился, исправь нужный шаг, а не начинай действовать наугад.</div><label class="label" for="pupil">Твоё имя (можно оставить пустым)</label><input class="field" id="pupil" maxlength="50" placeholder="Имя" value="${escapeHTML(S.name)}" oninput="setName(this.value)">${button('Перейти к проверке →','finishTheory()',false,'primary full')}`}
function setName(v){S.name=v.slice(0,50);persist()}
function finishTheory(){S.passed[0]=true;goNext()}
function diagnostic(){if(S.diagI>=questions.length){const count=S.diagFirst;S.route=count<=1?'support':count===2?'standard':'advanced';S.passed[1]=true;return `<span class="kicker">ДИАГНОСТИКА ЗАВЕРШЕНА</span><h2>Твой индивидуальный маршрут</h2><div class="recap"><div class="recap-row"><span>Ответов с первой попытки</span><b>${S.diagFirst} из 3</b></div><div class="recap-row"><span>Следующий маршрут</span><b>${routes[S.route].label}</b></div></div><p class="lead">Дальше тебе будут предложены задания с учётом твоих ответов.</p>${foot()}`}
const q=questions[S.diagI];return `<span class="kicker">ПЕРВИЧНАЯ ПРОВЕРКА · ${S.diagI+1} ИЗ 3</span><h2>${q.q}</h2><p class="lead">Выбери один ответ. При диагностике мы учитываем самостоятельное решение с первой попытки.</p>${optionsHTML(q.opts,S.selected,S.diagResolved[S.diagI])}${S.diagWrong?box('Этот вариант не решает задачу полностью. Сравни остальные способы и попробуй снова.','bad'):''}${S.diagResolved[S.diagI]?box('Верно! Ты нашёл подходящее решение.','good'):button('Проверить ответ','checkDiagnostic()',!S.selected)}${S.diagResolved[S.diagI]?button(S.diagI===2?'Узнать маршрут →':'Следующий вопрос →','advanceDiagnostic()',false,'primary full'):''}`}
function checkDiagnostic(){const q=questions[S.diagI];if(!S.selected)return;if(S.selected===q.answer){if(!S.diagTried[S.diagI])S.diagFirst++;S.diagResolved[S.diagI]=true;S.diagWrong=false}else{S.diagTried[S.diagI]=true;S.diagWrong=true;S.diagBad.push(S.selected);S.selected=''}render()}
function advanceDiagnostic(){if(!S.diagResolved[S.diagI])return;S.diagI++;S.selected='';S.diagBad=[];S.diagWrong=false;render();scrollToTop()}
function training(){const r=routes[S.route];if(S.routePhase==='done'){S.passed[2]=true;return `<span class="kicker">ИНДИВИДУАЛЬНЫЙ МАРШРУТ</span><h2>Задача решена!</h2>${box('Теперь ты умеешь выбирать действия с учётом условий. Можно переходить к практическим ситуациям.','good')}${foot()}`}
if(S.routePhase==='simple')return `<span class="kicker">ПОШАГОВАЯ ПОМОЩЬ</span><h2>Реши небольшую часть задачи</h2><p class="lead">${r.scaffold}</p>${optionsHTML(r.simpleOpts)}${S.routeScaffoldWrong?box('Проверь условие и попробуй другую возможность.','bad'):''}${button('Проверить шаг','checkRouteSimple()',!S.selected)}`;
if(S.routePhase==='analog')return `<span class="kicker">ЗАКРЕПЛЕНИЕ</span><h2>Проверь умение на похожей задаче</h2><p>${r.analog}</p>${optionsHTML(r.analogOpts)}${S.routeAnalogFails?box('Проверь количество предметов и требования задачи.','info'):''}${button('Проверить закрепление','checkRouteAnalog()',!S.selected)}`;
return `<span class="kicker">МОЙ МАРШРУТ · ${r.label.toUpperCase()}</span><h2>Выбери рабочий план</h2><p class="lead">${r.q}</p>${optionsHTML(r.opts)}${S.routeFails>0?box(r.hint,'info'):''}${button('Проверить план','checkRouteMain()',!S.selected)}`}
function checkRouteMain(){const r=routes[S.route];if(S.selected===r.answer){S.routePhase=S.routeFails?'analog':'done'}else{S.routeFails++;if(S.routeFails>=2&&!S.routeHelp){S.routePhase='simple';S.routeHelp=true}}S.selected='';render()}
function checkRouteSimple(){const r=routes[S.route];if(S.selected===r.simpleAnswer){S.routePhase='main';S.routeScaffoldWrong=false}else S.routeScaffoldWrong=true;S.selected='';render()}
function checkRouteAnalog(){const r=routes[S.route];if(S.selected===r.analogAnswer){S.routePhase='done'}else S.routeAnalogFails++;S.selected='';render()}
function cause(){if(S.causeI>=causeQuestions.length){S.passed[3]=true;return `<span class="kicker">ПОИСК ПРИЧИНЫ</span><h2>Проблемы найдены и исправлены</h2>${box('Ты определил, какое конкретное действие помогает устранить причину затруднения.','good')}${foot()}`};const q=causeQuestions[S.causeI];return `<span class="kicker">ИССЛЕДОВАНИЕ · СИТУАЦИЯ ${S.causeI+1} ИЗ 2</span><h2>Найди причину проблемы</h2><p class="lead">${q.q}</p>${optionsHTML(q.opts)}${S.causeFails[S.causeI]?box(S.causeFails[S.causeI]>1?'Проверь, какой шаг отвечает именно за возникшую ошибку.':q.hint,'info'):''}${button('Проверить решение','checkCause()',!S.selected)}`}
function checkCause(){const q=causeQuestions[S.causeI];if(S.selected===q.answer){S.causeI++;S.selected='';render();scrollToTop()}else{S.causeFails[S.causeI]++;S.selected='';render()}}
function order(){return `<span class="kicker">СОЗДАЁМ ПЛАН</span><h2>Собери алгоритм из шагов</h2><p class="lead">Четырём группам нужны одинаковые наборы для опыта: в каждом — <b>1 стаканчик и 2 палочки</b>. Материалов достаточно. Переставь команды так, чтобы задача была выполнена и проверена.</p><div class="note">Два шага наполнения лотков можно выполнить в любом порядке, но сначала необходимо подготовить лотки, а проверять наборы следует перед раздачей.</div>${S.order.map((id,i)=>{const row=orderItems.find(x=>x.id===id);return `<div class="order-row"><span class="n">${i+1}</span><span class="labeltext">${escapeHTML(row.text)}</span><button class="mini-btn" aria-label="Поднять команду" ${i===0||S.passed[4]?'disabled':''} onclick="shiftOrder(${i},-1)">↑</button><button class="mini-btn" aria-label="Опустить команду" ${i===4||S.passed[4]?'disabled':''} onclick="shiftOrder(${i},1)">↓</button></div>`}).join('')}${S.orderFails&&!S.passed[4]?box('Проверь начало и конец плана. Сначала нужны пустые лотки, а перед выдачей надо убедиться, что каждый набор полный.','info'):''}${S.passed[4]?box('Алгоритм собран! Ты учёл подготовку, действия и проверку результата.','good')+foot():button('Проверить порядок','checkOrder()')}`}
function shiftOrder(i,delta){const j=i+delta;if(j<0||j>=S.order.length)return;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];render()}
function checkOrder(){const a=S.order;const valid=a[0]==='trays'&&new Set(a.slice(1,3)).size===2&&a.slice(1,3).includes('pencils')&&a.slice(1,3).includes('cups')&&a[3]==='check'&&a[4]==='deliver';if(valid)S.passed[4]=true;else S.orderFails++;render()}
function sorting(){if(S.sortI>=sorted.length){S.passed[5]=true;return `<span class="kicker">АЛГОРИТМ С ВЫБОРОМ</span><h2>Сортировка завершена!</h2><div class="recap"><div class="recap-row"><span>Коробка А · чётные</span><b>3 карточки</b></div><div class="recap-row"><span>Коробка Б · нечётные</span><b>3 карточки</b></div></div>${box('Ты использовал одно правило для всех шести карточек и проверил результат.','good')}${foot()}`};const n=sorted[S.sortI];return `<span class="kicker">АЛГОРИТМ С УСЛОВИЕМ</span><h2>Помоги роботу рассортировать карточки</h2><p class="lead">На каждой карточке число. <b>Чётные</b> положи в коробку А, <b>нечётные</b> — в коробку Б. Выполняй это правило для каждой карточки.</p><div class="sort-card"><span class="pill">Карточка ${S.sortI+1} из 6</span><div class="sort-number">${n}</div><div class="muted small">Выбери нужную коробку</div></div><div class="two-cols">${button('📦 Коробка А<br><span class="small">Чётные</span>','sortPut("A")',false,'soft full')}${button('📦 Коробка Б<br><span class="small">Нечётные</span>','sortPut("B")',false,'soft full')}</div>${S.sortFails?box(S.sortFails>1?'Попробуй разделить число на 2. Если остатка нет, оно чётное.':'Проверь, к какой группе относится число.','info'):''}<p class="toast">Правильно разложено карточек: ${S.sortI} из 6</p>`}
function sortPut(bin){const n=sorted[S.sortI],valid=(n%2===0&&bin==='A')||(n%2!==0&&bin==='B');if(valid){S.sortI++;S.sortFails=0}else S.sortFails++;render()}
function walk(commands){let x=0,y=4,trace=['0,4'];for(let i=0;i<commands.length;i++){const c=commands[i],nx=x+(c==='right'?1:c==='left'?-1:0),ny=y+(c==='down'?1:c==='up'?-1:0);if(nx<0||ny<0||nx>4||ny>4)return {x,y,trace,status:'edge',badStep:i+1};if(walls.has(nx+','+ny))return {x,y,trace,status:'wall',badStep:i+1};x=nx;y=ny;trace.push(x+','+y)}return {x,y,trace,status:x===4&&y===0?'goal':'short',badStep:0}}
function board(isRun){const res=walk(S.program);return `<div class="board" aria-label="Поле робота 5 на 5 клеток">${Array.from({length:25},(_,i)=>{const x=i%5,y=Math.floor(i/5),id=x+','+y;let css=walls.has(id)?'wall':(x===4&&y===0?'end':'');if(isRun&&res.trace.includes(id)&&!css)css='trace';if(x===(isRun?res.x:0)&&y===(isRun?res.y:4))css='current';return `<div class="cell ${css}" title="Столбец ${x+1}, строка ${y+1}">${css==='current'?'🤖':css==='wall'?'▥':css==='end'?'★':isRun&&res.trace.includes(id)?'·':''}</div>`}).join('')}</div>`}
function robot(){const res=walk(S.program),ok=S.passed[6];if(ok&&!S.robotAnalogDone)return `<span class="kicker">ЗАКРЕПЛЕНИЕ ПОСЛЕ ПОМОЩИ</span><h2>Ещё один короткий маршрут</h2><p class="lead">Робот стоит в левом нижнем углу пустого поля 3 × 3. Как добраться до верхнего левого угла?</p>${optionsHTML([choice('up','↑ ↑'),choice('right','→ →'),choice('mixed','↑ → ↑')],S.robotAnalogChoice)}${button('Проверить закрепление','checkRobotAnalog()',!S.robotAnalogChoice)}`;
return `<span class="kicker">РОБОТ-ПОМОЩНИК</span><h2>Найди путь через препятствия</h2><p class="lead">Робот должен доставить коробку к звезде. <b>Старт — слева внизу, цель — справа вверху</b>. Через тёмные клетки проходить нельзя. Одна стрелка — один шаг.</p>${board(S.robotRan)}<div class="directions">${Object.keys(arrow).map(c=>`<button class="dir" aria-label="${{up:'Вверх',down:'Вниз',left:'Влево',right:'Вправо'}[c]}" ${ok||S.program.length>=12?'disabled':''} onclick="appendMove('${c}')">${arrow[c]}</button>`).join('')}</div><div class="strong">Твоя программа (${S.program.length} из 12 команд)</div><div class="program">${S.program.map((m,i)=>`<span class="chip"><small>${i+1}</small>${arrow[m]}</span>`).join('')||'<span class="muted">Добавляй команды кнопками со стрелками.</span>'}</div>${!ok?`<div class="actions">${button('Отменить','undoMove()',!S.program.length,'soft')}${button('Очистить','clearMoves()',!S.program.length,'soft')}</div>`:''}${S.robotRan?box(ok?'Робот добрался до звезды!':res.status==='wall'?`Робот встретил препятствие на шаге ${res.badStep}.`:res.status==='edge'?`На шаге ${res.badStep} робот выходит за пределы поля.`:'Робот пока не достиг цели.',ok?'good':'bad'):''}${S.robotFails>=1&&!ok?box('Посмотри на свободные клетки вдоль границ поля. Можно ли обойти препятствия по краю?','info'):''}${S.robotFails>=2&&!S.robotScaffoldDone&&!ok?`<div class="demo"><h3>Разберём упрощённую часть</h3><p>Какая сторона этого поля свободна от препятствий на всём протяжении: левый край или средний столбец?</p>${optionsHTML([choice('left','Левый край'),choice('middle','Средний столбец')])}${button('Проверить шаг','checkRobotScaffold()',!S.selected,'soft full')}</div>`:''}${ok?foot():button('Выполнить программу','runRobot()',!S.program.length)}`}
function appendMove(c){if(S.program.length>=12||S.passed[6])return;S.program.push(c);S.robotRan=false;render()}
function undoMove(){S.program.pop();S.robotRan=false;render()}
function clearMoves(){S.program=[];S.robotRan=false;render()}
function checkRobotScaffold(){if(S.selected==='left')S.robotScaffoldDone=true;S.selected='';render()}
function runRobot(){S.robotRan=true;const r=walk(S.program);if(r.status==='goal'){S.passed[6]=true;S.robotAnalogDone=S.robotFails===0;S.selected=''}else S.robotFails++;render()}
function checkRobotAnalog(){if(S.robotAnalogChoice==='up'){S.robotAnalogDone=true}else S.robotAnalogChoice='';render()}
function setRobotAnalog(v){S.robotAnalogChoice=v;render()}
function debug(){return `<span class="kicker">ОТЛАДКА АЛГОРИТМА</span><h2>Найди неточную команду</h2><p class="lead">Для трёх конвертов подготовили <b>15 карточек</b>. Нужно получить <b>3 одинаковых набора по 5 карточек</b>. Но программист записал:</p><div class="demo"><div class="demo-step"><span class="n">1</span>Возьми три пустых конверта.</div><div class="demo-step"><span class="n">2</span>Повтори 3 раза: положи в очередной конверт <b>4 карточки</b>.</div><div class="demo-step"><span class="n">3</span>Передай конверты трём группам.</div></div><p class="strong">Как изменить один шаг, чтобы проблема была решена?</p>${optionsHTML([choice('a','Повторить действие 2 раза вместо 3'),choice('b','В каждом повторении класть 5 карточек вместо 4'),choice('c','В каждом повторении класть 3 карточки вместо 4'),choice('d','В каждом повторении класть 6 карточек вместо 4')],S.debugAns,S.passed[7])}${S.debugFails&&!S.passed[7]?box('Проверь: сколько карточек получится в каждом конверте и сколько всего их требуется?','info'):''}${S.passed[7]?box('Правильно! Теперь 3 × 5 = 15, конверты наполнены поровну.','good')+foot():button('Проверить исправление','checkDebug()',!S.debugAns)}`}
function setDebug(v){S.debugAns=v;render()}
function checkDebug(){if(S.debugAns==='b')S.passed[7]=true;else{S.debugFails++;S.debugAns=''}render()}
function optimize(){return `<span class="kicker">ВЫБИРАЕМ ЛУЧШИЙ СПОСОБ</span><h2>Как решить задачу быстрее?</h2><p class="lead">Нужно перенести <b>12 книг</b> в шкаф. За один раз можно нести <b>не больше 4 книг</b>. Выбери способ, который соблюдает ограничение и требует наименьшего числа переносов.</p><div class="callout">Условие: за один перенос книги несут к шкафу и кладут туда. Считай только переносы с книгами, а не обратные шаги.</div>${optionsHTML([choice('a','2 раза по 6 книг'),choice('b','3 раза по 4 книги'),choice('c','4 раза по 3 книги'),choice('d','6 раз по 2 книги')],S.optAns,S.passed[8])}${S.optFails&&!S.passed[8]?box('Сначала исключи планы, в которых нарушено ограничение. Среди оставшихся сравни количество переносов.','info'):''}${S.passed[8]?box('Три переноса по четыре книги выполняют ограничение и дают минимальное число переносов.','good')+foot():button('Проверить способ','checkOptimize()',!S.optAns)}`}
function setOptimize(v){S.optAns=v;render()}
function checkOptimize(){if(S.optAns==='b')S.passed[8]=true;else{S.optFails++;S.optAns=''}render()}
const missions=[{id:'m1',label:'Раздать 8 карточек 4 группам',total:8,groups:4},{id:'m2',label:'Разложить 12 книг в 3 стопки',total:12,groups:3},{id:'m3',label:'Разделить 15 фишек на 5 наборов',total:15,groups:5}];
function creation(){const m=missions.find(x=>x.id===S.mission);return `<span class="kicker">ТЫ — АВТОР</span><h2>Создай свой алгоритм решения</h2><p class="lead">Выбери реальную задачу и составь <b>4 понятные команды</b>. Затем проверь результат.</p><label class="label" for="mission">Какую проблему будем решать?</label><select id="mission" ${S.ownDone?'disabled':''} onchange="changeMission(this.value)">${missions.map(q=>`<option value="${q.id}" ${S.mission===q.id?'selected':''}>${q.label}</option>`).join('')}</select><div class="callout">Нужно распределить <b>${m.total}</b> предметов между <b>${m.groups}</b> группами поровну. Нельзя потерять ни одного предмета.</div>${S.own.map((v,i)=>`<label class="label" for="own${i}">${i+1}. Команда ${i+1}</label><textarea id="own${i}" maxlength="180" rows="2" placeholder="Запиши точное действие" ${S.ownDone?'disabled':''} oninput="setOwn(${i},this.value)">${escapeHTML(v)}</textarea>`).join('')}<label class="label" for="ownCount">Сколько предметов должно быть в каждой группе?</label><input id="ownCount" type="number" class="field" min="1" max="99" value="${escapeHTML(S.ownTotal)}" ${S.ownDone?'disabled':''} oninput="setOwnCount(this.value)"><div class="demo"><h3>Проверь свою инструкцию</h3><label class="checkline"><input type="checkbox" ${S.ownChecklist[0]?'checked':''} ${S.ownDone?'disabled':''} onchange="setOwnCheck(0,this.checked)"><span>Я указал, что нужно подготовить и как раздать предметы поровну.</span></label><label class="checkline"><input type="checkbox" ${S.ownChecklist[1]?'checked':''} ${S.ownDone?'disabled':''} onchange="setOwnCheck(1,this.checked)"><span>По моей инструкции другой ученик сможет выполнить каждый шаг по порядку.</span></label></div>${S.ownDone?box('Алгоритм записан! Попроси одноклассника проверить его по твоим командам.','good')+foot():button('Проверить и сохранить алгоритм','checkCreative()')}<div id="ownFeedback"></div>`}
function changeMission(v){S.mission=v;S.ownDone=false;S.ownTotal='';render()}
function setOwn(i,v){S.own[i]=v.slice(0,180);persist()}
function setOwnCount(v){S.ownTotal=v;persist()}
function setOwnCheck(i,v){S.ownChecklist[i]=v;persist()}
function checkCreative(){S.own=Array.from({length:4},(_,i)=>$('#own'+i).value.trim());S.ownTotal=$('#ownCount').value.trim();const m=missions.find(x=>x.id===S.mission);const amount=S.ownTotal!==''&&Number(S.ownTotal)===m.total/m.groups;const valid=S.own.every(v=>v.length>=10)&&S.ownChecklist.every(Boolean)&&amount;if(valid){S.ownDone=true;S.passed[9]=true;render()}else{$('#ownFeedback').innerHTML=box(!amount?'Проверь, сколько предметов нужно дать каждой группе.':S.own.some(v=>v.length<10)?'Запиши все четыре достаточно подробные команды.':'Проверь оба пункта самопроверки.','bad');persist()}}
function rule(){return `<span class="kicker">ВОССТАНОВИ ПРАВИЛО</span><h2>Как решать проблемы с помощью алгоритма?</h2><p class="lead">Восстанови последовательность работы. Не нужно заново решать предыдущие задачи.</p>${ruleData.map((q,i)=>`<div class="demo-step" style="margin:11px 0;align-items:flex-start"><span class="n">${i+1}</span><div style="flex:1"><div class="strong">${q.label}</div><select ${S.passed[10]?'disabled':''} onchange="setRule(${i},this.value)"><option value="">Выбери продолжение</option>${q.opts.map(([v,t])=>`<option value="${v}" ${S.rules[i]===v?'selected':''}>${t}</option>`).join('')}</select></div></div>`).join('')}${S.ruleFails&&!S.passed[10]?box('Проверь последовательность: понять задачу → составить план → выполнить → проверить.','info'):''}${S.passed[10]?box('Ты восстановил главное правило решения задач через алгоритмы.','good')+foot():button('Проверить правило','checkRule()',S.rules.some(v=>!v))}`}
function setRule(i,v){S.rules[i]=v;render()}
function checkRule(){const k=['problem','parts','order','check'];if(S.rules.every((v,i)=>v===k[i])){S.passed[10]=true;S.completedAt=new Date().toLocaleDateString('ru-RU')}else S.ruleFails++;render()}
function finish(){return `<span class="kicker">РЕЗУЛЬТАТ</span><div style="text-align:center"><div style="font-size:2.4rem">🏆</div><h2>Задачи решены!</h2><p class="lead">Ты прошёл диагностику, разработал и проверил алгоритмы, исправил ошибки и восстановил правило.</p></div><div class="recap"><div class="recap-row"><span>Ученик</span><b>${escapeHTML(S.name||'Без имени')}</b></div><div class="recap-row"><span>Диагностика с первой попытки</span><b>${S.diagFirst} / 3</b></div><div class="recap-row"><span>Индивидуальный маршрут</span><b>${routes[S.route].label}</b></div><div class="recap-row"><span>Выполнено этапов</span><b>11 / 11</b></div><div class="recap-row"><span>Алгоритм</span><b>${escapeHTML(missions.find(m=>m.id===S.mission).label)}</b></div></div><div class="actions">${button('📋 Скопировать результат','copyResult()',false,'green')}${button('Начать заново','restart()',false,'soft')}</div><p id="copyStatus" class="toast" role="status"></p>`}
function report(){const m=missions.find(x=>x.id===S.mission);return `Решение проблем с помощью алгоритмов — 3 класс\nУченик: ${S.name||'Без имени'}\nДиагностика с первой попытки: ${S.diagFirst} из 3\nМаршрут: ${routes[S.route].label}\nВыполнено этапов: 11 из 11\nРобот — команда: ${S.program.map(x=>arrow[x]).join(' ')}\nСобственный алгоритм: ${m.label}\n${S.own.map((x,i)=>i+1+'. '+x).join('\n')}\nПредметов в группе: ${S.ownTotal}\nПравило восстановлено: да\nТворческая работа проверяется учителем/одноклассником.`}
async function copyResult(){const content=report();try{await navigator.clipboard.writeText(content);$('#copyStatus').textContent='Результат скопирован.'}catch(e){const input=document.createElement('textarea');input.value=content;input.style.width='100%';$('#copyStatus').replaceWith(input);input.select();document.execCommand('copy');input.remove();const txt=document.createElement('p');txt.id='copyStatus';txt.className='toast';txt.textContent='Результат скопирован.';$('#screen').appendChild(txt)}}
function restart(){if(!confirm('Начать заново? Текущий прогресс на этом устройстве будет сброшен.'))return;S=fresh();persist();render();scrollToTop()}
const STAGES=[theory,diagnostic,training,cause,order,sorting,robot,debug,optimize,creation,rule,finish];
// Preserve alternate option widgets where value isn't S.selected.
const originalChoose=choose;
choose=function(val){if(S.stage===7){setDebug(val);return}if(S.stage===8){setOptimize(val);return}if(S.stage===6&&S.passed[6]&&!S.robotAnalogDone){setRobotAnalog(val);return}originalChoose(val)};
render();
</script>
</body>
</html>
