<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Познание мира — урок 1</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.5 'Segoe UI',Arial,sans-serif;color:#253452;background:radial-gradient(circle at 10% 10%,#e2dfff,transparent 32%),#f1f6ff}.wrap{max-width:850px;margin:15px auto;padding:0 12px 35px}.hero{padding:27px;border-radius:27px;background:linear-gradient(120deg,#6852d8,#4785e4,#23a8c3);color:white;box-shadow:0 15px 30px #6475ad55}.hero h1{font-size:clamp(28px,5vw,42px);margin:5px 0}.hero p{margin:0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.steps span{padding:9px 4px;text-align:center;border-radius:12px;background:white;font-size:12px;font-weight:750}.steps .active{background:#e1ddff;color:#503db2}.panel{background:white;border-radius:24px;padding:clamp(17px,4vw,29px);box-shadow:0 12px 28px #5466aa24;margin:14px 0;border:1px solid #e5e9fa}h2{margin:4px 0 14px;font-size:26px}h3{font-size:21px}.tag{font-size:12px;font-weight:850;letter-spacing:.08em;color:#6251b9;text-transform:uppercase}.btn{font:inherit;font-weight:750;border:0;border-radius:13px;padding:12px 17px;cursor:pointer;background:#eae6ff;color:#5140a5;box-shadow:0 4px 0 #6657b52a;min-height:46px}.btn.primary{background:linear-gradient(115deg,#7158df,#4288e6);color:white}.btn.stop{background:#ffe7e8;color:#a33e4c}.btn:disabled{opacity:.48;cursor:default}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.scene{display:flex;align-items:center;gap:14px;background:#f0f8ff;padding:15px;border-radius:16px}.pic{font-size:54px}.choice{display:block;text-align:left;width:100%;padding:15px;margin:9px 0;background:#fafbff;border:2px solid #e2e8f7;border-radius:15px;font:inherit;cursor:pointer}.choice.sel{background:#edeaff;border-color:#7561d9}.feedback{padding:13px;border-radius:12px;margin:13px 0;background:#fff0d7}.feedback.good{background:#dff8ed;color:#116c58}.feedback.bad{background:#fff0f0;color:#a0394b}.rule{display:flex;align-items:center;gap:8px;padding:12px;border:2px solid #e3e7f7;border-radius:13px;margin:8px 0}.rule span{flex:1}.rule button{padding:6px 10px;background:#f0edff;border:0;border-radius:7px;cursor:pointer}pre{white-space:pre-wrap;font:14px/1.5 'Segoe UI',Arial;background:#f4f7fc;padding:15px;border-radius:12px}.small{font-size:13px;color:#6a7592}@media(max-width:550px){.steps span{font-size:10px}.pic{font-size:40px}}
</style></head><body><div class="wrap"><header class="hero"><b>ПОЗНАНИЕ МИРА · <span id="g"></span> КЛАСС · УРОК 1</b><h1 id="title"></h1><p id="objective"></p></header><div class="steps" id="steps"><span>Знакомство</span><span>Диагностика</span><span>Мой маршрут</span><span>Итог</span></div><div class="row"><button class="btn" id="speak">▶ Слушать</button><button class="btn stop" id="stop">■ Остановить звук</button></div><main id="main"></main><p class="small" id="goal"></p></div><script>
const DATA={"grade": 4, "title": "Значение семьи в обществе", "goal": "4.1.1.1", "objective": "доказывать значимость семьи в жизни общества", "questions": [{"pic": "🤝", "scene": "В семье взрослые учат детей уважать других людей.", "q": "Какой вывод подтверждает пример?", "opts": ["Семья помогает усваивать нормы поведения", "Семья заменяет все школы", "В семье учатся только взрослые"], "a": 0}, {"pic": "📚", "scene": "Бабушка рассказывает внукам о семейных традициях и истории Казахстана.", "q": "Какое значение семьи показано?", "opts": ["Семья определяет погоду", "Семья передаёт культурную память", "Семья управляет всеми музеями"], "a": 1}, {"pic": "🏘️", "scene": "Несколько семей вместе помогают благоустроить двор.", "q": "Какой аргумент доказывает пользу семьи для общества?", "opts": ["Семьи никогда не спорят", "Семьи живут только в одном доме", "Навыки сотрудничества в семье помогают общим делам"], "a": 2}], "rules": ["Формулирую утверждение о роли семьи", "Подбираю жизненный пример", "Объясняю, как пример подтверждает мысль", "Делаю вывод о значении семьи для общества"]};const $=s=>document.querySelector(s),main=$('#main');$('#g').textContent=DATA.grade;$('#title').textContent=DATA.title;$('#objective').textContent=DATA.objective;$('#goal').textContent='Цель '+DATA.goal+': '+DATA.objective;let st={phase:0,idx:0,diagnostics:[],queue:[],practice:[],current:null,attempts:0,hint:false,selected:-1,finalOrder:[2,0,3,1],finalChoice:-1,finalAttempts:0};let speech='';function talk(t){speech=t;if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.9;let voices=speechSynthesis.getVoices().filter(x=>/^ru/i.test(x.lang));u.voice=voices.find(x=>/google/i.test(x.name)&&/female|жен/i.test(x.name))||voices.find(x=>/google/i.test(x.name))||voices[0]||null;speechSynthesis.speak(u)}$('#speak').onclick=()=>talk(speech);$('#stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};function phase(n){st.phase=n;$('#steps').querySelectorAll('span').forEach((x,i)=>x.classList.toggle('active',i===n))}function intro(){phase(0);speech='Тема: '+DATA.title+'. '+DATA.objective;main.innerHTML=`<section class="panel"><div class="tag">Знакомство</div><h2>${DATA.title}</h2><p>Сегодня мы будем исследовать жизненные ситуации, сравнивать факты и делать выводы.</p><div class="scene"><span class="pic">📚</span><span>${DATA.objective}</span></div><div class="row"><button class="btn primary" id="start">Начать</button><button class="btn" id="hear">Слушать объяснение</button></div></section>`;$('#start').onclick=()=>start(DATA.questions[0],1);$('#hear').onclick=()=>talk(speech)}function start(q,p){phase(p);st.current=q;st.attempts=0;st.hint=false;st.selected=-1;draw()}function draw(){let q=st.current;let heading=st.phase===1?'Проверяю себя · '+(st.idx+1)+' из 3':'Мой маршрут · '+(st.practice.length+1);speech=q.scene+' '+q.q+' '+q.opts.map((o,i)=>(i+1)+'. '+o).join('. ');main.innerHTML=`<section class="panel"><div class="tag">${heading}</div><h2>${st.phase===1?'Подумай и выбери':'Реши новую ситуацию'}</h2><div class="scene"><span class="pic">${q.pic}</span><span>${q.scene}</span></div><h3>${q.q}</h3><div id="choices">${q.opts.map((o,i)=>`<button class="choice" data-i="${i}">${i+1}. ${o}</button>`).join('')}</div><div id="feedback"></div><div class="row"><button class="btn primary" id="check" disabled>Проверить</button><button class="btn" id="help">Подсказка</button><button class="btn" id="hear">Слушать задание</button></div></section>`;main.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{st.selected=+b.dataset.i;main.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('sel',x===b));$('#check').disabled=false});$('#check').onclick=check;$('#help').onclick=()=>{st.hint=true;let h='Сравни каждый вариант с описанной ситуацией. Подумай, что можно подтвердить фактами.';$('#feedback').innerHTML='<div class="feedback">'+h+'</div>';talk(h)};$('#hear').onclick=()=>talk(speech)}function check(){let q=st.current;st.attempts++;if(st.selected===q.a){complete(true);return}if(st.attempts===1){st.hint=true;$('#feedback').innerHTML='<div class="feedback bad">Попробуй ещё раз. Обрати внимание на сведения в условии.</div>';talk('Попробуй ещё раз. Обрати внимание на сведения в условии.')}else complete(false)}function complete(correct){let independent=correct&&st.attempts===1&&!st.hint;let result=independent?'Самостоятельно':correct?'После помощи':'Нужна помощь';let isDiag=st.phase===1;if(isDiag)st.diagnostics.push(result);else st.practice.push(result);let label=isDiag&&st.idx===2?'Мой маршрут':'Дальше';$('#feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}">${correct?'Получилось!':'Разберём это на следующем задании.'}</div><button class="btn primary" id="next">${label}</button>`;main.querySelectorAll('.choice,#check,#help').forEach(x=>x.disabled=true);$('#next').onclick=()=>{if(isDiag){st.idx++;if(st.idx<3)start(DATA.questions[st.idx],1);else route()}else next()}}function route(){phase(2);st.queue=st.diagnostics.map((r,i)=>({q:DATA.questions[i],i,r})).sort((a,b)=>({ 'Нужна помощь':0,'После помощи':1,'Самостоятельно':2}[a.r]-{'Нужна помощь':0,'После помощи':1,'Самостоятельно':2}[b.r]));speech='Твой индивидуальный маршрут готов. Сначала выполни задания по тем умениям, которые вызвали трудности.';main.innerHTML=`<section class="panel"><div class="tag">Индивидуальный маршрут</div><h2>Твои задания</h2><p>Сначала потренируем то, что вызвало затруднения.</p>${st.queue.map((x,i)=>`<div class="scene" style="margin:9px 0"><b>${i+1}.</b> ${x.r==='Самостоятельно'?'Усложняем задачу':x.r==='После помощи'?'Закрепляем умение':'Разбираем по шагам'}</div>`).join('')}<button class="btn primary" id="go">Начать маршрут</button></section>`;$('#go').onclick=next}function next(){if(st.practice.length>=7||!st.queue.length){final();return}let x=st.queue.shift();let q=x.q;let variant={...q,scene:x.r==='Самостоятельно'?'Представь, что тебе нужно объяснить свой выбор однокласснику. '+q.scene:x.r==='Нужна помощь'?'Прочитай внимательно. '+q.scene:'Рассмотри новую задачу. '+q.scene};start(variant,2);if(x.r==='Нужна помощь'){st.queue.push({...x,r:'После помощи'})}}function final(){phase(3);speech='Восстанови порядок действий и выбери правильный вывод.';main.innerHTML=`<section class="panel"><div class="tag">Итог</div><h2>Восстанови порядок</h2><p>Передвигай шаги стрелками.</p>${st.finalOrder.map((n,i)=>`<div class="rule"><b>${i+1}</b><span>${DATA.rules[n]}</span><button data-m="${i}" data-d="-1" ${i===0?'disabled':''}>↑</button><button data-m="${i}" data-d="1" ${i===3?'disabled':''}>↓</button></div>`).join('')}<h3>Как лучше учиться?</h3><div id="fc">${['Делать вывод, не проверяя факты.','Сначала рассмотреть сведения, затем объяснить вывод.','Всегда выбирать первый ответ.'].map((x,i)=>`<button class="choice ${st.finalChoice===i?'sel':''}" data-c="${i}">${i+1}. ${x}</button>`).join('')}</div><div id="fb"></div><button class="btn primary" id="verify">Проверить</button></section>`;main.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let i=+b.dataset.m,j=i+(+b.dataset.d);[st.finalOrder[i],st.finalOrder[j]]=[st.finalOrder[j],st.finalOrder[i]];final()});main.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.finalChoice=+b.dataset.c;final()});$('#verify').onclick=()=>{st.finalAttempts++;if(st.finalOrder.every((n,i)=>n===i)&&st.finalChoice===1){$('#fb').innerHTML='<div class="feedback good">Верно! Правило восстановлено.</div><button class="btn primary" id="report">Мой результат</button>';$('#report').onclick=report}else $('#fb').innerHTML='<div class="feedback bad">Проверь порядок и вывод. Попробуй ещё раз.</div>'}}function report(){let t=`ПОЗНАНИЕ МИРА · ${DATA.grade} КЛАСС · УРОК 1
${DATA.title}
Цель: ${DATA.goal}
Дата: ${new Date().toLocaleDateString('ru-RU')}

Диагностика:
${st.diagnostics.map((x,i)=>(i+1)+'. '+x).join('
')}

Индивидуальный маршрут:
${st.practice.map((x,i)=>(i+1)+'. '+x).join('
')}

Итог: выполнен, попыток ${st.finalAttempts}`;main.innerHTML='<section class="panel"><div class="tag">Результат</div><h2>Задание выполнено</h2><pre id="text"></pre><div class="row"><button class="btn primary" id="copy">Скопировать результат</button><button class="btn" id="again">Пройти заново</button></div><p id="status"></p></section>';$('#text').textContent=t;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(t);$('#status').textContent='Результат скопирован'}catch(e){$('#status').textContent='Выдели текст отчёта и скопируй вручную'}};$('#again').onclick=()=>location.reload()}intro();
</script></body></html>
