<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fa"><title>Математическая мастерская — 4 класс</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1b2e3c;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;padding:20px 12px 40px}main{max-width:790px;margin:0 auto}.surface{background:#fff;border:1px solid #dce4ea;box-shadow:0 12px 32px #1832470a;border-radius:20px;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:22px;font-weight:800;letter-spacing:-.4px}.caption{font-size:13px;color:#657789}.nav{display:flex;gap:6px;margin:20px 0}.nav div{background:#edf2f5;flex:1;text-align:center;border-radius:9px;padding:9px 3px;color:#73838b;font-size:12px;font-weight:650}.nav div.active{background:#26715f;color:#fff}h2{font-size:23px;margin:5px 0 10px}p{line-height:1.55}.muted{color:#596d7e}.box{background:#f0f5f4;border-radius:15px;padding:17px;margin:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cell{border:1px solid #dce5eb;border-radius:14px;padding:15px;min-width:0}.cell b{display:block;font-size:clamp(19px,4.2vw,25px);margin:11px 0}.mini{font-size:12px;color:#647786}.inp{width:100%;font-size:17px;padding:11px 12px;border:1.5px solid #cad6df;border-radius:10px;outline:none;background:#fff;color:#1b2e3c}.inp:focus{border-color:#328a71;box-shadow:0 0 0 3px #328a7124}.btn{font:inherit;font-weight:700;font-size:15px;border:1px solid #d3dde3;background:#fff;color:#265c50;border-radius:11px;padding:12px 17px;min-height:44px;cursor:pointer;touch-action:manipulation}.btn.primary{background:#24745d;border-color:#24745d;color:#fff}.btn.primary:hover{background:#1d614d}.btn:disabled{opacity:.44;cursor:not-allowed}.btn.full{width:100%}.btn.small{font-size:13px;padding:8px 12px;min-height:35px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions>*{flex:1}.big{font-size:clamp(31px,6vw,44px);font-weight:800;text-align:center;line-height:1.35;margin:20px auto}.center{text-align:center}.status{border-radius:12px;padding:15px;background:#ecf6ef;color:#1b563f;margin:14px 0}.status.warn{background:#fff5e7;color:#6d4d23}.status strong{display:block;margin-bottom:5px}.progress{display:flex;gap:5px;margin:10px 0 16px}.progress span{height:7px;flex:1;border-radius:10px;background:#e2e9ed}.progress span.past{background:#4f9b7c}.progress span.current{background:#29725f}.choices{display:grid;gap:9px;margin:15px 0}.choice{font:inherit;text-align:left;border:1.5px solid #d8e3e7;border-radius:11px;background:#fff;padding:13px 14px;cursor:pointer;color:#213c4c}.choice.picked{border-color:#257861;background:#f0f9f4}.choice:disabled{opacity:.7;cursor:not-allowed}table{border-collapse:collapse;width:100%;margin:10px 0 18px}td,th{border-bottom:1px solid #e3ebee;padding:10px 6px;text-align:left;font-size:14px}td:last-child,th:last-child{text-align:right}th{color:#526c75}textarea.inp{resize:vertical;min-height:88px}.hide{display:none!important}.footer{text-align:center;color:#6b7c85;font-size:12px;margin:16px auto}.score{font-size:33px;font-weight:800;margin:4px 0}.pill{border-radius:100px;padding:5px 11px;background:#e2f3eb;color:#28684e;font-size:13px;font-weight:700}.checkmark{font-size:39px;color:#23835b}.btn:focus-visible,.choice:focus-visible{outline:3px solid #88c7b1;outline-offset:2px}@media(max-width:560px){body{padding:8px 7px 24px}.surface{padding:16px 13px;border-radius:13px}.name{font-size:19px}.nav div{font-size:10px;padding:9px 2px}.cell{padding:11px}.grid{gap:7px}.inp{font-size:16px}.box{padding:13px}h2{font-size:21px}.row{align-items:flex-start}}@media print{body{background:#fff}.surface{box-shadow:none;border:0}.btn,.nav{display:none}}
</style>
</head>
<body><main><section class="surface"><header class="top"><div><div class="name">Математическая мастерская</div><div class="caption">4 класс · Умножение и деление чисел, оканчивающихся нулями</div></div><button class="btn small" id="restart">Заново</button></header><div class="nav" id="nav"><div>Проверка</div><div>Тренировка</div><div>Правило</div><div>Результат</div></div><div id="app" aria-live="polite"></div></section><div class="footer">Работает на телефоне и компьютере · Без регистрации</div></main>
<script>
'use strict';
const diagnostic=[['40 × 30',1200,'m'],['230 × 20',4600,'m'],['2400 × 300',720000,'m'],['4800 : 60',80,'d'],['5600 : 70',80,'d'],['72000 : 800',90,'d']];
const bank={
 m:[
 [{q:'20 × 30',a:600,h:'Сколько будет 2 × 3? Затем посчитай нули.'},{q:'40 × 50',a:2000,h:'Сначала умножь 4 на 5.'},{q:'60 × 30',a:1800,h:'Начни с 6 × 3.'},{q:'70 × 40',a:2800,h:'Найди 7 × 4.'},{q:'50 × 60',a:3000,h:'Найди 5 × 6.'}],
 [{q:'120 × 40',a:4800,h:'Найди 12 × 4, затем учти нули.'},{q:'230 × 30',a:6900,h:'Начни с 23 × 3.'},{q:'240 × 20',a:4800,h:'Сначала умножь 24 на 2.'},{q:'150 × 60',a:9000,h:'Найди 15 × 6.'},{q:'320 × 40',a:12800,h:'Найди 32 × 4, затем допиши нули.'}],
 [{q:'2400 × 300',a:720000,h:'Сначала вычисли 24 × 3.'},{q:'340 × 200',a:68000,h:'Найди 34 × 2.'},{q:'3600 × 40',a:144000,h:'Найди 36 × 4.'},{q:'1250 × 400',a:500000,h:'Найди 125 × 4, затем учти нули.'},{q:'240 × 300',a:72000,h:'Начни с 24 × 3.'}]],
 d:[
 [{q:'2400 : 60',a:40,h:'Раздели оба числа на 10.'},{q:'1800 : 30',a:60,h:'Получи 180 : 3.'},{q:'2800 : 40',a:70,h:'Раздели оба числа на 10.'},{q:'3500 : 50',a:70,h:'Получи 350 : 5.'},{q:'4200 : 70',a:60,h:'Получи 420 : 7.'}],
 [{q:'4200 : 60',a:70,h:'Раздели оба числа на 10.'},{q:'5600 : 70',a:80,h:'Получи 560 : 7.'},{q:'8100 : 90',a:90,h:'Получи 810 : 9.'},{q:'9600 : 80',a:120,h:'Получи 960 : 8.'},{q:'8400 : 70',a:120,h:'Получи 840 : 7.'}],
 [{q:'72000 : 800',a:90,h:'Раздели оба числа на 100.'},{q:'96000 : 600',a:160,h:'Получи 960 : 6.'},{q:'84000 : 700',a:120,h:'Получи 840 : 7.'},{q:'144000 : 1200',a:120,h:'Раздели оба числа на 100.'},{q:'56000 : 400',a:140,h:'Получи 560 : 4.'}]]};
const rules={m:[{question:'Чтобы вычислить 240 × 30, сначала удобно выполнить:',opts:['24 × 3','240 × 3','24 × 30'],correct:0,hint:'Какой пример получится, если сначала не учитывать конечные нули?'},{question:'После умножения 24 × 3 нужно дописать:',opts:['1 нуль','2 нуля','3 нуля'],correct:1,hint:'Сосчитай нули в исходных множителях.'},{question:'Чтобы вычислить 70 × 400, сначала удобно найти:',opts:['7 × 40','7 × 4','70 × 4'],correct:1,hint:'Временно не учитывай конечные нули в обоих числах.'}],d:[{question:'Чтобы вычислить 4800 : 60, удобно сначала получить:',opts:['480 : 6','48 : 6','480 : 60'],correct:0,hint:'Подумай, как уменьшить оба числа в десять раз.'},{question:'Если делимое и делитель уменьшить в 10 раз, частное:',opts:['Увеличится','Уменьшится','Не изменится'],correct:2,hint:'Сравни 60 : 20 и 6 : 2.'},{question:'На какое наибольшее из этих чисел можно разделить и 72000, и 800 без остатка?',opts:['10','100','1000'],correct:1,hint:'Выбери наибольшее число из вариантов, при делении на которое оба числа останутся целыми.'}]};
const E=id=>document.getElementById(id);const isInt=v=>/^\d+$/.test(String(v).trim());const safe=s=>String(s).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
let s;
function reset(){s={stage:0,diag:Array(6).fill(''),initial:{m:0,d:0},focus:'m',levels:{m:1,d:1},counts:{m:0,d:0},nextSkill:'m',idx:0,value:'',errors:0,usedHelp:false,hintLevel:0,solved:false,remedial:false,streak:{m:0,d:0},practice:[],ruleType:'m',ruleIndex:0,ruleChoice:-1,ruleChecks:0,ruleHint:false,ruleSolved:false,ruleLog:[]};render()}
function button(id,label,kind='primary',disabled=false){return `<button id="${id}" class="btn ${kind}" ${disabled?'disabled':''} type="button">${label}</button>`}
function setStage(n){s.stage=n;render()}
function chooseQuestion(){const arr=bank[s.focus][s.levels[s.focus]];return arr[s.counts[s.focus]%arr.length]}
function chooseNextType(){const m=s.initial.m,d=s.initial.d;let type;
 if(m>0&&d===0)type='m';else if(d>0&&m===0)type='d';else if(m>d)type=s.idx%3===2?'d':'m';else if(d>m)type=s.idx%3===2?'m':'d';else type=s.idx%2===0?'m':'d';
 // After a remedial task, retain this skill for immediate consolidation
 if(s.justRemediated){type=s.focus;s.justRemediated=false}
 s.focus=type;
}
function startPractice(){const m=diagnostic.slice(0,3).filter((q,i)=>Number(s.diag[i])!==q[1]).length;
 const d=diagnostic.slice(3).filter((q,i)=>Number(s.diag[i+3])!==q[1]).length;
 s.initial={m,d};s.focus=m>=d?'m':'d';
 s.levels.m=m===0?2:m>=2?0:1;s.levels.d=d===0?2:d>=2?0:1;
 s.stage=1;render();}
function record(result){const q=chooseQuestion();s.practice.push({q:q.q,a:q.a,skill:s.focus,level:s.levels[s.focus],first:result==='ok'&&s.errors===0&&!s.usedHelp,outcome:result,tries:s.errors+1,help:s.usedHelp});s.counts[s.focus]++;}
function checkAnswer(){const q=chooseQuestion();if(s.solved||!isInt(s.value))return;
 if(Number(s.value)===q.a){record('ok');s.solved=true;const clean=s.errors===0&&!s.usedHelp;s.streak[s.focus]=clean?s.streak[s.focus]+1:0;
 if(clean&&s.streak[s.focus]>=3){s.levels[s.focus]=Math.min(2,s.levels[s.focus]+1);s.streak[s.focus]=0;s.promoted=true}
 }else{s.errors++;s.usedHelp=true;s.hintLevel=Math.min(2,s.errors);s.streak[s.focus]=0;
 if(s.errors>=2){s.remedial=true;}}
 render();}
function moveOn(){if(s.remedial){record('hard');s.levels[s.focus]=Math.max(0,s.levels[s.focus]-1);s.justRemediated=true;s.streak[s.focus]=0}
 if(s.practice.length>=7){s.ruleType=s.initial.m>s.initial.d?'m':s.initial.d>s.initial.m?'d':s.focus;s.stage=2;render();return}
 if(s.usedHelp){s.justRemediated=true}
 s.idx++;chooseNextType();s.value='';s.errors=0;s.usedHelp=false;s.hintLevel=0;s.remedial=false;s.solved=false;s.promoted=false;render();}
function render(){E('nav').querySelectorAll('div').forEach((x,i)=>x.classList.toggle('active',i===s.stage));const app=E('app');app.innerHTML=s.stage===0?renderDiagnostic():s.stage===1?renderPractice():s.stage===2?renderRules():renderEnd();bind();}
function renderDiagnostic(){return `<h2>1. Реши примеры</h2><p class="muted">Впиши ответы самостоятельно.</p><div class="grid">${diagnostic.map((item,i)=>`<div class="cell"><span class="mini">№ ${i+1}</span><b>${item[0]}</b><input class="inp diag-input" data-index="${i}" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ответ" value="${safe(s.diag[i])}" aria-label="Ответ на пример ${item[0]}"></div>`).join('')}</div><div class="actions">${button('toPractice','Продолжить →','primary',!s.diag.every(isInt))}</div>`}
function renderPractice(){const q=chooseQuestion();let notice='';if(s.solved){notice=`<div class="status"><strong>Правильно!</strong>${s.promoted?'Ты справился с несколькими примерами подряд. Дальше будет сложнее.':s.usedHelp?'Теперь попробуем ещё один похожий пример.':'Продолжай!'}</div>`}else if(s.remedial){notice=`<div class="status warn"><strong>Попробуем пример проще</strong>Сначала вспомни: ${q.h}</div>`}else if(s.hintLevel>0){notice=`<div class="status warn"><strong>Подумай ещё</strong>${s.hintLevel===1?q.h:'Проверь промежуточное действие. '+q.h}</div>`}
 const done=s.practice.length,completed=s.solved||s.remedial;return `<div class="box"><span class="mini">Твои задания</span><h2>${s.focus==='m'?'Умножение':'Деление'}</h2><p style="margin-bottom:0">Решай самостоятельно. Если трудно, воспользуйся подсказкой.</p></div><div class="row"><strong>Задание ${Math.min(7,done+(!s.solved?1:0))} из 7</strong><span class="mini">Без помощи: ${s.practice.filter(x=>x.first).length}</span></div><div class="progress">${Array.from({length:7},(_,i)=>`<span class="${i<done?'past':i===done?'current':''}"></span>`).join('')}</div><div class="cell"><div class="big">${q.q} = ?</div><input class="inp" id="answer" type="text" inputmode="numeric" placeholder="Твой ответ" value="${safe(s.value)}" ${completed?'disabled':''} aria-label="Твой ответ">${!completed?`<div class="actions">${button('checkAnswer','Проверить','primary',!isInt(s.value))}</div>`:''}</div>${notice}${!completed&&s.hintLevel===0?`<div class="actions">${button('tip','Нужна подсказка?','secondary')}</div>`:''}${completed?`<div class="actions">${button('next',s.practice.length>=7?'Восстановить правило →':'Следующий пример →','primary')}</div>`:''}`;}
function renderRules(){const q=rules[s.ruleType][s.ruleIndex];let note='';if(s.ruleSolved)note='<div class="status"><strong>Верно!</strong>Переходи к следующему заданию.</div>';else if(s.ruleChecks>0||s.ruleHint)note=`<div class="status warn"><strong>Подумай ещё</strong>${q.hint}</div>`;
 return `<h2>2. Восстанови правило</h2><p class="muted">Выбери правильный ответ.</p><div class="row"><strong>Задание ${s.ruleIndex+1} из 3</strong><span class="mini">Верно с первого раза: ${s.ruleLog.filter(x=>x.first).length}</span></div><div class="box"><b>${q.question}</b></div><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${s.ruleChoice===i?'picked':''}" data-choice="${i}" ${s.ruleSolved?'disabled':''} type="button">${safe(o)}</button>`).join('')}</div>${note}${s.ruleSolved?`<div class="actions">${button('nextRule',s.ruleIndex===2?'Посмотреть результат →':'Следующее задание →')}</div>`:`<div class="actions">${button('ruleHint','Подсказка','secondary')}${button('ruleCheck','Проверить','primary',s.ruleChoice<0)}</div>`}`;}
function renderEnd(){const first=s.practice.filter(q=>q.first).length;const rulesFirst=s.ruleLog.filter(q=>q.first).length;return `<div class="center"><div class="checkmark">✓</div><h2>Молодец!</h2><p class="muted">Работа завершена.</p></div><div class="grid"><div class="cell"><span class="mini">Примеры без помощи</span><div class="score">${first} из ${s.practice.length}</div></div><div class="cell"><span class="mini">Правило с первого раза</span><div class="score">${rulesFirst} из 3</div></div></div><h3>Твои задания</h3><table><tbody>${s.practice.map(x=>`<tr><td>${x.q}</td><td>${x.first?'Самостоятельно':x.outcome==='hard'?'Было трудно':'С подсказкой'}</td></tr>`).join('')}</tbody></table><div class="actions">${button('copy','Скопировать результат','primary')}</div><p class="mini" id="copyStatus"></p>`;}
function bind(){E('restart').onclick=reset;
 if(s.stage===0){document.querySelectorAll('.diag-input').forEach(input=>{input.oninput=()=>{s.diag[+input.dataset.index]=input.value;E('toPractice').disabled=!s.diag.every(isInt)};input.onkeydown=e=>{if(e.key==='Enter'&&s.diag.every(isInt))startPractice()}});E('toPractice').onclick=startPractice;}
 if(s.stage===1){const input=E('answer');if(!s.solved&&!s.remedial){input.oninput=()=>{s.value=input.value;E('checkAnswer').disabled=!isInt(s.value)};input.onkeydown=e=>{if(e.key==='Enter')checkAnswer()};E('checkAnswer').onclick=checkAnswer;if(E('tip'))E('tip').onclick=()=>{s.hintLevel=1;s.usedHelp=true;s.streak[s.focus]=0;render()};}if(E('next'))E('next').onclick=moveOn;}
 if(s.stage===2){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.ruleChoice=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('picked',x===b));E('ruleCheck').disabled=false});if(E('ruleCheck'))E('ruleCheck').onclick=()=>{const q=rules[s.ruleType][s.ruleIndex];if(s.ruleChoice===q.correct){s.ruleSolved=true;s.ruleLog.push({first:s.ruleChecks===0&&!s.ruleHint});}else{s.ruleChecks++;s.ruleHint=true;}render()};if(E('ruleHint'))E('ruleHint').onclick=()=>{s.ruleHint=true;render()};if(E('nextRule'))E('nextRule').onclick=()=>{s.ruleIndex++;if(s.ruleIndex>=3){s.stage=3}else{s.ruleChoice=-1;s.ruleChecks=0;s.ruleHint=false;s.ruleSolved=false}render()};}
 if(s.stage===3)E('copy').onclick=copyResult;
}
async function copyResult(){const first=s.practice.filter(x=>x.first).length;const t=[
'Математическая мастерская — 4 класс',`Начальная проверка: ${diagnostic.filter((q,i)=>Number(s.diag[i])===q[1]).length} из 6`,
`Самостоятельно: ${first} из ${s.practice.length}`,`Восстановление правила: ${s.ruleLog.filter(x=>x.first).length} из 3 с первой попытки`,
...s.practice.map(x=>`${x.q} — ${x.first?'самостоятельно':x.outcome==='hard'?'нужна тренировка':'с подсказкой'}`)].join('\n');
try{if(!navigator.clipboard||!window.isSecureContext)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(t);E('copyStatus').textContent='Результат скопирован.';}catch(e){const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.top='0';document.body.append(el);el.select();let success=document.execCommand('copy');el.remove();if(success){E('copyStatus').textContent='Результат скопирован.';}else{E('copyStatus').textContent='Выдели текст ниже и скопируй его.';const area=document.createElement('textarea');area.className='inp';area.readOnly=true;area.value=t;E('copyStatus').after(area);area.focus();area.select();}}}
reset();
</script></body></html>
