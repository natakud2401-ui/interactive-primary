<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АЛГО.ЛАБ — Создаём алгоритмы • 3 класс</title><style>
:root{--ink:#233053;--muted:#647290;--blue:#4868eb;--violet:#7944e8;--pink:#fa76b4;--mint:#13c9ba;--yellow:#ffce62;--good:#159870;--bad:#d34c65;--paper:#f5f7ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 0% 0%,#e7dcff 0,transparent 45%),radial-gradient(ellipse at 95% 25%,#d9f6ff 0,transparent 45%),#f5f7ff;color:var(--ink);font:16px/1.5 'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh}.app{width:min(840px,calc(100% - 26px));margin:22px auto 50px}.hero{position:relative;overflow:hidden;border-radius:27px;background:linear-gradient(115deg,#673bdb,#4277e9 65%,#21bcdd);box-shadow:0 10px 0 #bcc9f3,0 23px 39px #304fba3b;color:white;padding:26px 28px 22px}.hero:before{content:'';position:absolute;border:25px solid #ffffff17;border-radius:100%;width:250px;height:250px;right:-100px;top:-120px}.hero:after{content:'';position:absolute;background:#ffffff12;width:170px;height:170px;transform:rotate(23deg);border-radius:35px;right:60px;bottom:-140px}.hero-content{display:flex;justify-content:space-between;gap:12px;align-items:center;position:relative;z-index:1}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.11em;color:#e7eaff}.hero h1{font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.15;margin:8px 0}.hero p{margin:0;color:#eaf4ff;max-width:540px}.robot{width:110px;filter:drop-shadow(0 9px 3px #1c277644);flex-shrink:0}.progress{margin-top:20px;background:#ffffff46;border-radius:50px;height:12px;overflow:hidden;position:relative}.bar{height:100%;width:0;background:linear-gradient(90deg,#fff3ae,#ffca55);border-radius:40px;transition:width .35s}.progress-label{display:flex;justify-content:space-between;margin-top:8px;font-size:.8rem;color:#fff;position:relative}.panel{margin-top:22px;background:white;border-radius:24px;padding:25px;box-shadow:0 8px 0 #e2e7f9,0 17px 38px #5d6aab1b;border:1px solid #e8edff}.kicker{display:inline-flex;border-radius:22px;background:#eceaff;color:#5d48bd;padding:6px 13px;font-size:.76rem;font-weight:850;letter-spacing:.02em}.panel h2{margin:13px 0 9px;font-size:clamp(1.24rem,3vw,1.65rem);line-height:1.25}.lead{color:#566581;margin:7px 0 18px}.theory{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:21px 0}.tcard{border-radius:17px;padding:15px 13px;border:1px solid #e7ebfa;box-shadow:0 5px 0 #e8edfb;background:linear-gradient(160deg,#fff,#f9faff)}.tcard strong{display:block;margin:6px 0}.tcard span{font-size:.86rem;color:#5d6b88}.theory-example{margin-top:18px;border:1px solid #dbe4ff;border-radius:19px;background:linear-gradient(145deg,#f9fcff,#f0eeff);padding:16px;box-shadow:0 5px 0 #e0e5fb}.theory-example h3{margin:0 0 10px;font-size:1rem;color:#4250a5}.example-step{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e3e9fc;border-radius:12px;padding:9px 12px;margin:7px 0;box-shadow:0 3px 0 #dce3f6;font-weight:620}.example-num{display:grid;place-items:center;background:linear-gradient(135deg,#5e6bea,#8971ec);border-radius:10px;color:#fff;flex:0 0 31px;width:31px;height:31px;font-weight:850;box-shadow:0 3px 0 #5156ad}.theory-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.compare-card{padding:12px 14px;border-radius:13px;font-size:.9rem;box-shadow:0 4px 0 #e5eaf8}.compare-card.bad{background:#fff0f2;border:1px solid #f5c8d0;color:#a13e52}.compare-card.good{background:#e4faf2;border:1px solid #b6e6d4;color:#166e54}.compare-card b{display:block;margin-bottom:5px}.compare-card p{margin:0}.theory-caption{font-weight:750;color:#4846a0;margin:14px 0 5px}.big-icon{font-size:1.8rem}.btn{border:0;border-radius:13px;padding:13px 18px;font:750 1rem 'Segoe UI',Arial,sans-serif;cursor:pointer;transition:transform .13s,box-shadow .13s;max-width:100%}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{color:#fff;background:linear-gradient(135deg,#6b45e9,#426ee9);box-shadow:0 5px 0 #4235a5,0 9px 17px #5143be30}.secondary{color:#5247bd;background:#eeebff;box-shadow:0 4px 0 #cbc7f0}.green{background:linear-gradient(130deg,#17bd9e,#0d9b88);box-shadow:0 5px 0 #0b7d6d;color:#fff}.full{width:100%}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:23px;flex-wrap:wrap}.choice-list{display:grid;gap:10px;margin:16px 0}.choice{display:block;text-align:left;background:#fff;border:2px solid #e2e8fb;border-radius:15px;width:100%;padding:12px 14px;font:650 .97rem 'Segoe UI',Arial,sans-serif;color:#273959;box-shadow:0 4px 0 #e4e9f9;cursor:pointer;transition:.15s}.choice:hover{border-color:#8882e9;background:#f9f8ff}.choice.selected{border-color:#7957e3;background:#eeebff}.choice:active{transform:translateY(2px);box-shadow:0 2px 0 #e4e9f9}.feedback{padding:12px 14px;border-radius:14px;margin:14px 0 0;font-size:.94rem;font-weight:600;border:1px solid}.feedback.good{color:#09694e;background:#e4fbf2;border-color:#b7ecd7}.feedback.bad{color:#a63d52;background:#fff0f2;border-color:#ffcbd4}.feedback.info{color:#564aa0;background:#f0edff;border-color:#ddd5ff}.steprows{display:grid;gap:9px;margin-top:16px}.step{border:1px solid #dce5f7;border-radius:13px;background:linear-gradient(150deg,#fff,#f8faff);display:flex;align-items:center;gap:9px;padding:10px 11px;box-shadow:0 3px 0 #e1e7f4}.step .text{flex:1;font-weight:600}.step .num{font-size:.75rem;font-weight:850;background:#e9eeff;border-radius:10px;padding:6px 9px;color:#6558b9}.smallbtn{border:1px solid #d5daee;background:#fff;color:#5751a9;border-radius:9px;font-weight:800;padding:5px 9px;cursor:pointer}.smallbtn:disabled{opacity:.25}.mini-title{font-weight:800;margin:18px 0 6px}.board{max-width:370px;margin:15px auto;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:7px;background:linear-gradient(140deg,#d3dcf4,#e8eeff);padding:11px;border-radius:20px;box-shadow:inset 0 3px 7px #8193ba33,0 7px 0 #b6c5df}.cell{aspect-ratio:1;border-radius:11px;background:linear-gradient(145deg,#fff,#dfe9ff);box-shadow:0 4px 0 #bbcae6,inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,4vw,33px);position:relative}.wall{background:linear-gradient(145deg,#818ba7,#536386);box-shadow:0 5px 0 #414a67,inset 2px 2px 1px #aab4c6;color:#fff}.goal{background:linear-gradient(145deg,#fff2b3,#ffc45c);box-shadow:0 4px 0 #d99c2b}.visited:not(.goal){background:linear-gradient(145deg,#c1f9ef,#7bdfca)}.robotcell{background:linear-gradient(145deg,#e2daff,#aaabfa)}.dirs{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px auto}.dir{min-width:64px;padding:11px;background:linear-gradient(135deg,#6f72ef,#5a46d9);box-shadow:0 5px 0 #4037a2;color:#fff;border:0;border-radius:13px;font-size:1.28rem;font-weight:800;cursor:pointer}.dir:active{transform:translateY(4px);box-shadow:none}.program{min-height:60px;border:2px dashed #d4dafa;background:#fafaff;border-radius:15px;padding:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.chip{display:flex;flex-direction:column;min-width:39px;align-items:center;background:#e8eaff;color:#5544b0;border-radius:10px;padding:4px 6px;font-size:1.25rem;line-height:1.1;font-weight:800}.chip small{font-size:.63rem;color:#747bb5}.note{background:#f8f8ff;border-left:4px solid #9b87e6;border-radius:9px;padding:12px 13px;margin:15px 0;color:#586683}.rule-list{display:grid;gap:12px}.rule{background:#f9faff;border:1px solid #e4e9f6;padding:14px;border-radius:14px}.rule select,.field{width:100%;margin-top:7px;padding:12px;border:2px solid #dde3f6;border-radius:12px;background:white;font:600 1rem 'Segoe UI',Arial,sans-serif;color:#233053;outline:none}.rule select:focus,.field:focus{border-color:#8a68e8}.task-label{font-weight:780;margin:14px 0 5px}.render-note{font-size:.82rem;color:#637293;margin-top:8px}.final-score{font-size:2.3rem;font-weight:900;color:#5e52d7;margin:3px 0}.success-stars{font-size:2.2rem;letter-spacing:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level-banner{border-radius:16px;background:linear-gradient(110deg,#fff4d8,#e7f9ff);padding:14px;color:#3d466b;margin:15px 0;border:1px solid #eae4cc}.illustration{width:100%;max-height:140px;margin:12px 0;display:block}.footer{font-size:.78rem;color:#808baa;text-align:center;margin:17px}.hidden{display:none!important}@media(max-width:600px){.hero{padding:21px 17px}.robot{width:74px}.panel{padding:18px}.theory{grid-template-columns:1fr}.tcard{display:flex;align-items:center;gap:11px}.tcard strong{margin:0}.dirs{gap:6px}.dir{min-width:57px}.actions .btn{flex:1}.grid2{grid-template-columns:1fr}.theory-compare{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="hero"><div class="hero-content"><div><div class="eyebrow">ВЫЧИСЛИТЕЛЬНОЕ МЫШЛЕНИЕ · 3 КЛАСС</div><h1>АЛГО.ЛАБ<br>Создаём алгоритмы</h1><p>Собирай команды, управляй роботом, исправляй ошибки.</p></div><svg class="robot" viewBox="0 0 110 125" aria-hidden="true"><defs><linearGradient id="face" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9f0ff"/></linearGradient><linearGradient id="body" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffec9e"/><stop offset="1" stop-color="#ffaa68"/></linearGradient></defs><rect x="21" y="29" width="69" height="58" rx="20" fill="url(#face)" stroke="#a5c8ff" stroke-width="4"/><rect x="28" y="36" width="55" height="38" rx="13" fill="#424c99"/><ellipse cx="44" cy="55" rx="7" ry="9" fill="#86ffff"/><ellipse cx="68" cy="55" rx="7" ry="9" fill="#86ffff"/><path d="M47 66 Q56 73 65 66" stroke="#fff" fill="none" stroke-width="3" stroke-linecap="round"/><path d="M55 29 V16" stroke="#dffaff" stroke-width="5"/><circle cx="55" cy="12" r="7" fill="#ffda77"/><rect x="28" y="88" width="56" height="29" rx="13" fill="url(#body)"/><path d="M31 116 L24 124 M79 116 L86 124" stroke="#ffe7b8" stroke-width="8"/><path d="M22 94 L10 105 M89 94 L101 105" stroke="#d7edff" stroke-width="8" stroke-linecap="round"/></svg></div><div class="progress"><div class="bar" id="bar"></div></div><div class="progress-label"><span id="phase">Теория</span><span id="progressText">Начало</span></div></header><section class="panel" id="screen"></section><div class="footer">Все ответы проверяются прямо в браузере. Имя и регистрация не требуются.</div></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={stage:0,di:0,first:0,tries:[0,0,0],complete:[false,false,false,false,false,false,false],route:'',order:[],selected:'',errors:0,orderFails:0,orderBaseSolved:false,orderAnalogChoice:'',orderRescueChoice:'',orderRescuePassed:false,robotFails:0,robotBaseSolved:false,robotAnalogChoice:'',program:[],robotChecked:false,debug:'',debugSolved:false,own:['','','',''],ownChecked:false,rules:['','',''],report:''};
const diag=[{skill:'Точная команда',title:'Какая команда понятна исполнителю?',prompt:'Тебе нужно нарисовать квадрат со стороной 4 клетки.',answers:[['vague','Нарисуй красивую фигуру.'],['precise','Нарисуй квадрат со стороной 4 клетки.'],['general','Нарисуй любую фигуру из четырёх линий.']],correct:'precise',hint:'Точная команда сообщает, какую фигуру нарисовать и какого она размера.'},{skill:'Порядок действий',title:'Что нужно сделать раньше?',prompt:'Ты делаешь бумажную открытку. Выбери правильный порядок.',answers:[['a','Напиши пожелание → возьми лист → сложи его.'],['b','Возьми лист → сложи его → напиши пожелание внутри.'],['c','Сложи лист → напиши пожелание → возьми лист.']],correct:'b',hint:'Нельзя сложить лист, если ещё не взял его.'},{skill:'Команды роботу',title:'Прочитай программу робота',prompt:'Робот стоит в нижнем левом углу поля 3 × 3. Цель — верхний правый угол. Какая инструкция его приведёт туда?',answers:[['a','↑ ↑ → →'],['b','↑ → ↑'],['c','→ → → ↑']],correct:'a',hint:'Нужно переместиться на две клетки вверх и две клетки вправо.'}];
const routeData={support:{name:'Учусь шаг за шагом',head:'Собери простую инструкцию',lead:'Чтобы сделать бумажный флажок, расположи команды в порядке выполнения.',items:['Возьми лист цветной бумаги.','Нарисуй на нём треугольник.','Вырежи треугольник по контуру.','Прикрепи его к палочке.']},standard:{name:'Конструктор алгоритмов',head:'Порядок имеет значение',lead:'Собери инструкцию, по которой робот приготовит бумажную табличку.',items:['Положи лист на стол.','Начерти на листе прямоугольник.','Напиши слово внутри прямоугольника.','Вырежи табличку по контуру.','Прикрепи табличку к папке.']},advanced:{name:'Мастер алгоритмов',head:'Исправь сложную инструкцию',lead:'Собери последовательность подготовки робота к рисованию схемы.',items:['Возьми чистый лист.','Отметь на листе начальную точку.','Отступи вправо 4 клетки и отметь вторую точку.','Соедини точки прямой линией.','Подпиши расстояние между точками.']}};
const levelNames={support:'Базовый',standard:'Основной',advanced:'Исследовательский'};
function btn(label,fn='next()',disabled=false,cl='primary'){return `<button class="btn ${cl}" ${disabled?'disabled':''} onclick="${fn}">${label}</button>`}
function feedback(message,type='info'){return `<div class="feedback ${type}" role="status">${message}</div>`}
function foot(show=true){return `<div class="actions">${show?btn('Далее →','next()',false):''}</div>`}
function updateChrome(){const names=['Теория','Диагностика','Твой маршрут','Робот и команды','Исправление ошибки','Создай алгоритм','Восстанови правило','Результаты'];$('#phase').textContent=names[S.stage];$('#progressText').textContent=S.stage===1?`Вопрос ${S.di+1}/3`:`Этап ${Math.min(S.stage+1,8)}/8`;$('#bar').style.width=`${(S.stage+ (S.stage===1?S.di/3:0))/7*100}%`}
function render(){updateChrome();const p=$('#screen');p.innerHTML=[theory,diagnostic,ordering,robot,debug,creation,rule,finish][S.stage]();window.scrollTo({top:0,behavior:'smooth'})}
function next(){if(S.stage===0){S.stage=1}else if(S.stage===1){if(!S.complete[0]||S.di<3)return;S.stage=2}else if(S.stage===2){if(!S.complete[1])return;S.stage=3}else if(S.stage===3){if(!S.complete[2])return;S.stage=4}else if(S.stage===4){if(!S.complete[3])return;S.stage=5}else if(S.stage===5){if(!S.complete[4])return;S.stage=6}else if(S.stage===6){if(!S.complete[5])return;S.stage=7}render()}
function theory(){return `<span class="kicker">ШАГ 1 · КОРОТКО О ГЛАВНОМ</span><h2>Как создать алгоритм?</h2><p class="lead"><b>Алгоритм</b> — это последовательность понятных и точных команд, которые исполнитель выполняет в определённом порядке, чтобы получить результат.</p><p><b>Исполнитель</b> — тот, кто выполняет команды: человек, робот или компьютер. Каждая команда должна быть ему понятна.</p><div class="theory"><div class="tcard"><div class="big-icon">①</div><div><strong>Определи цель</strong><span>Что должно получиться в конце?</span></div></div><div class="tcard"><div class="big-icon">②</div><div><strong>Запиши шаги</strong><span>Каждая команда — точное действие. Порядок важен.</span></div></div><div class="tcard"><div class="big-icon">③</div><div><strong>Проверь алгоритм</strong><span>Выполни шаги по очереди и исправь ошибки.</span></div></div></div><div class="theory-example"><h3>Пример · Как подготовить тетрадь к работе</h3><div class="example-step"><span class="example-num">1</span><span>Положи тетрадь на парту.</span></div><div class="example-step"><span class="example-num">2</span><span>Открой тетрадь на чистой странице.</span></div><div class="example-step"><span class="example-num">3</span><span>Запиши сегодняшнее число.</span></div><div class="theory-caption">Что произойдёт, если перепутать шаги?</div><p style="margin:0;color:#576785;font-size:.92rem">Например, нельзя записать число, пока тетрадь закрыта. Поэтому команды выполняют по порядку.</p></div><div class="theory-compare"><div class="compare-card bad"><b>Неточная команда</b><p>«Нарисуй красивую фигуру».</p></div><div class="compare-card good"><b>Точная команда</b><p>«Нарисуй квадрат со стороной 4 клетки».</p></div></div><div class="note"><b>Запомни:</b> алгоритм должен быть понятным, точным и выполнимым. Если результат неверный, найди шаг с ошибкой и исправь его.</div><div class="actions">${btn('Начать проверку →','next()')}</div>`}
function optionsHTML(items){return `<div class="choice-list">${items.map(([v,label])=>`<button type="button" class="choice ${S.selected===v?'selected':''}" onclick="choose('${v}')">${esc(label)}</button>`).join('')}</div>`}
function choose(v){S.selected=v;renderCurrent()}
function renderCurrent(){updateChrome();$('#screen').innerHTML=[theory,diagnostic,ordering,robot,debug,creation,rule,finish][S.stage]()}
function diagnostic(){if(S.di>=3){return `<span class="kicker">ДИАГНОСТИКА ПРОЙДЕНА</span><h2>Твой маршрут готов</h2><div class="level-banner"><b>Верно с первой попытки: ${S.first} из 3.</b><p>Маршрут: <b>${levelNames[S.route]}</b></p></div>${feedback('Дальше ты будешь создавать алгоритмы и управлять исполнителем.','good')}${foot()}`};const q=diag[S.di];return `<span class="kicker">ДИАГНОСТИКА · ${S.di+1}/3 · ${q.skill}</span><h2>${q.title}</h2><p class="lead">${q.prompt}</p>${S.di===2?smallBoard():''}${optionsHTML(q.answers)}${S.tries[S.di]>0?feedback(S.tries[S.di]>=2?'Подсказка по шагам: '+q.hint:'Подумай ещё. '+q.hint,'bad'):''}${btn('Проверить ответ','checkDiag()',!S.selected,'primary full')}`}
function smallBoard(){return `<div class="board" style="--n:3;max-width:235px">${Array.from({length:9},(_,i)=>`<div class="cell ${i===6?'robotcell':i===2?'goal':''}">${i===6?'🤖':i===2?'★':''}</div>`).join('')}</div>`}
function checkDiag(){const q=diag[S.di];if(S.selected===q.correct){if(S.tries[S.di]===0)S.first++;S.selected='';S.di++;if(S.di===3){S.route=S.first===3?'advanced':S.first===2?'standard':'support';S.complete[0]=true;S.order=shuffle(routeData[S.route].items)}renderCurrent()}else{S.tries[S.di]++;S.selected='';renderCurrent()}}
function shuffle(arr){return [...arr].map((v,i)=>({v,sort:(i*17+7)%arr.length})).sort((a,b)=>a.sort-b.sort).map(x=>x.v)}
function ordering(){const data=routeData[S.route];if(S.orderBaseSolved&&!S.complete[1])return `<span class="kicker">ЗАКРЕПЛЕНИЕ</span><h2>Ещё одна инструкция</h2><p class="lead">Основной алгоритм собран. Теперь выбери правильную последовательность для рисования круга.</p>${optionsHTML([['wrong1','Нарисуй круг → Возьми карандаш → Раскрась круг'],['right','Возьми карандаш → Нарисуй круг → Раскрась круг'],['wrong2','Возьми карандаш → Раскрась круг → Нарисуй круг']])}${S.orderFails>0?'<div class="note">Сначала подготовь инструмент, затем создай фигуру и только после этого раскрась её.</div>':''}${btn('Проверить закрепление','checkOrderAnalog()',!S.selected,'primary full')}`;
return `<span class="kicker">ТРЕНИРОВКА · ${levelNames[S.route].toUpperCase()}</span><h2>${data.head}</h2><div class="level-banner">${data.lead}</div><div class="steprows">${S.order.map((t,i)=>`<div class="step"><span class="num">${i+1}</span><span class="text">${esc(t)}</span><button class="smallbtn" aria-label="Выше" ${i===0||S.complete[1]?'disabled':''} onclick="moveOrder(${i},-1)">↑</button><button class="smallbtn" aria-label="Ниже" ${i===S.order.length-1||S.complete[1]?'disabled':''} onclick="moveOrder(${i},1)">↓</button></div>`).join('')}</div>${S.orderFails>0&&!S.complete[1]?feedback(S.orderFails>1?'Проверь сначала подготовку материалов. Каждый следующий шаг должен быть возможен после предыдущего.':'В последовательности есть ошибка. Подумай, можно ли выполнить каждый шаг именно в таком порядке.','bad'):''}${S.orderFails>=2&&!S.orderRescuePassed?`<div class="rule"><b>Маленький шаг. Что нужно сделать первым?</b>${[['first','Подготовить лист'],['last','Вырезать готовую работу']].map(([v,t])=>`<button class="choice ${S.orderRescueChoice===v?'selected':''}" onclick="S.orderRescueChoice='${v}';renderCurrent()">${t}</button>`).join('')}${btn('Проверить шаг','checkRescue()',!S.orderRescueChoice,'secondary full')}</div>`:''}${S.complete[1]?feedback('Алгоритм собран правильно. Можно переходить дальше.','good')+foot():btn('Проверить порядок','checkOrder()',false,'primary full')}`}
function checkRescue(){if(S.orderRescueChoice==='first')S.orderRescuePassed=true;else S.orderRescueChoice='';renderCurrent()}
function checkOrderAnalog(){if(S.selected==='right'){S.complete[1]=true;S.selected=''}else{S.orderFails++;S.selected=''}renderCurrent()}
function moveOrder(i,d){const j=i+d;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];renderCurrent()}
function checkOrder(){if(S.order.every((v,i)=>v===routeData[S.route].items[i])){if(S.orderFails>0){S.orderBaseSolved=true;S.selected=''}else S.complete[1]=true}else{S.errors++;S.orderFails++}renderCurrent()}
const mapObstacles=['1,2','1,1','2,1'];const arrow={up:'↑',down:'↓',left:'←',right:'→'};
function robotWalk(commands){let x=0,y=3,trace=['0,3'];for(let i=0;i<commands.length;i++){let c=commands[i],nx=x+(c==='right'?1:c==='left'?-1:0),ny=y+(c==='down'?1:c==='up'?-1:0);if(nx<0||ny<0||nx>3||ny>3)return {x,y,trace,status:'edge',step:i+1};if(mapObstacles.includes(nx+','+ny))return {x,y,trace,status:'wall',step:i+1};x=nx;y=ny;trace.push(x+','+y)}return {x,y,trace,status:x===3&&y===0?'goal':'short',step:commands.length}}
function robotGrid(checked=false,cmds=S.program){const res=robotWalk(cmds);return `<div class="board" style="--n:4">${Array.from({length:16},(_,i)=>{let x=i%4,y=Math.floor(i/4),id=x+','+y;let kind=mapObstacles.includes(id)?'wall':(x===3&&y===0)?'goal':'';if(checked&&res.trace.includes(id)&&!kind)kind='visited';if(x===(checked?res.x:0)&&y===(checked?res.y:3))kind='robotcell';return `<div class="cell ${kind}">${kind==='robotcell'?'🤖':kind==='wall'?'▥':kind==='goal'?'★':checked&&res.trace.includes(id)?'•':''}</div>`}).join('')}</div>`}
function robot(){if(S.robotBaseSolved&&!S.complete[2])return `<span class="kicker">ЗАКРЕПЛЕНИЕ</span><h2>Ещё один маршрут</h2><p class="lead">Робот дошёл до звезды. А теперь представь другое поле: робот стоит в нижнем левом углу поля 3 × 3. Чтобы попасть в верхний левый угол, какую программу нужно выполнить?</p>${optionsHTML([['right','→ →'],['up','↑ ↑'],['mixed','↑ → ↑']])}${S.robotFails>1?'<div class="note">Столбец не меняется, а строка должна уменьшиться на две клетки.</div>':''}${btn('Проверить закрепление','checkRobotAnalog()',!S.selected,'primary full')}`;
const res=robotWalk(S.program),success=S.complete[2],max=10;return `<span class="kicker">ИСПОЛНИТЕЛЬ · РОБОТ</span><h2>4. Проведи робота к звезде</h2><p class="lead">Составь программу из стрелок. Робот выполняет команды по порядку. Через серые клетки проходить нельзя.${S.route==='advanced'?' Усложнение: найди путь из 6 команд, начиная вправо.':''}</p>${robotGrid(S.robotChecked)}<div class="dirs">${Object.entries(arrow).map(([k,a])=>`<button class="dir" ${success||S.program.length>=max?'disabled':''} onclick="addMove('${k}')" aria-label="${k}">${a}</button>`).join('')}</div><div class="mini-title">Твоя программа (${S.program.length} команд)</div><div class="program">${S.program.map((c,i)=>`<span class="chip"><small>${i+1}</small>${arrow[c]}</span>`).join('')||'<span style="color:#9a9fb5">Нажимай на стрелки выше</span>'}</div><div class="actions">${btn('Отменить','undoMove()',success||!S.program.length,'secondary')}${btn('Очистить','clearMove()',success||!S.program.length,'secondary')}</div>${S.robotChecked?feedback(success?'Робот добрался до звезды! '+(S.program.length===6?'Ты нашёл кратчайший путь.':'Алгоритм работает.'):(res.status==='goal'?'Робот дошёл до звезды, но нужно соблюсти дополнительное условие о первой команде и длине маршрута.':res.status==='wall'?`Робот встретил стену на команде ${res.step}.`:res.status==='edge'?`На команде ${res.step} робот вышел за пределы поля.`:'До звезды ещё не дошли.')+' Проверь команды.',success?'good':'bad'):''}${S.robotFails>=2?'<div class="note"><b>Пошаговая помощь:</b> чтобы обойти стену, держись либо левого края, либо нижнего и правого края. В каждой команде делай один шаг.</div>':''}${success?foot():btn('Выполнить программу','checkRobot()',!S.program.length,'primary full')}`}
function checkRobotAnalog(){if(S.selected==='up'){S.complete[2]=true;S.selected=''}else{S.robotFails++;S.selected=''}renderCurrent()}
function addMove(m){S.program.push(m);S.robotChecked=false;renderCurrent()}
function undoMove(){S.program.pop();S.robotChecked=false;renderCurrent()}
function clearMove(){S.program=[];S.robotChecked=false;renderCurrent()}
function checkRobot(){S.robotChecked=true;let r=robotWalk(S.program),ok=r.status==='goal'&&(S.route!=='advanced'||(S.program.length===6&&S.program[0]==='right'));if(ok){if(S.robotFails>0){S.robotBaseSolved=true;S.selected=''}else S.complete[2]=true}else S.robotFails++;renderCurrent()}
function debug(){const options=[['up','↑ Вверх'],['down','↓ Вниз'],['left','← Влево'],['right','→ Вправо']];return `<span class="kicker">ОТЛАДКА</span><h2>5. Найди неверную команду</h2><p class="lead">Робот должен пройти от старта к звезде. Программист ошибся в пятой команде. Замени только её.</p>${robotGrid(false,[])}<div class="program">${['up','up','up','right',S.debug||'down','right'].map((m,i)=>`<span class="chip" style="${i===4?'background:#ffe0e7;color:#b34265':''}"><small>${i+1}</small>${arrow[m]}</span>`).join('')}</div><div class="mini-title">Какой должна быть пятая команда?</div>${optionsHTML(options)}${S.debugSolved?feedback('Правильно! Исправление одной команды восстановило весь маршрут.','good')+foot():`${S.errors>0&&S.debug===''?feedback('После четырёх команд робот уже находится на верхней строке. Двигайся к звезде.','info'):''}${btn('Проверить исправление','checkDebug()',!S.selected,'primary full')}`}`}
function checkDebug(){if(S.selected==='right'){S.debug='right';S.debugSolved=true;S.complete[3]=true}else{S.errors++;S.selected=''}renderCurrent()}
function creation(){const fields=[['Цель','Например: Подготовить школьную сумку'],['Шаг 1','Первая точная команда'],['Шаг 2','Следующая команда'],['Шаг 3','Последняя команда']];return `<span class="kicker">ТЫ — АВТОР</span><h2>6. Создай собственный алгоритм</h2><p class="lead">Придумай последовательность из трёх точных действий. Твой алгоритм должен помогать выполнить полезную задачу.</p><div class="theory" style="grid-template-columns:repeat(2,1fr)"><div class="tcard"><div><strong>Идея 1</strong><span>Как собрать портфель</span></div></div><div class="tcard"><div><strong>Идея 2</strong><span>Как полить растение</span></div></div></div>${fields.map((f,i)=>`<div class="task-label">${f[0]}</div><input class="field" maxlength="150" id="f${i}" placeholder="${f[1]}" value="${esc(S.own[i])}" oninput="onOwn(${i},this.value)" ${S.complete[4]?'disabled':''}>`).join('')}<div class="note"><b>Испытай инструкцию:</b> представь, что исполнитель ничего не знает, кроме твоих команд. Сможет ли он их выполнить?</div><label class="task-label"><input type="checkbox" id="owncheck" ${S.ownChecked?'checked':''} onchange="S.ownChecked=this.checked;updateCreateButton()"> Все шаги точные, идут по порядку, цель достигается</label>${S.complete[4]?feedback('Твой алгоритм записан! Попроси одноклассника проверить его на практике.','good')+foot():btn('Алгоритм готов','checkOwn()',false,'primary full')}<div id="createMsg"></div>`}
function onOwn(i,v){S.own[i]=v;updateCreateButton()};function updateCreateButton(){};
function checkOwn(){S.own=Array.from({length:4},(_,i)=>$('#f'+i).value.trim());S.ownChecked=$('#owncheck').checked;if(S.own.every(v=>v.length>=8)&&S.ownChecked){S.complete[4]=true;renderCurrent()}else $('#createMsg').innerHTML=feedback('Заполни цель и три команды (каждую достаточно подробно), затем отметь проверку.','bad')}
const ruleQuestions=[{q:'Команда алгоритма должна быть…',opts:[['precise','точной и понятной'],['random','случайной'],['vague','красивой, но неточной']],correct:'precise'},{q:'Команды алгоритма выполняются…',opts:[['order','в установленном порядке'],['any','в любом порядке'],['last','только последняя команда']],correct:'order'},{q:'Если результат неверный, нужно…',opts:[['fix','найти и исправить ошибку'],['guess','добавить случайные команды'],['leave','не проверять алгоритм']],correct:'fix'}];
function rule(){return `<span class="kicker">ВОССТАНОВИ ПРАВИЛО</span><h2>7. Как создают алгоритмы?</h2><p class="lead">Восстанови три главных правила. Решать предыдущие задачи заново не нужно.</p><div class="rule-list">${ruleQuestions.map((r,i)=>`<div class="rule"><b>${i+1}. ${r.q}</b><select ${S.complete[5]?'disabled':''} onchange="setRule(${i},this.value)"><option value="">Выбери продолжение</option>${r.opts.map(([v,t])=>`<option value="${v}" ${S.rules[i]===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div>${S.errors>0&&!S.complete[5]?'<div class="note">Проверь смысл каждого правила: сможет ли другой исполнитель повторить действия без твоих объяснений?</div>':''}${S.complete[5]?feedback('Все три правила восстановлены. Теперь ты умеешь не только выполнять, но и создавать алгоритмы.','good')+foot():btn('Проверить правила','checkRules()',S.rules.some(x=>!x),'primary full')}`}
function setRule(i,v){S.rules[i]=v;renderCurrent()}
function checkRules(){if(S.rules.every((v,i)=>v===ruleQuestions[i].correct)){S.complete[5]=true}else S.errors++;renderCurrent()}
function finish(){return `<span class="kicker">РЕЗУЛЬТАТ</span><div style="text-align:center"><div class="success-stars">✦ ✦ ✦</div><h2>Алгоритмическая миссия выполнена!</h2><div class="final-score">6 из 6</div><p class="lead">Все практические этапы пройдены.</p></div><div class="level-banner"><b>Диагностика:</b> ${S.first}/3 с первой попытки<br><b>Маршрут:</b> ${levelNames[S.route]}<br><b>Программирование робота:</b> ${S.program.length} команд<br><b>Алгоритм:</b> ${esc(S.own[0])}</div><div class="actions">${btn('Скопировать результат','copyReport()',false,'green')}${btn('Пройти снова','restart()',false,'secondary')}</div><div id="copyMsg"></div>`}
function reportText(){return `Создаём алгоритмы · 3 класс\nДиагностика: ${S.first} из 3 самостоятельно\nМаршрут: ${levelNames[S.route]}\nПроверка порядка: выполнено\nМаршрут робота: ${S.program.map(x=>arrow[x]).join(' ')}\nИсправление ошибки: выполнено\nСобственный алгоритм:\nЦель: ${S.own[0]}\n1. ${S.own[1]}\n2. ${S.own[2]}\n3. ${S.own[3]}\nПравило восстановлено: да`}
async function copyReport(){const text=reportText();try{await navigator.clipboard.writeText(text);$('#copyMsg').innerHTML=feedback('Результат скопирован.','good')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.width='100%';$('#copyMsg').replaceChildren(ta);ta.select();document.execCommand('copy');$('#copyMsg').innerHTML=feedback('Результат скопирован.','good')}}
function restart(){location.reload()}render();</script></body></html>
