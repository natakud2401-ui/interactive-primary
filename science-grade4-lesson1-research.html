let spoken='';
let speechToken=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function voiceChoose(){if(!('speechSynthesis' in window))return null;const v=speechSynthesis.getVoices().filter(x=>/^ru(?:[-_]|$)/i.test(x.lang));if(!v.length)return null;const google=v.filter(x=>/google/i.test(x.name));const female=/female|жен|ирина|мария|алена|алёна|мелена|милена|anna|maria|katya|oksana|svetlana|tatyana|елена|татьяна/i;return google.find(x=>female.test(x.name))||google[0]||v.find(x=>female.test(x.name))||v[0];}
function announce(m){notice.textContent=m;notice.classList.toggle('show',Boolean(m));}
function stopSpeak(fromButton=false){speechToken++;if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}if(fromButton)announce('Звук остановлен');else announce('');}
function speak(text){if(!('speechSynthesis' in window)){announce('Озвучка недоступна');return;}stopSpeak();const u=new SpeechSynthesisUtterance(String(text).replace(/→/g,', затем ').replace(/·/g,' ').replace(/\s+/g,' '));u.lang='ru-RU';u.rate=.93;u.pitch=1.07;const v=voiceChoose();if(v)u.voice=v;const token=speechToken;u.onerror=e=>{if(token===speechToken&&!['canceled','interrupted'].includes(e.error))announce('Озвучка недоступна');};u.onend=()=>{if(token===speechToken)announce('');};try{speechSynthesis.speak(u);announce('Идёт озвучка');}catch(e){announce('Озвучка недоступна');}}
function listen(){speak(spoken);}
if('speechSynthesis' in window){speechSynthesis.getVoices();}

function progress(){const labels=['Знакомство','Диагностика','Мой маршрут','Итог'];const i=state.phase==='intro'?0:state.phase==='diag'?1:state.phase==='train'?2:3;stepBar.innerHTML=labels.map((x,j)=>`<div class="step ${j<i?'done':j===i?'current':''}">${j+1}. ${x}</div>`).join('');}
function render(){stopSpeak();progress();if(state.phase==='intro')renderIntro();else if(state.phase==='diag'||state.phase==='train')renderTask();else if(state.phase==='final')renderFinal();else renderReport();}
function renderIntro(){spoken='Что стоит исследовать? Исследователь замечает явление или проблему, задаёт вопрос и объясняет, зачем людям и природе нужен ответ. Например, если школьные деревья сохнут, можно изучить, где почва быстрее теряет влагу. Так мы выбираем актуальное направление исследования. Сначала пройди три задания, затем получи свой маршрут.';app.innerHTML=`<div class="kicker">Небольшая теория</div><h2 class="title">Как выбрать актуальное исследование?</h2><p class="lead">Актуальное исследование помогает разобраться в <b>важной проблеме</b> или получить знания, которые пригодятся людям и природе.</p><div class="theory"><article class="theorycard"><div class="symbol">${art.plant}</div><h3>1. Замечаю</h3><p>Вижу явление или проблему. Например: одни деревья засыхают быстрее других.</p></article><article class="theorycard"><div class="symbol">${art.puddle}</div><h3>2. Спрашиваю</h3><p>Ставлю вопрос, на который можно найти ответ: что различается и почему?</p></article><article class="theorycard"><div class="symbol">${art.bird}</div><h3>3. Обосновываю</h3><p>Объясняю, кому и для чего пригодятся результаты исследования.</p></article></div><div class="formula">Исследование начинается не с готового ответа, а с наблюдения, вопроса и понимания того, зачем искать ответ.</div><label for="pupil" class="label">Твоё имя</label><input class="input" id="pupil" placeholder="Можно ввести имя" maxlength="50" value="${esc(state.name)}" oninput="state.name=this.value"><div class="actions"><button class="btn primary" onclick="begin()">Начать исследование</button></div>`;}
function begin(){state.phase='diag';state.diagIndex=0;activate('d_spot');scrollPanel();}
function activate(id){state.taskId=id;state.answer=null;state.attempts=0;state.usedHint=false;state.hintLevel=0;state.taskStatus=null;state.feedback='';state.feedbackType='';state.finished=false;render();}
function sceneHtml(t){return `<div class="scene"><div aria-hidden="true">${art[t.art]||art.plant}</div><div><div class="scenetitle">Ситуация</div><p>${esc(t.scene)}</p></div></div>`;}
function choiceHtml(t){return `<div class="choicegrid" role="group" aria-label="Варианты ответа">${t.options.map((v,i)=>`<button class="choice ${state.answer===i?'selected':''}" type="button" aria-pressed="${state.answer===i}" onclick="choose(${i})" ${state.finished?'disabled':''}><span class="num">${'АБВГ'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div>`;}
function groupHtml(t){return `<div class="items">${t.rows.map((r,i)=>`<div class="itemrow"><div class="itemtext">${esc(r[0])}</div><div class="togglebox">${Object.entries(t.labels).map(([key,label])=>`<button class="toggle ${state.answer?.[i]===key?'selected':''}" type="button" aria-pressed="${state.answer?.[i]===key}" onclick="setRow(${i},'${key}')" ${state.finished?'disabled':''}>${esc(label)}</button>`).join('')}</div></div>`).join('')}</div>`;}
function matchHtml(t){return `<div class="items">${t.rows.map((r,i)=>`<div class="itemrow"><div class="itemtext">${esc(r[0])}</div><select class="select" aria-label="Ответ для ситуации ${i+1}" onchange="setRow(${i},this.value)" ${state.finished?'disabled':''}><option value="">Выбери подходящий вариант</option>${Object.entries(t.labels).map(([key,label])=>`<option value="${key}" ${state.answer?.[i]===key?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`).join('')}</div>`;}
function builderHtml(t){let sections=t.fields.map((f,j)=>`<div class="buildfield"><h3>${esc(f.label)}</h3><div class="choicegrid">${f.options.map((v,i)=>`<button class="choice ${state.answer?.[j]===i?'selected':''}" type="button" aria-pressed="${state.answer?.[j]===i}" onclick="setField(${j},${i})" ${state.finished?'disabled':''}><span class="num">${i+1}</span><span>${esc(v)}</span></button>`).join('')}</div></div>`).join('');const chosen=t.fields.map((f,j)=>state.answer?.[j]===undefined?`<p>${j+1}. —</p>`:`<p>${j+1}. ${esc(f.options[state.answer[j]])}</p>`).join('');return `<div class="buildgrid">${sections}</div><div class="preview"><h3>Моя исследовательская заявка</h3>${chosen}</div>`;}
function taskSpoken(t){const options=t.kind==='choice'?` Варианты: ${t.options.join('; ')}.`:t.kind==='group'?` Высказывания: ${t.rows.map(x=>x[0]).join('; ')}. Группы: ${Object.values(t.labels).join('; ')}.`:t.kind==='match'?` Наблюдения: ${t.rows.map(x=>x[0]).join('; ')}. Возможные вопросы: ${Object.values(t.labels).join('; ')}.`:` ${t.fields.map(f=>f.label+'. '+f.options.join('; ')).join(' ')}`;return `Ситуация: ${t.scene}. ${t.question}.${options}${state.hintLevel?' Подсказка: '+t.hints[state.hintLevel-1]:''}`;}
function correctModel(t){if(t.kind==='choice')return t.options[t.key];if(t.kind==='builder')return t.fields.map((f,j)=>`${j+1}. ${f.options[f.key]}`).join(' | ');return t.rows.map((r,i)=>`${i+1}. ${t.kind==='group'?t.labels[r[1]]:t.labels[r[1]]}`).join(' | ');}
function renderTask(){const t=T[state.taskId],diagnostic=state.phase==='diag',n=diagnostic?state.diagIndex+1:state.trainIndex+1;spoken=taskSpoken(t);const controls=t.kind==='choice'?choiceHtml(t):t.kind==='group'?groupHtml(t):t.kind==='match'?matchHtml(t):builderHtml(t);app.innerHTML=`<div class="taskheader"><div><div class="kicker">${diagnostic?`Первичная диагностика · ${n} из 3`:`Индивидуальный маршрут · ${n} из ${state.queue.length}`}</div><h2 class="title">${esc(t.tag)}</h2></div><span class="pill">${esc(skillNames[t.skill])}</span></div>${sceneHtml(t)}<div class="prompt">${esc(t.question)}</div>${controls}${state.hintLevel?`<div class="tip"><strong>Подсказка ${state.hintLevel}</strong>${esc(t.hints[state.hintLevel-1])}</div>`:''}${state.feedback?`<div class="feedback ${state.feedbackType||'neutral'}" role="status"><b>${esc(state.feedback)}</b>${state.finished?`<p>${esc(t.why)}</p>${state.taskStatus==='needs'?`<p><b>Разбор ответа:</b> ${esc(correctModel(t))}</p>`:''}<p><b>Результат:</b> ${esc(statusLabel(state.taskStatus))}</p>`:''}</div>`:''}<div class="actions">${!state.finished?`<button class="btn primary" onclick="check()">Проверить</button><button class="btn secondary" onclick="hint()" ${state.hintLevel>=2?'disabled':''}>Нужна подсказка</button>`:`<button class="btn primary" onclick="nextTask()">${diagnostic?'Следующее задание':state.trainIndex===state.queue.length-1?'К итоговому заданию':'Продолжить'}</button>`}</div>`;}
function choose(i){if(state.finished)return;state.answer=i;state.feedback='';render();}
function setRow(i,k){if(state.finished)return;if(!state.answer||typeof state.answer!=='object')state.answer={};if(k)state.answer[i]=k;else delete state.answer[i];state.feedback='';render();}
function setField(j,i){if(state.finished)return;if(!state.answer||typeof state.answer!=='object')state.answer={};state.answer[j]=i;state.feedback='';render();}
function answered(t){if(t.kind==='choice')return typeof state.answer==='number';if(!state.answer||typeof state.answer!=='object')return false;return(t.kind==='builder'?t.fields.length:t.rows.length)===Object.keys(state.answer).length;}
function isCorrect(t){if(t.kind==='choice')return state.answer===t.key;if(t.kind==='group'||t.kind==='match')return t.rows.every((r,i)=>state.answer[i]===r[1]);return t.fields.every((f,j)=>state.answer[j]===f.key);}
function hint(){if(state.finished||state.hintLevel>=2)return;state.usedHint=true;state.hintLevel++;state.totalHints++;state.feedback='';render();}
function statusLabel(s){return s==='independent'?'Самостоятельно с первой попытки':s==='helped'?'После подсказки или повторной попытки':'Потребовалась пошаговая помощь';}
function finishTask(result){state.finished=true;state.taskStatus=result;state.feedback=result==='independent'?'Верно, выполнено самостоятельно.':result==='helped'?'Верно, удалось исправить ответ.':'Пока есть затруднение. Разберём, как рассуждать.';state.feedbackType=result==='needs'?'neutral':'good';const entry={id:state.taskId,skill:T[state.taskId].skill,status:result,errors:state.attempts,hints:state.hintLevel};if(state.phase==='diag'){state.diag[entry.skill]=result;state.diagDetail[entry.skill]=entry;}else{state.trainLog.push(entry);}}
function check(){if(state.finished)return;const t=T[state.taskId];if(!answered(t)){state.feedback='Сначала выбери ответ во всех необходимых частях.';state.feedbackType='neutral';render();return;}if(isCorrect(t)){finishTask(state.attempts===0&&!state.usedHint?'independent':'helped');render();return;}state.attempts++;state.totalErrors++;if(state.attempts>=2){finishTask('needs');render();return;}state.feedback=t.nudge||'Проверь свой выбор и попробуй ещё раз.';state.feedbackType='bad';if(state.hintLevel===0){state.hintLevel=1;state.usedHint=true;state.totalHints++;}render();}
function startRoute(){state.queue=skills.map(s=>({id:initial[s][state.diag[s]],depth:0,reason:'diagnosis'}));state.phase='train';state.trainIndex=0;state.streak=0;activate(state.queue[0].id);}
function scheduleAfterTraining(){const cur=state.queue[state.trainIndex];const result=state.taskStatus,t=T[cur.id];if(result==='independent'){state.streak++;}else state.streak=0;let nextId=null;if(cur.id!=='bonus'&&cur.depth<2){if(result==='needs')nextId=cur.id===easy[t.skill]?guided[t.skill]:cur.id===guided[t.skill]?null:easy[t.skill];else if(result==='helped')nextId=cur.id===analog[t.skill]?null:analog[t.skill];else if(cur.id===easy[t.skill]||cur.id===guided[t.skill])nextId=analog[t.skill];}
const wasUsed=id=>state.queue.some(x=>x.id===id);if(nextId&&!wasUsed(nextId)&&state.queue.length<10){state.queue.splice(state.trainIndex+1,0,{id:nextId,depth:cur.depth+1,reason:result});}
if(state.streak>=3&&!state.bonusAdded&&state.queue.length<10){state.queue.push({id:'bonus',depth:0,reason:'achievement'});state.bonusAdded=true;}}
function nextTask(){if(!state.finished)return;if(state.phase==='diag'){state.diagIndex++;if(state.diagIndex<3)activate(['d_spot','d_ask','d_value'][state.diagIndex]);else startRoute();}else{scheduleAfterTraining();state.trainIndex++;if(state.trainIndex<state.queue.length)activate(state.queue[state.trainIndex].id);else{state.phase='final';render();}}scrollPanel();}
function finalSpeech(){const c=cases[state.caseId];return `Итоговое задание. Восстанови порядок действий исследователя: четыре шага. Затем выбери исследовательский вопрос и объясни пользу для ситуации: ${c.scene}. Варианты вопросов: ${c.questions.join('; ')}. Варианты пользы: ${c.benefits.join('; ')}.`;}
function addStep(k){if(state.finalDone||state.finalOrder.includes(k))return;state.finalOrder.push(k);state.finalFeedback='';render();}
function resetSteps(){if(state.finalDone)return;state.finalOrder=[];state.finalFeedback='';render();}
function chooseCase(k){if(state.finalDone)return;state.caseId=k;state.finalQ=null;state.finalBenefit=null;state.finalFeedback='';render();}
function finalPick(type,i){if(state.finalDone)return;if(type==='q')state.finalQ=i;else state.finalBenefit=i;state.finalFeedback='';render();}
function finalCheck(){if(state.finalDone)return;const c=cases[state.caseId];if(state.finalOrder.length!==4||state.finalQ===null||state.finalBenefit===null){state.finalFeedback='Заполни все части итогового задания.';state.finalFeedbackType='neutral';render();return;}state.finalAttempts++;const order=state.finalOrder.every((id,i)=>id===finalSteps[i][0]);if(order&&state.finalQ===c.q&&state.finalBenefit===c.b){state.finalDone=true;state.finalGuided=state.finalAttempts>1;state.finalFeedback='Ты восстановил правило и составил обоснование исследования.';state.finalFeedbackType='good';}else{state.finalFeedback=order?'Проверь, связан ли вопрос с ситуацией и чем помогут результаты.':'Проверь порядок: сначала наблюдение, затем вопрос, далее значимость и сведения для проверки.';state.finalFeedbackType='bad';}render();}
function finalHelp(){const c=cases[state.caseId];state.finalOrder=finalSteps.map(x=>x[0]);state.finalQ=c.q;state.finalBenefit=c.b;state.finalDone=true;state.finalGuided=true;state.finalFeedback='Правило восстановлено после пошагового разбора. Посмотри, как связаны проблема, вопрос и польза.';state.finalFeedbackType='neutral';render();}
function renderFinal(){const c=cases[state.caseId];spoken=finalSpeech();const stepMap=new Map(finalSteps);const mixed=['evidence','notice','value','question'];app.innerHTML=`<div class="kicker">Итоговое задание</div><h2 class="title">Восстанови правило исследователя</h2><p class="lead">Собери четыре шага в правильном порядке. Затем выбери актуальное направление исследования для одной ситуации.</p><div class="subhead">1. Расположи действия по порядку</div><div class="ordered-controls">${mixed.map(k=>`<button class="orderbtn" onclick="addStep('${k}')" ${state.finalDone||state.finalOrder.includes(k)?'disabled':''}>${esc(stepMap.get(k))}</button>`).join('')}</div><div class="orderzone">${state.finalOrder.length?state.finalOrder.map((k,i)=>`<span class="tag">${i+1}. ${esc(stepMap.get(k))}</span>`).join(''):'<span class="muted small">Здесь появится твоя последовательность</span>'}</div><div class="actions"><button class="btn outline mini" onclick="resetSteps()" ${state.finalDone?'disabled':''}>Собрать заново</button></div><div class="separator"></div><div class="subhead">2. Выбери исследовательскую ситуацию</div><div class="choicegrid">${Object.entries(cases).map(([k,s])=>`<button class="choice ${state.caseId===k?'selected':''}" onclick="chooseCase('${k}')" ${state.finalDone?'disabled':''} aria-pressed="${state.caseId===k}"><span>${esc(s.title)}</span></button>`).join('')}</div>${sceneHtml(c)}<div class="subhead">3. Выбери проверяемый вопрос</div><div class="choicegrid">${c.questions.map((s,i)=>`<button class="choice ${state.finalQ===i?'selected':''}" onclick="finalPick('q',${i})" ${state.finalDone?'disabled':''} aria-pressed="${state.finalQ===i}"><span class="num">${i+1}</span><span>${esc(s)}</span></button>`).join('')}</div><div class="subhead">4. Объясни, почему исследование важно</div><div class="choicegrid">${c.benefits.map((s,i)=>`<button class="choice ${state.finalBenefit===i?'selected':''}" onclick="finalPick('b',${i})" ${state.finalDone?'disabled':''} aria-pressed="${state.finalBenefit===i}"><span class="num">${i+1}</span><span>${esc(s)}</span></button>`).join('')}</div>${state.finalFeedback?`<div class="feedback ${state.finalFeedbackType}" role="status">${esc(state.finalFeedback)}${state.finalDone?`<p><b>Исследовательский вопрос:</b> ${esc(c.questions[c.q])}</p><p><b>Значимость:</b> ${esc(c.benefits[c.b])}</p>`:''}</div>`:''}<div class="actions">${state.finalDone?'<button class="btn primary" onclick="showReport()">Мой результат</button>':`<button class="btn primary" onclick="finalCheck()">Проверить итог</button>${state.finalAttempts>=2?'<button class="btn secondary" onclick="finalHelp()">Разобрать по шагам</button>':''}`}</div>`;}
function showReport(){state.phase='report';render();scrollPanel();}
function reportText(){const independ=state.trainLog.filter(x=>x.status==='independent').length;const c=cases[state.caseId];return `ЕСТЕСТВОЗНАНИЕ · 4 КЛАСС · УРОК 1\nТема: Что стоит исследовать?\nЦель обучения: 4.1.1.1\nУченик: ${state.name.trim()||'не указано'}\n\nПЕРВИЧНАЯ ДИАГНОСТИКА\n${skills.map(s=>`${skillNames[s]}: ${statusLabel(state.diag[s])}`).join('\n')}\nСамостоятельно: ${skills.filter(s=>state.diag[s]==='independent').length} из 3 умений\n\nИНДИВИДУАЛЬНЫЙ МАРШРУТ\nВыполнено заданий: ${state.trainLog.length}\nСамостоятельно с первого раза: ${independ}\nПосле подсказки или повторной попытки: ${state.trainLog.filter(x=>x.status==='helped').length}\nПотребовалась пошаговая помощь: ${state.trainLog.filter(x=>x.status==='needs').length}\nОшибочных попыток всего: ${state.totalErrors}\nПодсказок использовано: ${state.totalHints}\n\n${state.trainLog.map((x,i)=>`${i+1}. ${T[x.id].tag} — ${statusLabel(x.status)}`).join('\n')}\n\nИТОГ\n${state.finalDone?(state.finalGuided?'Выполнен с поддержкой':'Выполнен самостоятельно'):'Не завершён'}\nСитуация: ${c.title}\nИсследовательский вопрос: ${c.questions[c.q]}\nЗначимость: ${c.benefits[c.b]}\n`;}
async function copyReport(){const txt=reportText();let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;}}catch(e){}if(!ok){const x=document.createElement('textarea');x.value=txt;x.style.position='fixed';x.style.opacity='0';document.body.append(x);x.select();try{ok=document.execCommand('copy')}catch(e){}x.remove();}const b=document.getElementById('copyBtn');if(b)b.textContent=ok?'Результат скопирован':'Скопируй текст отчёта';if(!ok){const out=document.getElementById('fullReport');out.classList.remove('hidden');out.focus();out.select();}}
function renderReport(){const independent=state.trainLog.filter(x=>x.status==='independent').length,c=cases[state.caseId];spoken=`Мой результат. Ты завершил исследование. Умений выполнено самостоятельно в диагностике: ${skills.filter(s=>state.diag[s]==='independent').length} из трёх. Самостоятельных тренировочных заданий: ${independent}. Покажи результат учителю.`;app.innerHTML=`<div class="kicker">Мой результат</div><h2 class="title">Я умею выбирать направление исследования</h2><p class="lead">${esc(state.name.trim()||'Исследователь')}, ты учился замечать проблему, задавать проверяемый вопрос и объяснять значимость исследования.</p><div class="reportgrid"><div class="stat"><b>${skills.filter(s=>state.diag[s]==='independent').length}/3</b><span>Умений без помощи в диагностике</span></div><div class="stat"><b>${independent}/${state.trainLog.length}</b><span>Заданий самостоятельно</span></div><div class="stat"><b>${state.totalHints}</b><span>Подсказок</span></div></div><div class="subhead">Первичная диагностика</div><table class="resulttable"><thead><tr><th>Проверяемое умение</th><th>Результат</th></tr></thead><tbody>${skills.map(s=>`<tr><td>${esc(skillNames[s])}</td><td>${esc(statusLabel(state.diag[s]))}</td></tr>`).join('')}</tbody></table><div class="subhead">Индивидуальный маршрут</div><table class="resulttable"><thead><tr><th>Задание</th><th>Результат</th></tr></thead><tbody>${state.trainLog.map(x=>`<tr><td>${esc(T[x.id].tag)}</td><td>${esc(statusLabel(x.status))}</td></tr>`).join('')}</tbody></table><div class="subhead">Итоговое исследование</div><div class="outcome"><b>${esc(c.title)}</b><p><b>Ситуация:</b> ${esc(c.scene)}</p><p><b>Вопрос:</b> ${esc(c.questions[c.q])}</p><p><b>Почему важно:</b> ${esc(c.benefits[c.b])}</p><p><b>Итог:</b> ${state.finalGuided?'выполнен с поддержкой':'выполнен самостоятельно'}</p></div><div class="actions"><button class="btn primary" id="copyBtn" onclick="copyReport()">Скопировать результат</button><button class="btn outline" onclick="window.print()">Распечатать</button><button class="btn secondary" onclick="restart()">Пройти ещё раз</button></div><textarea id="fullReport" class="input hidden" style="width:100%;min-height:230px;margin-top:15px" readonly>${esc(reportText())}</textarea><p class="small muted">Передать результат учителю можно с помощью кнопки «Скопировать результат».</p>`;}
function restart(){stopSpeak();const name=state.name;Object.assign(state,{phase:'intro',name,diagIndex:0,diag:{},diagDetail:{},queue:[],trainIndex:0,trainLog:[],taskId:null,answer:null,attempts:0,usedHint:false,hintLevel:0,taskStatus:null,feedback:'',feedbackType:'',finished:false,totalErrors:0,totalHints:0,streak:0,bonusAdded:false,finalOrder:[],caseId:'trees',finalQ:null,finalBenefit:null,finalAttempts:0,finalDone:false,finalGuided:false,finalFeedback:'',finalFeedbackType:''});render();scrollPanel();}
render();
</script>
</body>
</html>
