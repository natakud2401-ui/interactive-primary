function russianVoice(){if(!('speechSynthesis' in window))return null;const voices=window.speechSynthesis.getVoices().filter(v=>/^ru(?:[-_]|$)/i.test(v.lang));if(!voices.length)return null;const g=voices.filter(v=>/google/i.test(v.name));if(g.length){return g.find(v=>/female|жен|милена|алёна|ирина|anna|maria|samantha|katya|настя|oksana/i.test(v.name))||g[0]}return voices.find(v=>/female|жен|милена|алёна|ирина|anna|maria|katya|oksana|светлана|татьяна/i.test(v.name))||voices[0]}

function renderIntro(){spoken='Научные открытия. Открытие — это новое знание о природе. Изобретение — предмет или устройство, которое создали люди. Учёные исследовали микроорганизмы, электрические явления и магниты. Эти знания помогают беречь здоровье, создавать приборы и ориентироваться. Твоя задача — выяснить, как научные открытия меняют жизнь.';app.innerHTML=`<div class="row"><div class="kicker">Узнаём новое</div>${voiceButton()}</div><h2 class="title">От открытия — к полезному делу</h2><p class="lead">Учёные исследуют природу и узнают то, чего раньше не знали. Такие знания помогают людям создавать новые технологии, защищать здоровье и лучше понимать мир.</p><div class="arrow-line"><span class="formula">Наблюдение и исследование</span><span aria-hidden="true">→</span><span class="formula">Научное знание</span><span aria-hidden="true">→</span><span class="formula">Польза для людей</span></div><div class="cards3"><div class="knowledge"><div class="symbol"><svg viewBox="0 0 64 64" width="53" aria-hidden="true"><circle cx="32" cy="32" r="21" fill="#8ce1bf" stroke="#0f9278" stroke-width="3"/><g stroke="#19aa89" stroke-width="4" stroke-linecap="round"><path d="M32 3v9m0 40v9M3 32h9m40 0h9M12 12l7 7m26 26 7 7M12 52l7-7m26-26 7-7"/></g><g fill="#168c75"><circle cx="23" cy="23" r="5"/><circle cx="40" cy="30" r="4"/><circle cx="29" cy="42" r="3"/></g></svg></div><strong>Микроорганизмы</strong><p>Учёные выяснили, что некоторые микробы вызывают болезни. Эти знания помогают предотвращать инфекции.</p></div><div class="knowledge"><div class="symbol"><svg viewBox="0 0 64 64" width="50" aria-hidden="true"><path d="M32 5C14 5 12 28 22 38q5 7 5 12h10q0-6 6-13C52 24 47 5 32 5Z" fill="#ffda79" stroke="#e49f25" stroke-width="3"/><path d="M27 53h10M28 59h8" stroke="#6d78a2" stroke-width="6" stroke-linecap="round"/><path d="M18 20h-8m44 0h-8M32 1v-1" stroke="#e49f25" stroke-width="3"/></svg></div><strong>Электричество</strong><p>Исследование электрических явлений помогло развить технику: лампы, бытовые приборы и средства связи.</p></div><div class="knowledge"><div class="symbol"><svg viewBox="0 0 64 64" width="54" aria-hidden="true"><path d="M11 7v29a21 21 0 0 0 42 0V7H39v29a7 7 0 0 1-14 0V7Z" fill="#f17a9a" stroke="#cc4c74" stroke-width="3"/><path d="M11 7h14v13H11Zm28 0h14v13H39Z" fill="#d7e9ff"/></svg></div><strong>Магнитные свойства</strong><p>Знания о магнитах используются, например, в компасах и различных устройствах.</p></div></div><div class="tip"><strong>Запомни различие</strong>Открытие — учёные <b>узнали</b> о природе. Изобретение — люди <b>создали</b> новое устройство. Оба могут быть полезны, но это не одно и то же.</div><label class="label" for="student">Твоё имя (для отчёта учителю)</label><input id="student" class="input" maxlength="50" placeholder="Имя" value="${esc(state.name)}" autocomplete="off"><div class="actions"><button class="btn primary" onclick="start()">Начать исследование</button></div>`}
function start(){state.name=document.getElementById('student')?.value.trim()||'';state.phase='diag';state.diagnosticIndex=0;activate(['d1','d2','d3'][0]);scrollPanel();speak(spoken)}
function activate(id){state.taskId=id;state.answers={};state.order=[];state.attempts=0;state.usedHint=false;state.hintLevel=0;state.finished=false;state.ok=false;state.taskFeedback='';state.taskFeedbackGood=false;render()}
function taskAnswer(a){if(state.finished)return;state.answers.value=a;state.taskFeedback='';renderTask()}
function matchAnswer(i,val){if(state.finished)return;state.answers[i]=val;state.taskFeedback='';renderTask()}
function sortAnswer(i,val){if(state.finished)return;state.answers[i]=val;state.taskFeedback='';renderTask()}
function addOrder(id){if(state.finished||state.order.includes(id))return;state.order.push(id);state.taskFeedback='';renderTask()}
function clearOrder(){if(state.finished)return;state.order=[];state.taskFeedback='';renderTask()}
function hint(){if(state.finished)return;const task=T[state.taskId];state.usedHint=true;state.hintLevel=Math.min(2,state.hintLevel+1);state.hintCount++;renderTask();speak(task.hints[state.hintLevel-1])}
function getChecked(task){if(task.kind==='choice')return state.answers.value===task.key;if(task.kind==='match')return task.rows.every((r,i)=>state.answers[i]===r[1]);if(task.kind==='sort')return task.rows.every((r,i)=>state.answers[i]===r[1]);return task.key.length===state.order.length && task.key.every((v,i)=>v===state.order[i])}
function isFilled(task){if(task.kind==='choice')return state.answers.value!==undefined;if(task.kind==='match'||task.kind==='sort')return task.rows.every((_,i)=>state.answers[i]!==undefined&&state.answers[i]!=='');return state.order.length===task.items.length}
function check(){if(state.finished)return;const task=T[state.taskId];if(!isFilled(task)){state.taskFeedback='Ответь на все части задания, затем нажми «Проверить».';state.taskFeedbackGood=false;renderTask();return}state.attempts++;if(getChecked(task)){state.ok=true;state.finished=true;state.taskFeedbackGood=true;state.taskFeedback=state.attempts===1&&!state.usedHint?'Верно, самостоятельно!':'Верно! Ты справился с заданием.';if(state.attempts===1&&!state.usedHint)state.streak++;else state.streak=0}else{state.totalErrors++;state.streak=0;state.taskFeedbackGood=false;if(state.attempts>=2){state.finished=true;state.ok=false;state.taskFeedback='Пока есть затруднение. Посмотри объяснение, а следующий шаг будет проще.'}else{state.hintLevel=Math.max(1,state.hintLevel);state.usedHint=true;state.hintCount++;state.taskFeedback='Попробуй ещё раз. Подсказка поможет найти связь.'}}renderTask();if(state.ok)speak(state.taskFeedback);else if(state.attempts>=2)speak('Ничего страшного. Посмотри объяснение и перейди к следующему заданию.');else speak(state.taskFeedback+' '+task.hints[0])}
function nextTask(){const task=T[state.taskId];const result=state.ok?(state.attempts===1&&!state.usedHint?'independent':'helped'):'needs';if(state.phase==='diag'){state.diag[task.skill]=result;state.diagnosticIndex++;if(state.diagnosticIndex<3)activate(['d1','d2','d3'][state.diagnosticIndex]);else{state.trainQueue=skills.map(s=>({id:startTasks[s][state.diag[s]],depth:0}));state.trainIndex=0;state.phase='train';activate(state.trainQueue[0].id)}speak(spoken);scrollPanel();return}
state.trainLog.push({skill:task.skill,id:state.taskId,status:result,errors:Math.max(0,state.attempts-1),hint:state.usedHint});const entry=state.trainQueue[state.trainIndex];if(state.trainQueue.length<10){if(result==='needs'&&entry.depth<2&&state.taskId!==easy[task.skill])state.trainQueue.splice(state.trainIndex+1,0,{id:easy[task.skill],depth:entry.depth+1});else if(result==='helped'&&entry.depth<2&&state.taskId!==analog[task.skill]&&state.taskId!==easy[task.skill])state.trainQueue.splice(state.trainIndex+1,0,{id:analog[task.skill],depth:entry.depth+1});else if(result==='helped'&&entry.depth<2&&state.taskId===analog[task.skill])state.trainQueue.splice(state.trainIndex+1,0,{id:easy[task.skill],depth:entry.depth+1});if(state.streak>=3&&!state.bonusAdded&&state.trainQueue.length<10){state.trainQueue.push({id:'bonus',depth:0});state.bonusAdded=true}}
state.trainIndex++;if(state.trainIndex<state.trainQueue.length)activate(state.trainQueue[state.trainIndex].id);else{state.phase='final';render()}speak(spoken);scrollPanel()}
function choicesHtml(task){return `<div class="choicegrid">${task.options.map((s,i)=>`<button type="button" class="choice ${state.answers.value===i?'selected':''}" onclick="taskAnswer(${i})" aria-pressed="${state.answers.value===i}"><span class="num">${'АБВГ'[i]}</span><span>${esc(s)}</span></button>`).join('')}</div>`}
function matchHtml(task){const options=Object.entries(task.targets);return `<div class="matchlist">${task.rows.map(([label],i)=>`<div class="matchrow"><div class="statement">${esc(label)}</div><select aria-label="Применение для: ${esc(label)}" onchange="matchAnswer(${i},this.value)"><option value="">Выбери применение</option>${options.map(([id,text])=>`<option value="${id}" ${state.answers[i]===id?'selected':''}>${esc(text)}</option>`).join('')}</select></div>`).join('')}</div>`}
function sortHtml(task){return `<div class="sortlist">${task.rows.map(([label],i)=>`<div class="sortrow"><div class="statement">${esc(label)}</div><div class="sort-buttons"><button type="button" class="${state.answers[i]==='discovery'?'selected':''}" aria-pressed="${state.answers[i]==='discovery'}" onclick="sortAnswer(${i},'discovery')">Открытие</button><button type="button" class="${state.answers[i]==='invention'?'selected':''}" aria-pressed="${state.answers[i]==='invention'}" onclick="sortAnswer(${i},'invention')">Изобретение</button></div></div>`).join('')}</div>`}
function sequenceHtml(task){return `<p class="small muted">Нажимай на карточки в правильной последовательности.</p><div class="seqset">${[...task.items].reverse().map(([id,label])=>`<button class="seq" type="button" onclick="addOrder('${id}')" ${state.order.includes(id)?'disabled':''}>${esc(label)}</button>`).join('')}</div><div class="sequence">${state.order.length?state.order.map((id,i)=>`<span class="token">${i+1}. ${esc(task.items.find(e=>e[0]===id)[1])}</span>`).join(''):'<span class="muted small">Здесь появится твоя последовательность</span>'}</div><div class="actions"><button class="btn outline small" onclick="clearOrder()" ${state.finished?'disabled':''}>Собрать заново</button></div>`}
function renderTask(){const t=T[state.taskId],isDiag=state.phase==='diag';const n=isDiag?state.diagnosticIndex+1:state.trainIndex+1;spoken=t.question+(t.kind==='choice'?'. Варианты: '+t.options.join('; '):t.kind==='match'?'. '+t.rows.map(r=>r[0]).join('; ')+'. Применение: '+Object.values(t.targets).join('; '):t.kind==='sort'?'. '+t.rows.map(r=>r[0]).join('; '):'. '+t.items.map(x=>x[1]).join('; '));const control=t.kind==='choice'?choicesHtml(t):t.kind==='match'?matchHtml(t):t.kind==='sort'?sortHtml(t):sequenceHtml(t);app.innerHTML=`<div class="taskheader"><div><div class="kicker">${isDiag?'Первичная диагностика · '+n+' из 3':'Тренировка · задание '+n+' из '+state.trainQueue.length}</div><h2 class="title">${esc(t.tag)}</h2></div>${voiceButton()}</div><div class="pill">${esc(skillNames[t.skill])}</div><p class="prompt">${esc(t.question)}</p>${control}${state.hintLevel>0?`<div class="tip"><strong>Подсказка ${state.hintLevel}</strong>${esc(t.hints[state.hintLevel-1])}</div>`:''}${state.taskFeedback?`<div class="feedback ${state.taskFeedbackGood?'good':'bad'}" role="status"><strong>${esc(state.taskFeedback)}</strong>${state.finished?`<p>${esc(t.why)}</p>`:''}</div>`:''}<div class="actions">${!state.finished?`<button class="btn primary" onclick="check()">Проверить</button><button class="btn secondary" onclick="hint()" ${state.hintLevel>=2?'disabled':''}>Нужна подсказка</button>`:`<button class="btn primary" onclick="nextTask()">${isDiag?'Следующее задание':state.trainIndex===state.trainQueue.length-1?'К итоговому заданию':'Продолжить'}</button>`}</div>`}
const stories={microbes:{title:'Микробы и здоровье',open:'Учёные узнали, что некоторые микробы вызывают болезни.',choices:[['Врачи стали применять способы предупреждения инфекций.','yes'],['Люди выяснили, почему день сменяется ночью.','no'],['Люди начали рассчитывать движение спутников.','no']]},electricity:{title:'Электричество в жизни',open:'Учёные изучили электрические явления и их свойства.',choices:[['Люди стали создавать электрические приборы и освещение.','yes'],['Люди узнали, что вода состоит из песка.','no'],['Люди перестали изучать магнитные свойства.','no']]},gravity:{title:'Притяжение Земли',open:'Учёные изучили закономерности притяжения тел.',choices:[['Эти знания помогают рассчитывать движение космических аппаратов.','yes'],['Эти знания объясняют, как лечить все инфекции.','no'],['Эти знания показывают, что все предметы сделаны из металла.','no']]}};

function setReflection(s){state.finalReflection=s}
function finalCheck(){state.finalReflection=document.getElementById('reflection')?.value.trim()||state.finalReflection;const orderOk=['look','learn','use'].every((v,i)=>state.finalOrder[i]===v),benefitOk=stories[state.finalSubject].choices[Number(state.finalBenefit)]?.[1]==='yes';state.finalAttempts++;if(orderOk&&benefitOk){state.finalPassed=true;state.finalHelped=state.finalAttempts>1;state.finalFeedback='Ты восстановил путь от исследования к пользе и составил рассказ об открытии!'}else{state.finalFeedback=!orderOk&&!benefitOk?'Проверь порядок шагов и выбери пользу, которая связана с открытием.':!orderOk?'В последовательности есть ошибка. Что происходит сначала, а что позже?':'Проверь пользу: связана ли она с выбранным научным знанием?';if(state.finalAttempts>=2)state.finalHelped=true}renderFinal();speak(state.finalFeedback)}
function renderFinal(){const story=stories[state.finalSubject];spoken='Итог. Восстанови путь научного открытия: от исследования до пользы для людей. Затем выбери научное знание и расскажи, как оно изменило нашу жизнь.';app.innerHTML=`<div class="taskheader"><div><div class="kicker">Итоговое задание</div><h2 class="title">Восстанови правило и расскажи об открытии</h2></div>${voiceButton()}</div><div class="subhead">1. Восстанови путь открытия</div><p class="lead">Расположи три действия в нужном порядке.</p><div class="seqset">${[finalItems[2],finalItems[0],finalItems[1]].map(([k,v])=>`<button class="seq" onclick="addFinalOrder('${k}')" ${state.finalPassed||state.finalOrder.includes(k)?'disabled':''}>${esc(v)}</button>`).join('')}</div><div class="sequence">${state.finalOrder.length?state.finalOrder.map((id,i)=>`<span class="token">${i+1}. ${esc(finalItems.find(x=>x[0]===id)[1])}</span>`).join(''):'<span class="muted small">Твой порядок действий</span>'}</div><div class="actions"><button class="btn outline small" onclick="clearFinalOrder()" ${state.finalPassed?'disabled':''}>Собрать заново</button></div><div class="separator"></div><div class="subhead">2. Составь рассказ</div><p class="lead">Выбери научное знание и найди пользу, которую оно принесло людям.</p><div class="choicegrid" style="margin-top:16px">${Object.entries(stories).map(([id,s])=>`<button class="choice ${id===state.finalSubject?'selected':''}" aria-pressed="${id===state.finalSubject}" onclick="setFinalSubject('${id}')" ${state.finalPassed?'disabled':''}><span>${esc(s.title)}</span></button>`).join('')}</div><div class="outcome" style="margin:18px 0"><strong>Учёные сделали открытие:</strong> ${esc(story.open)}</div><p class="label">Как это помогло людям?</p><div class="choicegrid">${story.choices.map(([v],i)=>`<button class="choice ${state.finalBenefit===String(i)?'selected':''}" onclick="setFinalBenefit(${i})" aria-pressed="${state.finalBenefit===String(i)}" ${state.finalPassed?'disabled':''}><span class="num">${i+1}</span><span>${esc(v)}</span></button>`).join('')}</div><label class="label" for="reflection">Закончи рассказ своими словами: «Это открытие важно, потому что…»</label><textarea id="reflection" class="textarea" oninput="setReflection(this.value)" placeholder="Напиши одно предложение. Можно рассказать его устно учителю." ${state.finalPassed?'readonly':''}>${esc(state.finalReflection)}</textarea>${state.finalFeedback?`<div class="feedback ${state.finalPassed?'good':'bad'}" role="status">${esc(state.finalFeedback)}${!state.finalPassed&&state.finalAttempts>=2?'<p>Подумай: сначала исследуют, затем узнают новое, потом применяют знания. Польза должна относиться к выбранному открытию.</p>':''}</div>`:''}<div class="actions">${state.finalPassed?'<button class="btn primary" onclick="showReport()">Мой результат</button>':'<button class="btn primary" onclick="finalCheck()">Проверить итог</button>'}</div>`}
function showReport(){state.phase='report';render();scrollPanel()}
function status(s){return s==='independent'?'Самостоятельно':s==='helped'?'После подсказки':'Потребовалась помощь'}
function reportText(){const correctDiag=skills.filter(s=>state.diag[s]==='independent').length,indepTrain=state.trainLog.filter(x=>x.status==='independent').length;return `ЕСТЕСТВОЗНАНИЕ · 3 КЛАСС · УРОК 1\nТема: Открытия, которые изменили жизнь\nЦель: 3.1.1.1\nУченик: ${state.name||'не указано'}\n\nДИАГНОСТИКА\n${skills.map(s=>skillNames[s]+': '+status(state.diag[s])).join('\n')}\nСамостоятельно: ${correctDiag} из 3 умений\n\nИНДИВИДУАЛЬНЫЙ МАРШРУТ\nВыполнено заданий: ${state.trainLog.length}\nСамостоятельно: ${indepTrain}\nПосле подсказки: ${state.trainLog.filter(x=>x.status==='helped').length}\nПотребовалась помощь: ${state.trainLog.filter(x=>x.status==='needs').length}\nПодсказок использовано: ${state.hintCount}\nОшибочных попыток: ${state.totalErrors}\n\nИТОГ\n${state.finalPassed?'Выполнен '+(state.finalHelped?'с поддержкой':'самостоятельно'):'Не завершён'}\nТема рассказа: ${stories[state.finalSubject].title}\nПольза: ${stories[state.finalSubject].choices[Number(state.finalBenefit)]?.[0]||'не выбрана'}\nОтвет ученика: ${state.finalReflection||'устный ответ'}\nРезультат сформирован в тренажёре.`}
async function copyResult(){const t=reportText(),btn=document.getElementById('copyBtn');let success=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);success=true}}catch(e){}if(!success){const x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{success=document.execCommand('copy')}catch(e){}x.remove()}if(btn)btn.textContent=success?'Результат скопирован':'Скопируй текст ниже';if(!success){document.getElementById('fullReport')?.classList.remove('hidden')}}
function renderReport(){const independ=state.trainLog.filter(x=>x.status==='independent').length;spoken='Ты завершил исследование. Посмотри, какие умения освоены и какие задания удалось выполнить самостоятельно. Покажи результат учителю.';app.innerHTML=`<div class="taskheader"><div><div class="kicker">Мой результат</div><h2 class="title">Исследование завершено</h2></div>${voiceButton()}</div><p class="lead">${esc(state.name||'Исследователь')}, ты познакомился с научными открытиями и научился объяснять, как они помогают людям.</p><div class="reportgrid"><div class="stat"><b>${skills.filter(s=>state.diag[s]==='independent').length}/3</b><span>Умений без помощи на старте</span></div><div class="stat"><b>${independ}/${state.trainLog.length}</b><span>Заданий самостоятельно</span></div><div class="stat"><b>${state.hintCount}</b><span>Подсказок</span></div></div><div class="subhead">Первичная диагностика</div><table class="resulttable"><thead><tr><th>Умение</th><th>Результат</th></tr></thead><tbody>${skills.map(s=>`<tr><td>${esc(skillNames[s])}</td><td>${status(state.diag[s])}</td></tr>`).join('')}</tbody></table><div class="subhead">Итоговый рассказ</div><div class="outcome"><b>${esc(stories[state.finalSubject].title)}</b><p>${esc(stories[state.finalSubject].open)}</p><p><b>Польза:</b> ${esc(stories[state.finalSubject].choices[Number(state.finalBenefit)]?.[0]||'')}</p><p><b>Ответ ученика:</b> ${esc(state.finalReflection||'Ответ можно рассказать учителю устно.')}</p></div><div class="actions"><button id="copyBtn" class="btn primary" onclick="copyResult()">Скопировать результат</button><button class="btn outline" onclick="window.print()">Распечатать</button><button class="btn secondary" onclick="restart()">Пройти ещё раз</button></div><textarea id="fullReport" class="textarea hidden" readonly>${esc(reportText())}</textarea><p class="small muted">Результат можно скопировать и передать учителю. Он не отправляется автоматически на сервер.</p>`}
function restart(){stopSpeak();const name=state.name;Object.assign(state,{phase:'intro',name,diagnosticIndex:0,diag:{},trainQueue:[],trainIndex:0,trainLog:[],totalErrors:0,hintCount:0,streak:0,bonusAdded:false,taskId:null,answers:{},order:[],attempts:0,usedHint:false,hintLevel:0,finished:false,ok:false,taskFeedback:'',taskFeedbackGood:false,finalOrder:[],finalSubject:'microbes',finalBenefit:'',finalReflection:'',finalAttempts:0,finalFeedback:'',finalPassed:false,finalHelped:false});render();scrollPanel()}
render();
</script>
</body>
</html>
