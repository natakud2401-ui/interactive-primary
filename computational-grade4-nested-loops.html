ly:Consolas,'Courier New',monospace;line-height:1.8;font-size:clamp(.80rem,2.4vw,1rem);white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}.code-op{color:#93e7fa}.code-number{color:#ffd36a}.code-symbol{color:#ffbad3}.code-row{border-left:2px solid #8196c3;margin:2px 0 2px 15px;padding-left:12px}.program .sub{border-left:2px solid #edbd5c;margin-left:12px;padding-left:10px}.chip-group{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 15px}.tile{border:2px solid #cacff0;border-radius:12px;background:linear-gradient(180deg,#fff,#eef1ff);padding:9px 12px;box-shadow:0 4px 0 #d8def0;font-weight:800;color:#3c477e;cursor:grab;min-height:44px;display:inline-flex;gap:8px;align-items:center;justify-content:center}.tile.active{background:#ece9ff;border-color:#6251d8;box-shadow:0 4px 0 #b5abf5}.tile:active{cursor:grabbing;transform:translateY(2px)}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:98px;min-height:40px;max-width:100%;background:#fff;color:#2d3e6e;padding:6px 11px;border:2px dashed #93a8df;border-radius:11px;font-weight:800;cursor:pointer;vertical-align:middle;box-shadow:inset 0 1px 4px #dce5fd;font-family:'Segoe UI',Roboto,Arial,sans-serif;text-align:center}.slot.filled{border-style:solid;background:#e7f5ff;border-color:#52b5d4}.slot.over{background:#fff4d7;border-color:#e3a33b}.slot.static{cursor:default;pointer-events:none}.code-line{margin:9px 0}.indent{margin-left:18px;border-left:2px solid #9ca8d2;padding-left:14px}.indent2{margin-left:20px;border-left:2px solid #cdb7e9;padding-left:12px}.scope{font-size:.88rem;color:#4b5982;font-weight:750;margin-bottom:4px}.build-code{background:#f4f6ff;border:1px solid #d8e0fb;border-radius:16px;padding:13px 15px;margin:13px 0;line-height:2.1}.build-code .line{margin:5px 0}.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.target-btn{padding:10px;background:white;border:2px solid #dbe1f6;box-shadow:0 3px 0 #e2e5f0;border-radius:14px;cursor:pointer;text-align:center}.target-btn.selected{border-color:#6555de;background:#eeeaff}.target-btn .pattern-row{gap:3px}.target-btn .symbol{width:24px;height:24px;font-size:1rem;border-radius:5px}.target-btn .patterns{gap:3px}.badge{border-radius:50px;background:#e8e6ff;color:#483aa5;font-weight:850;font-size:.79rem;padding:5px 12px;display:inline-flex}.counter{font-weight:900;color:#4e3ec2}.subtle{border-top:1px solid #e9ebf5;margin:17px 0}.lock{font-size:.86rem;color:#687591}.score-big{font-size:2.7rem;font-weight:900;line-height:1.1;color:#4f43c6}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-cell{background:#f2f4ff;border:1px solid #dfe4fb;padding:13px;border-radius:15px}.summary-cell b{display:block;font-size:1.6rem;color:#5545c3}.summary-cell span{font-size:.85rem;color:#55617d}.progress-steps{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0}.dot{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;font-size:.75rem;font-weight:850;background:#e7eafa;color:#687093}.dot.current{background:#5950df;color:white}.dot.done{background:#d8f4e6;color:#17765c}.strike{opacity:.58;text-decoration:line-through}.small-note{font-size:.8rem;color:#72809c}.footer{color:#7784a3;font-size:.78rem;text-align:center;margin-top:22px}@media(max-width:600px){.wrap{padding:11px 9px 40px}.hero{border-radius:20px;padding:20px 17px}.panel{border-radius:20px;padding:17px 15px}.config-grid{gap:8px}.config{padding:9px}.theory-grid{grid-template-columns:1fr}.tile{font-size:.88rem;padding:8px 10px}.btnrow .btn{flex:1}.summary{grid-template-columns:1fr 1fr}.target-btn{padding:7px}.target-btn .symbol{width:21px;height:22px;font-size:.92rem}.scope{font-size:.78rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body>
<div class="wrap">
<header class="hero"><div class="hero-row"><div><div class="topline">Вычислительное мышление · 4 класс</div><h1>ЦИКЛ².ЛАБ</h1><p>Вложенные циклы: создавай узоры, управляй повторениями, собирай программы</p></div><div class="logo" aria-hidden="true">▦</div></div><div class="progress-bg"><div class="progress-inner" id="progressFill"></div></div><div class="progress-text"><span id="progressLabel">Теория</span><span id="progressNumber">0 / 10</span></div></header>
<main id="app"></main><div class="footer">Работает без интернета · ответы сохраняются на этом устройстве · не требует регистрации</div>
</div>
<script>
'use strict';
const KEY='nested-loops-grade4-2026-v1';
const S={circle:'●',triangle:'▲',square:'■',star:'★'};
const SHAPES=['circle','triangle','square','star'];
const WORD={circle:'круг',triangle:'треугольник',square:'квадрат',star:'звезда'};
const STAGES=10;
const DIAG=[
 {q:'Внешний цикл повторяется 3 раза, а внутренний — 2 раза. Внутри внутреннего рисуется один круг. Сколько кругов получится?',opts:['5','6','8','9'],right:1},
 {q:'Нужно получить 2 ряда по 4 квадрата. Какие количества повторений подходят?',opts:['Внешний — 4, внутренний — 2','Внешний — 2, внутренний — 2','Внешний — 4, внутренний — 4','Внешний — 2, внутренний — 4'],right:3},
 {q:'Программа: Повтори 3 раза { Повтори 2 раза { нарисуй звезду }; нарисуй круг }. Сколько кругов получится?',opts:['3','2','5','6'],right:0}
];
const ANALOG=[
 {q:'Два раза повторяются четыре квадрата. Сколько всего квадратов?',opts:['6','8','10','12'],right:1},
 {q:'В трёх рядах по два значка. Сколько всего значков?',opts:['5','6','8','9'],right:1},
 {q:'В двух рядах три раза повторяется пара фигур. Сколько всего фигур?',opts:['6','9','12','15'],right:2},
 {q:'Внешний цикл повторён 4 раза, внутренний — 2 раза. Сколько раз выполнится одна команда внутри внутреннего?',opts:['4','6','8','10'],right:2},
 {q:'Повтори 4 раза { Повтори 2 раза {▲}; ● }. Сколько всего кругов?',opts:['2','4','6','8'],right:1},
 {q:'Программа рисует 3 строки по 2 пары фигур. Сколько фигур получится?',opts:['6','9','12','15'],right:2},
 {q:'Повтори 2 раза { Повтори 3 раза {●}; ▲ }. Сколько треугольников?',opts:['2','3','5','6'],right:0},
 {q:'Во втором ряду рисуют 2 квадрата, в третьем — 3, в четвёртом — 4. Сколько всего квадратов в этих рядах?',opts:['8','9','10','12'],right:1},
 {q:'Действие стоит после внутреннего цикла, но внутри внешнего. Внешний цикл повторяется 4 раза. Сколько раз выполнится действие?',opts:['1','2','4','8'],right:2},
 {q:'Повтори 2 раза {●; Повтори 3 раза {▲}; ■}. Сколько всего фигур будет нарисовано?',opts:['8','9','10','12'],right:2}
];
function newState(){return {screen:'theory',di:0,diagAnswers:[null,null,null],diagAttempts:[0,0,0],diagFirst:0,level:null,idx:0,completed:Array(10).fill(false),tries:Array(10).fill(0),hintUsed:Array(10).fill(false),reinforced:Array(10).fill(false),pending:false,reinChoice:null,selected:null,feedback:'',choice:null,form:{rows:2,cols:2},pair:{outer:2,inner:2,a:null,b:null},slots4:{outer:null,inner:null,a:null,b:null},choice5:null,fix:{outer:3,inner:2},slots7:{outer:null,inner:null,inside:null,after:null},stairs:null,scope:null,slots10:{outer:null,before:null,inner:null,inside:null,after:null},achievements:0};}
let state=newState();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.completed)&&saved.completed.length===10&&['theory','diagnostic','practice','results'].includes(saved.screen)){state={...newState(),...saved};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderSymbols(line){return '<div class="pattern-row">'+line.map(k=>'<span class="symbol '+k+'" aria-label="'+WORD[k]+'">'+S[k]+'</span>').join('')+'</div>'}
function showRows(rows){if(!rows||rows.length===0)return '<div class="ghost">Выбери команды — здесь появится результат.</div>';return '<div class="patterns">'+rows.map(renderSymbols).join('')+'</div>'}
function gridOption(rows){return '<div class="patterns">'+rows.map(renderSymbols).join('')+'</div>'}
function msg(text,type='err'){return '<div class="feedback '+type+'" role="status">'+text+'</div>'}
function stepper(id,val,min=1,max=5){return '<div class="stepper"><button class="btn outline sm" data-act="dec" data-field="'+id+'" '+(val<=min?'disabled':'')+' aria-label="Уменьшить">−</button><b>'+val+'</b><button class="btn outline sm" data-act="inc" data-field="'+id+'" '+(val>=max?'disabled':'')+' aria-label="Увеличить">+</button></div>'}
function chips(){return '<div class="chip-group">'+[
 {v:'repeat2',label:'Повтори 2 раза'},{v:'repeat3',label:'Повтори 3 раза'},{v:'repeat4',label:'Повтори 4 раза'},
 {v:'circle',label:'● Круг'},{v:'triangle',label:'▲ Треугольник'},{v:'square',label:'■ Квадрат'},{v:'star',label:'★ Звезда'}
].map(t=>'<button type="button" draggable="true" class="tile '+(state.selected===t.v?'active':'')+'" data-token="'+t.v+'" aria-pressed="'+(state.selected===t.v?'true':'false')+'">'+t.label+'</button>').join('')+'</div>'}
function slot(n,label,v){const show=v?(v.startsWith('repeat')?'Повтори '+v.replace('repeat','')+' раза':S[v]+' '+WORD[v]):'Нажми или перетащи';return '<button type="button" class="slot '+(v?'filled':'')+'" data-slot="'+n+'" aria-label="'+esc(label)+'">'+esc(show)+'</button>'}
function codePreview(rowText){return '<div class="program">'+rowText+'</div>'}
function nextControl(){return '<div class="btnrow"><span class="lock">'+(state.completed[state.idx]?'Задание выполнено ✓':'Следующий этап откроется после правильного решения')+'</span><button class="btn" data-act="next" '+(!state.completed[state.idx]?'disabled':'')+'>'+ (state.idx===9?'Мои результаты':'Следующее задание →')+'</button></div>'}
function gradeFeedback(){if(state.pending)return '<div class="feedback note">Основное задание решено. Чтобы закрепить правило после подсказки, выполни похожую задачу ниже.</div>';if(state.feedback==='ok')return msg('Верно! Алгоритм приводит к нужному результату.','ok');if(state.feedback==='wrong'){let detail=state.tries[state.idx]>=2?'Раздели задачу на два уровня: что происходит внутри одного ряда и сколько раз повторяется весь ряд.':'';return msg('Пока не совпадает с целью. Проверь количество повторений и расположение команд. '+detail)}return ''}
function attempt(){state.tries[state.idx]++;state.feedback='wrong';if(state.tries[state.idx]>=2)state.hintUsed[state.idx]=true;persist();render(false)}
function solve(){state.feedback='ok';if(state.tries[state.idx]>0||state.hintUsed[state.idx]||(state.level==='С поддержкой'&&state.idx<3)){state.pending=true}else{state.completed[state.idx]=true}persist();render(false)}
function analogSection(){if(!state.pending)return '';let a=ANALOG[state.idx];return '<div class="subtle"></div><h3>Закрепи на похожем примере</h3><p>'+a.q+'</p>'+choiceButtons(a.opts,state.reinChoice,'rein')+'<button class="btn alt" data-act="check-rein" '+(state.reinChoice===null?'disabled':'')+'>Проверить закрепление</button>'+(state.feedback==='rein-wrong'?msg('Посчитай отдельно количество повторений каждого уровня и попробуй ещё раз.'):'')}
function choiceButtons(opts,chosen,act){return '<div class="choice-list">'+opts.map((s,i)=>'<button class="choice '+(chosen===i?'selected':'')+'" data-act="'+act+'" data-value="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(s)+'</span></button>').join('')+'</div>'}
function frame(title,description,body){return '<section class="panel"><div class="row space"><div class="label">Задание '+(state.idx+1)+' из 10</div><span class="badge">'+(state.idx<3?'Осваиваю':state.idx<7?'Применяю':'Создаю')+'</span></div><h2>'+title+'</h2><p class="lead">'+description+'</p>'+body+gradeFeedback()+analogSection()+nextControl()+'</section>'}
function renderTheory(){return '<section class="panel"><div class="label">Небольшая теория</div><h2>Что такое вложенные циклы?</h2><p>Цикл помогает повторять команды. Иногда внутри одного цикла находится другой. Это и есть <b>вложенный цикл</b>.</p><div class="theory-grid"><div class="theory-card"><div class="theory-icon">▤</div><b>Внешний цикл</b><p>Повторяет целую группу действий, например создание одного ряда.</p></div><div class="theory-card"><div class="theory-icon">▦</div><b>Внутренний цикл</b><p>Повторяет команды внутри каждого прохода внешнего цикла.</p></div></div><div class="preview"><div class="pattern-title">Что нарисует такой алгоритм?</div>'+showRows(Array.from({length:2},()=>['square','square','square']))+'</div><div class="program"><span class="code-op">Повтори</span> <span class="code-number">2</span> раза {<br>　<span class="code-op">Повтори</span> <span class="code-number">3</span> раза {<br>　　<span class="code-symbol">Нарисуй квадрат</span><br>　}<br>}</div><div class="rule"><b>Запомни:</b> сначала выполняются все команды внутреннего цикла. Затем внешний цикл запускает их снова. Если в каждом из 2 рядов по 3 квадрата, всего получится 6 квадратов.</div><button class="btn" data-act="start-diag">Начать короткую проверку →</button></section>'}
function renderDiagnostic(){let q=DIAG[state.di],n=state.di+1;return '<section class="panel"><div class="label">Первичная проверка · вопрос '+n+' из 3</div><h2>Проверь, как ты понял вложенные циклы</h2><p class="lead">'+q.q+'</p>'+choiceButtons(q.opts,state.diagAnswers[state.di],'diag-choice')+(state.feedback==='diag-wrong'?msg('Проверь, что выполняется за один проход внешнего цикла. Попробуй ещё раз.'):'')+(state.feedback==='diag-ok'?msg('Ответ принят.','ok'):'')+'<div class="btnrow"><span class="muted mini">Учитываются самостоятельные ответы с первой попытки.</span><button class="btn" '+(state.feedback!=='diag-ok'?'disabled':'')+' data-act="diag-next">'+(n===3?'Перейти к заданиям':'Следующий вопрос →')+'</button></div></section>'}
function preview(title,rows){return '<div class="preview"><div class="pattern-title">'+title+'</div>'+showRows(rows)+'</div>'}
function task0(){let opts=['Внешний 3 · внутренний 2','Внешний 2 · внутренний 3','Внешний 2 · внутренний 4','Внешний 3 · внутренний 3'];return frame('Выбери программу для рисунка','На рисунке показано, что должен нарисовать робот. Выбери количества повторений внешнего и внутреннего циклов.',preview('Образец',Array.from({length:2},()=>Array(3).fill('circle')))+choiceButtons(opts,state.choice,'choice')+'<button class="btn alt" data-act="check" '+(state.choice===null?'disabled':'')+'>Проверить программу</button>')}
function task1(){let {rows,cols}=state.form;return frame('Настрой два счётчика','Измени количество повторений. Один цикл создаёт ряды, другой — элементы внутри каждого ряда.',preview('Нужный рисунок',Array.from({length:4},()=>Array(3).fill('square')))+'<div class="config-grid"><div class="config"><div class="mini">Повторить ряды</div>'+stepper('form.rows',rows)+'</div><div class="config"><div class="mini">Повторить фигуры в ряду</div>'+stepper('form.cols',cols)+'</div></div>'+preview('Получается сейчас',Array.from({length:rows},()=>Array(cols).fill('square')))+'<button class="btn alt" data-act="check">Проверить результат</button>')}
function task2(){let t=state.pair;let row=Array.from({length:t.inner},()=>[t.a,t.b].filter(Boolean)).flat();return frame('Создай чередующийся узор','Выбери две команды, затем настрой, сколько раз повторять пару фигур внутри ряда и сколько рядов создать.',preview('Образец',Array.from({length:3},()=>['circle','triangle','circle','triangle','circle','triangle']))+'<div class="config-grid"><div class="config"><div class="mini">Внешний цикл</div>'+stepper('pair.outer',t.outer)+'</div><div class="config"><div class="mini">Внутренний цикл</div>'+stepper('pair.inner',t.inner)+'</div></div><div class="config-grid"><div class="config"><div class="mini">Первая команда пары</div>'+shapePicker('pair.a',t.a)+'</div><div class="config"><div class="mini">Вторая команда пары</div>'+shapePicker('pair.b',t.b)+'</div></div>'+preview('Текущий результат',Array.from({length:t.outer},()=>row))+'<button class="btn alt" data-act="check" '+(!t.a||!t.b?'disabled':'')+'>Проверить узор</button>')}
function shapePicker(path,current){return '<div class="chip-group center">'+SHAPES.map(t=>'<button class="tile '+(current===t?'active':'')+'" data-act="pickshape" data-field="'+path+'" data-value="'+t+'" aria-label="'+WORD[t]+'">'+S[t]+'</button>').join('')+'</div>'}
function builder(s,variant){let v=state[s];let title=variant===4?'Собери вложенную программу':variant===7?'Помести команду в нужный цикл':'Создай программу с нуля';let desc=variant===4?'Выбирай карточку сверху и нажимай на пустое место в программе. Можно также перетащить карточку.':variant===7?'Одна команда должна повторяться в каждом внутреннем цикле, а другая — только после него.':'Построй программу, которая воспроизводит образец. Карточки можно нажимать или перетаскивать.';let rowTarget=variant===4?['square','circle','square','circle']:variant===7?['triangle','triangle','triangle','circle']:['circle','star','star','square'];let target=Array.from({length:variant===4?2:variant===7?4:3},()=>rowTarget);let code='';let buildRows=[];if(variant===4){code='<div class="line">'+slot('outer','внешний цикл',v.outer)+' {</div><div class="indent"><div class="line">'+slot('inner','внутренний цикл',v.inner)+' {</div><div class="indent2"><div class="line">'+slot('a','первая команда',v.a)+'</div><div class="line">'+slot('b','вторая команда',v.b)+'</div></div><div class="line">}</div></div><div class="line">}</div>';if(v.outer&&v.inner&&v.a&&v.b)buildRows=Array.from({length:Number(v.outer.slice(6))},()=>Array.from({length:Number(v.inner.slice(6))},()=>[v.a,v.b]).flat())}else if(variant===7){code='<div class="line">'+slot('outer','внешний цикл',v.outer)+' {</div><div class="indent"><div class="line">'+slot('inner','внутренний цикл',v.inner)+' {</div><div class="indent2"><div class="line">'+slot('inside','внутренняя команда',v.inside)+'</div></div><div class="line">}</div><div class="line">'+slot('after','команда после внутреннего цикла',v.after)+'</div></div><div class="line">}</div>';if(v.outer&&v.inner&&v.inside&&v.after)buildRows=Array.from({length:Number(v.outer.slice(6))},()=>[...Array(Number(v.inner.slice(6))).fill(v.inside),v.after])}else{code='<div class="line">'+slot('outer','внешний цикл',v.outer)+' {</div><div class="indent"><div class="line">'+slot('before','команда перед внутренним циклом',v.before)+'</div><div class="line">'+slot('inner','внутренний цикл',v.inner)+' {</div><div class="indent2"><div class="line">'+slot('inside','внутренняя команда',v.inside)+'</div></div><div class="line">}</div><div class="line">'+slot('after','команда после внутреннего цикла',v.after)+'</div></div><div class="line">}</div>';if(v.outer&&v.inner&&v.before&&v.inside&&v.after)buildRows=Array.from({length:Number(v.outer.slice(6))},()=>[v.before,...Array(Number(v.inner.slice(6))).fill(v.inside),v.after])}
return frame(title,desc,preview('Образец',target)+'<div class="scope">Доступные команды — выбери одну:</div>'+chips()+'<div class="build-code">'+code+'</div><div class="small-note">Нажми на карточку, затем на нужный блок. Для замены выбери другую карточку.</div>'+preview('Что рисует твоя программа',buildRows)+'<button class="btn outline sm" data-act="clear-build">Очистить программу</button> <button class="btn alt" data-act="check" '+(!Object.values(v).every(Boolean)?'disabled':'')+'>Запустить и проверить</button>')}
function task4(){let options=[Array.from({length:3},()=>['triangle','circle','triangle']),Array.from({length:3},()=>['triangle','triangle','circle']),Array.from({length:2},()=>['triangle','triangle','triangle']),Array.from({length:3},()=>['circle','triangle','triangle'])];let p='<div class="program"><span class="code-op">Повтори</span> <span class="code-number">3</span> раза {<br>　<span class="code-op">Повтори</span> <span class="code-number">2</span> раза { <span class="code-symbol">▲</span> }<br>　<span class="code-symbol">●</span><br>}</div><div class="targets">'+options.map((o,i)=>'<button class="target-btn '+(state.choice5===i?'selected':'')+'" data-act="pattern-choice" data-value="'+i+'"><div class="mini">Вариант '+(i+1)+'</div>'+gridOption(o)+'</button>').join('')+'</div>';return frame('Предскажи результат','Не запускай программу мысленно целиком. Сначала определи, что появляется в одном ряду, затем — сколько раз повторяется этот ряд.',p+'<button class="btn alt" data-act="check" '+(state.choice5===null?'disabled':'')+'>Проверить выбор</button>')}
function task5(){let f=state.fix;return frame('Отладь два счётчика','Робот должен создать точно такой узор, как в образце. В исходной программе два счётчика настроены неправильно.',preview('Нужный результат',Array.from({length:2},()=>['square','circle','square','circle','square','circle']))+'<div class="config-grid"><div class="config"><div class="mini">Внешний цикл</div>'+stepper('fix.outer',f.outer)+'</div><div class="config"><div class="mini">Внутренний цикл</div>'+stepper('fix.inner',f.inner)+'</div></div><div class="program"><span class="code-op">Повтори</span> <span class="code-number">'+f.outer+'</span> раза {<br>　<span class="code-op">Повтори</span> <span class="code-number">'+f.inner+'</span> раза {<br>　　<span class="code-symbol">■ ●</span><br>　}<br>}</div>'+preview('Результат программы',Array.from({length:f.outer},()=>Array.from({length:f.inner},()=>['square','circle']).flat()))+'<button class="btn alt" data-act="check">Проверить исправление</button>')}
function task7(){let opts=['Повторить один раз','Повторить четыре раза','Повторить по номеру ряда','Повторить на единицу меньше номера ряда'];let rows=state.stairs===0?Array.from({length:4},()=>['square']):state.stairs===1?Array.from({length:4},()=>Array(4).fill('square')):state.stairs===2?Array.from({length:4},(_,i)=>Array(i+1).fill('square')):state.stairs===3?Array.from({length:4},(_,i)=>Array(i).fill('square')):[];return frame('Придумай правило для лестницы','Каждый следующий ряд длиннее предыдущего. Выбери правило для внутреннего цикла, чтобы построить лестницу из четырёх рядов.',preview('Образец',Array.from({length:4},(_,i)=>Array(i+1).fill('square')))+'<div class="program"><span class="code-op">Для</span> номера ряда от <span class="code-number">1</span> до <span class="code-number">4</span> {<br>　<span class="code-op">Повтори</span> <span class="code-number">?</span> { <span class="code-symbol">■</span> }<br>}</div>'+choiceButtons(opts,state.stairs,'stairs-choice')+preview('Получается по выбранному правилу',rows)+'<button class="btn alt" data-act="check" '+(state.stairs===null?'disabled':'')+'>Проверить правило</button>')}
function task8(){let opts=['До внешнего цикла','Внутри внутреннего цикла','После внутреннего цикла, внутри внешнего'];let rows=state.scope===0?[['circle'],...Array.from({length:3},()=>['triangle','triangle'])]:state.scope===1?Array.from({length:3},()=>['triangle','circle','triangle','circle']):state.scope===2?Array.from({length:3},()=>['triangle','triangle','circle']):[];return frame('Найди правильное место для команды','Алгоритм уже рисует два треугольника в каждом ряду. Куда поместить круг, чтобы каждый ряд завершался ровно одним кругом?',preview('Нужный узор',Array.from({length:3},()=>['triangle','triangle','circle']))+'<div class="build-code"><div>Повтори 3 раза {</div><div class="indent">Повтори 2 раза { <b>▲</b> }</div><div class="indent">'+(state.scope===2?'●':state.scope===1?'(● внутри повторения)':'(● здесь нет)')+'</div><div>}</div></div>'+choiceButtons(opts,state.scope,'scope-choice')+preview('Текущий результат',rows)+'<button class="btn alt" data-act="check" '+(state.scope===null?'disabled':'')+'>Проверить расположение</button>')}
const taskRender=[task0,task1,task2,()=>builder('slots4',4),task4,task5,()=>builder('slots7',7),task7,task8,()=>builder('slots10',10)];
function renderResults(){let first=state.tries.filter(v=>v===0).length,errors=state.tries.reduce((a,b)=>a+b,0),help=state.hintUsed.filter(Boolean).length;let report=`ЦИКЛ².ЛАБ — Вложенные циклы, 4 класс\nДиагностика: ${state.diagFirst}/3 с первой попытки\nМаршрут: ${state.level}\nВыполнено заданий: ${state.completed.filter(Boolean).length}/10\nСамостоятельно с первой попытки: ${first}/10\nС подсказками: ${help}\nОшибочных попыток: ${errors}`;return '<section class="panel"><div class="label">Лаборатория завершена</div><h2>Ты умеешь создавать вложенные циклы!</h2><p>Ты построил программы с несколькими уровнями повторений, исправил ошибки и научился управлять тем, какие команды относятся к каждому циклу.</p><div class="summary"><div class="summary-cell"><b>'+state.diagFirst+'/3</b><span>Диагностика без ошибок</span></div><div class="summary-cell"><b>10/10</b><span>Выполнено заданий</span></div><div class="summary-cell"><b>'+first+'/10</b><span>Самостоятельно с первой попытки</span></div><div class="summary-cell"><b>'+help+'</b><span>Заданий с подсказками</span></div></div><p class="muted">Ошибочных попыток: '+errors+'. Маршрут: <b>'+state.level+'</b>.</p><div class="btnrow"><button class="btn" data-act="copy-result">Скопировать результат</button><button class="btn outline" data-act="reset">Пройти ещё раз</button></div><div id="copied" aria-live="polite"></div></section>'}
function progress(){let done=state.completed.filter(Boolean).length;document.getElementById('progressFill').style.width=(done*10)+'%';document.getElementById('progressNumber').textContent=done+' / 10';document.getElementById('progressLabel').textContent=state.screen==='theory'?'Теория':state.screen==='diagnostic'?'Диагностика · '+(state.di+1)+'/3':state.screen==='results'?'Все задания пройдены':'Задание '+(state.idx+1)+' / 10 · '+(state.level||'Маршрут');}
function render(shouldScroll=false){progress();let html='';if(state.screen==='theory')html=renderTheory();else if(state.screen==='diagnostic')html=renderDiagnostic();else if(state.screen==='results')html=renderResults();else{let dots='<div class="progress-steps">'+Array.from({length:10},(_,i)=>'<span class="dot '+(state.completed[i]?'done':i===state.idx?'current':'')+'">'+(state.completed[i]?'✓':i+1)+'</span>').join('')+'</div>';html=dots+taskRender[state.idx]();}const y=window.scrollY;document.getElementById('app').innerHTML=html;if(shouldScroll){window.scrollTo({top:0,behavior:'instant'});}else{requestAnimationFrame(()=>window.scrollTo(0,y));}}
function assign(path,value){const [group,key]=path.split('.');state[group][key]=value;state.feedback='';persist();render(false)}
function checkStage(){if(state.completed[state.idx]||state.pending)return;let ok=false;switch(state.idx){case 0:ok=state.choice===1;break;case 1:ok=state.form.rows===4&&state.form.cols===3;break;case 2:ok=state.pair.outer===3&&state.pair.inner===3&&state.pair.a==='circle'&&state.pair.b==='triangle';break;case 3:{let s=state.slots4;ok=s.outer==='repeat2'&&s.inner==='repeat2'&&s.a==='square'&&s.b==='circle';break}case 4:ok=state.choice5===1;break;case 5:ok=state.fix.outer===2&&state.fix.inner===3;break;case 6:{let s=state.slots7;ok=s.outer==='repeat4'&&s.inner==='repeat3'&&s.inside==='triangle'&&s.after==='circle';break}case 7:ok=state.stairs===2;break;case 8:ok=state.scope===2;break;case 9:{let s=state.slots10;ok=s.outer==='repeat3'&&s.before==='circle'&&s.inner==='repeat2'&&s.inside==='star'&&s.after==='square';break}}if(ok)solve();else attempt()}
function moveNext(){if(!state.completed[state.idx])return;if(state.idx===9){state.screen='results'}else{state.idx++;state.feedback='';state.selected=null}persist();render(true)}
function handleAction(t){const act=t.dataset.act,v=t.dataset.value;if(act==='start-diag'){state.screen='diagnostic';state.feedback='';persist();return render(true)}if(act==='diag-choice'){if(state.feedback==='diag-ok')return;let ix=Number(v);state.diagAnswers[state.di]=ix;state.diagAttempts[state.di]++;if(ix===DIAG[state.di].right){if(state.diagAttempts[state.di]===1)state.diagFirst++;state.feedback='diag-ok'}else state.feedback='diag-wrong';persist();return render(false)}if(act==='diag-next'){if(state.feedback!=='diag-ok')return;if(state.di===2){state.level=state.diagFirst===3?'Исследовательский':state.diagFirst===2?'Основной':'С поддержкой';state.screen='practice';state.feedback=''}else{state.di++;state.feedback=''}persist();return render(true)}if(state.screen==='practice'&&state.completed[state.idx]&&act!=='next')return;
if(act==='next')return moveNext();if(act==='check')return checkStage();if(act==='choice'){state.choice=Number(v);state.feedback=''}if(act==='pattern-choice'){state.choice5=Number(v);state.feedback=''}if(act==='stairs-choice'){state.stairs=Number(v);state.feedback=''}if(act==='scope-choice'){state.scope=Number(v);state.feedback=''}if(act==='rein'){state.reinChoice=Number(v);state.feedback=''}if(act==='check-rein'){if(state.reinChoice===ANALOG[state.idx].right){state.pending=false;state.reinforced[state.idx]=true;state.completed[state.idx]=true;state.feedback='ok'}else{state.reinChoice=null;state.feedback='rein-wrong'}}if(act==='inc'||act==='dec'){const [k,key]=t.dataset.field.split('.'),n=act==='inc'?1:-1;state[k][key]=Math.max(1,Math.min(5,state[k][key]+n));state.feedback=''}if(act==='pickshape'){const [k,key]=t.dataset.field.split('.');state[k][key]=v;state.feedback=''}if(act==='clear-build'){const k=state.idx===3?'slots4':state.idx===6?'slots7':'slots10';Object.keys(state[k]).forEach(x=>state[k][x]=null);state.selected=null;state.feedback=''}if(act==='copy-result'){const first=state.tries.filter(v=>v===0).length;const errors=state.tries.reduce((a,b)=>a+b,0);const msg=`ЦИКЛ².ЛАБ — Вложенные циклы, 4 класс\nДиагностика с первой попытки: ${state.diagFirst}/3\nМаршрут: ${state.level}\nВыполнено: 10/10\nСамостоятельно с первой попытки: ${first}/10\nЗаданий с подсказкой: ${state.hintUsed.filter(Boolean).length}\nОшибок: ${errors}`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(()=>{document.getElementById('copied').textContent='Результат скопирован.'}).catch(()=>fallbackCopy(msg))}else{fallbackCopy(msg)}return}if(act==='reset'){if(confirm('Начать заново? Текущий результат будет сброшен.')){state=newState();persist();render(true)}return}persist();render(false)}
function fallbackCopy(str){const ta=document.createElement('textarea');ta.value=str;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();let node=document.getElementById('copied');if(node)node.textContent='Результат скопирован.'}
function placeToken(token,slotId){let k=state.idx===3?'slots4':state.idx===6?'slots7':'slots10';if((slotId==='outer'||slotId==='inner')!==token.startsWith('repeat')){state.feedback='wrong';persist();render(false);return}state[k][slotId]=token;state.selected=null;state.feedback='';persist();render(false)}
document.getElementById('app').addEventListener('click',e=>{const token=e.target.closest('[data-token]');if(token){state.selected=token.dataset.token;state.feedback='';persist();return render(false)}const slotEl=e.target.closest('[data-slot]');if(slotEl){if(state.selected)placeToken(state.selected,slotEl.dataset.slot);return}const t=e.target.closest('[data-act]');if(t)handleAction(t)});
document.getElementById('app').addEventListener('dragstart',e=>{const tile=e.target.closest('[data-token]');if(!tile)return;e.dataTransfer.setData('text/plain',tile.dataset.token);e.dataTransfer.effectAllowed='copy'});
document.getElementById('app').addEventListener('dragover',e=>{const s=e.target.closest('[data-slot]');if(s){e.preventDefault();e.dataTransfer.dropEffect='copy';s.classList.add('over')}});
document.getElementById('app').addEventListener('dragleave',e=>{const s=e.target.closest('[data-slot]');if(s)s.classList.remove('over')});
document.getElementById('app').addEventListener('drop',e=>{const s=e.target.closest('[data-slot]');if(!s)return;e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(t&&['repeat2','repeat3','repeat4',...SHAPES].includes(t))placeToken(t,s.dataset.slot)});
render();
</script>
