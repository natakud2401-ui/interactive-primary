<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Развитие науки Казахстана — Каныш Сатпаев</title><style>
:root{--ink:#263453;--violet:#6752d9;--blue:#4287e4;--mint:#128b76}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 8% 0,#e1dcff,transparent 33%),#f1f6ff;color:var(--ink)}.wrap{max-width:920px;margin:18px auto;padding:0 14px 35px}.hero{background:linear-gradient(115deg,#624dd1,#397edc,#24a3c4);color:white;border-radius:27px;padding:30px;box-shadow:0 15px 30px #5263b544}.hero h1{font-size:clamp(28px,5vw,43px);margin:9px 0}.hero p{font-size:17px;line-height:1.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.step{background:white;border-radius:12px;text-align:center;padding:11px 5px;font-size:12px;font-weight:800}.step.on{background:#e2ddff;color:#5443ac}.panel{background:white;border:1px solid #e0e6f7;border-radius:25px;padding:clamp(18px,4vw,31px);box-shadow:0 14px 30px #4d5e9b20;margin:15px 0}.tag{color:#6654ba;font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}h2{font-size:27px;margin:9px 0 15px}h3{font-size:21px}.lead{font-size:17px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.fact{border:1px solid #e3e7f7;background:#f8faff;border-radius:17px;padding:16px;line-height:1.45}.fact .pic{font-size:39px}.fact strong{display:block;margin:8px 0}.btn{border:0;border-radius:13px;padding:13px 17px;min-height:46px;background:#ebe7ff;color:#5643b1;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #5747a31d}.primary{background:linear-gradient(115deg,#6b57dc,#4488e8);color:white}.btn:disabled{opacity:.5;cursor:default}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.scene{display:flex;align-items:center;gap:16px;padding:16px;background:#eff7ff;border-radius:17px;font-size:17px;line-height:1.5}.scene .pic{font-size:52px;flex:none}.choice{width:100%;display:block;text-align:left;background:#f9fbff;border:2px solid #e1e7f5;border-radius:15px;padding:15px;margin:10px 0;font:inherit;font-size:17px;cursor:pointer}.choice.sel{border-color:#7662da;background:#eeeaff}.feedback{padding:14px;border-radius:13px;background:#fff0df;margin:13px 0;line-height:1.5}.feedback.good{background:#def7eb;color:#116d58}.feedback.bad{background:#fff0f0;color:#963e4c}.hint{background:#f0edff;border-left:4px solid #7965dc;padding:13px;border-radius:10px;margin:10px 0}.rule{display:flex;gap:12px;align-items:center;border:2px solid #e1e7f5;border-radius:14px;padding:12px;margin:9px 0}.rule span{flex:1}.rule button{border:1px solid #ccd5ec;background:white;border-radius:8px;padding:8px 12px;cursor:pointer}.report{white-space:pre-wrap;background:#f7f9fd;padding:15px;border-radius:14px;line-height:1.6}.muted{color:#67758d;font-size:13px}.progress{height:10px;border-radius:10px;background:#e5eaf7;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:linear-gradient(90deg,#3ab5ca,#7558df)}@media(max-width:620px){.cards{grid-template-columns:1fr}.steps{gap:4px}.step{font-size:10px;padding:9px 3px}.hero{padding:23px}.scene .pic{font-size:39px}}
</style></head><body><div class="wrap"><header class="hero"><div>ПОЗНАНИЕ МИРА · 4 КЛАСС</div><h1>Развитие науки в Казахстане</h1><p>Каныш Сатпаев: как исследования помогают узнавать богатства страны и развивать науку.</p></header><nav class="steps" id="steps"><div class="step on">Исследуем</div><div class="step">Диагностика</div><div class="step">Мой маршрут</div><div class="step">Восстанови правило</div></nav><main id="main"></main></div><script>
'use strict';const $=s=>document.querySelector(s),main=$('#main');const skillNames={evidence:'Факты и доказательства',role:'Вклад учёного',impact:'Значение науки'};
const diagnostic=[
{skill:'evidence',icon:'🪨',scene:'Геолог нашёл образец породы и предположил, что в этой местности есть полезные ископаемые.',q:'Что поможет проверить предположение?',opts:['Исследовать образцы и сопоставить результаты из разных мест.','Сразу объявить, что месторождение найдено.','Спросить, какой камень выглядит красивее.'],a:0,hints:['Предположение нужно подтвердить данными.','Подумай, что можно изучить и сравнить.'],why:'Научный вывод опирается на исследование и сопоставление данных.'},
{skill:'role',icon:'🗺️',scene:'Каныш Сатпаев исследовал месторождения полезных ископаемых, в том числе в районе Жезказгана.',q:'Какую роль выполнял учёный в этой работе?',opts:['Выбирал цвета для оформления карты.','Изучал недра и обосновывал перспективы месторождений.','Только перевозил готовую руду.'],a:1,hints:['Вспомни, чем занимается геолог.','Он исследует строение Земли и полезные ископаемые.'],why:'Сатпаев был геологом и внёс значительный вклад в изучение минеральных ресурсов Казахстана.'},
{skill:'impact',icon:'🏛️',scene:'В 1946 году была создана Академия наук Казахской ССР. Её первым президентом стал Каныш Сатпаев.',q:'Почему создание Академии было важным?',opts:['Учёные перестали проводить исследования.','Все исследования стали посвящать только одной породе.','Появился крупный научный центр, объединявший исследования разных направлений.'],a:2,hints:['Подумай, зачем учёным нужны научные учреждения.','В них исследователи могут сотрудничать.'],why:'Академия помогала организовывать и развивать научные исследования.'}
];
const bank={
evidence:[
{level:0,icon:'🔎',scene:'Два образца камня отличаются по цвету.',q:'Как узнать, одинаковы ли их свойства?',opts:['Изучить и сравнить свойства образцов.','Решить только по цвету.'],a:0,hints:['Внешний вид — не единственный признак.','Нужно сравнить свойства.']},
{level:1,icon:'📊',scene:'В двух местах взяли образцы породы. В одном образце обнаружено больше меди.',q:'Какой вывод пока обоснован?',opts:['Вся территория первого района богаче медью.','Исследованный образец из первого места содержит больше меди.','Медь есть только в первом районе.'],a:1,hints:['Подумай, что известно только об образцах.','Не переноси результат одного образца на весь район.']},
{level:2,icon:'🧭',scene:'Учёные исследовали несколько участков. На одном участке многообещающие образцы, но измерений пока мало.',q:'Какое решение научно обоснованнее?',opts:['Сразу строить предприятие.','Прекратить исследования без объяснения.','Провести дополнительные исследования и оценить запасы.'],a:2,hints:['Для большого решения нужны надёжные данные.','Одних первых образцов недостаточно.']}
],role:[
{level:0,icon:'🪨',scene:'Исследователь изучает горные породы и полезные ископаемые.',q:'Как называется его профессия?',opts:['Геолог','Астроном'],a:0,hints:['Эта профессия связана с недрами Земли.','Подумай о горных породах.']},
{level:1,icon:'🗺️',scene:'Сатпаев исследовал минеральные ресурсы Центрального Казахстана.',q:'Что лучше всего характеризует его вклад?',opts:['Он изучал только погоду.','Он помог расширить знания о месторождениях Казахстана.','Он занимался исключительно строительством дорог.'],a:1,hints:['Обрати внимание на область исследований учёного.','Геологи изучают недра.']},
{level:2,icon:'🏛️',scene:'Сатпаев занимался геологией и возглавил Академию наук Казахской ССР.',q:'Какой вывод следует из этих двух фактов?',opts:['Он занимался только полевыми исследованиями.','Он не участвовал в организации науки.','Он был и исследователем, и организатором научной работы.'],a:2,hints:['Сравни две стороны его деятельности.','Учёный может проводить исследования и руководить научным учреждением.']}
],impact:[
{level:0,icon:'🏗️',scene:'Геологи обнаружили полезное ископаемое и подтвердили его запасы.',q:'Для чего могут пригодиться эти сведения?',opts:['Для планирования дальнейшего освоения месторождения.','Чтобы не проводить никаких расчётов.'],a:0,hints:['Результаты исследований помогают принимать решения.','Подумай о планировании работ.']},
{level:1,icon:'🤝',scene:'Геологи, инженеры и другие специалисты вместе изучают возможности использования месторождения.',q:'Почему полезно их сотрудничество?',opts:['Чтобы никто не отвечал за свою часть работы.','Разные знания помогают оценить задачу с нескольких сторон.','Чтобы не проверять выводы.'],a:1,hints:['Специалисты решают разные задачи.','Подумай, как знания дополняют друг друга.']},
{level:2,icon:'🌿',scene:'Рядом с населённым пунктом обнаружено месторождение. Его освоение может дать рабочие места, но повлиять на природу.',q:'Какое решение учитывает разные последствия?',opts:['Оценивать только будущую прибыль.','Оценивать только число рабочих мест.','Изучить экономические и экологические последствия до принятия решения.'],a:2,hints:['У решения может быть несколько последствий.','Важно учитывать и людей, и окружающую среду.']}
]};
let st={phase:'intro',idx:0,diag:[],queue:[],current:null,attempts:0,hint:false,selected:-1,practice:[],streak:0,order:[2,0,3,1],conclusion:-1,finalAttempts:0,finalPassed:false};function steps(n){$('#steps').querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('on',i===n))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function intro(){steps(0);main.innerHTML=`<section class="panel"><div class="tag">История научного открытия</div><h2>Каныш Сатпаев (1899–1964)</h2><p class="lead">Каныш Имантаевич Сатпаев — выдающийся казахстанский учёный-геолог. Он исследовал минеральные богатства Казахстана, особенно Центрального Казахстана и Жезказганского района. В 1946 году стал первым президентом Академии наук Казахской ССР.</p><div class="cards"><div class="fact"><div class="pic">🪨</div><strong>Геология</strong>Изучение горных пород, недр и полезных ископаемых.</div><div class="fact"><div class="pic">🗺️</div><strong>Жезказган</strong>Один из важнейших районов его геологических исследований.</div><div class="fact"><div class="pic">🏛️</div><strong>Академия наук</strong>Организация исследований и сотрудничества учёных.</div></div><p class="lead"><strong>Главный вопрос:</strong> как исследования одного учёного могут повлиять на развитие целой страны?</p><div class="row"><button class="btn primary" id="start">Начать исследование</button></div></section>`;$('#start').onclick=()=>{st.idx=0;st.diag=[];task(diagnostic[0],'diag')}}
function task(t,phase){st.phase=phase;st.current=t;st.attempts=0;st.hint=false;st.selected=-1;renderTask()}function renderTask(){const t=st.current;steps(st.phase==='diag'?1:2);main.innerHTML=`<section class="panel"><div class="tag">${st.phase==='diag'?'Диагностика · '+(st.idx+1)+' из 3':'Мой маршрут · задание '+(st.practice.length+1)}</div><h2>${st.phase==='diag'?'Проверяю, что знаю':'Исследую и делаю вывод'}</h2><div class="scene"><span class="pic">${t.icon}</span><span>${esc(t.scene)}</span></div><h3>${esc(t.q)}</h3><div>${t.opts.map((o,i)=>`<button class="choice" data-c="${i}">${i+1}. ${esc(o)}</button>`).join('')}</div><div id="fb"></div><div class="row"><button class="btn primary" id="check" disabled>Проверить</button><button class="btn" id="hint">Подсказка</button></div></section>`;main.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.selected=+b.dataset.c;main.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('sel',x===b));$('#check').disabled=false});$('#check').onclick=check;$('#hint').onclick=()=>{st.hint=true;$('#fb').innerHTML=`<div class="hint">${esc(t.hints[Math.min(st.attempts,1)])}</div>`}}function done(msg,correct,fn){$('#fb').innerHTML=`<div class="feedback ${correct?'good':'bad'}">${esc(msg)}</div><button class="btn primary" id="next">Продолжить</button>`;main.querySelectorAll('[data-c],#check,#hint').forEach(x=>x.disabled=true);$('#next').onclick=fn}
function check(){if(st.selected<0)return;st.attempts++;let t=st.current,ok=st.selected===t.a;if(ok){let independent=st.attempts===1&&!st.hint;finish(independent?'Самостоятельно':'После помощи',true)}else if(st.attempts===1){st.hint=true;$('#fb').innerHTML=`<div class="feedback bad">Этот вывод пока не подтверждён. Попробуй ещё раз.</div><div class="hint">${esc(t.hints[0])}</div>`}else finish('Нужна помощь',false)}
function finish(result,ok){let t=st.current;if(st.phase==='diag'){st.diag.push({skill:t.skill,result});done(ok?'Ответ принят. '+(t.why||''):'Понадобится дополнительная тренировка. '+(t.why||''),ok,()=>{st.idx++;st.idx<3?task(diagnostic[st.idx],'diag'):route()})}else{st.practice.push({skill:t.skill,result});st.streak=result==='Самостоятельно'?st.streak+1:0;if(result!=='Самостоятельно'&&st.practice.length<9){let lvl=result==='Нужна помощь'?0:Math.min(t.level||1,1);st.queue.unshift({...bank[t.skill][lvl],skill:t.skill})}if(st.streak>=3&&st.practice.length+st.queue.length<9){st.queue.push({...bank.impact[2],skill:'impact'});st.streak=0}if(st.practice.length>=9)st.queue=[];done(ok?'Верно! Ты обосновал решение.':'Следующее задание будет проще.',ok,nextPractice)}}
function route(){steps(2);st.phase='route';st.queue=[];let sorted=[...st.diag].sort((a,b)=>({'Нужна помощь':0,'После помощи':1,'Самостоятельно':2}[a.result]-{'Нужна помощь':0,'После помощи':1,'Самостоятельно':2}[b.result]));sorted.forEach(x=>{let level=x.result==='Самостоятельно'?2:x.result==='После помощи'?1:0;st.queue.push({...bank[x.skill][level],skill:x.skill})});st.practice=[];st.streak=0;main.innerHTML=`<section class="panel"><div class="tag">Индивидуальный маршрут</div><h2>Что будем исследовать?</h2>${sorted.map((x,i)=>`<div class="fact" style="margin:9px 0"><strong>${i+1}. ${skillNames[x.skill]}</strong>${x.result==='Самостоятельно'?'Попробуем задачу сложнее.':x.result==='После помощи'?'Закрепим это умение.':'Начнём с более простого задания.'}</div>`).join('')}<button class="btn primary" id="go">Начать маршрут</button></section>`;$('#go').onclick=nextPractice}function nextPractice(){st.queue.length?task(st.queue.shift(),'practice'):final()}
const rules=['Изучить вопрос и собрать сведения.','Проверить сведения исследованиями и сравнением.','Сделать вывод на основе доказательств.','Объяснить, как результаты могут быть полезны людям.'];function final(){steps(3);st.phase='final';main.innerHTML=`<section class="panel"><div class="tag">Итоговое исследование</div><h2>Восстанови правило</h2><p>Расставь шаги научного исследования в правильном порядке.</p>${st.order.map((n,i)=>`<div class="rule"><b>${i+1}</b><span>${rules[n]}</span><button data-i="${i}" data-d="-1" ${i===0?'disabled':''}>↑</button><button data-i="${i}" data-d="1" ${i===3?'disabled':''}>↓</button></div>`).join('')}<h3>Почему деятельность Каныша Сатпаева важна для Казахстана?</h3>${['Он помог изучать богатства недр и организовывать научные исследования.','Он доказал, что исследования не нужны для развития страны.','Он занимался только продажей готовых изделий.'].map((x,i)=>`<button class="choice ${st.conclusion===i?'sel':''}" data-answer="${i}">${i+1}. ${x}</button>`).join('')}<div id="ff"></div><div class="row"><button class="btn primary" id="verify">Проверить</button></div></section>`;main.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,j=i+(+b.dataset.d);[st.order[i],st.order[j]]=[st.order[j],st.order[i]];final()});main.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{st.conclusion=+b.dataset.answer;main.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('sel',x===b))});$('#verify').onclick=()=>{st.finalAttempts++;if(st.order.every((x,i)=>x===i)&&st.conclusion===0){st.finalPassed=true;$('#ff').innerHTML='<div class="feedback good">Отлично! Ты восстановил порядок научного исследования и объяснил вклад учёного.</div><button class="btn primary" id="report">Мой результат</button>';$('#report').onclick=report}else{$('#ff').innerHTML='<div class="feedback bad">Проверь последовательность: сначала собирают сведения, затем проверяют их. Проверь и вывод.</div>'}}}
function reportText(){return `ПОЗНАНИЕ МИРА · 4 КЛАСС\nТема: Развитие науки в Казахстане. Каныш Сатпаев\nДата: ${new Date().toLocaleDateString('ru-RU')}\n\nДИАГНОСТИКА\n${st.diag.map(x=>skillNames[x.skill]+': '+x.result).join('\n')}\n\nИНДИВИДУАЛЬНЫЙ МАРШРУТ\n${st.practice.map((x,i)=>(i+1)+'. '+skillNames[x.skill]+': '+x.result).join('\n')}\nСамостоятельно: ${st.practice.filter(x=>x.result==='Самостоятельно').length} из ${st.practice.length}\n\nВОССТАНОВИ ПРАВИЛО\n${st.finalPassed?'Выполнено':'Не выполнено'}; попыток: ${st.finalAttempts}`}
function report(){st.phase='report';main.innerHTML='<section class="panel"><div class="tag">Результат</div><h2>Исследование завершено</h2><p>Ты изучил вклад Каныша Сатпаева и научился отличать предположение от обоснованного вывода.</p><div class="report" id="text"></div><div class="row"><button class="btn primary" id="copy">Скопировать результат</button><button class="btn" id="restart">Пройти заново</button></div><p class="muted" id="status"></p></section>';$('#text').textContent=reportText();$('#copy').onclick=async()=>{let s=reportText();try{await navigator.clipboard.writeText(s);$('#status').textContent='Результат скопирован.'}catch(e){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove();$('#status').textContent='Результат скопирован.'}};$('#restart').onclick=()=>{st={phase:'intro',idx:0,diag:[],queue:[],current:null,attempts:0,hint:false,selected:-1,practice:[],streak:0,order:[2,0,3,1],conclusion:-1,finalAttempts:0,finalPassed:false};intro()}}
intro();</script></body></html>
