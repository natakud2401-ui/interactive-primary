<html lang="ru">

<style>
:root{--ink:#172c43;--muted:#63748a;--blue:#205d91;--blue2:#12476f;--cyan:#e9f4fc;--bg:#f3f7fb;--surface:#fff;--stroke:#d6e0ea;--good:#13754c;--goodbg:#ebf8f0;--bad:#a33c3a;--badbg:#fff0ee;--yellow:#fbf3d9;--shadow:0 14px 42px #12345213}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
button,select,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6dafec;outline-offset:2px}
.wrap{max-width:990px;margin:0 auto;padding:24px 20px 80px}.mast{border-radius:24px;background:linear-gradient(118deg,#123e63,#23618d);color:white;padding:26px 30px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.mast:after{content:"";position:absolute;right:-35px;top:-90px;border:30px solid #ffffff17;width:240px;height:240px;border-radius:50%;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:750;text-transform:uppercase;color:#cfe3f4}h1{font-size:clamp(22px,3.3vw,32px);margin:8px 0 4px;line-height:1.2}h2{font-size:clamp(21px,2.6vw,27px);line-height:1.2;margin:0 0 14px}h3{font-size:17px;margin:0 0 10px}p{margin:0 0 13px}.small{font-size:13px}.muted{color:var(--muted)}.mast .muted{color:#dae9f4}.progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:19px;font-size:13px}.progress-rail{height:8px;border-radius:20px;background:#ffffff40;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:#aee8da;border-radius:20px;transition:width .25s}.steps{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:20px 0 16px}.step-btn{min-width:0;border:1px solid var(--stroke);border-radius:10px;background:#fff;height:43px;color:var(--muted);font-weight:750}.step-btn.selected{border-color:var(--blue);background:var(--cyan);color:var(--blue2)}.step-btn.done{background:var(--goodbg);color:var(--good);border-color:#a4d7bd}.step-btn.selected.done{box-shadow:inset 0 0 0 1px var(--good)}.board{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;padding:clamp(20px,3vw,34px);box-shadow:var(--shadow);min-height:460px}.section-label{color:var(--blue);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}.desc{font-size:16px;margin-bottom:24px;max-width:760px}.flex{display:flex;align-items:center;gap:12px}.wraprow{flex-wrap:wrap}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}.box{background:#f4f8fb;border:1px solid var(--stroke);padding:17px 19px;border-radius:14px}.soft{background:var(--cyan);border-color:#cce4f5}.outline{background:white;border-color:var(--stroke)}.btn{border:1px solid transparent;border-radius:10px;padding:11px 18px;min-height:44px;background:var(--blue);color:#fff;font-weight:700;transition:background .14s,transform .08s;text-align:center}.btn:hover:not(:disabled){background:var(--blue2)}.btn:active:not(:disabled){transform:translateY(1px)}.btn.ghost{color:var(--blue2);background:#fff;border-color:var(--stroke)}.btn.ghost:hover:not(:disabled){background:var(--cyan)}.btn.danger{color:var(--bad);background:#fff;border-color:#efcbc7}.btn.choice{display:flex;justify-content:space-between;align-items:center;text-align:left;color:var(--ink);background:#fff;border-color:var(--stroke);font-weight:550;gap:12px}.btn.choice:hover:not(:disabled){background:var(--cyan);border-color:#b4d6ec}.btn.choice:disabled{color:var(--muted);background:#f3f6f8}.btn.sm{font-size:13px;padding:7px 12px;min-height:36px}.btn.next{margin-left:auto}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.checkline{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}.feedback{margin-top:16px;padding:13px 16px;border-radius:12px;border:1px solid var(--stroke);display:flex;align-items:flex-start;gap:9px}.feedback.good{background:var(--goodbg);color:#15553d;border-color:#b8dcc6}.feedback.bad{background:var(--badbg);color:#833a34;border-color:#efc6c0}.feedback.info{background:#eef5fc;color:#264e71;border-color:#c9ddef}.mark{font-size:21px;line-height:1;font-weight:800}.sequence{min-height:55px;display:flex;align-items:center;flex-wrap:wrap;gap:9px}.num{border-radius:9px;display:inline-flex;justify-content:center;align-items:center;background:white;border:1px solid var(--stroke);width:32px;height:32px;font-weight:800;color:var(--blue2);flex-shrink:0}.choice-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:white;border:1px solid var(--stroke);border-radius:10px;cursor:pointer;margin-bottom:9px}.choice-row:has(input:checked){border-color:#77b0d8;background:#edf7ff}.choice-row input{accent-color:var(--blue);width:18px;height:18px;flex-shrink:0}.choice-row span{flex:1}.choice-row .flag{margin-left:auto}.two-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.three-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.label{display:block;font-weight:750;font-size:14px;margin-bottom:6px}.field{border:1px solid #bacbd9;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px;min-height:44px;width:100%}.field.medium{max-width:165px}.field.short{max-width:105px}.field.textarea{min-height:85px;resize:vertical}.item{margin-bottom:18px}.item:last-child{margin-bottom:0}.numberline{display:flex;align-items:start;gap:12px;padding:10px 0;border-bottom:1px solid #e4edf4}.numberline:last-child{border:0}.empty{font-style:italic;color:#8b9aa8;font-size:14px}.inline-num{display:inline-flex;width:26px;height:26px;border-radius:7px;background:#e7f0fa;color:var(--blue2);font-weight:750;align-items:center;justify-content:center;flex-shrink:0}.mini-cards{display:flex;gap:8px;flex-wrap:wrap}.tile{border:1px solid var(--stroke);background:#fff;min-width:45px;min-height:57px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:23px;font-weight:800}.tile small{font-size:11px;color:var(--muted);font-weight:500}.tile.warn{background:#fff1e7;border-color:#e7bc8a}.robot-grid{width:min(100%,318px);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.robot-cell{aspect-ratio:1;border:1px solid #c8d8e7;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative}.robot-cell.wall{background:repeating-linear-gradient(135deg,#e6ebef 0,#e6ebef 9px,#cbd3dc 9px,#cbd3dc 11px)}.robot-cell.target{background:#e6f6ef}.robot-cell.visited:after{content:"·";font-size:34px;font-weight:800;color:#92b9d4;position:absolute}.robot-cell .piece{font-size:28px;z-index:1;line-height:1}.robot-cell .piece.goal{color:#177b51}.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);margin-top:10px}.robot-layout{display:grid;grid-template-columns: minmax(240px,1fr) minmax(230px,.9fr);gap:24px;align-items:start}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:12px auto}.pad .btn{padding:8px;min-height:50px;font-size:23px}.pad .spacer{visibility:hidden}.step-ops{border:1px solid var(--stroke);border-radius:12px;padding:16px;min-height:120px}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:15px}.diagram-card{border:1px solid var(--stroke);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:9px}.op{border:1px solid #cbdde9;border-radius:9px;background:var(--cyan);padding:11px;text-align:center;min-width:130px}.arrowdown{font-size:25px;color:var(--blue);line-height:1}.num-inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.instruction-svg{display:block;margin:0 auto;width:min(100%,370px);height:auto;max-height:260px}.pill{display:inline-flex;border:1px solid #d8e8f3;background:#f0f8fd;color:var(--blue2);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:750}.note{margin-top:12px;color:var(--muted);font-size:13px}.hide{display:none!important}.results-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-item{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke);border-radius:10px;padding:12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}.result-item.good{background:var(--goodbg);border-color:#b8dbc8}.bigscore{text-align:center;font-size:43px;font-weight:850;color:var(--blue2);margin:3px 0}.footer{font-size:12px;color:#7a8b99;margin-top:15px;text-align:center}@media(max-width:670px){.wrap{padding:12px 11px 40px}.mast{padding:21px 18px;border-radius:18px}.steps{gap:4px}.step-btn{height:37px;border-radius:7px}.board{padding:18px 15px;border-radius:15px}.robot-layout,.two-cols,.three-cols,.diagram,.results-list{grid-template-columns:1fr}.robot-grid{max-width:255px}.robot-cell .piece{font-size:25px}.checkline>.btn{width:100%}.num-inputs{grid-template-columns:1fr 1fr}.btn.choice{font-size:14px}.actions{gap:6px}.actions .btn{padding:10px 12px;font-size:14px}.pill{font-size:11px}}
@media print{body{background:#fff}.mast{color:#000;background:white;box-shadow:none;border:1px solid #bbb}.board{box-shadow:none}.steps,.actions,.checkline,.footer{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="mast"><div class="eyebrow">Вычислительное мышление · 3 класс</div><h1>Алгоритм в виде инструкции</h1><div class="muted">Интерактивная мастерская: выполняй, проверяй, исправляй.</div><div class="progress-top"><span id="stageLabel">Задание 1 из 10</span><span id="progressLabel">Выполнено 0 из 10</span></div><div class="progress-rail"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></header>
<nav id="steps" class="steps" aria-label="Выбор задания"></nav>
<main id="main" class="board" aria-live="polite"></main>
<div id="actions" class="actions"></div>
<div class="footer">Работает без интернета. Ответы проверяются в браузере.</div>
</div>
<script>
'use strict';
const titleList=['Перепутанные действия','Маршрут робота','Исправь ошибку','Точные команды','Пропущенные шаги','Выполни алгоритм','Сравни алгоритмы','Другой маршрут','Повторение команд','Создай инструкцию'];
const orderOptions=[{id:'cover',text:'Присыпь семя землёй'},{id:'fill',text:'Насыпь землю в стаканчик'},{id:'water',text:'Полей землю'},{id:'seed',text:'Положи семя в ямку'},{id:'hole',text:'Сделай ямку в земле'}];
const precision=[{q:'Положить книгу на парту корешком влево.',opts:['Положи книгу аккуратно.','Положи книгу на парту корешком влево.','Положи книгу на парту.'],correct:1},{q:'Нарисовать квадрат со стороной 4 клетки.',opts:['Нарисуй фигуру со сторонами по 4 клетки.','Нарисуй квадрат со стороной 4 клетки.','Нарисуй квадрат побольше.'],correct:1},{q:'Пройти сначала 3 клетки вправо, затем 1 вниз.',opts:['Вправо 3 клетки, затем вниз 1 клетку.','Вниз 1 клетку, затем вправо 3 клетки.','Вправо 1 клетку, затем вниз 3 клетки.'],correct:0}];
const missingOpts=[['draw','Начерти прямоугольник 15 × 4 см'],['cut','Вырежи прямоугольник по контуру'],['name','Напиши имя на листе'],['fold','Сложи лист пополам']];
const mathOps=['Прибавь 3','Умножь на 2','Вычти 4','Прибавь 5'];
const expectedMath=[8,16,12,17];
const arrows={up:'↑',down:'↓',left:'←',right:'→'};
const walls=new Set(['1,2','2,2','2,1']);
function initial(){return {stage:0,order:[],orderChecked:false,commands:[],robotChecked:false,fix:'down',fixChecked:false,prec:['','',''],precChecked:false,missing:['',''],missingChecked:false,math:['','','',''],mathChecked:false,compare:'',compareNum:'',compareChecked:false,alt:[],altChecked:false,repeat:['','',''],repeatChecked:false,creative:['','','','',''],self:[false,false,false],creativeSaved:false,hints:{},results:false};}
let S=initial();
try{const saved=JSON.parse(localStorage.getItem('algorithm_instruction_grade3_v1')||'null');if(saved&&typeof saved==='object'&&Array.isArray(saved.order)&&Array.isArray(saved.commands)&&Array.isArray(saved.prec)&&saved.prec.length===3){S={...initial(),...saved};S.stage=Number.isInteger(S.stage)?Math.max(0,Math.min(9,S.stage)):0;S.results=false;}}catch(e){}
function persist(){try{localStorage.setItem('algorithm_instruction_grade3_v1',JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function evaluate(){let a=[S.orderChecked&&S.order.join(',')==='fill,hole,seed,cover,water',S.robotChecked&&go(S.commands).status==='success',S.fixChecked&&go(['up','up','up','right',S.fix,'right']).status==='success',S.precChecked&&S.prec.every((v,i)=>v!==''&&Number(v)===precision[i].correct),S.missingChecked&&S.missing[0]==='draw'&&S.missing[1]==='cut',S.mathChecked&&S.math.every((v,i)=>v.trim()!==''&&Number(v)===expectedMath[i]),S.compareChecked&&S.compare==='a'&&S.compareNum.trim()!==''&&Number(S.compareNum)===14,S.altChecked&&S.alt.length===6&&S.alt[0]==='right'&&go(S.alt).status==='success',S.repeatChecked&&S.repeat.join(',')==='3,1,6',S.creativeSaved];return a;}
function go(cmds){let x=0,y=3;const trace=['0,3'];for(let i=0;i<cmds.length;i++){let c=cmds[i],nx=x+(c==='right'?1:c==='left'?-1:0),ny=y+(c==='down'?1:c==='up'?-1:0);if(nx<0||nx>3||ny<0||ny>3)return {status:'edge',x,y,trace,step:i+1};if(walls.has(nx+','+ny))return {status:'wall',x,y,trace,step:i+1};x=nx;y=ny;trace.push(x+','+y)}return {status:x===3&&y===0?'success':'unfinished',x,y,trace,step:cmds.length};}
const button=(label,action,cls='btn',extra='')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
const feedback=(good,t,neutral=false)=>`<div class="feedback ${neutral?'info':good?'good':'bad'}" role="status"><span class="mark">${neutral?'ℹ':good?'✓':'!'}</span><span>${t}</span></div>`;
const option=(name,value,label,sel)=>`<label class="choice-row"><input type="radio" name="${name}" value="${esc(value)}" ${String(sel)===String(value)?'checked':''}><span>${esc(label)}</span></label>`;
const input=(name,val,placeholder='',type='text',extra='')=>`<input class="field" name="${name}" value="${esc(val)}" placeholder="${esc(placeholder)}" type="${type}" autocomplete="off" ${extra}>`;
const select=(name,val,options)=>`<select name="${name}" class="field"><option value="">Выбери команду</option>${options.map(([id,t])=>`<option value="${id}" ${val===id?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
function frame(number,title,desc,content){return `<div class="section-label">Задание ${number} из 10</div><h2>${title}</h2><p class="desc">${desc}</p>${content}`;}
function hint(i,t){return `<div class="checkline">${button('Подсказка','hint','btn ghost sm')}${S.hints[i]?'<div class="feedback info" style="flex:1;min-width:220px;margin:0"><span class="mark">ℹ</span><span>'+t+'</span></div>':''}</div>`;}
function stage0(){let rows=S.order.map((id,i)=>`<div class="numberline"><span class="inline-num">${i+1}</span><span>${esc(orderOptions.find(o=>o.id===id)?.text||'')}</span></div>`).join('');return frame(1,'Перепутанные действия','Маша хочет посадить семя. Все действия перепутались. Нажимай на них в таком порядке, чтобы получилась правильная инструкция.',`<div class="stack">${orderOptions.map(o=>`<button class="btn choice" data-action="append-order" data-value="${o.id}" ${S.order.includes(o.id)?'disabled':''}>${esc(o.text)}<span>${S.order.includes(o.id)?'✓':'＋'}</span></button>`).join('')}</div><div class="box" style="margin-top:18px"><h3>Твоя инструкция</h3>${rows||'<div class="empty">Выбирай команды сверху. Они появятся здесь.</div>'}<div class="flex wraprow" style="justify-content:flex-end;margin-top:13px">${button('Отменить шаг','undo-order','btn ghost sm',S.order.length?'':'disabled')}${button('Очистить','clear-order','btn ghost sm',S.order.length?'':'disabled')}</div></div>${S.orderChecked?feedback(evaluate()[0],evaluate()[0]?'Верно! Каждый шаг можно выполнить после предыдущего.':'Проверь: сначала подготовь землю, затем сделай ямку и положи в неё семя.'):''}<div class="checkline">${button('Проверить инструкцию','check-order','btn',S.order.length===5?'':'disabled')}</div>`);}
function robotGrid(trace=[],at={x:0,y:3}){return `<div class="robot-grid" role="img" aria-label="Поле 4 на 4, робот в левом нижнем углу, цель в правом верхнем, стены в клетках второго столбца третьего ряда, третьего столбца третьего ряда и третьего столбца второго ряда">${Array.from({length:16},(_,i)=>{let x=i%4,y=Math.floor(i/4),wall=walls.has(x+','+y),target=x===3&&y===0,here=at.x===x&&at.y===y,path=trace.includes(x+','+y);return `<div class="robot-cell ${wall?'wall':''} ${target?'target':''} ${path&&!here?'visited':''}">${here?'<span class="piece" title="Робот">♟</span>':target?'<span class="piece goal" title="Цель">★</span>':''}</div>`;}).join('')}</div><div class="legend"><span>♟ — робот</span><span>★ — цель</span><span>▨ — стена</span></div>`;}
function robotStage(n){let isAlt=n===7,cmds=isAlt?S.alt:S.commands,checked=isAlt?S.altChecked:S.robotChecked,result=go(cmds),success=isAlt?evaluate()[7]:evaluate()[1],maximum=isAlt?6:10;let f='';if(checked){let message=result.status==='wall'?`На шаге ${result.step} робот встретил стену.`:result.status==='edge'?`На шаге ${result.step} робот вышел за границу поля.`:result.status==='unfinished'?'Робот пока не дошёл до звезды.':isAlt&&!success?'Цель достигнута, но нужно ровно 6 команд, начиная с шага вправо.':'Робот дошёл до звезды. Инструкция работает.';f=feedback(success,message);}return frame(isAlt?8:2,isAlt?'Найди другой маршрут':'Проложи путь роботу',isAlt?'Робот должен добраться до звезды за 6 команд. Первая команда обязательно «вправо». Найди другой маршрут, не проходя через стены.':'Робот стоит в левом нижнем углу. Составь инструкцию, по которой он доберётся до звезды. Каждая команда перемещает его на одну клетку.',`<div class="robot-layout"><div class="box">${robotGrid(checked?result.trace:[],checked?result:{x:0,y:3})}</div><div><h3>Выбирай команды</h3><div class="pad"><span class="spacer"></span>${button('↑','append-command','btn ghost',`data-value="up" ${cmds.length>=maximum?'disabled':''} aria-label="Вверх"`)}<span class="spacer"></span>${button('←','append-command','btn ghost',`data-value="left" ${cmds.length>=maximum?'disabled':''} aria-label="Влево"`)}${button('↓','append-command','btn ghost',`data-value="down" ${cmds.length>=maximum?'disabled':''} aria-label="Вниз"`)}${button('→','append-command','btn ghost',`data-value="right" ${cmds.length>=maximum?'disabled':''} aria-label="Вправо"`)}</div><div class="step-ops"><div class="flex between wraprow"><strong>Программа робота</strong><span class="muted small">${cmds.length}/${maximum} команд</span></div><div class="mini-cards" style="margin:12px 0">${cmds.map((c,i)=>`<div class="tile"><small>${i+1}</small>${arrows[c]}</div>`).join('')||'<div class="empty">Добавь команды стрелками.</div>'}</div><div class="flex wraprow">${button('Отменить','undo-command','btn ghost sm',cmds.length?'':'disabled')}${button('Очистить','clear-command','btn ghost sm',cmds.length?'':'disabled')}</div></div></div></div>${f}${hint(n,isAlt?'Подумай, как обойти стены по нижнему и правому краям поля.':'Можно сначала пройти вдоль одной стороны поля, а затем вдоль другой.') }<div class="checkline">${button('▶ Запустить робота','run-command','btn',cmds.length?'':'disabled')}</div>`);}
function stage2(){let commands=['up','up','up','right',S.fix,'right'];return frame(3,'Исправь ошибку программиста','Программист составил инструкцию движения к звезде. В пятой команде он ошибся. Исправь только эту команду.',`<div class="box"><h3>Инструкция программиста</h3><div class="mini-cards">${commands.map((c,i)=>`<div class="tile ${i===4?'warn':''}"><small>${i+1}</small>${arrows[c]}</div>`).join('')}</div><p class="note">Пятая команда выделена цветом.</p></div><h3 style="margin-top:20px">Какой должна быть пятая команда?</h3>${[['up','Вверх ↑'],['down','Вниз ↓'],['left','Влево ←'],['right','Вправо →']].map(([id,label])=>option('fix',id,label,S.fix)).join('')}${S.fixChecked?feedback(evaluate()[2],evaluate()[2]?'Теперь робот достигнет звезды!':'После четвёртой команды робот находится в верхнем ряду. Подумай, куда ему нужно двигаться дальше.'):''}<div class="checkline">${button('Проверить исправление','check-fix')}</div>`);}
function stage3(){return frame(4,'Говори точно!','Компьютер выполняет команды буквально. Выбери такие инструкции, которые точно подходят к заданию.',`${precision.map((p,i)=>`<div class="box item"><h3>${i+1}. ${esc(p.q)}</h3>${p.opts.map((o,j)=>option('prec-'+i,j,o,S.prec[i])).join('')}${S.precChecked?feedback(Number(S.prec[i])===p.correct,' '+(Number(S.prec[i])===p.correct?'Точно сформулировано.':'В выбранной команде потеряно или изменено условие.')):''}</div>`).join('')}${hint(3,'В инструкции нужно сохранить предмет, место, размер или порядок действий — всё, что указано в задаче.')}${S.precChecked&&evaluate()[3]?feedback(true,'Все три команды выбраны верно!'):''}<div class="checkline">${button('Проверить три ответа','check-prec','btn',S.prec.every(v=>v!=='')?'':'disabled')}</div>`);}
function stage4(){return frame(5,'Пропущенные шаги','Ученик записал инструкцию изготовления бумажной закладки. Два действия исчезли. Восстанови их.',`<div class="box"><h3>Как сделать закладку</h3><div class="numberline"><span class="inline-num">1</span><span>Возьми лист, линейку, карандаш и ножницы.</span></div><div class="numberline"><span class="inline-num">2</span><div style="flex:1"><label class="label" for="missing-0">Какая команда пропущена?</label>${select('missing-0',S.missing[0],missingOpts)}</div></div><div class="numberline"><span class="inline-num">3</span><div style="flex:1"><label class="label" for="missing-1">Какая команда пропущена?</label>${select('missing-1',S.missing[1],missingOpts)}</div></div><div class="numberline"><span class="inline-num">4</span><span>Подпиши готовую закладку.</span></div><div class="numberline"><span class="inline-num">5</span><span>Убери ножницы и другие инструменты на место.</span></div></div>${S.missingChecked?feedback(evaluate()[4],evaluate()[4]?'Последовательность восстановлена!':'Подумай, что нужно сделать до вырезания, а что — после него.'):''}<div class="checkline">${button('Проверить инструкцию','check-missing','btn',S.missing.every(Boolean)?'':'disabled')}</div>`);}
function stage5(){let acts=['+3','×2','−4','+5'];return frame(6,'Выполни алгоритм','Начальное число — 5. Выполняй команды строго по порядку. После каждого действия записывай результат. Следующая команда применяется к предыдущему результату.',`<div class="box" style="max-width:570px"><div class="flex between"><strong>Начальное число</strong><span style="font-size:30px;font-weight:850;color:var(--blue2)">5</span></div>${mathOps.map((o,i)=>`<div class="numberline"><span class="inline-num">${i+1}</span><span class="pill" style="font-size:17px;min-width:58px;justify-content:center">${acts[i]}</span><div style="flex:1"><label class="label" for="math-${i}">${o}</label>${input('math-'+i,S.math[i],'Результат','number','inputmode="numeric"')}</div>${S.mathChecked?`<span style="font-weight:bold;color:${S.math[i].trim()!==''&&Number(S.math[i])===expectedMath[i]?'var(--good)':'var(--bad)'}">${S.math[i].trim()!==''&&Number(S.math[i])===expectedMath[i]?'✓':'✗'}</span>`:''}</div>`).join('')}</div>${S.mathChecked?feedback(evaluate()[5],evaluate()[5]?'Все четыре шага выполнены верно!':'Посмотри на отмеченные ошибки. Каждое действие начинай с результата предыдущего шага.'):''}<div class="checkline">${button('Проверить вычисления','check-math')}</div>`);}
function stage6(){return frame(7,'Один набор действий — разные результаты','Два робота начинают с числа 4. Они выполняют одни и те же действия, но в разном порядке.',`<div class="diagram"><div class="diagram-card"><h3>Робот А</h3><strong style="font-size:24px">4</strong><span class="arrowdown">↓</span><div class="op">Прибавь 6</div><span class="arrowdown">↓</span><div class="op">Умножь на 2</div><span class="arrowdown">↓</span><strong>Результат — ?</strong></div><div class="diagram-card"><h3>Робот Б</h3><strong style="font-size:24px">4</strong><span class="arrowdown">↓</span><div class="op">Умножь на 2</div><span class="arrowdown">↓</span><div class="op">Прибавь 6</div><span class="arrowdown">↓</span><strong>Результат — ?</strong></div></div><div style="margin-top:22px"><h3>Какой робот получит число 20?</h3>${[['a','Робот А'],['b','Робот Б'],['both','Оба робота'],['none','Ни один']].map(([v,l])=>option('compare',v,l,S.compare)).join('')}<label class="label" for="compareNum" style="margin-top:15px">Какое число получит другой робот?</label>${input('compareNum',S.compareNum,'Введи число','number','inputmode="numeric"')}</div>${S.compareChecked?feedback(evaluate()[6],evaluate()[6]?'Верно! Порядок команд влияет на результат.':'Выполни верхнюю команду каждого робота, а затем вторую. Сравни результаты.'):''}<div class="checkline">${button('Сравнить алгоритмы','check-compare')}</div>`);}
function stage8(){let coords=['0,4','0,3','0,2','1,2','1,1','1,0','2,0'];let path=S.repeatChecked&&evaluate()[8];return frame(9,'Инструкция с повторением','Робот стоит в клетке: столбец 1, строка 5. Ему нужно выполнить три команды два раза подряд.',`<div class="box soft" style="text-align:center"><div style="font-size:32px;letter-spacing:.25em;font-weight:800">↑ ↑ →</div><strong>Повтори 2 раза</strong><div class="small muted">Каждая стрелка — перемещение на одну клетку.</div></div><div class="box" style="margin-top:16px"><p class="muted small" style="text-align:center">Столбцы: 1 · 2 · 3 · 4 · 5</p><div style="width:min(100%,260px);margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px">${Array.from({length:25},(_,i)=>{let x=i%5,y=Math.floor(i/5);return `<div class="robot-cell" style="aspect-ratio:1">${x===0&&y===4?'<span class="piece">♟</span>':path&&x===2&&y===0?'<span class="piece goal">★</span>':path&&coords.includes(x+','+y)?'<span class="piece" style="color:#8bb8d2">·</span>':''}</div>`;}).join('')}</div><p class="note" style="text-align:center">Строки считаются сверху вниз: от 1 до 5.</p></div><div class="three-cols" style="margin-top:17px"><div><label class="label" for="repeat-0">Конечный столбец</label>${input('repeat-0',S.repeat[0],'Номер','number','inputmode="numeric"')}</div><div><label class="label" for="repeat-1">Конечная строка</label>${input('repeat-1',S.repeat[1],'Номер','number','inputmode="numeric"')}</div><div><label class="label" for="repeat-2">Всего команд</label>${input('repeat-2',S.repeat[2],'Количество','number','inputmode="numeric"')}</div></div>${S.repeatChecked?feedback(evaluate()[8],evaluate()[8]?'Верно! Робот выполнил 6 команд и остановился в нужной клетке.':'Напиши «↑ ↑ → ↑ ↑ →» и проследи путь от нижней левой клетки.'):''}<div class="checkline">${button('Проверить маршрут','check-repeat')}</div>`);}
function house(){let grid=Array.from({length:16},(_,i)=>`<line x1="${20+i*17}" y1="0" x2="${20+i*17}" y2="198" stroke="#b4c4d2" stroke-opacity=".35"/>`).join('')+Array.from({length:12},(_,i)=>`<line x1="20" y1="${i*17}" x2="280" y2="${i*17}" stroke="#b4c4d2" stroke-opacity=".35"/>`).join('');return `<svg class="instruction-svg" viewBox="0 0 300 198" aria-label="Домик с квадратным основанием, треугольной крышей, дверью, двумя окнами и трубой" role="img">${grid}<g fill="none" stroke="#1d4767" stroke-width="2.5" stroke-linejoin="round"><rect x="99" y="85" width="102" height="102"/><path d="M82 85 L150 17 L218 85 Z"/><path d="M184 34 V63 H201 V51"/><rect x="137" y="136" width="26" height="51"/><rect x="110" y="106" width="18" height="18"/><rect x="172" y="106" width="18" height="18"/></g></svg>`;}
function stage9(){let rules=['Я указал размеры и расположение деталей.','Действия записаны в правильном порядке.','Другой ученик сможет выполнить инструкцию без образца.'];return frame(10,'Стань автором инструкции','Нужно объяснить другому ученику, как нарисовать домик в тетради в клетку. Он не видит образец и может выполнять только твои команды.',`<div class="box soft"><h3>Домик, который нужно нарисовать</h3>${house()}<p class="small">Основание — квадрат со стороной 6 клеток. Есть крыша, дверь, два окна и труба.</p></div><h3 style="margin-top:22px">Запиши инструкцию из пяти шагов</h3><div class="stack">${S.creative.map((v,i)=>`<div class="flex" style="align-items:flex-start"><span class="inline-num" style="margin-top:7px">${i+1}</span><textarea name="creative-${i}" rows="2" class="field textarea" placeholder="Команда ${i+1}">${esc(v)}</textarea></div>`).join('')}</div><div class="box" style="margin-top:18px"><h3>Проверь свою инструкцию</h3>${rules.map((t,i)=>`<label class="choice-row"><input type="checkbox" name="self-${i}" ${S.self[i]?'checked':''}><span>${t}</span></label>`).join('')}</div>${S.creativeSaved?feedback(true,'Инструкция записана. Проверь её на практике: попроси одноклассника нарисовать домик без образца. Если возникнут ошибки, уточни команды.')+'<div class="checkline">'+button('Скопировать инструкцию','copy-instruction','btn ghost')+'</div>':''}<div class="checkline">${button('Инструкция готова','save-creative','btn',S.creative.every(v=>v.trim().length>=8)&&S.self.every(Boolean)?'':'disabled')}</div>`);}
function results(){let ok=evaluate(),num=ok.slice(0,9).filter(Boolean).length;return `<div class="section-label">Результат работы</div><h2>Моя мастерская алгоритмов</h2><div class="box soft"><div class="bigscore">${num} / 9</div><div style="text-align:center">Заданий с автоматической проверкой выполнено правильно</div><p class="note" style="text-align:center">Задание 10 — творческое, проверяется с одноклассником или учителем.</p></div><h3 style="margin-top:23px">Вернись к заданиям</h3><div class="results-list">${ok.map((done,i)=>`<button type="button" class="result-item ${done?'good':''}" data-action="go-stage" data-value="${i}"><strong style="color:${done?'var(--good)':'var(--muted)'}">${done?'✓':'○'}</strong><span>${i+1}. ${titleList[i]}</span></button>`).join('')}</div><div class="checkline">${button('Скопировать результат','copy-results','btn ghost')}${button('Начать заново','reset','btn danger')}</div>`;}
const renderers=[stage0,()=>robotStage(1),stage2,stage3,stage4,stage5,stage6,()=>robotStage(7),stage8,stage9];
function render(){const ok=evaluate(),done=ok.filter(Boolean).length;document.getElementById('steps').innerHTML=titleList.map((v,i)=>`<button class="step-btn ${S.stage===i&&!S.results?'selected':''} ${ok[i]?'done':''}" title="${i+1}. ${esc(v)}" aria-label="Задание ${i+1}: ${esc(v)}${ok[i]?', выполнено':''}" data-action="go-stage" data-value="${i}" ${S.stage===i&&!S.results?'aria-current="step"':''}>${ok[i]?'✓':i+1}</button>`).join('');document.getElementById('progressLabel').textContent=`Выполнено ${done} из 10`;document.getElementById('stageLabel').textContent=S.results?'Результаты':`Задание ${S.stage+1} из 10`;document.getElementById('progressFill').style.width=10*done+'%';document.getElementById('main').innerHTML=S.results?results():renderers[S.stage]();document.getElementById('actions').innerHTML=`${button('← Назад',S.results?'back-results':'prev','btn ghost',!S.results&&S.stage===0?'disabled':'')}${S.results?'':S.stage===9?button('Мои результаты →','results','btn next'):button('Следующее задание →','next','btn next')}`;persist();}
function touch(action,value){switch(action){case'go-stage':S.stage=Number(value);S.results=false;break;case'prev':S.stage=Math.max(0,S.stage-1);break;case'next':S.stage=Math.min(9,S.stage+1);break;case'back-results':S.results=false;break;case'results':S.results=true;break;case'append-order':if(!S.order.includes(value))S.order.push(value);S.orderChecked=false;break;case'undo-order':S.order.pop();S.orderChecked=false;break;case'clear-order':S.order=[];S.orderChecked=false;break;case'check-order':S.orderChecked=true;break;case'append-command':{const prop=S.stage===7?'alt':'commands',check=S.stage===7?'altChecked':'robotChecked';if(S[prop].length<(S.stage===7?6:10))S[prop].push(value);S[check]=false;break;}case'undo-command':{const prop=S.stage===7?'alt':'commands';S[prop].pop();S[S.stage===7?'altChecked':'robotChecked']=false;break;}case'clear-command':{const prop=S.stage===7?'alt':'commands';S[prop]=[];S[S.stage===7?'altChecked':'robotChecked']=false;break;}case'run-command':S[S.stage===7?'altChecked':'robotChecked']=true;break;case'check-fix':S.fixChecked=true;break;case'check-prec':S.precChecked=true;break;case'check-missing':S.missingChecked=true;break;case'check-math':S.mathChecked=true;break;case'check-compare':S.compareChecked=true;break;case'check-repeat':S.repeatChecked=true;break;case'save-creative':S.creativeSaved=true;break;case'hint':S.hints[S.stage]=!S.hints[S.stage];break;case'copy-instruction':copyText('Инструкция для рисования домика\n'+S.creative.map((s,i)=>`${i+1}. ${s}`).join('\n'));return;case'copy-results':{let ok=evaluate();copyText(`Алгоритм в виде инструкции. Результат: ${ok.slice(0,9).filter(Boolean).length}/9\n`+titleList.map((s,i)=>`${i+1}. ${s}: ${ok[i]?'выполнено':'пока не выполнено'}`).join('\n'));return;}case'reset':if(!confirm('Начать заново? Все введённые ответы будут очищены.'))return;S=initial();break;default:return;}render();}
function copyText(text){const announce=msg=>{let el=document.createElement('div');el.className='feedback info';el.role='status';el.textContent=msg;document.getElementById('main').appendChild(el);setTimeout(()=>el.remove(),2300);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>announce('Скопировано.'),()=>fallback());}else fallback();function fallback(){let area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let success=false;try{success=document.execCommand('copy');}catch(e){}area.remove();announce(success?'Скопировано.':'Не удалось скопировать автоматически. Выдели текст и скопируй вручную.');}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)touch(el.dataset.action,el.dataset.value);});
document.addEventListener('change',e=>{const t=e.target,n=t.name;if(!n)return;if(n==='fix'){S.fix=t.value;S.fixChecked=false;}else if(n==='compare'){S.compare=t.value;S.compareChecked=false;}else if(n.startsWith('prec-')){S.prec[Number(n.split('-')[1])]=t.value;S.precChecked=false;}else if(n.startsWith('missing-')){S.missing[Number(n.split('-')[1])]=t.value;S.missingChecked=false;}else if(n.startsWith('self-')){S.self[Number(n.split('-')[1])]=t.checked;S.creativeSaved=false;}else return;render();});
document.addEventListener('input',e=>{const t=e.target,n=t.name;if(!n)return;let recognized=true;if(n.startsWith('math-')){S.math[Number(n.split('-')[1])]=t.value;S.mathChecked=false;}else if(n==='compareNum'){S.compareNum=t.value;S.compareChecked=false;}else if(n.startsWith('repeat-')){S.repeat[Number(n.split('-')[1])]=t.value;S.repeatChecked=false;}else if(n.startsWith('creative-')){S.creative[Number(n.split('-')[1])]=t.value;S.creativeSaved=false;}else recognized=false;if(recognized){persist();document.querySelectorAll('.feedback:not(.info)').forEach(x=>x.remove());const checkBtn=document.querySelector('[data-action="save-creative"]');if(checkBtn)checkBtn.disabled=!(S.creative.every(v=>v.trim().length>=8)&&S.self.every(Boolean));}});
render();
</script>
</body>
</html>
