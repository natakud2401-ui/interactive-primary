{"id":"h-find","stage":"hard","type":"find","skill":"find","title":"Спортивный день","desc":"Отметь в тексте все несклоняемые имена существительные.","txt":"Вратарь отразил пенальти. После игры спортсмен дал интервью. На трибуне висело табло, а зрители обсуждали результат.","targets":["пенальти","интервью","табло"],"hint":"Ищи имена существительные, которые сохраняют одну и ту же форму при разных падежных вопросах."},{"id":"h-repair","stage":"hard","type":"repair","skill":"repair","title":"В школьной газете","desc":"Проверь выделенное слово. Есть ли ошибка в его форме? Если есть, выбери исправление.","items":[{"sentence":"Мы шли по широкому шоссу.","shown":"шоссу","candidate":"шоссе","answer":"fix"},{"sentence":"На сцене стояло новое пианино.","shown":"пианино","candidate":"пианино","answer":"keep"},{"sentence":"Дети угощались овощным рагом.","shown":"рагом","candidate":"рагу","answer":"fix"}],"hint":"Проверь связь слов: существительное не изменяется по падежам, а прилагательное согласуется с ним."},{"id":"h-gender","stage":"hard","type":"gender","skill":"gender","title":"Согласованные слова","desc":"Определи род существительного по согласованному слову.","items":[{"phrase":"Выгодное пари","noun":"пари","answer":"n"},{"phrase":"Смелый какаду","noun":"какаду","answer":"m"},{"phrase":"Улыбчивая леди","noun":"леди","answer":"f"}],"hint":"Род определяется по согласованному слову: какой? какая? какое?"},{"id":"h-agree","stage":"hard","type":"agree","skill":"agree","title":"Уточни признак","desc":"Прочитай словосочетание. Подбери второе прилагательное в нужной форме.","items":[{"phrase":"Строгое жюри","forms":["честный","честная","честное"],"answer":"честное"},{"phrase":"Решающий пенальти","forms":["решающий","решающая","решающее"],"answer":"решающий"},{"phrase":"Знаменитая Барто","forms":["талантливый","талантливая","талантливое"],"answer":"талантливая"}],"hint":"Первое прилагательное уже согласовано с существительным. Выбери форму второго прилагательного того же рода."} const LOOK=Object.fromEntries(TASKS.map(t=>[t.id,t]));
const skillNames={find:'Нахожу в тексте',repair:'Исправляю ошибки',gender:'Определяю род',agree:'Согласую прилагательные'};
const groups={diag:['d-find','d-repair','d-gender','d-agree'],final:['f-find','f-repair','f-agree','f-gender']};
const saveKey='neskl_4_v7_real_life',journalKey='neskl_4_v7_real_life_journal';
const el=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const make=()=>({stage:'intro',diagIndex:0,trainIndex:0,finalIndex:0,plan:[],diag:[],train:[],final:[],attempts:0,hints:0,feedback:null,answers:{},started:new Date().toISOString(),studentName:'',run:Math.floor(Math.random()*1e9),added:[],done:null});
let state;try{state=JSON.parse(localStorage.getItem(saveKey))||make();if(!state.stage||!state.answers)state=make();if(typeof state.studentName!=='string')state.studentName=''}catch{state=make()}
let teacher=false;
function persist(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch{}}
function journal(){try{return JSON.parse(localStorage.getItem(journalKey))||[]}catch{return []}}
function addJournal(x){try{const j=journal();j.push(x);localStorage.setItem(journalKey,JSON.stringify(j.slice(-80)))}catch{}}
function shuffle(a,seed){let x=(seed>>>0)||1, r=a.slice();for(let i=r.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;const j=(x>>>0)%(i+1);[r[i],r[j]]=[r[j],r[i]]}return r}
function stableOrder(key,n){const seed=Array.from(key+state.run).reduce((v,c)=>Math.imul(v^c.charCodeAt(0),16777619)>>>0,2166136261);return shuffle(Array.from({length:n},(_,i)=>i),seed)}
function section(){return state.stage==='diag'?'Диагностика':state.stage==='train'?'Индивидуальная тренировка':state.stage==='final'?'Итоговая проверка':'Правило'}
function task(){return state.stage==='diag'?LOOK[groups.diag[state.diagIndex]]:state.stage==='final'?LOOK[groups.final[state.finalIndex]]:state.stage==='train'?LOOK[state.plan[state.trainIndex]]:null}
function stageNumber(){return {intro:0,diag:1,route:2,train:2,final:3,done:4}[state.stage]??0}
function stages(){const names=['Правило','Диагностика','Маршрут','Проверка'],n=stageNumber();return names.map((s,i)=>`<div class="step ${i<n?'done':i===n?'now':''}">${i<n?'✓ ':''}${s}</div>`).join('')}
function initAnswer(t){if(!state.answers[t.id])state.answers[t.id]={selected:[],rows:{}};return state.answers[t.id]}
function tokenKey(s){return s.toLocaleLowerCase('ru-RU').replace(/^[^а-яёa-z]+|[^а-яёa-z]+$/gi,'')}
function fmtSentence(s,shown){const a=s.toLocaleLowerCase('ru-RU').indexOf(shown.toLocaleLowerCase('ru-RU'));if(a<0)return esc(s);return esc(s.slice(0,a))+'<span class="target">'+esc(s.slice(a,a+shown.length))+'</span>'+esc(s.slice(a+shown.length))}
function form(t){const a=initAnswer(t);if(t.type==='find'){
 const needles=new Set(t.targets.map(tokenKey));const words=t.txt.split(/(\s+)/);let i=-1;
 const text=words.map(w=>{if(/^\s+$/.test(w))return w;i++;return `<button type="button" data-token="${i}" aria-pressed="${a.selected.includes(i)}" class="token ${a.selected.includes(i)?'sel':''}">${esc(w)}</button>`}).join('');return `<div class="text-search" aria-label="Текст для поиска слов">${text}</div>`;
 }
 if(t.type==='repair')return `<div class="items">${t.items.map((it,i)=>{const options=[{v:'keep',label:'Оставить без изменения'},{v:'fix',label:'Нужно исправить'}];const o=stableOrder(t.id+'-'+i,2).map(j=>options[j]);return `<div class="item"><div class="sentence">${fmtSentence(it.sentence,it.shown)}</div><div class="choices">${o.map(v=>`<button type="button" class="choice ${a.rows[i]===v.v?'sel':''}" aria-pressed="${a.rows[i]===v.v}" data-row="${i}" data-val="${v.v}">${esc(v.label)}</button>`).join('')}</div></div>`}).join('')}</div>`;
 if(t.type==='agree')return `<div class="items">${t.items.map((it,i)=>{const o=stableOrder(t.id+'-agree-'+i,it.forms.length).map(j=>it.forms[j]);return `<div class="item"><div class="gline"><div class="phrase">${esc(it.phrase)}</div><div class="choices gender">${o.map(v=>`<button type="button" class="choice ${a.rows[i]===v?'sel':''}" data-row="${i}" data-val="${esc(v)}" aria-pressed="${a.rows[i]===v}">${esc(v)}</button>`).join('')}</div></div></div>`}).join('')}</div>`;
 if(t.type==='gender')return `<div class="items">${t.items.map((it,i)=>{const ops=[{v:'m',label:'Мужской'},{v:'f',label:'Женский'},{v:'n',label:'Средний'}];const o=stableOrder(t.id+'-'+i,3).map(j=>ops[j]);return `<div class="item"><div class="gline"><div class="phrase">${esc(it.phrase)}</div><div class="choices gender">${o.map(v=>`<button type="button" class="choice ${a.rows[i]===v.v?'sel':''}" aria-pressed="${a.rows[i]===v.v}" data-row="${i}" data-val="${v.v}">${v.label}</button>`).join('')}</div></div></div>`}).join('')}</div>`;
 return '';
}
function assess(t){const a=initAnswer(t);let sum=0,n=0,complete=false;
 if(t.type==='find'){
 const parts=t.txt.split(/\s+/);const goal=parts.map((s,i)=>t.targets.map(tokenKey).includes(tokenKey(s))?i:-1).filter(x=>x>=0);
 const selected=a.selected;const ok=selected.filter(x=>goal.includes(x)).length;const extra=selected.filter(x=>!goal.includes(x)).length;sum=Math.max(0,ok-extra);n=goal.length;complete=selected.length>0;return {ok:ok===goal.length&&extra===0,got:sum,total:n,complete};
 }
 n=t.items.length;sum=t.items.reduce((s,it,i)=>s+Number(a.rows[i]===it.answer),0);complete=t.items.every((_,i)=>a.rows[i]!==undefined);return {ok:sum===n,got:sum,total:n,complete}
}
function record(t,r){return {id:t.id,skill:t.skill,title:t.title,good:r.got,total:r.total,perfect:r.ok,attempts:state.attempts||1,hints:state.hints||0}}
function percent(num,tot){return Math.max(0,Math.min(100,Math.round(100*num/tot)))}
function taskUI(){const t=task(),d=state.stage;
 const at=d==='diag'?state.diagIndex:d==='train'?state.trainIndex:state.finalIndex;
 const len=d==='diag'?groups.diag.length:d==='train'?state.plan.length:groups.final.length;
 const pct=percent(at,len);
 const feedback=state.feedback;
 return `<div class="minititle">${section()} · ${at+1} из ${len}</div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><h2 class="heading">${esc(t.title)}</h2><div class="task"><p class="instruction">${esc(t.desc)}</p>${form(t)}</div>
 ${feedback?`<div class="feedback ${feedback.kind==='warn'?'warn':''}">${esc(feedback.text)}</div>`:''}
 ${state.hints>0&&d==='train'?`<div class="hint">${esc(t.hint)}</div>`:''}
 <div class="actionbar">${d==='train'&&!feedback?`<button class="light" data-action="hint">Подсказка</button>`:''}<button class="primary" data-action="${feedback?'next-'+d:'check-'+d}">${feedback?(d==='train'&&feedback.kind==='warn'&&state.attempts===1?'Попробовать ещё раз':'Следующее задание'):'Проверить'}</button></div>`;
}
function intro(){return `<div class="theory"><h2 class="heading">Что такое несклоняемые существительные?</h2><p>Несклоняемые имена существительные <strong>не изменяют свою форму по падежам</strong>.</p><div class="example"><b>Вижу пальто. Подошёл к пальто. Рассказывал о пальто.</b><div>Существительное <b>пальто</b> остаётся неизменным.</div></div><p>Для сравнения: <b>стол — стола — столом</b>. Это склоняемое существительное.</p><p>Род несклоняемого существительного в словосочетании можно определить по согласованному прилагательному: <b>новое фойе</b> (средний род), <b>свежая салями</b> (женский род), <b>сильный кенгуру</b> (мужской род).</p></div><label class="student-field" for="student-name">Твоё имя<input id="student-name" class="student-input" type="text" autocomplete="name" maxlength="60" placeholder="Введи имя" value="${esc(state.studentName)}"></label><div class="actionbar"><button class="primary" data-action="start">Начать задания</button></div>`}
function route(){const bad=state.diag.filter(x=>!x.perfect);const msg=bad.length?'Тренировка составлена по результатам диагностики.':'Все диагностические задания выполнены верно. Следующее задание будет сложнее.';return `<h2 class="heading">Твой маршрут</h2><p class="caption">${msg}</p><div class="route">${groups.diag.map(id=>{const t=LOOK[id],l=state.diag.find(x=>x.id===id);return `<div class="routebox ${l&&!l.perfect?'weak':''}"><b>${esc(skillNames[t.skill])}</b><span>${l&&l.perfect?'Выполнено самостоятельно':'Нужна тренировка'}</span></div>`}).join('')}</div><div class="actionbar"><button class="primary" data-action="start-train">Начать тренировку</button></div>`}
function total(logs){return logs.reduce((a,x)=>a+x.good,0)}function maximum(logs){return logs.reduce((a,x)=>a+x.total,0)}
function result(){const p=percent(total(state.final),Math.max(1,maximum(state.final)));const d=state.diag.filter(x=>x.perfect).length;const independent=state.train.filter(x=>x.perfect&&x.hints===0&&x.attempts===1).length;return `<h2 class="heading">Результаты</h2>${state.studentName?`<p class="caption">${esc(state.studentName)}</p>`:''}<div class="resultscore">Итоговая проверка: ${p}%</div><div class="metricgrid"><div class="metric"><b>${d}/${groups.diag.length}</b><span>Диагностика</span></div><div class="metric"><b>${independent}</b><span>Заданий самостоятельно</span></div><div class="metric"><b>${state.train.length}</b><span>Заданий тренировки</span></div></div><p class="caption" style="margin-top:17px">${p>=85?'Ты хорошо различаешь склоняемые и несклоняемые существительные.':p>=60?'Повтори слова, в которых были ошибки.':'Полезно повторить правило и пройти тренировку ещё раз.'}</p><div class="actionbar"><button class="light" data-action="copy">Скопировать результат</button><button class="primary" data-action="new">Пройти снова</button></div>`}
function report(){const a=['Несклоняемые имена существительные — 4 класс',`Ученик: ${state.studentName||'Имя не указано'}`,`Диагностика: ${state.diag.filter(x=>x.perfect).length}/${groups.diag.length} заданий без ошибок`,`Итог: ${total(state.final)}/${maximum(state.final)} верных ответов`,`Самостоятельная тренировка: ${state.train.filter(x=>x.perfect&&x.attempts===1&&x.hints===0).length} заданий`,`С подсказкой или повтором: ${state.train.filter(x=>x.hints>0||x.attempts>1).length} заданий`];for(const [name,logs] of [['Диагностика',state.diag],['Тренировка',state.train],['Итог',state.final]]){a.push('',name+':');for(const x of logs)a.push(`${x.title}: ${x.good}/${x.total}; попыток ${x.attempts}; подсказок ${x.hints}`)}return a.join('\n')}
function teacherUI(){const data=journal();return `<h2 class="heading">Журнал работ</h2>${data.length?`<div class="tablewrap"><table><thead><tr><th>Ученик</th><th>Диагностика</th><th>Итог</th><th>Самостоятельно</th></tr></thead><tbody>${data.slice().reverse().map((x,i)=>`<tr><td>${esc(x.studentName||'Работа №'+(data.length-i))}</td><td>${x.diag}</td><td>${x.final}</td><td>${x.independent}</td></tr>`).join('')}</tbody></table></div>`:'<p class="caption">Пока нет завершённых работ.</p>'}<div class="toolbar"><button class="light" data-action="copy-journal">Скопировать журнал</button><button class="light" data-action="csv">Скачать CSV</button><button class="primary" data-action="back">К заданию</button></div><h3 style="font-size:16px;margin-top:22px">Текущая работа</h3><div class="report">${esc(report())}</div>`}
function render(){document.getElementById('steps').innerHTML=stages();document.getElementById('teacher').textContent=teacher?'К заданиям':'Учителю';if(teacher){el.innerHTML=teacherUI();return}el.innerHTML=state.stage==='intro'?intro():state.stage==='route'?route():state.stage==='done'?result():taskUI();persist()}
function getNextFeedback(){return {kind:'ok',text:'Ответ сохранён. Переходи к следующему заданию.'}}
function checkDiag(){const t=task(),r=assess(t);if(!r.complete){alert('Заверши задание, затем нажми «Проверить».');return}state.diag.push(record(t,r));state.feedback=getNextFeedback();render()}
function nextDiag(){state.diagIndex++;state.feedback=null;state.attempts=0;state.hints=0;if(state.diagIndex===groups.diag.length){const weak=state.diag.filter(x=>!x.perfect).map(x=>LOOK[x.id].skill);state.plan=weak.length?weak.map(s=>({find:'t-find',repair:'t-repair',gender:'t-gender',agree:'t-agree'}[s])):['h-find'];state.stage='route'}render()}
function startTrain(){state.stage='train';state.trainIndex=0;state.feedback=null;state.hints=0;state.attempts=0;render()}
function addExtra(t,level){if(state.plan.length>=6)return;const id=({find:{analogy:'a-find',easy:'e-find'},repair:{analogy:'a-repair',easy:'e-repair'},gender:{analogy:'a-gender',easy:'e-gender'},agree:{analogy:'a-agree',easy:'e-agree'}}[t.skill]||{})[level];if(id&&!state.plan.includes(id))state.plan.splice(state.trainIndex+1,0,id)}
function checkTrain(){const t=task(),r=assess(t);if(!r.complete){alert('Заверши задание, затем нажми «Проверить».');return}state.attempts++;
 if(r.ok){state.train.push(record(t,r));if(state.hints||state.attempts>1)addExtra(t,'analogy');state.feedback={kind:'ok',text:'Верно! Переходи к следующему заданию.'};render();return}
 if(state.attempts===1){state.feedback={kind:'warn',text:'Есть ошибки. Можно воспользоваться подсказкой и попробовать ещё раз.'};render();return}
 state.train.push(record(t,r));addExtra(t,'easy');state.feedback={kind:'warn',text:'Некоторые ответы пока неверны. В маршрут добавлено более простое задание.'};render()
}
function checkFinal(){const t=task(),r=assess(t);if(!r.complete){alert('Заверши задание, затем нажми «Проверить».');return}state.final.push(record(t,r));state.feedback={kind:'ok',text:'Ответ сохранён.'};render()}
function advanceTrain(){state.trainIndex++;state.attempts=0;state.hints=0;state.feedback=null;if(state.trainIndex>=state.plan.length)state.stage='final';render()}
function advanceFinal(){state.finalIndex++;state.feedback=null;state.attempts=0;state.hints=0;if(state.finalIndex>=groups.final.length){state.stage='done';state.done=new Date().toISOString();addJournal({studentName:state.studentName||'',date:state.done,diag:`${state.diag.filter(x=>x.perfect).length}/3`,final:`${total(state.final)}/${maximum(state.final)}`,independent:state.train.filter(x=>x.perfect&&x.attempts===1&&x.hints===0).length,report:report()})}render()}
async function copyText(v){try{await navigator.clipboard.writeText(v)}catch(e){const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}alert('Скопировано.')}
function saveCSV(){const arr=journal();const rows=[['Ученик','Дата','Диагностика','Итог','Самостоятельно'],...arr.map((x,i)=>[x.studentName||'Работа №'+(i+1),new Date(x.date).toLocaleString('ru-RU'),x.diag,x.final,x.independent])];const csv=rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='несклоняемые_4_класс_результаты.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function action(act){if(act==='start'){const field=document.getElementById('student-name');const name=(field?.value||state.studentName||'').trim().replace(/\s+/g,' ');if(!name){alert('Введи имя, чтобы начать.');field?.focus();return}state.studentName=name;state.stage='diag';state.started=new Date().toISOString();render()}else if(act==='start-train')startTrain();else if(act==='check-diag')checkDiag();else if(act==='next-diag')nextDiag();else if(act==='check-train')checkTrain();else if(act==='next-train'){if(state.feedback?.kind==='warn'&&state.attempts===1){state.feedback=null;render()}else advanceTrain()}else if(act==='check-final')checkFinal();else if(act==='next-final')advanceFinal();else if(act==='hint'){state.hints++;render()}else if(act==='new'){if(confirm('Пройти задания заново?')){state=make();teacher=false;render()}}else if(act==='copy')copyText(report());else if(act==='csv')saveCSV();else if(act==='copy-journal')copyText(journal().map((x,i)=>`${x.studentName||'Работа №'+(i+1)}: диагностика ${x.diag}, итог ${x.final}, самостоятельно ${x.independent}`).join('\n'));else if(act==='back'){teacher=false;render()}}
el.addEventListener('input',e=>{if(e.target.id==='student-name'){state.studentName=e.target.value;persist()}});
el.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}if(teacher||!['diag','train','final'].includes(state.stage)||state.feedback)return;const t=task(),ans=initAnswer(t);const token=e.target.closest('[data-token]');if(token){const v=Number(token.dataset.token);ans.selected=ans.selected.includes(v)?ans.selected.filter(x=>x!==v):[...ans.selected,v];render();return}const row=e.target.closest('[data-row]');if(row){ans.rows[Number(row.dataset.row)]=row.dataset.val;render()}});
document.getElementById('teacher').addEventListener('click',()=>{teacher=!teacher;render()});render();
</script></body></html>
