3bb5;box-shadow:0 3px 0 #d9dff7}.btn.tertiary{background:#fff;color:#5143d8;border:1px solid #cfcef9;box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.question-prompt{font-size:18px;font-weight:800;line-height:1.4;margin:7px 0 15px}.story{background:#fff;border:1px solid #dce2f2;border-radius:13px;padding:16px 18px;margin:15px 0;line-height:1.75}.story p{margin:0}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:600 15px/1.45 'Segoe UI',Arial,sans-serif;color:#2a395a;background:#fff;border:1.5px solid #dde5f5;border-radius:13px;padding:13px 15px;cursor:pointer;min-height:55px;transition:background .15s,border .15s}.choice:hover,.token:hover,.order-piece:hover{border-color:#ac9cff;background:#f8f6ff}.choice .bubble{width:22px;height:22px;border:2px solid #b9c4e5;border-radius:50%;flex:none}.choice.selected{background:#eeeaff;border-color:#6854df;box-shadow:0 0 0 1px #6854df}.choice.selected .bubble{border:6px solid #6650dc;background:#fff}.tokens{display:grid;gap:10px}.token{width:100%;text-align:left;padding:12px 15px;background:#fff;border:1.5px solid #dce4f5;border-radius:12px;cursor:pointer;font:600 15px/1.5 'Segoe UI',Arial,sans-serif}.token.selected{border-color:#6e55e7;background:#edeaff}.token .chip-index{display:inline-grid;place-items:center;background:#eff2fa;border-radius:8px;width:27px;height:27px;color:#66738c;margin-right:10px;font-size:12px}.token.selected .chip-index{background:#6353e3;color:#fff}.match-table{display:grid;gap:12px}.match-row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:center;padding:13px;background:#fff;border:1px solid #e0e6f3;border-radius:12px}.match-row .left{font-weight:700;font-size:14px}.match-row select{width:100%;font:500 14px/1.4 'Segoe UI',Arial,sans-serif;border:1.5px solid #cfd9ed;border-radius:9px;color:#243553;background:#fff;padding:11px 10px;min-height:45px}.match-row select:focus{outline:2px solid #c4b w:auto}.row-buttons{display:flex;gap:7px;flex-wrap:wrap}.teacher-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.teacher-view{background:#fff;border:1px solid #e1e6f5;border-radius:15px;padding:20px;margin:14px 0}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.footer{text-align:center;color:#7b88a0;font-size:12px;margin:17px auto}.hidden{display:none!important}@media(max-width:640px){.shell{padding:0 9px;margin:8px auto 20px}.hero{padding:24px 21px;border-radius:22px 22px 0 0}.panel{padding:19px 15px 28px}.topbar{align-items:stretch}.stepper{width:100%;order:2;min-width:0}.step{font-size:10.5px;padding:9px 2px}.teacher-link{margin-left:auto}.rule-grid{grid-template-columns:1fr}.card{padding:15px}.match-row{grid-template-columns:1fr;gap:7px}.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 3px}.stat strong{font-size:21px}.actions .btn{width:100%}.hero h1{font-size:27px}.token,.choice{font-size:14px}.teacher-view{padding:12px}}

<body>
<div class="shell">
<header class="hero"><div class="eyebrow">ЯЗЫКОЗНАНИЕ · 3 КЛАСС</div><h1>Причина и следствие</h1><p>Читаем внимательно. Находим связь событий. Проверяем доказательства.</p></header>
<main class="panel">
<div class="topbar"><div class="stepper" id="stepper"><div class="step current">Правило</div><div class="step">Диагностика</div><div class="step">Маршрут</div><div class="step">Проверка</div></div><button type="button" class="teacher-link" id="teacherBtn">Учителю</button></div>
<div id="app"></div>
</main><div class="footer">Языкознание · 3 класс</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SK={cause:'Нахожу причину',effect:'Нахожу следствие',chain:'Строю цепочку событий',proof:'Проверяю доказательство'};
let phase='intro', student='', diagIndex=0,route=[],routeIndex=0,finalIndex=0,attempt=0,hintsUsed=0,selected=null,selectedMany=new Set(),matches={},ordered=[],taskStatus='',correctFirst=0,independentStreak=0,diagLog=[],routeLog=[],finalLog=[],current=null,reportOnly=false,challengeAdded=false;
const key='yazykoznanie3_cause_results_v1';
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const T=(id,skill,type,title,context,prompt,data,hints=[],explain='')=>({id,skill,type,title,context,prompt,...data,hints,explain});
// Every item has one unambiguous solution; the evidence is stated within its context.
const diagnosis=[
 T('d1','cause','choice','Почему испортился рисунок?','На перемене Даша случайно опрокинула бутылку с водой. Вода попала на рисунок, и краски расплылись.','Выбери событие, из-за которого краски расплылись.',{options:['На рисунок пролилась вода.','Началась перемена.','Даша рисовала цветы.','Бутылка стояла на парте.'],correct:'На рисунок пролилась вода.'}),
 T('d2','effect','choice','Что произошло в результате?','Перед уроком в кабинете открыли окно. Через несколько минут в классе стало прохладнее.','Что стало следствием открытого окна?',{options:['Окно было в кабинете.','В классе стало прохладнее.','Урок должен был начаться.','Ученики сидели за партами.'],correct:'В классе стало прохладнее.'}),
 T('d3','chain','order','Восстанови цепочку','На улице начался сильный дождь. Из-за этого тропинка стала скользкой, и ребята пошли медленнее.','Расположи события по порядку: от причины к последнему следствию.',{items:['Ребята пошли медленнее.','Начался сильный дождь.','Тропинка стала скользкой.'],correct:['Начался сильный дождь.','Тропинка стала скользкой.','Ребята пошли медленнее.']}),
 T('d4','proof','choice','Можно ли сделать такой вывод?','Утром на школьном дворе посадили клён. Вечером пошёл снег. Коля решил, что снег пошёл из-за посадки дерева.','Как следует оценить вывод Коли?',{options:['Вывод доказан: события произошли в один день.','Вывод не доказан: совпадение по времени ещё не означает причинную связь.','Вывод доказан: клён посадили раньше снегопада.','Вывод доказан: посадка дерева меняет погоду.'],correct:'Вывод не доказан: совпадение по времени ещё не означает причинную связь.'})
];
const core={
 cause:T('r-cause','cause','evidence','Найди причину','Петя поставил чашку на самый край стола. Проходя мимо, он задел её локтем. Чашка упала и разбилась. Папа помог убрать осколки.','Отметь предложение, в котором названо действие, непосредственно вызвавшее падение чашки.',{parts:['Петя поставил чашку на край стола.','Он задел чашку локтем.','Чашка упала и разбилась.','Папа помог убрать осколки.'],correct:[1]},['Найди действие, после которого чашка именно упала.','Отличай условие (чашка стояла близко к краю) от действия, вызвавшего падение.'],'К падению привело то, что Петя задел чашку локтем.'),
 effect:T('r-effect','effect','match','Соедини причину и следствие','','Выбери для каждой причины подходящее следствие.',{pairs:[['Рюкзак оставили открытым под дождём.','Книги в рюкзаке намокли.'],['Ребята забыли выключить фонарик на ночь.','К утру батарейки разрядились.'],['На холодное стекло подышали тёплым воздухом.','Стекло запотело.']]},['Сначала прочитай действие, затем подумай, что из-за него изменится.','Проверь, совпадает ли результат с причиной именно в этой строке.'],'У каждого события есть следствие, соответствующее условиям ситуации.'),
 chain:T('r-chain','chain','order','Цепочка событий','Из-за ночного мороза вода в лужах замёрзла. Утром на дорожке стало скользко, поэтому прохожие шли осторожнее.','Восстанови последовательность от причины к следствию.',{items:['Прохожие шли осторожнее.','Вода в лужах замёрзла.','Ночью ударил мороз.','На дорожке стало скользко.'],correct:['Ночью ударил мороз.','Вода в лужах замёрзла.','На дорожке стало скользко.','Прохожие шли осторожнее.']},['Начни с того, что вызвало первое изменение.','Каждый следующий шаг должен быть результатом предыдущего.'],'Мороз вызвал замерзание воды, а лёд на дорожке заставил прохожих идти осторожнее.'),
 proof:T('r-proof','proof','labels','Проверь утверждения','Перед началом экскурсии автобус задержался. Водитель сообщил учителю, что на дороге идёт ремонт. Автобус приехал к школе на двадцать минут позже. Пока ждали, дети рассматривали карту.','Для каждого утверждения выбери: подтверждено текстом или не доказано.',{claims:[['Автобус задержался из-за дорожных работ.','Подтверждено'],['Дети опоздали, потому что долго рассматривали карту.','Не доказано'],['Автобус прибыл позже запланированного времени.','Подтверждено']]},['Сравни каждое утверждение с сообщением водителя и описанием ожидания.','То, что дети смотрели карту во время ожидания, не объясняет задержку автобуса.'],'Причину задержки назвал водитель; связь с рассматриванием карты в тексте не подтверждена.')
};
const analogous={
 cause:T('a-cause','cause','choice','Похожая ситуация','Миша случайно наступил на шланг, по которому поливали грядку. Вода перестала течь из наконечника.','Из-за чего вода перестала течь?',{options:['Миша пережал шланг ногой.','Грядку поливали водой.','Наступило утро.','В огороде росли овощи.'],correct:'Миша пережал шланг ногой.'},['Найди действие, которое мешает воде проходить.'],'Пережатый шланг перекрыл поток воды.'),
 effect:T('a-effect','effect','choice','Что будет следствием?','Ветер распахнул незапертую калитку, поэтому она стукнулась о забор.','Какое событие — следствие порыва ветра?',{options:['Забор стоял у калитки.','Калитка стукнулась о забор.','Калитка была незапертой.','Наступил вечер.'],correct:'Калитка стукнулась о забор.'},['Ищи результат действия ветра.'],'Калитка ударилась о забор вследствие порыва ветра.'),
 chain:T('a-chain','chain','order','Три звена','Солнце нагрело снег на крыше. Снег начал таять. С крыши закапала вода.','Поставь события по порядку.',{items:['С крыши закапала вода.','Солнце нагрело снег.','Снег начал таять.'],correct:['Солнце нагрело снег.','Снег начал таять.','С крыши закапала вода.']},['Начни с первого изменения.'],'Нагревание привело к таянию снега, поэтому появилась капающая вода.'),
 proof:T('a-proof','proof','choice','Не путай события и причины','Маша надела красную куртку. Через час пошёл дождь. Маша сказала: «Дождь пошёл из-за моей куртки».','Почему такое объяснение нельзя считать доказанным?',{options:['Куртка была красной.','Маша надела куртку раньше дождя, но это не доказывает связи событий.','Дождь закончился через час.','Маша говорила очень уверенно.'],correct:'Маша надела куртку раньше дождя, но это не доказывает связи событий.'},['Подумай, достаточно ли того, что одно событие случилось раньше другого.'],'Очередность событий не доказывает причинную связь.')
};
const scaffold={
 cause:T('s-cause','cause','choice','Разберём по шагам','Мальчик уронил стакан с водой. Вода разлилась по столу.','Что случилось сначала — причина или следствие?',{options:['Стакан упал — причина.','Вода разлилась — причина.','Это два несвязанных события.'],correct:'Стакан упал — причина.'},['Падение стакана объясняет появление воды на столе.'],'Причина — стакан упал, следствие — вода разлилась.'),
 effect:T('s-effect','effect','choice','Разберём по шагам','Капли дождя попали на сухую скамейку. После этого скамейка стала мокрой.','Что изменилось из-за дождя?',{options:['Скамейка стала мокрой.','Скамейка стояла во дворе.','Началось утро.'],correct:'Скамейка стала мокрой.'},['Следствие — это результат события.'],'Следствие попадания капель — мокрая скамейка.'),
 chain:T('s-chain','chain','order','Разберём по шагам','Дул ветер. Листья упали с ветки на дорожку.','Поставь события по порядку.',{items:['Листья упали на дорожку.','Подул ветер.'],correct:['Подул ветер.','Листья упали на дорожку.']},['Начни с причины.'],'Сначала подул ветер, затем листья упали.'),

function record(){return {name:student,date:new Date().toLocaleString('ru-RU'),diagnosis:diagLog.filter(x=>x.correct).length,diagTotal:4,route:routeLog.length,independent:routeLog.filter(x=>x.first).length,hints:routeLog.reduce((n,x)=>n+(x.hints||0),0),final:finalLog.filter(x=>x.correct).length,finalTotal:finals.length,skills:diagLog.filter(x=>!x.correct).map(x=>SK[x.skill]).join('; ')||'Без затруднений'}}
function getSaved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}
function saveRecord(){try{let s=getSaved();s.push(record());localStorage.setItem(key,JSON.stringify(s.slice(-150)))}catch(e){console.warn('Result could not be saved locally',e)}}
function setStep(){const names=['intro','diag','train','final','result'];const n=phase==='result'?4:Math.max(0,names.indexOf(phase));document.querySelectorAll('.step').forEach((el,i)=>{el.className='step '+(i<n?'done':i===n?'current':'')})}
function app(html){$('app').innerHTML=html;setStep();window.scrollTo({top:0,behavior:'smooth'})}
function intro(){phase='intro';app(`<div class="minor">Короткая теория</div><h2>Как связаны события?</h2><div class="rule-grid"><div class="rule-card"><strong>Причина — почему?</strong><p>То, из-за чего произошло событие.</p></div><div class="rule-card"><strong>Следствие — что произошло?</strong><p>Результат действия или события.</p></div></div><div class="example"><b>Пример:</b> Подул сильный ветер <b>→</b> листья слетели с дерева.<br><b>Причина:</b> сильный ветер. <b>Следствие:</b> листья слетели.</div><div class="notice"><b>Проверь связь.</b> Если одно событие случилось после другого, это ещё не значит, что первое стало причиной второго.</div><div class="card"><h3>Начнём</h3><label class="label" for="student">Твоё имя</label><input class="field" id="student" maxlength="55" autocomplete="given-name" placeholder="Введи своё имя" value="${escapeHtml(student)}"><div class="actions right"><button class="btn" id="start">Начать диагностику</button></div><p class="mininote" id="introWarn" role="status"></p></div>`);$('start').onclick=()=>{const v=$('student').value.trim().replace(/\s+/g,' ');if(!v){$('introWarn').textContent='Введи имя, чтобы начать.';$('student').focus();return;}student=v;phase='diag';renderQuestion()}}
function idxInfo(){if(phase==='diag')return [diagIndex+1,diagnosis.length,'ДИАГНОСТИКА'];if(phase==='train')return [routeIndex+1,route.length,'ИНДИВИДУАЛЬНЫЙ МАРШРУТ'];return [finalIndex+1,finals.length,'ИТОГОВАЯ ПРОВЕРКА']}
const valueOrder=(xs,correct)=>{let b=shuffle(xs); if(b.join('|')===correct.join('|'))b.reverse();return b};
function displayTask(t){current=t;selected=null;selectedMany=new Set();matches={};ordered=[];attempt=0;hintsUsed=0;taskStatus='';current._options=t.type==='choice'?shuffle(t.options):[];current._items=t.type==='order'?valueOrder(t.items,t.correct):[];current._effects=t.type==='match'?shuffle(t.pairs.map(x=>x[1])):[];current._partOrder=t.type==='evidence'?shuffle([...t.parts.keys()]):[];current._claimOrder=t.type==='labels'?shuffle([...t.claims.keys()]):[];renderTask()}
function renderQuestion(){if(phase==='diag'){if(diagIndex>=diagnosis.length){startRoute();return}displayTask(diagnosis[diagIndex])}else if(phase==='train'){if(routeIndex>=route.length){phase='final';renderQuestion();return}displayTask(route[routeIndex])}else if(phase==='final'){if(finalIndex>=finals.length){finish();return}displayTask(finals[finalIndex])}}
function renderTask(){const t=current,[num,total,label]=idxInfo(),pct=Math.round((num-1)/total*100);let body='';
 if(t.type==='choice')body=`<div class="choices">${t._options.map((v,i)=>`<button class="choice${selected===v?' selected':''}" type="button" data-ch="${i}" aria-pressed="${selected===v}"><span class="bubble"></span><span>${escapeHtml(v)}</span></button>`).join('')}</div>`;
 if(t.type==='evidence')body=`<div class="tokens">${t._partOrder.map((i,j)=>`<button type="button" class="token${selectedMany.has(i)?' selected':''}" data-ev="${i}" aria-pressed="${selectedMany.has(i)}"><span class="chip-index">${j+1}</span>${escapeHtml(t.parts[i])}</button>`).join('')}</div><div class="mininote">Можно выбрать несколько фрагментов.</div>`;

 if(t.type==='order')body=`<div class="small muted" style="margin-bottom:7px">Выбранный порядок (нажми на строку, чтобы вернуть её):</div><div class="order-picked">${ordered.length?ordered.map((v,i)=>`<button type="button" class="order-slot" data-undo="${i}"><span class="number">${i+1}</span><span>${escapeHtml(v)}</span></button>`).join(''):'<div class="mininote">Нажимай на события в нужной последовательности.</div>'}</div><div class="order-bank">${t._items.filter(x=>!ordered.includes(x)).map((v,i)=>`<button type="button" class="order-piece" data-order="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}</div>`;
 const hintAllowed=phase==='train',note=phase==='diag'?'':phase==='final'?'':'Внимательно проверь связь событий.';
 let feedback=''; if(taskStatus==='wrong')feedback=`<div class="feedback bad"><strong>Проверь ещё раз.</strong>${escapeHtml(t.hints[Math.min(hintsUsed-1,t.hints.length-1)]||'Сравни текст и свой ответ. События должны быть связаны по смыслу.')}</div>`;if(taskStatus==='right')feedback=`<div class="feedback good"><strong>Верно!</strong>${escapeHtml(t.explain||'Ты нашёл причинно-следственную связь.')}</div>`;
 app(`<div class="progress-caption"><div class="minor">${label} · ${num} ИЗ ${total} · ${escapeHtml(SK[t.skill])}</div><div class="small muted">${pct}%</div></div><div class="meter"><span style="width:${pct}%"></span></div><div class="card"><h2 style="font-size:23px;margin:0 0 7px">${escapeHtml(t.title)}</h2>${t.context?`<div class="story">${escapeHtml(t.context)}</div>`:''}<div class="question-prompt">${escapeHtml(t.prompt)}</div>${body}${feedback}<p id="validation" class="mininote" role="status"></p></div><div class="actions">${hintAllowed&&taskStatus!=='right'?`<button class="btn secondary" id="hint">Подсказка</button>`:'<span></span>'}<button class="btn" id="check">${taskStatus==='right'?'Следующее задание':'Проверить'}</button></div>${note?`<p class="mininote">${note}</p>`:''}`);
 document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{if(taskStatus==='right')return;selected=t._options[Number(b.dataset.ch)];refreshSelections()});
 document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{if(taskStatus==='right')return;let i=Number(b.dataset.ev);selectedMany.has(i)?selectedMany.delete(i):selectedMany.add(i);refreshSelections()});
 document.querySelectorAll('[data-match]').forEach(s=>s.onchange=()=>{matches[s.dataset.match]=s.value});
 document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(taskStatus==='right')return;ordered.push(b.dataset.order);renderTask()});
 document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(taskStatus==='right')return;ordered.splice(Number(b.dataset.undo),1);renderTask()});

}
function refreshSelections(){document.querySelectorAll('[data-ch]').forEach(b=>{const sel=current._options[Number(b.dataset.ch)]===selected;b.classList.toggle('selected',sel);b.setAttribute('aria-pressed',String(sel))});document.querySelectorAll('[data-ev]').forEach(b=>{const sel=selectedMany.has(Number(b.dataset.ev));b.classList.toggle('selected',sel);b.setAttribute('aria-pressed',String(sel))})}
function showHint(){if(phase!=='train'||taskStatus==='right')return;hintsUsed++;taskStatus='wrong';renderTask()}
function fullyAnswered(t){return t.type==='choice'?selected!==null:t.type==='evidence'?selectedMany.size>0:t.type==='order'?ordered.length===t.correct.length:(t.type==='match'?t.pairs:t.claims).every((_,i)=>Boolean(matches[i]))}
function isCorrect(t){if(t.type==='choice')return selected===t.correct;if(t.type==='evidence')return selectedMany.size===t.correct.length&&t.correct.every(i=>selectedMany.has(i));if(t.type==='order')return ordered.length===t.correct.length&&ordered.every((x,i)=>x===t.correct[i]);if(t.type==='match')return t.pairs.every((x,i)=>matches[i]===x[1]);if(t.type==='labels')return t.claims.every((x,i)=>matches[i]===x[1]);return false}
function check(){if(taskStatus==='right'){advance();return}if(!fullyAnswered(current)){$('validation').textContent='Сначала выполни все части задания.';return}const good=isCorrect(current);
 if(phase==='diag'){diagLog.push({id:current.id,skill:current.skill,correct:good});diagIndex++;renderQuestion();return}
 if(phase==='final'){finalLog.push({id:current.id,skill:current.skill,correct:good});finalIndex++;renderQuestion();return}
 attempt++;if(good){taskStatus='right';const first=attempt===1&&hintsUsed===0;routeLog.push({id:current.id,skill:current.skill,first,attempts:attempt,hints:hintsUsed,correct:true});if(first){correctFirst++;independentStreak++}else {independentStreak=0;if(!current.id.startsWith('a-')&&!current.id.startsWith('s-')&&route.length<7&&!route.some(x=>x.id===analogous[current.skill].id))route.splice(routeIndex+1,0,analogous[current.skill]);}
 if(independentStreak>=2&&!challengeAdded&&route.length<7){challengeAdded=true;const other=hard.find(x=>!route.some(y=>y.id===x.id)&&x.skill!==current.skill);if(other)route.push(other)}renderTask();return}
 taskStatus='wrong';independentStreak=0;if(attempt===1){hintsUsed++;renderTask();return}if(attempt>=2){routeLog.push({id:current.id,skill:current.skill,first:false,attempts:attempt,hints:hintsUsed,correct:false});if(!current.id.startsWith('s-')&&route.length<7&&!route.some(x=>x.id===scaffold[current.skill].id)){route.splice(routeIndex+1,0,scaffold[current.skill]);if(!route.some(x=>x.id===analogous[current.skill].id)&&route.length<7)route.splice(routeIndex+2,0,analogous[current.skill])}routeIndex++;renderQuestion();return}}
function advance(){if(phase==='train')routeIndex++;renderQuestion()}
function startRoute(){const weak=diagLog.filter(x=>!x.correct).map(x=>x.skill);route=weak.map(k=>core[k]);const strongest=hard.filter(t=>!weak.includes(t.skill));if(!weak.length)route=shuffle(hard).slice(0,3);else {const candidate=shuffle(strongest);while(route.length<Math.min(4,weak.length+2)&&candidate.length)route.push(candidate.pop())}route=route.slice(0,6);routeIndex=0;phase='train';challengeAdded=false;renderQuestion()}
function finish(){phase='result';saveRecord();const r=record();const pct=Math.round(r.final/r.finalTotal*100);const skills=r.skills==='Без затруднений'?'Все диагностические задания выполнены правильно.':`Для тренировки были выбраны умения: ${escapeHtml(r.skills)}.`;
 app(`<div class="minor">Работа завершена</div><h2>Результат: ${escapeHtml(student)}</h2><div class="stats"><div class="stat"><strong>${r.diagnosis}/${r.diagTotal}</strong><span>Диагностика</span></div><div class="stat"><strong>${r.final}/${r.finalTotal}</strong><span>Итог</span></div><div class="stat"><strong>${r.independent}</strong><span>Самостоятельно в маршруте</span></div></div><div class="report-summary"><h3>${pct===100?'Все итоговые задания выполнены верно!':pct>=75?'Большинство связей определено верно.':'Есть умения, которые стоит потренировать ещё.'}</h3><p>${skills}</p><p>Заданий в тренировке: <b>${r.route}</b>. Подсказок использовано: <b>${r.hints}</b>.</p><p>Чтобы проверить объяснение, задавай два вопроса: <b>«Почему это произошло?»</b> и <b>«Что подтверждает мой вывод?»</b></p></div><div class="actions"><button class="btn tertiary" id="copy">Скопировать результат</button><button class="btn" id="again">Пройти ещё раз</button></div><div class="mininote" id="copyState" role="status"></div>`);
 $('again').onclick=()=>{reset();intro()};$('copy').onclick=()=>copyText(formatResult(r),'copyState')}
function reset(){phase='intro';student='';diagIndex=0;routeIndex=0;finalIndex=0;route=[];attempt=0;hintsUsed=0;correctFirst=0;independentStreak=0;diagLog=[];routeLog=[];finalLog=[];challengeAdded=false}
function formatResult(r){return `Языкознание, 3 класс — Причина и следствие\nУченик: ${r.name}\nДата: ${r.date}\nДиагностика: ${r.diagnosis}/${r.diagTotal}\nТренировка: ${r.route} заданий, самостоятельно — ${r.independent}, подсказок — ${r.hints}\nИтог: ${r.final}/${r.finalTotal}\nЗатруднения: ${r.skills}`}
function copyText(s,id){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>$(id).textContent='Результат скопирован.').catch(()=>manualCopy(s,id))}else manualCopy(s,id)}
function manualCopy(s,id){const a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();$(id).textContent=ok?'Результат скопирован.':'Не удалось скопировать автоматически.'}
function teacher(){reportOnly=true;const list=getSaved();const rows=list.map((r,i)=>`<tr><td>${escapeHtml(r.name||'Без имени')}</td><td>${escapeHtml(r.date||'')}</td><td>${r.diagnosis}/${r.diagTotal}</td><td>${r.final}/${r.finalTotal}</td><td>${r.independent??0}</td><td>${r.hints??0}</td></tr>`).join('');const content=`<div class="minor">Для учителя</div><h2>Журнал выполненных работ</h2><p class="muted small">Здесь показаны результаты, сохранённые в этом браузере. Для передачи результатов с других устройств используйте «Скопировать результат» на итоговом экране или подключите платформу с общим журналом.</p><div class="teacher-view"><h3>Работы: ${list.length}</h3>${list.length?`<div class="teacher-table-wrapper"><table class="teacher-table"><thead><tr><th>Ученик</th><th>Дата</th><th>Диагн.</th><th>Итог</th><th>Самост.</th><th>Подсказки</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">На этом устройстве ещё нет завершённых работ.</p>'}<div class="teacher-actions"><button class="btn secondary" id="csv" ${list.length?'':'disabled'}>Скачать CSV</button><button class="btn tertiary" id="back">Вернуться к заданию</button></div></div>`;
 $('app').dataset.cached=$('app').innerHTML; $('stepper').classList.add('hidden');app(content);$('back').onclick=()=>{reportOnly=false;$('stepper').classList.remove('hidden');if(phase==='intro')intro();else if(phase==='result')finishView();else renderTask()};if($('csv'))$('csv').onclick=()=>downloadCsv(list)}
function finishView(){const rows=getSaved().filter(r=>r.name===student);const last=rows[rows.length-1];if(last){const previous=last;app(`<div class="minor">Работа завершена</div><h2>Результат: ${escapeHtml(student)}</h2><div class="stats"><div class="stat"><strong>${previous.diagnosis}/${previous.diagTotal}</strong><span>Диагностика</span></div><div class="stat"><strong>${previous.final}/${previous.finalTotal}</strong><span>Итог</span></div><div class="stat"><strong>${previous.independent}</strong><span>Самостоятельно</span></div></div><div class="actions"><button class="btn tertiary" id="copy">Скопировать результат</button><button class="btn" id="again">Пройти ещё раз</button></div><div id="copyState" class="mininote"></div>`);$('copy').onclick=()=>copyText(formatResult(previous),'copyState');$('again').onclick=()=>{reset();intro()}}else intro()}
function downloadCsv(rows){const headers=['Имя','Дата','Диагностика','Всего в диагностике','Тренировка','Самостоятельно','Подсказки','Итог','Всего итог','Затруднения'];const vals=rows.map(x=>[x.name,x.date,x.diagnosis,x.diagTotal,x.route,x.independent,x.hints,x.final,x.finalTotal,x.skills]);const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const s='\uFEFF'+[headers,...vals].map(r=>r.map(q).join(';')).join('\r\n');const b=new Blob([s],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yazykoznanie_3_prichina_sledstvie.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('teacherBtn').onclick=()=>{if(reportOnly)return;teacher()};
intro();
</script>
</body>
</html>
