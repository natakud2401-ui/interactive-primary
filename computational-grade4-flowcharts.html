<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8fafc">
<title>Мастерская блок-схем — вычислительное мышление, 4 класс</title>
<style>
:root{--ink:#172c46;--muted:#63748a;--line:#d9e2ec;--bg:#f4f7fa;--paper:#fff;--blue:#2166b4;--blue-light:#eaf2fd;--green:#18784a;--green-light:#e9f7ef;--warning:#924810;--warning-light:#fff3e3;--danger:#ae3434;--danger-light:#fff0f0;--radius:15px}
*{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);scroll-behavior:smooth}body{margin:0;padding:24px 12px 60px;line-height:1.5}main{max-width:780px;margin:auto}.shell{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(21,45,71,.06)}.head{display:flex;justify-content:space-between;align-items:start;gap:20px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;color:var(--muted)}h1{font-size:25px;line-height:1.2;margin:5px 0 8px}h2{font-size:21px;line-height:1.25;margin:3px 0 15px}h3{font-size:17px;line-height:1.3;margin:10px 0}p{margin:9px 0 14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.topicon{font-size:35px;line-height:1}.progress{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:21px}.progress-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 12px}.steps{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}.dot{min-height:35px;padding:0;background:#e7edf4;border:0;border-radius:8px;color:var(--muted);font-size:13px;font-weight:650}.dot.current{background:#dceafb;color:#154d92;border:2px solid #a8c8ee}.dot.complete{background:var(--green-light);color:var(--green)}.dot:focus-visible,.btn:focus-visible,.choice:focus-within{outline:3px solid #83ade3;outline-offset:2px}.stage{padding:2px 3px 5px}.subtle{font-size:13px;color:var(--muted)}.theory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:19px 0}.theory .shape{border:1px solid var(--line);border-radius:12px;padding:12px 7px 10px;text-align:center;min-width:0}.shape svg{width:100%;height:67px;display:block}.shape strong{display:block;font-size:14px}.shape .subtle{display:block;line-height:1.3;font-size:12px}.question{margin:20px 0;border-top:1px solid var(--line);padding-top:17px}.question:first-of-type{border-top:0}.question-title{font-weight:650;margin:0 0 10px}.choice{border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:10px;padding:11px 13px;margin:8px 0;cursor:pointer;min-height:45px;background:white}.choice:hover{border-color:#aabed6;background:#fbfdff}.choice:has(input:checked){border-color:#6c9dd3;background:var(--blue-light)}.choice input{accent-color:var(--blue);flex:0 0 auto}.box{background:#f6f8fb;border:1px solid #e3e9f1;border-radius:13px;padding:16px;margin:15px 0}.box.white{background:white}.msg{border-radius:11px;padding:12px 14px;margin:16px 0;line-height:1.5}.msg.ok{background:var(--green-light);color:#145f3b;border:1px solid #bde4ce}.msg.hint{background:var(--warning-light);color:#78400e;border:1px solid #f4d2a5}.msg.error{background:var(--danger-light);color:var(--danger);border:1px solid #f1cece}.msg strong{display:block;margin-bottom:3px}.btn{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:11px;padding:11px 18px;font-weight:650;min-height:44px}.btn.secondary{background:white;border-color:#b6c7d8;color:var(--ink)}.btn.ghost{background:transparent;border-color:transparent;color:#46627d}.btn.small{padding:6px 11px;min-height:36px;font-size:13px}.btn.full{width:100%;margin-top:10px}.btn:hover:not(:disabled){filter:brightness(.96)}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}.bottom{border-top:1px solid var(--line);margin-top:24px;padding-top:19px;display:flex;justify-content:space-between;align-items:center;gap:12px}.bottom .subtle{max-width:52%}.badge{background:#edf4fd;border-radius:99px;padding:5px 11px;color:#275a91;font-size:12px;font-weight:700;white-space:nowrap}.flexline{display:flex;justify-content:space-between;align-items:center;gap:12px}.diagram-wrap{padding:13px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;margin:15px auto;overflow-x:auto}.diagram-wrap .svg-center{max-width:600px;margin:auto}.diagram{display:block;width:100%;height:auto;max-width:100%;color:var(--ink);overflow:visible}.diagram .stroke{stroke:#2b4057;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}.diagram text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#1a304d;text-anchor:middle;font-size:17px}.diagram .smalltxt{font-size:14px}.diagram .arrow{fill:#2b4057}.diagram .filled{fill:white}.diagram .placeholder{fill:#fefaf0}.diagram-title{font-size:12px;text-align:center;color:var(--muted);font-weight:600;margin-bottom:5px}.items{display:flex;flex-direction:column;gap:8px}.pick{background:white;border:1px solid var(--line);border-radius:11px;padding:9px 11px;text-align:left;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}.pick.selected{background:#f0f3f7;color:var(--muted)}.sample-shape{border:2px solid #2b4057;text-align:center;min-width:165px;max-width:230px;padding:10px 13px;font-size:14px;font-weight:600;line-height:1.3;background:white}.sample-shape.oval{border-radius:100px}.sample-shape.rect{border-radius:2px}.builder{display:flex;flex-direction:column;align-items:center;gap:5px;margin:10px auto}.builder .sample-shape{width:min(80%,290px)}.builder .down{font-size:20px;color:var(--blue);font-weight:700}.builder-holder{min-height:80px}.field{display:block;margin:16px 0}.field label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}.field select,.field input,.field textarea{width:100%;min-height:44px;border:1px solid #bfcddc;border-radius:10px;padding:9px 12px;background:white;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #92b8e8;border-color:#3e80c6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorebig{font-size:36px;font-weight:800;margin:3px 0}.checkrow{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.checkrow input{margin-top:5px;accent-color:var(--blue)}.small-status{display:flex;gap:8px;align-items:center}.small-status .mark{font-weight:800}.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:13px}.final-line{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.copy-note{font-size:12px;color:var(--muted);margin:3px 0}
@media (max-width:600px){body{padding:0 0 40px}.shell{padding:14px;border-radius:0;border-left:0;border-right:0}.progress{padding:13px}.theory{gap:6px}.theory .shape{padding:7px 3px}.shape strong{font-size:12px}.shape .subtle{font-size:11px}.grid2{grid-template-columns:1fr}.sample-shape{min-width:125px}.head h1{font-size:21px}h2{font-size:19px}.dot{min-height:33px}.diagram-wrap{padding:8px 3px}.diagram text{font-size:17px}}@media print{body{background:white;padding:0}.shell{border:0;box-shadow:none}.progress,.bottom,.btn{display:none!important}}
</style>
</head>
<body>
<main class="shell">
  <div class="progress">
    <div class="head"><div><div class="eyebrow">ВЫЧИСЛИТЕЛЬНОЕ МЫШЛЕНИЕ · 4 КЛАСС</div><h1>Мастерская блок-схем</h1></div><div class="topicon" aria-hidden="true">◇</div></div>
    <div class="progress-row"><span id="stage-indicator"></span><span id="completed-indicator"></span></div>
    <nav id="step-nav" class="steps" aria-label="Этапы тренажёра"></nav>
  </div>
  <section id="stage-content" class="stage" aria-live="polite"></section>
  <div id="stage-bottom" class="bottom"></div>
  <div class="footer">Прогресс сохраняется в этом браузере. Для нового прохождения используйте «Начать заново».</div>
</main>
<script>
(()=>{'use strict';
const KEY='blok-shemy-4-klass-v3';
const NAMES=['Проверка знаний','Индивидуальная тренировка','Собери последовательность','Блок-схема с условием','Поиск ошибки','Два условия','Проверка алгоритма','Схема для доставки','Собственная блок-схема'];
const init=()=>({step:0,diag:['','',''],diagDone:false,train:'',trainAttempts:0,trainDone:false,scaffold:'',scaffoldDone:false,analog:'',analogAttempts:0,analogDone:false,linear:[],linearAttempts:0,linearDone:false,branch:['','','',''],branchAttempts:0,branchDone:false,debug:'',debugAttempts:0,debugDone:false,dual:['','','','','','',''],dualAttempts:0,dualDone:false,tests:['','',''],testsAttempts:0,testsDone:false,design:['','','','',''],designAttempts:0,designDone:false,own:['','',''],ownChecks:[false,false,false],ownDone:false});
let S=init();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){S={...S,...saved};S.step=Math.min(8,Math.max(0,Number(S.step)||0));}}catch(e){}
const diagAnswers=['rect','diamond','no'];
const score=()=>S.diag.filter((v,i)=>v===diagAnswers[i]).length;
const level=()=>score()===3?'advanced':score()===2?'standard':'support';
const LEVELS={
 support:{name:'Базовый',question:'В какой фигуре нужно записать вопрос «Число больше 10?»',choices:[['oval','Овал'],['rect','Прямоугольник'],['diamond','Ромб']],answer:'diamond',hint:'Вопрос предполагает два ответа: «Да» или «Нет».',scaffold:'В какой фигуре обозначают начало алгоритма?',scaffoldChoices:[['oval','Овал'],['diamond','Ромб']],scaffoldAnswer:'oval',analog:'В какой фигуре записывают действие «Прибавь 4»?',analogChoices:[['oval','Овал'],['rect','Прямоугольник'],['diamond','Ромб']],analogAnswer:'rect'},
 standard:{name:'Основной',question:'Начальное число — 4. Если оно больше 5, прибавь 2. Если нет — прибавь 3. Какое число получится?',choices:[['6','6'],['7','7'],['9','9']],answer:'7',hint:'Проверь условие: действительно ли 4 больше 5? Потом выбери соответствующую ветку.',scaffold:'Верно ли утверждение «4 больше 5»?',scaffoldChoices:[['yes','Да'],['no','Нет']],scaffoldAnswer:'no',analog:'Теперь начальное число — 8. Условие и действия те же. Какой результат?',analogChoices:[['10','10'],['11','11'],['6','6']],analogAnswer:'10'},
 advanced:{name:'Исследовательский',question:'Начальное число — 8. Выполни блок-схему с двумя проверками. Какой результат получится?',choices:[['3','3'],['5','5'],['6','6'],['10','10']],answer:'6',hint:'При первом условии выбери ветку «Да». Полученное число проверь на чётность.',scaffold:'После первого действия получилось число 5. Оно чётное?',scaffoldChoices:[['yes','Да'],['no','Нет']],scaffoldAnswer:'no',analog:'Выполни тот же алгоритм с начальным числом 9. Какой результат?',analogChoices:[['3','3'],['6','6'],['7','7']],analogAnswer:'3'}
};
const passTrain=()=>S.trainDone&&(S.trainAttempts===0||S.analogDone);
const stages=()=>[S.diagDone,passTrain(),S.linearDone,S.branchDone,S.debugDone,S.dualDone,S.testsDone,S.designDone,S.ownDone];
const nextAllowed=()=>stages()[S.step];
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const num=v=>String(v).trim()!==''&&Number.isFinite(Number(v))?Number(v):NaN;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function btn(text,action,disabled=false,more=''){return `<button type="button" class="btn ${more}" data-act="${action}" ${disabled?'disabled':''}>${text}</button>`;}
function message(kind,title,body=''){return `<div class="msg ${kind}" role="status"><strong>${title}</strong>${body?`<div>${body}</div>`:''}</div>`;}
function choices(field,options,value,disabled=false){return `<div role="group">${options.map(([id,label],i)=>`<label class="choice"><input type="radio" name="${field}" data-field="${field}" value="${esc(id)}" ${id===value?'checked':''} ${disabled?'disabled':''}><span>${esc(label)}</span></label>`).join('')}</div>`;}
function select(field,label,options,value,disabled=false){return `<div class="field"><label for="${field}">${label}</label><select id="${field}" data-field="${field}" ${disabled?'disabled':''}><option value="">Выбери вариант</option>${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
function input(field,label,value,disabled=false,type='number',placeholder='Результат'){return `<div class="field"><label for="${field}">${label}</label><input id="${field}" data-field="${field}" type="${type}" ${type==='number'?'inputmode="numeric"':''} placeholder="${esc(placeholder)}" autocomplete="off" value="${esc(value)}" ${disabled?'disabled':''}></div>`;}
function checkList(field,lines,values,disabled=false){return lines.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-field="${field}" data-index="${i}" ${values[i]?'checked':''} ${disabled?'disabled':''}><span>${x}</span></label>`).join('');}
function diagram(inner,viewBox='0 0 520 450',label='Блок-схема'){return `<div class="diagram-wrap"><div class="svg-center"><svg class="diagram" viewBox="${viewBox}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg></div></div>`;}
const arrow=(x,y)=>`<path class="arrow" d="M${x-5} ${y-10} L${x+5} ${y-10} L${x} ${y} Z"/>`;
function branchSvg({start='НАЧАЛО',init='n = 7',condition='Условие?',yes='Действие?',no='Действие?',end='КОНЕЦ',shape='diamond'}={}){
 const polygon=shape==='diamond'?'<polygon class="stroke filled" points="260,148 360,197 260,246 160,197"/>':shape==='oval'?'<ellipse class="stroke filled" cx="260" cy="197" rx="100" ry="47"/>':'<rect class="stroke filled" x="160" y="150" width="200" height="94"/>';
 return diagram(`<g class="stroke"><ellipse class="filled" cx="260" cy="26" rx="79" ry="22"/><path d="M260 48 V78"/><rect class="filled" x="193" y="78" width="134" height="46"/><path d="M260 124 V148"/>${polygon}<path d="M160 197 H98 V270 M360 197 H422 V270"/><rect class="filled" x="5" y="270" width="186" height="51"/><rect class="filled" x="329" y="270" width="186" height="51"/><path d="M98 321 V359 H260 M422 321 V359 H260 V388"/><ellipse class="filled" cx="260" cy="414" rx="79" ry="22"/></g>
 <g class="arrow">${arrow(260,78)}${arrow(260,148)}${arrow(98,270)}${arrow(422,270)}${arrow(260,388)}</g>
 <g><text x="260" y="32">${esc(start)}</text><text x="260" y="106">${esc(init)}</text><text x="260" y="202" class="${condition.length>17?'smalltxt':''}">${esc(condition.slice(0,29))}</text><text x="102" y="184">Да</text><text x="418" y="184">Нет</text><text x="98" y="300" class="${yes.length>16?'smalltxt':''}">${esc(yes.slice(0,22))}</text><text x="422" y="300" class="${no.length>16?'smalltxt':''}">${esc(no.slice(0,22))}</text><text x="260" y="420">${esc(end)}</text></g>`,'0 0 520 442','Блок-схема с условием, двумя ветками и объединением');
}
function dualSvg(t,init='n = 8'){
 return diagram(`<g class="stroke"><ellipse class="filled" cx="260" cy="29" rx="78" ry="22"/><path d="M260 51 V86"/><rect class="filled" x="198" y="86" width="124" height="46"/><path d="M260 132 V160"/><polygon class="filled" points="260,160 349,220 260,280 171,220"/><path d="M171 220 H120 V308 M349 220 H400 V308"/><rect class="filled" x="26" y="308" width="190" height="53"/><rect class="filled" x="304" y="308" width="190" height="53"/><path d="M121 361 V392 H260 M399 361 V392 H260 V419"/><polygon class="filled" points="260,419 349,475 260,531 171,475"/><path d="M171 475 H120 V549 M349 475 H400 V549"/><rect class="filled" x="26" y="549" width="190" height="49"/><rect class="filled" x="304" y="549" width="190" height="49"/><path d="M121 598 V624 H260 M399 598 V624 H260 V635"/><ellipse class="filled" cx="260" cy="662" rx="78" ry="23"/></g>
 <g class="arrow">${arrow(260,86)}${arrow(260,160)}${arrow(120,308)}${arrow(400,308)}${arrow(260,419)}${arrow(120,549)}${arrow(400,549)}${arrow(260,635)}</g>
 <g><text x="260" y="35">НАЧАЛО</text><text x="260" y="114">${esc(init)}</text><text x="260" y="225" class="${t[0].length>14?'smalltxt':''}">${esc(t[0])}</text><text x="120" y="206">Да</text><text x="400" y="206">Нет</text><text x="121" y="341" class="${t[1].length>14?'smalltxt':''}">${esc(t[1])}</text><text x="399" y="341" class="${t[2].length>14?'smalltxt':''}">${esc(t[2])}</text><text x="260" y="480" class="${t[3].length>14?'smalltxt':''}">${esc(t[3])}</text><text x="120" y="463">Да</text><text x="400" y="463">Нет</text><text x="121" y="581" class="${t[4].length>14?'smalltxt':''}">${esc(t[4])}</text><text x="399" y="581" class="${t[5].length>14?'smalltxt':''}">${esc(t[5])}</text><text x="260" y="668">КОНЕЦ</text></g>`,'0 0 520 690','Блок-схема: два условия, две пары веток и объединение стрелок');
}
function theory(){return `<h2>1. Узнай, как устроена блок-схема</h2><p><b>Алгоритм</b> — последовательность точных команд для решения задачи. Алгоритм можно записать словами, списком шагов или с помощью блок-схемы.</p>
 <div class="theory">
  <div class="shape"><svg viewBox="0 0 120 66"><ellipse cx="60" cy="33" rx="54" ry="25" fill="none" stroke="#2b4057" stroke-width="2"/><text x="60" y="38" fill="#1a304d" font-size="12" font-weight="700" text-anchor="middle">НАЧАЛО</text></svg><strong>Овал</strong><span class="subtle">Начало и конец</span></div>
  <div class="shape"><svg viewBox="0 0 120 66"><rect x="7" y="9" width="106" height="48" fill="none" stroke="#2b4057" stroke-width="2"/><text x="60" y="38" fill="#1a304d" font-size="15" text-anchor="middle">+ 5</text></svg><strong>Прямоугольник</strong><span class="subtle">Действие</span></div>
  <div class="shape"><svg viewBox="0 0 120 66"><polygon points="60,3 117,33 60,63 3,33" fill="none" stroke="#2b4057" stroke-width="2"/><text x="60" y="38" fill="#1a304d" font-size="12" text-anchor="middle">Да/Нет?</text></svg><strong>Ромб</strong><span class="subtle">Условие</span></div>
 </div><p><b>Стрелки</b> указывают, какую команду выполнять следующей. Если в ромбе записан вопрос, нужно выбрать стрелку «Да» или «Нет».</p>
 <h3>Небольшая проверка</h3>
 <div class="question"><p class="question-title">1. В какой фигуре записывают команду «Умножь число на 2»?</p>${choices('diag.0',[['oval','Овал'],['rect','Прямоугольник'],['diamond','Ромб']],S.diag[0],S.diagDone)}</div>
 <div class="question"><p class="question-title">2. В какой фигуре записывают вопрос «Число чётное?»?</p>${choices('diag.1',[['oval','Овал'],['rect','Прямоугольник'],['diamond','Ромб']],S.diag[1],S.diagDone)}</div>
 <div class="question"><p class="question-title">3. Какую стрелку выбрать, если условие в ромбе не выполняется?</p>${choices('diag.2',[['yes','«Да»'],['no','«Нет»'],['stop','Нужно сразу остановиться']],S.diag[2],S.diagDone)}</div>
 ${S.diagDone?message('ok','Проверка завершена',`Правильных ответов: <b>${score()} из 3</b>. Твой маршрут — <b>${LEVELS[level()].name}</b>.`):btn('Проверить знания','finish-diag',S.diag.some(x=>!x),'full')}`;
}
function training(){const p=LEVELS[level()];let out=`<div class="flexline"><h2>2. Индивидуальная тренировка</h2><span class="badge">${p.name}</span></div>`;
 if(!S.trainDone){out+=`<p class="question-title">${p.question}</p>`;
  if(level()==='advanced')out+=dualSvg(['n > 5?','n = n − 3','n = n + 3','n чётное?','n = n : 2','n = n + 1']);
  if(level()==='standard')out+=branchSvg({init:'n = 4',condition:'n > 5?',yes:'n = n + 2',no:'n = n + 3'});
  if(S.trainAttempts>=2&&!S.scaffoldDone){out+=`<div class="box"><h3>Разберись с одним шагом</h3><p>${p.scaffold}</p>${choices('scaffold',p.scaffoldChoices,S.scaffold)}${btn('Проверить шаг','check-scaffold',!S.scaffold,'full')}</div>`}
  else {out+=choices('train',p.choices,S.train);if(S.trainAttempts>0)out+=message('hint','Подсказка',p.hint);out+=btn('Проверить ответ','check-train',!S.train,'full')}
 } else if(S.trainAttempts>0&&!S.analogDone){out+=message('ok','Первое задание решено');out+=`<h3>Закрепи результат</h3><p>${p.analog}</p>${choices('analog',p.analogChoices,S.analog)}${S.analogAttempts?message('hint','Попробуй ещё раз','Проследи выполнение каждой команды по порядку.'):''}${btn('Проверить закрепление','check-analog',!S.analog,'full')}`;}
 else out+=message('ok','Тренировка пройдена',S.trainAttempts===0?'Задание выполнено самостоятельно.':'Основной и дополнительный примеры решены.');
 return out;
}
const linearItems=[{id:'end',text:'КОНЕЦ',type:'oval'},{id:'write',text:'Запиши результат',type:'rect'},{id:'start',text:'НАЧАЛО',type:'oval'},{id:'add',text:'Прибавь 4',type:'rect'},{id:'get',text:'Возьми число 6',type:'rect'}];
function linearStage(){return `<h2>3. Собери блок-схему</h2><p>Компьютер должен взять число 6, прибавить к нему 4 и записать результат. Нажимай на блоки в правильном порядке.</p>
<div class="items">${linearItems.map(b=>`<button type="button" class="pick ${S.linear.includes(b.id)?'selected':''}" data-act="pick-linear" data-value="${b.id}" ${S.linear.includes(b.id)||S.linearDone?'disabled':''}><span class="sample-shape ${b.type}">${b.text}</span><span aria-hidden="true">${S.linear.includes(b.id)?'✓':'＋'}</span></button>`).join('')}</div>
<div class="box"><div class="flexline"><b>Твоя блок-схема</b><span class="subtle">${S.linear.length} из 5</span></div><div class="builder builder-holder">${S.linear.length===0?'<span class="subtle">Выбранные блоки появятся здесь.</span>':S.linear.map((id,i)=>`${i?'<div class="down" aria-hidden="true">↓</div>':''}<div class="sample-shape ${linearItems.find(b=>b.id===id).type}">${linearItems.find(b=>b.id===id).text}</div>`).join('')}</div>${!S.linearDone?`<div class="actions">${btn('Отменить шаг','undo-linear',!S.linear.length,'secondary small')}${btn('Очистить','clear-linear',!S.linear.length,'secondary small')}</div>`:''}</div>
${S.linearAttempts&&!S.linearDone?message('hint','Подсказка','Сначала начало, затем получение числа, действие, запись результата и конец.'):''}
${S.linearDone?message('ok','Блок-схема собрана правильно!'):btn('Проверить порядок','check-linear',S.linear.length!==5,'full')}`;}
const branchChoices=[[['gt','Число больше 5?'],['even','Число чётное?'],['lt','Число меньше 5?']],[['plus','Прибавь 2'],['minus','Вычти 2'],['double','Умножь на 2']],[['minus','Вычти 2'],['plus','Прибавь 2'],['double','Умножь на 2']]];
const getBranchText=v=>({gt:'n > 5?',even:'n чётное?',lt:'n < 5?',plus:'n = n + 2',minus:'n = n − 2',double:'n = n × 2'}[v]??'Заполни блок');
function branching(){return `<h2>4. Самостоятельно построй ветвление</h2><p>Начальное число — <b>7</b>. Если оно больше 5, прибавь 2. Иначе вычти 2.</p><p>Выбери, что записать в ромб и в два прямоугольника.</p>
${select('branch.0','Блок 1. Какой вопрос записать в ромбе?',branchChoices[0],S.branch[0],S.branchDone)}
${select('branch.1','Блок 2. Действие по стрелке «Да»',branchChoices[1],S.branch[1],S.branchDone)}
${select('branch.2','Блок 3. Действие по стрелке «Нет»',branchChoices[2],S.branch[2],S.branchDone)}
${branchSvg({condition:getBranchText(S.branch[0]),yes:getBranchText(S.branch[1]),no:getBranchText(S.branch[2])})}
${input('branch.3','Какой результат получится по твоей блок-схеме?',S.branch[3],S.branchDone)}
${S.branchAttempts&&!S.branchDone?message('hint','Проверь схему','Какой вопрос должен быть в ромбе? Число 7 больше 5? По какой стрелке оно пойдёт?'):''}
${S.branchDone?message('ok','Блок-схема с ветвлением построена правильно!'):btn('Проверить блок-схему','check-branch',S.branch.some(v=>!String(v).trim()),'full')}`;}
function debugging(){return `<h2>5. Найди ошибку в алгоритме</h2><p>Программист хотел создать алгоритм: если число больше 10, написать «Большое». Иначе написать «Небольшое».</p><p><b>Найди ошибку в блок-схеме.</b></p>
${branchSvg({init:'Проверь число',condition:'Число > 10?',yes:'«Небольшое»',no:'«Большое»'})}
${choices('debug',[['oval','Заменить ромб на овал'],['swap','Поменять местами действия веток «Да» и «Нет»'],['arrows','Развернуть все стрелки'],['nothing','Ошибок нет']],S.debug,S.debugDone)}
${S.debugAttempts&&!S.debugDone?message('hint','Подумай','Если число равно 15, какое слово должно появиться? А какое получится по изображённой схеме?'):''}
${S.debugDone?message('ok','Ошибка найдена!'):btn('Проверить исправление','check-debug',!S.debug,'full')}`;}
const dualOptions=[ [['gt','n > 5?'],['lt','n < 5?'],['even','n чётное?']], [['sub3','n = n − 3'],['add3','n = n + 3']], [['add3','n = n + 3'],['sub3','n = n − 3']], [['even','n чётное?'],['gt8','n > 8?'],['odd','n нечётное?']], [['half','n = n : 2'],['add1','n = n + 1']], [['add1','n = n + 1'],['half','n = n : 2']] ];
function dualTexts(){return S.dual.slice(0,6).map((v,i)=>dualOptions[i].find(o=>o[0]===v)?.[1]??(i===0||i===3?'Условие?':'Действие?'))}
function twoConditions(){const labels=['Первое условие','Действие 1 — Да','Действие 1 — Нет','Второе условие','Действие 2 — Да','Действие 2 — Нет'];return `<h2>6. Построй блок-схему с двумя условиями</h2><p>Начальное число — <b>8</b>. Составь схему по инструкции:</p><ol><li>Если число больше 5, вычти 3, иначе прибавь 3.</li><li>Проверь полученное число на чётность.</li><li>Если чётное, раздели на 2, иначе прибавь 1.</li></ol>
${labels.map((label,i)=>select('dual.'+i,(i+1)+'. '+label,dualOptions[i],S.dual[i],S.dualDone)).join('')}
${dualSvg(dualTexts())}
${input('dual.6','Какое число получится после выполнения всей блок-схемы?',S.dual[6],S.dualDone)}
${S.dualAttempts&&!S.dualDone?message('hint','Проверь команды','После первого действия число изменяется. Затем проверь его на чётность и выбери вторую ветку.'):''}
${S.dualDone?message('ok','Алгоритм с двумя условиями составлен правильно!'):btn('Проверить блок-схему','check-dual',S.dual.some(v=>!String(v).trim()),'full')}`;}
function tests(){const starts=[4,9,10],keys=[8,3,8];return `<h2>7. Проверь, как работает алгоритм</h2><p>Ты построил схему с двумя условиями. Теперь испытай её с другими начальными числами.</p><div class="box"><b>Правило</b><ol><li>Если число больше 5, вычти 3, иначе прибавь 3.</li><li>Если полученное число чётное, раздели на 2, иначе прибавь 1.</li></ol></div>
${starts.map((n,i)=>`<div class="box white"><div class="flexline"><b>Испытание ${i+1}</b><span class="badge">n = ${n}</span></div>${input('tests.'+i,'Какое число получится?',S.tests[i],S.testsDone)}${(S.testsAttempts||S.testsDone)?`<div class="small-status" aria-label="${num(S.tests[i])===keys[i]?'Верно':'Неверно'}"><span class="mark" style="color:${num(S.tests[i])===keys[i]?'#18784a':'#ae3434'}">${num(S.tests[i])===keys[i]?'✓':'✕'}</span><span class="subtle">${num(S.tests[i])===keys[i]?'Правильно':'Проверь вычисление'}</span></div>`:''}</div>`).join('')}
${S.testsAttempts&&!S.testsDone?message('hint','Проверь отмеченные ошибки','Каждую следующую команду выполняй с новым значением числа.'):''}
${S.testsDone?message('ok','Алгоритм прошёл все три испытания!'):btn('Проверить три результата','check-tests',S.tests.some(v=>!String(v).trim()),'full')}`;}
const designOptions=[ [['diamond','Ромб'],['rectangle','Прямоугольник'],['oval','Овал']], [['gt5','Масса больше 5 кг?'],['lt5','Масса меньше 5 кг?'],['eq5','Масса равна 5 кг?']], [['800','Назначь стоимость 800 тг'],['400','Назначь стоимость 400 тг']], [['400','Назначь стоимость 400 тг'],['800','Назначь стоимость 800 тг']] ];
function design(){const labels=['Какую фигуру использовать для проверки массы?','Что написать внутри фигуры?','Что выполнить по стрелке «Да»?','Что выполнить по стрелке «Нет»?'];const d=S.design;
return `<h2>8. Построй блок-схему для службы доставки</h2><p>Если масса посылки <b>больше 5 кг</b>, доставка стоит <b>800 тенге</b>. Во всех остальных случаях — <b>400 тенге</b>.</p><p>Самостоятельно выбери фигуру, условие и действия.</p>
${labels.map((l,i)=>select('design.'+i,(i+1)+'. '+l,designOptions[i],d[i],S.designDone)).join('')}
${branchSvg({init:'Масса = 7 кг',condition:d[1]==='gt5'?'Масса > 5?':d[1]==='lt5'?'Масса < 5?':d[1]==='eq5'?'Масса = 5?':'Условие?',yes:d[2]?d[2]+' тенге':'Действие?',no:d[3]?d[3]+' тенге':'Действие?',shape:d[0]==='oval'?'oval':d[0]==='rectangle'?'rect':'diamond'})}
${input('design.4','Сколько стоит доставка посылки массой 7 кг?',d[4],S.designDone,'number','Стоимость в тенге')}
${S.designAttempts&&!S.designDone?message('hint','Проверь свою схему','Для проверки нужна фигура условия. Проверь стрелки «Да» и «Нет» и результат для 7 кг.'):''}
${S.designDone?message('ok','Блок-схема для службы доставки составлена правильно!'):btn('Проверить свою схему','check-design',S.design.some(v=>!String(v).trim()),'full')}`;}
function ownStage(){const a=S.own;return `<h2>9. Создай собственную блок-схему</h2><p>Придумай алгоритм, который помогает принять решение в повседневной жизни: например, при выборе одежды по погоде, подготовке к уроку или уходе за растением.</p><p><b>Запиши одно условие и два разных действия.</b></p>
${input('own.0','1. Вопрос для ромба',a[0],S.ownDone,'text','Например: Идёт дождь?')}
${input('own.1','2. Действие по ветке «Да»',a[1],S.ownDone,'text','Например: Возьми зонт')}
${input('own.2','3. Действие по ветке «Нет»',a[2],S.ownDone,'text','Например: Иди без зонта')}
${branchSvg({condition:a[0]||'Твой вопрос?',yes:a[1]||'Твоё действие',no:a[2]||'Твоё действие'})}
<p class="copy-note">На схеме длинные фразы показываются сокращённо. Полные команды остаются в полях выше.</p>
<div class="box"><b>Проверь свою блок-схему</b>
${checkList('ownChecks',['В ромбе вопрос, на который можно ответить «Да» или «Нет».','Обе команды понятны, точны и записаны в прямоугольниках.','По каждой ветке алгоритм правильно завершается.'],S.ownChecks,S.ownDone)}</div>
${S.ownDone?`<div class="box"><h3>Мастерская завершена!</h3><p>Ты прошёл все девять этапов и создал собственную блок-схему.</p><p class="subtle">Творческое задание проверяет учитель или одноклассник.</p><div class="final-line"><span>Первичная диагностика</span><b>${score()} из 3</b></div><div class="final-line"><span>Твой маршрут</span><b>${LEVELS[level()].name}</b></div><div class="final-line"><span>Выполнено этапов</span><b>9 из 9</b></div><div class="actions" style="margin-top:18px">${btn('Скопировать мою инструкцию','copy-own',false,'secondary')}${btn('Начать заново','reset',false,'secondary')}</div></div>`:btn('Моя блок-схема готова','finish-own',!a.every(v=>v.trim().length>=8)||!S.ownChecks.every(Boolean),'full')}`;}
const renderers=[theory,training,linearStage,branching,debugging,twoConditions,tests,design,ownStage];
function render(restoreScroll=true){const currentY=window.scrollY;const d=stages();if(S.step>0&&!d.slice(0,S.step).every(Boolean)){S.step=d.findIndex(x=>!x);if(S.step<0)S.step=8;}
 document.getElementById('stage-indicator').textContent=`Этап ${S.step+1} из 9`;
 document.getElementById('completed-indicator').textContent=`Выполнено ${d.filter(Boolean).length} из 9`;
 document.getElementById('step-nav').innerHTML=d.map((ok,i)=>`<button class="dot ${i===S.step?'current':ok?'complete':''}" type="button" data-act="jump" data-value="${i}" aria-label="Этап ${i+1}: ${NAMES[i]}" title="${NAMES[i]}" ${i>S.step&&!d.slice(0,i).every(Boolean)?'disabled':''}>${ok?'✓':i+1}</button>`).join('');
 document.getElementById('stage-content').innerHTML=renderers[S.step]();
 document.getElementById('stage-bottom').innerHTML=(S.step<8?`<span class="subtle">${d[S.step]?'Этап выполнен. Можно продолжать.':'Следующий этап откроется после выполнения задания.'}</span>${btn('Далее →','next',!d[S.step])}`:'<span class="subtle">Творческая работа завершает маршрут.</span>');
 save();if(restoreScroll)window.scrollTo(0,currentY);else window.scrollTo({top:0,behavior:'smooth'});
}
function updateSubmit(){const buttons=document.querySelectorAll('[data-act]');for(const b of buttons){switch(b.dataset.act){case'finish-diag':b.disabled=S.diag.some(x=>!x);break;case'check-train':b.disabled=!S.train;break;case'check-scaffold':b.disabled=!S.scaffold;break;case'check-analog':b.disabled=!S.analog;break;case'check-linear':b.disabled=S.linear.length!==5;break;case'check-branch':b.disabled=S.branch.some(v=>!String(v).trim());break;case'check-debug':b.disabled=!S.debug;break;case'check-dual':b.disabled=S.dual.some(v=>!String(v).trim());break;case'check-tests':b.disabled=S.tests.some(v=>!String(v).trim());break;case'check-design':b.disabled=S.design.some(v=>!String(v).trim());break;case'finish-own':b.disabled=!S.own.every(v=>v.trim().length>=8)||!S.ownChecks.every(Boolean);break;}}}
function setField(field,value){if(field.includes('.')){const [k,i]=field.split('.');const arr=[...S[k]];arr[Number(i)]=value;S[k]=arr;}else S[field]=value;save();}
function updateOwnPreview(){const condition=S.own[0],yes=S.own[1],no=S.own[2];const svg=document.querySelector('#stage-content svg.diagram');if(!svg)return;const nodes=svg.querySelectorAll('text');if(nodes.length>=7){nodes[2].textContent=(condition||'Твой вопрос?').slice(0,29);nodes[5].textContent=(yes||'Твоё действие').slice(0,22);nodes[6].textContent=(no||'Твоё действие').slice(0,22);}}
function act(action,argument){switch(action){
 case'finish-diag':if(S.diag.every(Boolean))S.diagDone=true;break;
 case'check-scaffold':{const p=LEVELS[level()];if(S.scaffold===p.scaffoldAnswer){S.scaffoldDone=true;S.train='';}else{S.scaffold='';}break;}
 case'check-train':if(S.train===LEVELS[level()].answer){S.trainDone=true;}else{S.trainAttempts++;S.train='';}break;
 case'check-analog':if(S.analog===LEVELS[level()].analogAnswer){S.analogDone=true;}else{S.analogAttempts++;S.analog='';}break;
 case'pick-linear':if(!S.linear.includes(argument)&&!S.linearDone)S.linear.push(argument);break;
 case'undo-linear':S.linear.pop();break;
 case'clear-linear':S.linear=[];break;
 case'check-linear':if(S.linear.join(',')==='start,get,add,write,end'){S.linearDone=true;}else{S.linearAttempts++;S.linear=[];}break;
 case'check-branch':if(S.branch[0]==='gt'&&S.branch[1]==='plus'&&S.branch[2]==='minus'&&num(S.branch[3])===9)S.branchDone=true;else S.branchAttempts++;break;
 case'check-debug':if(S.debug==='swap')S.debugDone=true;else{S.debugAttempts++;S.debug='';}break;
 case'check-dual':if(S.dual.slice(0,6).join(',')==='gt,sub3,add3,even,half,add1'&&num(S.dual[6])===6)S.dualDone=true;else S.dualAttempts++;break;
 case'check-tests':if(S.tests.every((v,i)=>num(v)===[8,3,8][i]))S.testsDone=true;else S.testsAttempts++;break;
 case'check-design':if(S.design.slice(0,4).join(',')==='diamond,gt5,800,400'&&num(S.design[4])===800)S.designDone=true;else S.designAttempts++;break;
 case'finish-own':if(S.own.every(v=>v.trim().length>=8)&&S.ownChecks.every(Boolean))S.ownDone=true;break;
 case'next':if(S.step<8&&nextAllowed()){S.step++;render(false);return;}break;
 case'jump':{const n=Number(argument),d=stages();if(n>=0&&n<=8&&d.slice(0,n).every(Boolean)){S.step=n;render(false);}return;}
 case'copy-own':{const value='Моя блок-схема\nУсловие: '+S.own[0]+'\nЕсли Да: '+S.own[1]+'\nЕсли Нет: '+S.own[2];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>{const b=document.querySelector('[data-act="copy-own"]');if(b)b.textContent='Скопировано ✓';}).catch(()=>window.prompt('Скопируй текст:',value));}else window.prompt('Скопируй текст:',value);return;}
 case'reset':{if(!window.confirm('Начать заново? Все сохранённые ответы будут очищены.'))return;S=init();render(false);return;}
 }render(true);
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.value);});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.field)return;const name=t.dataset.field;if(t.type==='checkbox'){const a=[...S[name]];a[Number(t.dataset.index)]=t.checked;S[name]=a;save();updateSubmit();return;}if(t.type==='radio'||t.tagName==='SELECT'){setField(name,t.value);render(true);}});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.field||t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT')return;setField(t.dataset.field,t.value);if(S.step===8)updateOwnPreview();updateSubmit();});
render(false);
})();
</script>
</body>
</html>
