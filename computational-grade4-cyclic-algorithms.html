 {id:'c6',kind:'multi',prompt:'Начальное n = 2. Пока n < 8, выполняй n = n + 2. Выбери ВСЕ верные утверждения.',opts:[['A','Число увеличивается на 2 в каждом повторении'],['B','Команда выполнится ровно 3 раза'],['C','В конце число будет равно 10'],['D','После последнего прибавления условие проверится снова']],answer:['A','B','D'],hint:'Проследи значения n и помни, что условие проверяется перед каждым новым повтором.',analog:{kind:'single',prompt:'Начальное n = 1. Пока n < 7, прибавляй 2. Каким будет n после остановки?',opts:[['A','5'],['B','6'],['C','7'],['D','9']],answer:'C'},scaffold:{prompt:'Если n = 8, условие n < 8 выполняется?',opts:[['A','Да'],['B','Нет']],answer:'B'}},
 {id:'c7',kind:'builder',prompt:'Построй циклический алгоритм: нужно нарисовать ровно пять звёзд, используя счётчик k, который сначала равен нулю.',answer:['lt5','star','inc1','5'],hint:'Проверка должна стать ложной после пятой звезды. Увеличивай счётчик после рисунка.',analog:{kind:'single',prompt:'Тот же алгоритм должен нарисовать 7 звёзд. На какое условие нужно заменить k < 5?',opts:[['A','k < 6'],['B','k < 7'],['C','k < 8'],['D','k > 7']],answer:'B'},scaffold:{prompt:'Как изменять k после каждой нарисованной звезды, чтобы он дошёл до пяти?',opts:[['A','k = 0'],['B','k = k − 1'],['C','k = k + 1'],['D','k = 5']],answer:'C'}},
 {id:'c8',kind:'trace',prompt:'Начальное число n = 3. Пока n < 11, выполняй n = n + 2. Введи четыре последовательных результата после повторений.',answer:[5,7,9,11],hint:'Каждый следующий результат вычисляй из предыдущего, а перед новым повторением проверяй условие.',analog:{kind:'number',prompt:'Начальное число n = 2. Пока n < 11, выполняй n = n + 3. Сколько раз выполнится команда?',answer:3},scaffold:{prompt:'Каким станет n после ПЕРВОГО прибавления 2 к числу 3?',opts:[['A','4'],['B','5'],['C','6'],['D','7']],answer:'B'}}
];
const BONUS=choice('bonus','Задание повышенной сложности. Счётчик k = 1. Пока k ≤ 7, робот печатает значение k, затем прибавляет к нему 2. Сколько значений напечатает робот?', [['A','3'],['B','4'],['C','5'],['D','6']],'B','Нужно учесть число, при котором условие ещё истинно, и каждое напечатанное значение.',{kind:'single',prompt:'Теперь k = 2. Пока k ≤ 8, робот печатает k и прибавляет 2. Сколько чисел будет напечатано?',opts:[['A','3'],['B','4'],['C','5'],['D','6']],answer:'B'}, {prompt:'Будет ли выполняться условие k ≤ 7 при k = 7?',opts:[['A','Да'],['B','Нет']],answer:'A'});
const FINAL=[
 {id:'finish',t:'Если ответ «Нет», заверши алгоритм.'},
 {id:'draw',t:'Если ответ «Да», выполни повторяемое действие.'},
 {id:'return',t:'Вернись к проверке условия.'},
 {id:'init',t:'Установи счётчик повторений k = 0.'},
 {id:'test',t:'Проверь: k меньше нужного числа повторений?'},

];
const FINAL_ANSWER=['init','test','draw','add','return','finish'];
function diagCorrect(){return S.diag.filter((v,i)=>v===D[i].ans).length}
function phase(){return S.screen==='intro'?0:S.screen==='diag'||S.screen==='routing'?1:S.screen==='route'||S.screen==='core'?2:3}
function progress(){let val=0;if(S.screen==='intro')val=3;if(S.screen==='diag')val=8+S.diagIndex*6;if(S.screen==='routing')val=27;if(S.screen==='route')val=28+Math.round(S.routeIndex/Math.max(1,S.route.length)*12);if(S.screen==='core')val=40+Math.round((S.coreIndex+(S.taskSolved?1:0))/S.coreTasks.length*47);if(S.screen==='final')val=S.finalDone?100:90;if(S.screen==='finished')val=100;return Math.min(100,val)}
function renderChrome(){const p=progress();$('progress').style.width=p+'%';$('progressNum').textContent=p+'%';$('progressLabel').textContent={intro:'Изучи правило',diag:'Первичная проверка',routing:'Твой маршрут',route:'Разбираем затруднения',core:'Практическая лаборатория',final:'Восстанови правило',finished:'Алгоритм освоен'}[S.screen];const names=['Теория','Диагностика','Тренировка','Итог'];$('phasebar').innerHTML=names.map((x,i)=>`<div class="phase ${phase()===i?'active':phase()>i?'done':''}">${phase()>i?'✓ ':''}${x}</div>`).join('')}
function setScreen(screen){S.screen=screen;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderChrome();const app=$('app');if(S.screen==='intro')app.innerHTML=introHTML();else if(S.screen==='diag')app.innerHTML=diagHTML();else if(S.screen==='routing')app.innerHTML=routingHTML();else if(S.screen==='route'||S.screen==='core')app.innerHTML=taskHTML();else if(S.screen==='final')app.innerHTML=finalHTML();else app.innerHTML=finishHTML();}
function diagram(){return `<div class="mini-scheme"><div class="svg-wrap"><svg viewBox="0 0 650 280" role="img" aria-label="Блок-схема цикла: проверка условия, действие, возвращение к условию либо завершение"><defs><filter id="ds"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6d6da9" flood-opacity=".18"/></filter><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#546d98"/></marker></defs><path d="M320 12 V38" stroke="#546d98" stroke-width="3" fill="none" marker-end="url(#ar)"/><ellipse cx="320" cy="15" rx="77" ry="13" fill="#fde5f1" stroke="#ea6dac" stroke-width="2" filter="url(#ds)"/><text x="320" y="19" font-size="13" text-anchor="middle" fill="#8d2d60" font-weight="700">НАЧАЛО</text><path d="M320 38 L425 92 L320 145 L215 92 Z" fill="#ffedb5" stroke="#e4aa39" stroke-width="3" filter="url(#ds)"/><text x="320" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#845b10">Условие?</text><path d="M320 145 V169" stroke="#546d98" stroke-width="3" marker-end="url(#ar)"/><text x="332" y="159" fill="#188959" font-weight="800" font-size="14">Да</text><rect x="236" y="174" width="168" height="58" rx="10" fill="#d9edff" stroke="#4d9be5" stroke-width="3" filter="url(#ds)"/><text x="320" y="199" text-anchor="middle" font-size="15" font-weight="800" fill="#1b5895">Выполни</text><text x="320" y="218" text-anchor="middle" font-size="15" font-weight="800" fill="#1b5895">действие</text><path d="M236 204 H173 V92 H214" stroke="#546d98" fill="none" stroke-width="3" marker-end="url(#ar)"/><text x="154" y="162" fill="#5f6e96" font-size="13" transform="rotate(-90 154 162)">Повтори проверку</text><path d="M425 92 H542 V188" stroke="#546d98" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="449" y="83" fill="#c54b59" font-size="14" font-weight="800">Нет</text><ellipse cx="542" cy="216" rx="68" ry="25" fill="#fce0ec" stroke="#e879a7" stroke-width="3" filter="url(#ds)"/><text x="542" y="221" text-anchor="middle" fill="#9b3c6c" font-weight="800" font-size="15">КОНЕЦ</text></svg></div><div class="svg-caption">Цикл с условием: после действия возвращаемся к проверке. При ответе «Нет» выходим.</div></div>`}
function introHTML(){return `<span class="tag">01 · Немного теории</span><h2>Что такое циклический алгоритм?</h2><p class="lead"><b>Цикл</b> — часть алгоритма, в которой одна команда или группа команд выполняется несколько раз. Это удобнее, чем записывать одинаковые действия снова и снова.</p><div class="grid3"><div class="theory-box"><div class="theory-icon">↻</div><b>Повтори несколько раз</b><div class="step-text">«Повтори 4 раза: нарисуй круг» — получится ровно 4 круга.</div></div><div class="theory-box"><div class="theory-icon">4</div><b>Счётчик</b><div class="step-text">Число, которое помогает узнать, сколько повторений уже выполнено.</div></div><div class="theory-box"><div class="theory-icon">◇</div><b>Условие остановки</b><div class="step-text">«Пока k &lt; 4» означает: повторяй действия, пока проверка даёт ответ «Да».</div></div></div><h3>Как работает цикл «пока»?</h3>${diagram()}<div class="callout"><b>Запомни:</b> после каждого повторения счётчик должен изменяться, иначе цикл может никогда не закончиться. В цикле «пока» условие проверяется <b>перед</b> очередным повторением.</div><label class="fieldlabel" for="studentName">Твоё имя (для результата)</label><input class="field" id="studentName" autocomplete="off" maxlength="45" placeholder="Имя" value="${esc(S.name)}"><div class="btnrow"><button class="btn primary" onclick="beginDiag()">Проверить свои знания →</button></div></div>`}
function beginDiag(){S.name=ss($('studentName').value);setScreen('diag')}
function drawOptions(opts,selected,multi=false){return `<div class="options">${opts.map(([v,t],i)=>`<button class="option ${multi?(Array.isArray(selected)&&selected.includes(v)?'selected':''):selected===v?'selected':''}" type="button" aria-pressed="${multi?Array.isArray(selected)&&selected.includes(v):selected===v}" onclick="pick('${esc(v)}')"><span class="choice-icon">${multi?'✓':String.fromCharCode(65+i)}</span><span>${esc(t)}</span></button>`).join('')}</div>`}
function diagHTML(){const q=D[S.diagIndex],locked=S.choiceLocked;return `<span class="tag amber">02 · Диагностика · ${S.diagIndex+1}/3</span><h2>${esc(q.q)}</h2><p class="sub">Ответь самостоятельно. По результатам будут подобраны тренировочные задания.</p>${drawOptions(q.opts,S.input.value||'')}${locked?`<div class="feedback ${S.diag[S.diagIndex]===q.ans?'good':'tip'}"><strong>${S.diag[S.diagIndex]===q.ans?'Ответ принят — верно.':'Ответ зафиксирован.'}</strong>Теперь можно переходить дальше. Затруднения разберём во время тренировки.</div>`:''}<div class="btnrow"><button class="btn primary" ${!locked&&!S.input.value?'disabled':''} onclick="${locked?'nextDiag()':'submitDiag()'}">${locked?(S.diagIndex===2?'Узнать свой маршрут →':'Следующий вопрос →'):'Проверить ответ'}</button></div>`}
function pick(v){if(S.choiceLocked)return;const t=currentTask();const multiple=(S.screen==='core'||S.screen==='route')&&S.mode==='main'&&t?.kind==='multi';if(multiple){let z=S.input.value||[];S.input.value=z.includes(v)?z.filter(x=>x!==v):[...z,v]}else S.input.value=v;render()}
function submitDiag(){if(!S.input.value||S.choiceLocked)return;S.diag.push(S.input.value);S.choiceLocked=true;render()}
function nextDiag(){if(!S.choiceLocked)return;S.diagIndex++;S.input={};S.choiceLocked=false;if(S.diagIndex>=D.length){let missed=D.filter((q,i)=>S.diag[i]!==q.ans).map(q=>q.skill);S.route=missed.map(skill=>({...R[skill],routeSkill:skill}));if(!S.route.length)S.route=[choice('r-plus','Робот повторяет команды «шаг вперёд, хлопок» четыре раза. Сколько всего отдельных команд он выполнит?', [['A','4'],['B','6'],['C','8'],['D','12']],'C','В каждом повторении две команды, а не одна.',{kind:'number',prompt:'Три раза выполняются две команды. Сколько всего отдельных команд?',answer:6}, {prompt:'Сколько отдельных команд в одном повторе «шаг вперёд, хлопок»?',opts:[['A','1'],['B','2'],['C','3'],['D','4']],answer:'B'})];S.coreTasks=CORE.map(x=>({...x}));if(diagCorrect()===3){S.coreTasks.splice(4,0,BONUS);S.bonusAdded=true}setScreen('routing')}else setScreen('diag')}
function routingHTML(){const c=diagCorrect(),names=c===3?'Исследовательский':c===2?'Основной':'С поддержкой';return `<span class="tag green">Маршрут построен</span><h2>Проверка завершена</h2><div class="scoregrid"><div class="stat"><strong>${c}/3</strong><span>Верно</span></div><div class="stat"><strong>${S.route.length}</strong><span>Заданий маршрута</span></div><div class="stat"><strong>${names}</strong><span>Уровень</span></div></div><p class="lead">${c===3?'Ты уверенно справился с проверкой. Начнём с задания на внимательность, затем перейдём к более сложным циклам.':c===2?'Сначала разберём одно затруднение, затем будем строить собственные циклы.':'Сначала потренируем отдельные умения с наводящими вопросами, затем перейдём к конструктору циклов.'}</p><div class="routecard"><b>Твой маршрут</b><div class="pills">${S.route.map(t=>`<span class="pill">${t.routeSkill==='recognition'?'Повторяемые команды':t.routeSkill==='count'?'Количество повторений':t.routeSkill==='condition'?'Условие остановки':'Тренировка внимания'}</span>`).join('')}</div></div><div class="btnrow"><button class="btn primary" onclick="enterRoute()">Начать тренировку →</button></div>`}
function enterRoute(){freshTask();setScreen('route')}
function currentTask(){if(S.screen==='route')return S.route[S.routeIndex];if(S.screen==='core')return S.coreTasks[S.coreIndex];return null}
function freshTask(){S.mainAttempts=0;S.analogAttempts=0;S.scaffoldAttempts=0;S.scaffoldPassed=false;S.hintLevel=0;S.mode='main';S.input={};S.feedback='';S.feedbackKind='';S.taskSolved=false;S.choiceLocked=false;S.routeTrace=null;S.order=[]}
function taskHeader(t){const core=S.screen==='core';return `<span class="tag ${core?'':'green'}">${core?'Практика · '+(S.coreIndex+1)+'/'+S.coreTasks.length:'Индивидуальный маршрут · '+(S.routeIndex+1)+'/'+S.route.length}</span><h2>${t.id==='bonus'?'Повышенная сложность':'Лаборатория циклов'}</h2><p class="lead">${esc(t.prompt)}</p>${core?`<div class="pills"><span class="pill ${S.mainAttempts===0?'green':'pink'}">${S.mainAttempts===0?'Выполни самостоятельно':'Разбираем по шагам'}</span><span class="pill">${t.kind==='multi'?'Несколько правильных ответов':t.kind==='pattern'?'Конструктор узора':t.kind==='robot'?'Робот-исполнитель':t.kind==='builder'?'Построение блок-схемы':t.kind==='trace'?'Таблица повторений':'Проверка алгоритма'}</span></div>`:''}`}
function taskHTML(){const t=currentTask();if(!t)return `<h2>Маршрут завершён</h2>`;let body;if(S.taskSolved){body=`<div class="feedback good"><strong>Задание выполнено!</strong>${S.mainAttempts===0?'Решено самостоятельно, без подсказок.':'Основное и дополнительное задания выполнены.'}</div>`}else if(S.mode==='scaffold'){body=`<div class="feedback tip"><strong>Разберём один простой шаг</strong>Две ошибки подряд — значит, сначала проверим маленькую часть правила.</div><h3>${esc(t.scaffold.prompt)}</h3>${drawOptions(t.scaffold.opts,S.input.value||'')}`;if(S.feedback)body+=feedbackHTML()}else if(S.mode==='analog'){body=`<div class="feedback good"><strong>Основное задание выполнено</strong>После подсказки полезно решить ещё один похожий пример самостоятельно.</div><h3>${esc(t.analog.prompt)}</h3>${questionHTML(t.analog,true)}`;if(S.feedback)body+=feedbackHTML()}else{body=questionHTML(t,false);if(S.feedback)body+=feedbackHTML();if(S.hintLevel>0)body+=`<div class="feedback tip"><strong>Подсказка ${S.hintLevel} из 2</strong>${esc(t.hint||'Проследи каждое повторение по очереди.')}${S.hintLevel===2?'<br>Посмотри, меняется ли значение счётчика после действия.':''}</div>`}const canSubmit=S.mode==='scaffold'?Boolean(S.input.value):S.mode==='analog'?answerReady(t.analog):answerReady(t);const footer=S.taskSolved?`<div class="btnrow"><button class="btn primary" onclick="advanceTask()">Следующее задание →</button></div>`:`<div class="btnrow"><button class="btn soft" onclick="requestHint()" ${S.mode==='main'&&S.hintLevel<2?'':'disabled'}>Нужна подсказка?</button><button class="btn primary" ${canSubmit?'':'disabled'} onclick="checkTask()">${S.mode==='scaffold'?'Проверить шаг':S.mode==='analog'?'Проверить закрепление':'Проверить ответ'}</button></div>`;return taskHeader(t)+body+footer}
function feedbackHTML(){return `<div class="feedback ${S.feedbackKind}"><strong>${S.feedbackKind==='bad'?'Проверь ещё раз':S.feedbackKind==='good'?'Правильно':'Обрати внимание'}</strong>${esc(S.feedback)}</div>`}
function selectField(k,label,opts,value=''){return `<label class="fieldlabel" for="in_${esc(k)}">${label}</label><select class="field" id="in_${esc(k)}" onchange="fieldChange('${esc(k)}',this.value)"><option value="">— Выбери —</option>${opts.map(([v,t])=>`<option value="${esc(v)}" ${(S.input[k]||value)===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`}
const dirs=[['up','↑ Вверх'],['down','↓ Вниз'],['left','← Влево'],['right','→ Вправо']];
const shapeOpts=[['circle','○ Круг'],['square','■ Квадрат'],['triangle','▲ Треугольник']];
function shapeIcon(s){return s==='circle'?'●':s==='square'?'■':s==='triangle'?'▲':'·'}
function shapeClass(s){return s==='circle'?'circ':s==='square'?'sq':'tri'}
function stamps(arr,target){return `<div class="color-stamps">${arr.map(x=>`<div class="stamp ${shapeClass(x)} ${target?'target':''}" title="${esc(x)}">${shapeIcon(x)}</div>`).join('')}</div>`}
function getPattern(){const a=S.input.a,b=S.input.b,n=Number(S.input.n);return a&&b&&n?Array.from({length:n},()=>[a,b]).flat():[]}
function questionHTML(t,analog=false){if(!t)return '';let result='';if(t.kind==='single'||t.kind==='multi'){result=drawOptions(t.opts,S.input.value|| (t.kind==='multi'?[]:''),t.kind==='multi')}
if(t.kind==='number'){result=`<label class="fieldlabel" for="numeric">Запиши число</label><input class="field" type="number" id="numeric" placeholder="Твой ответ" value="${esc(S.input.value||'')}" oninput="fieldChange('value',this.value)">`}
if(t.kind==='pattern'){result=`<div class="builder"><b>Узор, который нужно получить:</b>${stamps(t.target,true)}<div class="form-row three">${selectField('a','Первая команда',shapeOpts)}${selectField('b','Вторая команда',shapeOpts)}${selectField('n','Повторить',[['2','2 раза'],['3','3 раза'],['4','4 раза']])}</div><div class="divider"></div><b>Что рисует твой алгоритм:</b><div id="patternPreview">${getPattern().length?stamps(getPattern()):'<div class="small">Выбери команды и количество повторений.</div>'}</div></div>`}
if(t.kind==='robot'){result=`<div class="builder"><div class="robot-grid" id="robotgrid">${robotCells()}</div><p class="small" style="text-align:center;margin:10px 0 0">Начало — внизу слева, звезда — в третьей строке справа. В клетку со стеной переходить нельзя.</p><div class="form-row three">${selectField('a','Команда 1',dirs)}${selectField('b','Команда 2',dirs)}${selectField('c','Команда 3',dirs)}</div>${selectField('n','Повторить последовательность',[['1','1 раз'],['2','2 раза'],['3','3 раза']])}<div class="program" id="robotProgram">${programPreview()}</div>${S.routeTrace?`<div class="feedback ${S.routeTrace.status==='success'?'good':'bad'}">${esc(S.routeTrace.message)}</div>`:''}</div>`}
if(t.kind==='builder'){result=`<div class="builder"><div class="form-row">${selectField('cond','Условие в ромбе',[['lt4','k < 4?'],['lt5','k < 5?'],['le5','k ≤ 5?']])}${selectField('action','Повторяемая команда',[['star','Нарисуй звезду'],['circle','Нарисуй круг'],['erase','Сотри фигуру']])}${selectField('counter','Как изменить счётчик',[['inc1','k = k + 1'],['dec1','k = k − 1'],['same','k = 0']])}${selectField('result','Сколько звёзд получится',[['4','4'],['5','5'],['6','6']])}</div>${builderDiagram()}</div>`}
if(t.kind==='trace'){result=`<div class="builder"><div class="pills"><span class="pill">Старт: n = 3</span><span class="pill">Пока n &lt; 11</span><span class="pill">Повторяй: n = n + 2</span></div><div class="form-row" style="margin-top:9px">${[0,1,2,3].map(i=>`<label class="fieldlabel">После ${i+1}-го повторения<input class="field" type="number" placeholder="Число" value="${esc(S.input['n'+i]||'')}" oninput="fieldChange('n${i}',this.value)"></label>`).join('')}</div></div>`}
return result}
function robotCells(){const path=S.routeTrace?.trace||[],at=S.routeTrace?.at||[0,4],walls=new Set(['1,3','3,4','3,2']);let html='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){const p=x+','+y;let c=walls.has(p)?'wall':path.some(a=>a[0]===x&&a[1]===y)?'visited':'';if(x===4&&y===2)c+=' goal';if(x===at[0]&&y===at[1])c+=' robot';html+=`<div class="cell ${c}" aria-label="Столбец ${x+1}, строка ${y+1}">${x===at[0]&&y===at[1]?'🤖':walls.has(p)?'▦':x===4&&y===2?'★':path.some(a=>a[0]===x&&a[1]===y)?'·':''}</div>`}return html}
function programPreview(){let s=[S.input.a,S.input.b,S.input.c],n=Number(S.input.n);if(s.every(Boolean)&&n){return Array.from({length:n},(_,i)=>s.map((d,j)=>`<span class="program-piece">${{up:'↑',down:'↓',left:'←',right:'→'}[d]}<small>${i+1}.${j+1}</small></span>`).join('')).join('')}return `<span class="small">Выбери команды — увидишь весь список шагов.</span>`}
function traceRobot(){let x=0,y=4,trace=[[x,y]],walls=new Set(['1,3','3,4','3,2']);let commands=Array.from({length:Number(S.input.n)},()=>[S.input.a,S.input.b,S.input.c]).flat();for(let i=0;i<commands.length;i++){let c=commands[i],nx=x+(c==='left'?-1:c==='right'?1:0),ny=y+(c==='up'?-1:c==='down'?1:0);if(nx<0||nx>4||ny<0||ny>4)return {status:'edge',at:[x,y],trace,message:'На шаге '+(i+1)+' робот пытается выйти за границу поля.'};if(walls.has(nx+','+ny))return {status:'wall',at:[x,y],trace,message:'На шаге '+(i+1)+' робот упирается в стену. Исправь команды.'};x=nx;y=ny;trace.push([x,y])}return {status:x===4&&y===2?'success':'short',at:[x,y],trace,message:x===4&&y===2?'Робот дошёл до звезды!':'Команды выполнены, но робот ещё не достиг звезды.'}}
function builderDiagram(){const cond=S.input.cond==='lt4'?'k < 4?':S.input.cond==='lt5'?'k < 5?':S.input.cond==='le5'?'k ≤ 5?':'Условие?';const action=S.input.action==='star'?'Нарисуй ★':S.input.action==='circle'?'Нарисуй ○':S.input.action==='erase'?'Сотри фигуру':'Команда?';const inc=S.input.counter==='inc1'?'k = k + 1':S.input.counter==='dec1'?'k = k − 1':S.input.counter==='same'?'k = 0':'Измени k';return `<div class="svg-wrap"><svg viewBox="0 0 560 465" role="img" aria-label="Создаваемая блок-схема цикла"><defs><filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity=".15"/></filter><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5d749d"/></marker></defs><g stroke-width="3" stroke-linejoin="round" filter="url(#sh)"><ellipse cx="280" cy="27" rx="83" ry="24" fill="#ffe5f0" stroke="#d85a99"/><rect x="225" y="74" width="110" height="47" rx="10" fill="#d9f2ff" stroke="#56a7dd"/><polygon points="280,145 375,201 280,257 185,201" fill="#fff0bd" stroke="#ddaa38"/><rect x="208" y="281" width="144" height="50" rx="9" fill="#dcefff" stroke="#5899e5"/><rect x="208" y="363" width="144" height="45" rx="9" fill="#dcefff" stroke="#5899e5"/><ellipse cx="473" cy="201" rx="76" ry="23" fill="#ffe4f0" stroke="#d85a99"/></g><g stroke="#5d749d" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M280 51 V74"/><path d="M280 121 V145"/><path d="M280 257 V281"/><path d="M280 331 V363"/><path d="M208 384 H148 V201 H185"/><path d="M375 201 H395"/></g><g text-anchor="middle" font-size="16" font-family="Segoe UI,Arial" font-weight="700" fill="#1c4c78"><text x="280" y="33" fill="#963b6b">НАЧАЛО</text><text x="280" y="103">k = 0</text><text x="280" y="207" fill="#825e14">${esc(cond)}</text><text x="280" y="311">${esc(action)}</text><text x="280" y="392">${esc(inc)}</text><text x="473" y="207" fill="#963b6b">КОНЕЦ</text><text x="300" y="271" font-size="14" fill="#11936b">Да</text><text x="392" y="187" font-size="14" fill="#d03f5d">Нет</text></g></svg></div><div class="svg-caption">Каждый блок и каждая стрелка находятся в одном чертеже.</div>`}
function fieldChange(k,v){S.input[k]=v;const t=currentTask();const active=S.mode==='analog'?t?.analog:t;const submit=document.querySelector('.btnrow .btn.primary');if(submit&&active)submit.disabled=!answerReady(active);if(t?.kind==='pattern'&&S.mode==='main'){const el=$('patternPreview');if(el)el.innerHTML=getPattern().length?stamps(getPattern()):'<div class="small">Выбери все параметры.</div>'}if(t?.kind==='robot'&&S.mode==='main'){const el=$('robotProgram');if(el)el.innerHTML=programPreview()}if(t?.kind==='builder'&&S.mode==='main'){const el=document.querySelector('.builder .svg-wrap');if(el){let frag=builderDiagram();const start=frag.indexOf('<div class="svg-wrap">')+22,end=frag.indexOf('</div>');el.innerHTML=frag.slice(start,end)}}}
function answerReady(t){if(!t)return false;if(t.kind==='single'||t.kind==='number')return ss(S.input.value)!=='';if(t.kind==='multi')return Array.isArray(S.input.value)&&S.input.value.length>0;if(t.kind==='pattern')return !!(S.input.a&&S.input.b&&S.input.n);if(t.kind==='robot')return !!(S.input.a&&S.input.b&&S.input.c&&S.input.n);if(t.kind==='builder')return !!(S.input.cond&&S.input.action&&S.input.counter&&S.input.result);if(t.kind==='trace')return [0,1,2,3].every(i=>ss(S.input['n'+i])!=='');return false}
function validate(t){if(!t)return false;if(t.kind==='single')return S.input.value===t.answer;if(t.kind==='number')return ss(S.input.value)!==''&&Number(S.input.value)===t.answer;if(t.kind==='multi')return Array.isArray(S.input.value)&&[...S.input.value].sort().join()===t.answer.slice().sort().join();if(t.kind==='pattern')return [S.input.a,S.input.b,S.input.n].join()===t.answer.join();if(t.kind==='robot'){S.routeTrace=traceRobot();return S.routeTrace.status==='success'}if(t.kind==='builder')return [S.input.cond,S.input.action,S.input.counter,S.input.result].join()===t.answer.join();if(t.kind==='trace')return t.answer.every((v,i)=>Number(S.input['n'+i])===v&&ss(S.input['n'+i])!=='');return false}
function requestHint(){if(S.mode!=='main'||S.taskSolved)return;S.hintLevel=Math.min(2,S.hintLevel+1);S.feedback='';render()}
function checkTask(){const t=currentTask();if(S.taskSolved)return;if(S.mode==='scaffold'){if(!S.input.value)return;let ok=S.input.value===t.scaffold.answer;if(ok){S.scaffoldPassed=true;S.mode='main';S.input={};S.feedback='Простой шаг выполнен. Теперь вернись к основному алгоритму.';S.feedbackKind='tip';S.hintLevel=2}else{S.scaffoldAttempts++;S.feedback='Проверяй только один указанный шаг, не весь алгоритм.';S.feedbackKind='bad';S.input={}}render();return}
const q=S.mode==='analog'?t.analog:t;if(!answerReady(q))return;const ok=validate(q);
if(ok){if(S.mode==='analog'){S.taskSolved=true;S.feedback='';S.assisted++;S.done.push({id:t.id,kind:'с помощью и закреплением',mistakes:S.mainAttempts+S.analogAttempts})}else if(S.mainAttempts>0||S.hintLevel>0||S.scaffoldPassed){if(t.analog){S.mode='analog';S.input={};S.feedback='';S.hintLevel=0;render();return}else{S.taskSolved=true;S.assisted++;S.done.push({id:t.id,kind:'после подсказки',mistakes:S.mainAttempts})}}else{S.taskSolved=true;S.independent++;S.firstStreak++;S.done.push({id:t.id,kind:'самостоятельно',mistakes:0});if(S.firstStreak>=2&&!S.bonusAdded&&S.screen==='core'){S.coreTasks.splice(S.coreIndex+1,0,BONUS);S.bonusAdded=true}}S.feedback='';S.feedbackKind='good'}else{S.mistakes++;if(S.mode==='analog'){S.analogAttempts++;S.feedback='Это похожая задача. Сначала проверь число повторений и выполни действия по очереди.';S.feedbackKind='bad'}else{S.mainAttempts++;S.firstStreak=0;S.hintLevel=Math.max(1,S.hintLevel);S.feedback=(q.kind==='robot'&&S.routeTrace)?S.routeTrace.message:'Ответ пока неверный. Попробуй ещё раз.';S.feedbackKind='bad';if(S.mainAttempts>=2&&t.scaffold&&!S.scaffoldPassed){S.mode='scaffold';S.input={};S.feedback='';S.hintLevel=2}}}render()}
function advanceTask(){if(!S.taskSolved)return;if(S.screen==='route'){S.routeIndex++;freshTask();if(S.routeIndex>=S.route.length)setScreen('core');else setScreen('route')}else{S.coreIndex++;freshTask();if(S.coreIndex>=S.coreTasks.length){S.finalOrder=FINAL.map(x=>x.id);S.finalExit='';setScreen('final')}else setScreen('core')}}
function finalHTML(){return `<span class="tag amber">04 · Итог</span><h2>Восстанови правило циклического алгоритма</h2><p class="lead">Ты научился выполнять и создавать циклы. Теперь <b>восстанови порядок действий</b>, чтобы алгоритм повторил команду нужное количество раз и вовремя остановился.</p><p class="sub">Ничего вычислять не нужно. Перемещай шаги кнопками ↑ и ↓.</p><div class="order-list">${S.finalOrder.map((id,i)=>`<div class="order-item"><span class="step-num">${i+1}</span><span class="text">${esc(FINAL.find(x=>x.id===id)?.t)}</span><div class="order-controls"><button class="tinybtn" type="button" ${i===0||S.finalDone?'disabled':''} aria-label="Переместить шаг вверх" onclick="moveFinal(${i},-1)">↑</button><button class="tinybtn" type="button" ${i===S.finalOrder.length-1||S.finalDone?'disabled':''} aria-label="Переместить шаг вниз" onclick="moveFinal(${i},1)">↓</button></div></div>`).join('')}</div><div class="divider"></div><h3>Когда выполнение цикла заканчивается?</h3>${drawFinalExit()}${S.finalAttempts>0&&!S.finalDone?`<div class="feedback tip"><strong>Подсказка</strong>${S.finalOrder.join()!==FINAL_ANSWER.join()?'Сначала установи счётчик, затем проверь условие. После действия измени счётчик и вернись к проверке.':'Проверь, по какой ветке условие больше не допускает повторений.'}</div>`:''}${S.finalDone?'<div class="feedback good"><strong>Правило восстановлено!</strong>Условие проверяется перед новым повторением. При ответе «Да» действие выполняется, счётчик меняется и проверка повторяется. При ответе «Нет» алгоритм завершается.</div>':''}<div class="btnrow"><button class="btn primary" ${S.finalDone?'':' '+(S.finalExit?'':'disabled')} onclick="${S.finalDone?'setScreen(\'finished\')':'checkFinal()'}">${S.finalDone?'Посмотреть результат →':'Проверить правило'}</button></div>`}
function drawFinalExit(){return `<div class="options"><button class="option ${S.finalExit==='yes'?'selected':''}" ${S.finalDone?'disabled':''} onclick="setFinalExit('yes')"><span class="choice-icon">А</span>Когда ответ на вопрос условия — «Да»</button><button class="option ${S.finalExit==='no'?'selected':''}" ${S.finalDone?'disabled':''} onclick="setFinalExit('no')"><span class="choice-icon">Б</span>Когда ответ на вопрос условия — «Нет»</button><button class="option ${S.finalExit==='always'?'selected':''}" ${S.finalDone?'disabled':''} onclick="setFinalExit('always')"><span class="choice-icon">В</span>После каждого выполненного действия</button></div>`}
function setFinalExit(v){S.finalExit=v;render()}
function moveFinal(i,d){if(S.finalDone)return;const j=i+d;if(j<0||j>=S.finalOrder.length)return;[S.finalOrder[i],S.finalOrder[j]]=[S.finalOrder[j],S.finalOrder[i]];render()}
function checkFinal(){S.finalAttempts++;if(S.finalOrder.join()===FINAL_ANSWER.join()&&S.finalExit==='no'){S.finalDone=true;S.done.push({id:'final',kind:'восстановлено правило',mistakes:S.finalAttempts-1})}else S.mistakes++;render()}
function report(){const name=S.name||'Не указано',diag=diagCorrect(),list=S.done.map((d,i)=>`${i+1}. ${d.id}: ${d.kind}${d.mistakes?' (ошибок: '+d.mistakes+')':''}`).join('\n');return `ЦИКЛ.ЛАБ — Циклические алгоритмы, 4 класс\nИмя: ${name}\nДиагностика: ${diag}/3\nПерсональный маршрут: ${S.route.map(x=>x.routeSkill||'дополнительное').join(', ')}\nОсновная тренировка: ${S.coreTasks.length} заданий\nСамостоятельно: ${S.independent}\nПосле подсказки/закрепления: ${S.assisted}\nКоличество ошибочных попыток: ${S.mistakes}\nИтог «Восстанови правило»: ${S.finalDone?'выполнен':'не выполнен'}\n\nЗадания:\n${list}`}
async function copyReport(){const val=report();try{await navigator.clipboard.writeText(val);$('copyStatus').textContent='Результат скопирован.'}catch(e){const area=document.createElement('textarea');area.value=val;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');$('copyStatus').textContent='Результат скопирован.'}catch(x){$('copyStatus').textContent='Скопируй текст результата вручную.'}area.remove()}}
function downloadReport(){const blob=new Blob(['\ufeff',report()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Результат_ЦИКЛ_ЛАБ.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function finishHTML(){return `<span class="tag green">Все этапы выполнены</span><h2>Ты освоил циклические алгоритмы!</h2><p class="lead">Теперь ты умеешь находить повторяемые действия, выполнять цикл, управлять счётчиком, проверять условие остановки и самостоятельно строить алгоритм.</p><div class="scoregrid"><div class="stat"><strong>${diagCorrect()}/3</strong><span>Диагностика</span></div><div class="stat"><strong>${S.independent}</strong><span>Самостоятельно</span></div><div class="stat"><strong>${S.assisted}</strong><span>После помощи</span></div></div><div class="routecard"><h3>Результат работы</h3><div class="result-detail"><span>Ученик</span><b>${esc(S.name||'Не указано')}</b></div><div class="result-detail"><span>Всего тренировочных заданий</span><b>${S.route.length+S.coreTasks.length}</b></div><div class="result-detail"><span>Ошибочных попыток</span><b>${S.mistakes}</b></div><div class="result-detail"><span>Итог «Восстанови правило»</span><b class="checkmark">Выполнен</b></div></div><div class="btnrow"><button class="btn aqua" onclick="copyReport()">Скопировать результат</button><button class="btn soft" onclick="downloadReport()">Сохранить отчёт</button></div><p id="copyStatus" class="small" role="status"></p><div class="btnrow"><button class="btn soft" onclick="restart()">Пройти ещё раз</button></div>`}
function restart(){S=newS();setScreen('intro')}
render();
</script></body></html>
