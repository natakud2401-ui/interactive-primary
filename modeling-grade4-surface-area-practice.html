<style>
:root{--ink:#233155;--muted:#627392;--purple:#6550d9;--violet:#8060ea;--blue:#2d96d5;--cyan:#20b9c9;--line:#dce3f5;--green:#16805e;--rose:#b7405a;--bg:#f2f5ff;--card:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font:16px/1.5 'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 0 0,#e9e0ff,transparent 37%),radial-gradient(ellipse at 100% 4%,#dbf4ff,transparent 36%),#f3f6ff}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,[role="button"]:focus-visible{outline:3px solid #efad33;outline-offset:3px}button:disabled{opacity:.49;cursor:not-allowed}
.app{width:min(970px,calc(100% - 26px));margin:17px auto 42px}.hero{background:linear-gradient(122deg,#7344dd,#4d67e3 59%,#1bafcb);border-radius:24px;padding:25px 28px 21px;color:#fff;box-shadow:0 10px 0 #cdd4f6,0 20px 35px #41369c23}.eyebrow{font-size:.72rem;font-weight:850;letter-spacing:.1em;color:#ebeeff;text-transform:uppercase}.hero h1{font-size:clamp(1.6rem,4.5vw,2.45rem);line-height:1.15;margin:7px 0 6px}.hero p{margin:0;color:#f1f7ff;max-width:680px}.hero-bottom{display:flex;align-items:center;gap:13px;margin-top:16px;flex-wrap:wrap}.progress-track{flex:1;min-width:100px;height:10px;background:#ffffff52;overflow:hidden;border-radius:20px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#ffe28b,#9cf5e6);transition:width .25s}.progress-text{font-weight:750;font-size:.8rem}
.card{background:var(--card);border:1px solid #e4e9fa;padding:clamp(18px,3.3vw,27px);border-radius:24px;margin-top:22px;box-shadow:0 8px 0 #e1e7f6,0 20px 30px #5d6baf15}.card h2{font-size:clamp(1.33rem,3.6vw,1.75rem);line-height:1.25;margin:8px 0 10px}.card h3{font-size:1.05rem;margin:8px 0}.lead{color:#485775;margin:0 0 18px;line-height:1.6}.kicker{display:inline-block;color:#6147bb;background:#eeebff;padding:5px 12px;border-radius:100px;font-size:.75rem;font-weight:850;letter-spacing:.04em}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.workbox{min-width:0;padding:15px;border-radius:18px;border:1px solid #dfe6f5;background:linear-gradient(146deg,#fff,#f9fbff)}.workbox h3{margin:0 0 8px}.model{display:grid;place-items:center;min-height:210px}.model svg{width:100%;max-width:440px;max-height:265px}.net{display:grid;place-items:center}.net svg{width:100%;max-width:580px;height:auto}.face-chip-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0 0}.face-chip{background:#fff;border:1.8px solid #d5deed;border-radius:11px;padding:9px 5px;min-height:43px;color:#40527b;font-size:.84rem;font-weight:750}.face-chip.chosen{background:#ebe9ff;border-color:#7360df;color:#4e3fbd}.net g[data-face]{cursor:pointer}.net g[data-face]:focus-visible rect:first-child{stroke:#dc900e;stroke-width:4}.stat-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stat{background:#f0efff;border:1px solid #e2e0fc;border-radius:12px;padding:9px 13px;flex:1;min-width:105px}.stat span{display:block;color:#68749a;font-size:.77rem}.stat strong{display:block;color:#5043b7;font-size:1.07rem}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:13px 0}.option{color:#28395e;text-align:left;border:2px solid #dce3f4;background:#fafdff;min-height:67px;padding:13px 16px;border-radius:14px;font-weight:750}.option:hover:not(:disabled){border-color:#9887ea}.option.selected{background:#eeeaff;border-color:#7159df}.option.correct{background:#e9f9f0;border-color:#3ba87a}.option small{display:block;color:#627392;font-weight:550;font-size:.8rem;margin-top:3px}.counter{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:8px}.step{display:grid;place-items:center;border:1.5px solid #c8c6f2;color:#5747b7;background:#f5f3ff;border-radius:11px;min-width:45px;min-height:43px;font-size:1.4rem;font-weight:800}.counter strong{min-width:75px;text-align:center;color:#4636aa;font-size:1.15rem}.hint{background:#f7f8ff;border-left:4px solid #7b6be0;border-radius:10px;padding:12px 14px;font-size:.91rem;color:#465678;margin:12px 0}.feedback{border-radius:13px;padding:12px 15px;margin:15px 0 0;border:1px solid #d5dff7;background:#f2f5ff;font-weight:650}.feedback.ok{background:#e9faf2;border-color:#a7dfc4;color:#146d53}.feedback.err{background:#fff1f3;border-color:#f3bdc7;color:#9c3750}.btn{border:0;border-radius:13px;min-height:48px;padding:12px 18px;color:white;font-weight:850;background:linear-gradient(125deg,#7152dc,#4779e4);box-shadow:0 4px 0 #4137aa}.btn.alt{background:#eeeaff;color:#5946b6;box-shadow:0 4px 0 #d4ceec}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #403ba3}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:21px}.actions .btn{min-width:150px}.callout{background:#fff7e8;border:1px solid #f1dfb5;border-radius:14px;padding:13px 15px;color:#77591e;font-weight:650;margin:14px 0}.subtle{color:var(--muted);font-size:.87rem}.tiles{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:16px 0}.tile{border:2px solid #cdd3ef;background:#fff;padding:10px 15px;min-width:83px;border-radius:13px;color:#4f408f;font-weight:850;box-shadow:0 4px 0 #e2e6f6}.tile.chosen{background:#ece9ff;border-color:#6751db}.slots{display:grid;gap:10px;margin:15px 0}.slot-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(112px,160px);gap:10px;align-items:center;background:#f7f8ff;border:1px solid #e0e5f3;border-radius:12px;padding:11px}.slot-row b{font-size:.9rem}.slot{border:2px dashed #9aa9dc;border-radius:11px;background:#fff;min-height:45px;color:#5447aa;font-weight:800}.slot.filled{border-style:solid;background:#e9f2ff}.plans{display:grid;gap:9px;margin:14px 0}.planrow{border:1px solid #dce4f5;border-radius:13px;background:#fafbff;padding:11px;display:flex;align-items:center;gap:10px}.plan-num{width:32px;height:32px;border-radius:10px;background:#e7e8ff;color:#6150cd;display:grid;place-items:center;flex-shrink:0;font-weight:850}.planrow .plan-text{flex:1;font-weight:650;font-size:.9rem}.move{border:1px solid #cdd6ec;background:#fff;border-radius:8px;color:#4b429a;font-weight:850;padding:6px 10px;min-width:39px;min-height:41px}.model-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.model-option{padding:9px;border-radius:15px;background:#fff;border:2px solid #dee4f4;color:#263859;min-width:0}.model-option.selected{border-color:#7560db;background:#f2eeff}.model-option svg{width:100%;max-height:140px}.model-option b{display:block}.model-option span{font-size:.82rem;color:#5d6b89}.complete{font-size:2.4rem;line-height:1.3}.bigstat{font-size:2rem;font-weight:900;color:#5b45c6}.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.scoreitem{text-align:center;border:1px solid #e0e7f7;border-radius:14px;padding:13px 5px;background:#f6f7ff}.scoreitem b{display:block;font-size:1.7rem;color:#5746bf}.scoreitem span{font-size:.79rem;color:#5d6b86}.footer{text-align:center;font-size:.78rem;color:#8190a7;margin:18px 0}.hidden{display:none!important}
@media(max-width:680px){.app{width:calc(100% - 18px);margin:8px auto 30px}.hero{padding:20px;border-radius:19px}.card{border-radius:18px}.grid2{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}.face-chip-row{grid-template-columns:repeat(3,minmax(0,1fr))}.model-choices{grid-template-columns:1fr}.model-option{display:grid;grid-template-columns:85px 1fr;gap:8px;text-align:left;align-items:center}.model-option svg{grid-row:span 2}.model-option b{align-self:end}.model-option span{align-self:start}.actions .btn{flex:1}.model{min-height:170px}}
@media(max-width:390px){.face-chip{font-size:.75rem;min-height:45px}.tile{min-width:65px}.planrow{gap:6px;padding:8px}.move{padding:5px 7px;min-width:33px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body>
<div class="app">
<header class="hero"><div class="eyebrow">Математическое моделирование · 4 класс</div><h1>ПРОЕКТ.ЛАБ</h1><p>Площадь поверхности: 9 практических задач. Изменяй модель, выбирай грани и принимай решения как настоящий проектировщик.</p><div class="hero-bottom"><span class="progress-text" id="progress-text">Задание 1 из 9</span><div class="progress-track" aria-label="Прогресс"><div class="progress-fill" id="progress-fill"></div></div><span class="progress-text" id="progress-percent">0%</span></div></header>
<main class="card" id="screen" aria-live="polite"></main>
<div class="footer">Без теоретического блока · регистрация не нужна · результаты учителю не отправляются</div>
</div>
<script>
'use strict';
const KEY='surface-project-lab-grade4-v1';
const faces=['top','bottom','front','back','left','right'];
const names={top:'Верх',bottom:'Низ',front:'Передняя',back:'Задняя',left:'Левая',right:'Правая'};
const allFaces=[...faces];
const faceExceptTop=faces.filter(k=>k!=='top');
const walls=['front','back','left','right'];
const planSteps=[
'Уточнить, какие части модели требуется покрыть.',
'Измерить длину, ширину и высоту модели.',
'Вычислить площади нужных граней.',
'Сложить площади, учитывая одинаковые грани.',
'Сравнить результат с запасом материала.'
];
const hint1=[
'На чертеже показаны шесть граней, но верхнюю сторону по условию покрывать не нужно.',
'В расчёте учитывай только покрываемые грани, а не всю коробку.',
'Сравни исходную и изменённую модель. Какие размеры граней содержат высоту?',
'Проверь, какое условие изменилось: нижняя грань не участвует в покрытии.',
'Сначала рассчитай четыре стенки. Затем проверь, какая упаковка достаточна и оставляет меньше всего лишнего.',
'Каждый результат относится к паре противоположных граней, а не к одной грани.',
'Сравни площадь всех шести граней у каждой модели. Только рисунка недостаточно.',
'Сначала определяют задачу и измеряют модель. Проверка запаса выполняется после вычислений.',
'Увеличивай длину, пока весь запас материала ещё позволяет покрыть шесть граней.'
];
const hint2=[
'Проверь, чтобы были выбраны ровно пять граней: все, кроме одной, названной в условии.',
'Верхняя грань имеет площадь 5 × 3 см². Её не следует прибавлять.',
'При изменении высоты площадь верхней и нижней граней сохраняется.',
'Площадь дна равна 6 × 3 см²; исключи её из полного расчёта.',
'У каждой из четырёх стенок высота 2 см. Передняя и задняя имеют длину 6 см, две остальные — 4 см.',
'Площади пар: для каждой пары найди площадь одной грани и умножь на два.',
'У коробок разных пропорций расход может отличаться, даже если они кажутся похожими.',
'Перед сравнением с запасом материала необходимо закончить расчёт.',
'При ширине 3 см и высоте 2 см площадь поверхности увеличивается на 10 см² при каждом увеличении длины на 1 см.'
];
function fresh(){return {idx:0,completed:Array(9).fill(false),tries:Array(9).fill(0),feedback:'',feedbackType:'',selected:null,selectedTile:null,faces:[],height:2,slots:{top:null,front:null,side:null},order:[2,0,4,1,3],length:4,finished:false};}
let st=fresh();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.completed)&&saved.completed.length===9&&Number.isInteger(saved.idx)&&saved.idx>=0&&saved.idx<=9){st={...fresh(),...saved};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function area({l,w,h},coverage=allFaces){let v=0;for(const k of coverage){v+=k==='top'||k==='bottom'?l*w:k==='front'||k==='back'?l*h:w*h;}return v;}
function poly(points,fill){return `<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="${fill}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`}
function boxSvg(d,small=false){let {l,w,h}=d,sx=29,depth=18,sy=34,ox=(460-(l*sx+w*depth))/2,oy=122;let a=[ox,oy],b=[ox+l*sx,oy],c=[b[0],oy+h*sy],e=[ox,oy+h*sy],off=[w*depth,-w*15];let p=x=>[x[0]+off[0],x[1]+off[1]],pt=x=>x.join(',');let btm=Math.max(c[1],p(c)[1]);return `<svg viewBox="0 0 460 292" role="img" aria-label="Прямоугольная коробка: длина ${l} см, ширина ${w} см, высота ${h} см"><g>${poly([a,b,p(b),p(a)],'#ffbb9b')}${poly([b,p(b),p(c),c],'#b4a0f3')}${poly([a,b,c,e],'#74cddd')}</g><g font-family="Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="middle" fill="#26385c"><text x="${(a[0]+b[0])/2}" y="${a[1]+h*sy/2+5}" font-size="${small?21:17}">${l} × ${h}</text><text x="${(a[0]+b[0])/2+off[0]/2}" y="${a[1]+off[1]/2-6}" font-size="${small?17:15}">${l} × ${w}</text><text x="${b[0]+off[0]/2+5}" y="${b[1]+h*sy/2+off[1]/2}" font-size="${small?14:13}">${w}×${h}</text></g>${small?'':`<g stroke="#43497b" stroke-width="1.7" fill="none"><path d="M${a[0]},${btm+15} H${b[0]}"/><path d="M${a[0]-15},${oy} V${e[1]}"/><path d="M${b[0]+16},${oy-13} l${off[0]},${off[1]}"/></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#3b4c79" font-size="13" font-weight="800"><text x="${(a[0]+b[0])/2}" y="${btm+32}">Длина ${l} см</text><text x="${a[0]-25}" y="${oy+h*sy/2}" transform="rotate(-90 ${a[0]-25} ${oy+h*sy/2})">Высота ${h} см</text><text x="${b[0]+off[0]/2+19}" y="${oy+off[1]/2-18}">Ширина ${w} см</text></g>`}</svg>`;}
function netSvg(d,coverage=[],interactive=false){const {l,w,h}=d,totalW=2*(l+w),totalH=2*w+h;const u=Math.min(29,530/totalW,253/totalH),ox=(550-totalW*u)/2,oy=(292-totalH*u)/2;
 const blocks=[['top',w,0,l,w],['left',0,w,w,h],['front',w,w,l,h],['right',w+l,w,w,h],['back',w+l+w,w,l,h],['bottom',w,w+h,l,w]];
 let svg=`<svg viewBox="0 0 550 292" role="img" aria-label="Развёртка коробки. Сторона одной клетки равна 1 см">`;
 for(const [name,x,y,ww,hh] of blocks){const X=ox+x*u,Y=oy+y*u,W=ww*u,H=hh*u,chosen=coverage.includes(name),fill=chosen?'#dcd6ff':'#f6f8fe',stroke=chosen?'#6756d8':'#9aaed6';const live=interactive?`data-face="${name}" role="button" tabindex="0" aria-label="${names[name]}: ${chosen?'выбрана':'не выбрана'}"`:'',lines=[];for(let z=1;z<ww;z++)lines.push(`<path d="M${X+z*u} ${Y} V${Y+H}"/>`);for(let z=1;z<hh;z++)lines.push(`<path d="M${X} ${Y+z*u} H${X+W}"/>`);
 svg+=`<g ${live}><rect x="${X}" y="${Y}" width="${W}" height="${H}" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="${chosen?3:1.5}"/><g stroke="${stroke}" stroke-width=".65" opacity=".55" pointer-events="none">${lines.join('')}</g><text x="${X+W/2}" y="${Y+H/2+3.8}" font-family="Segoe UI,Arial,sans-serif" font-size="${W<53?9:11}" font-weight="800" fill="#384a7d" text-anchor="middle" pointer-events="none">${names[name]}</text>${chosen?`<text x="${X+W-8}" y="${Y+11}" font-family="Arial" font-size="12" font-weight="900" fill="#5440c4" text-anchor="middle" pointer-events="none">✓</text>`:''}</g>`;
 }
 return svg+'</svg>';
}
function model(d,coverage=allFaces){return `<div class="workbox"><h3>Объёмная модель</h3><div class="model">${boxSvg(d)}</div><div class="subtle">Размеры в см. Площадь граней — в см².</div></div>`}
function net(d,coverage=[],interactive=false){return `<div class="workbox"><h3>Развёртка модели</h3><div class="net">${netSvg(d,coverage,interactive)}</div><div class="subtle">Сторона одной клетки равна 1 см.</div>${interactive?`<div class="face-chip-row">${faces.map(f=>`<button type="button" data-act="face" data-face="${f}" class="face-chip ${st.faces.includes(f)?'chosen':''}" aria-pressed="${st.faces.includes(f)}">${names[f]}</button>`).join('')}</div>`:''}</div>`}
function options(items,choice){return `<div class="choice-grid">${items.map((x,i)=>`<button data-act="select" data-value="${i}" class="option ${choice===i?'selected':''}" aria-pressed="${choice===i}">${x}</button>`).join('')}</div>`}
function counter(key,value,min,max,label){return `<div class="workbox"><h3>${label}</h3><div class="counter"><button class="step" data-act="adjust" data-key="${key}" data-delta="-1" ${value<=min?'disabled':''} aria-label="Уменьшить ${label.toLowerCase()}">−</button><strong>${value} см</strong><button class="step" data-act="adjust" data-key="${key}" data-delta="1" ${value>=max?'disabled':''} aria-label="Увеличить ${label.toLowerCase()}">+</button></div></div>`}
function pairSlots(){const slots=[['top','Верхняя и нижняя грани'],['front','Передняя и задняя грани'],['side','Левая и правая грани']];return `<div class="tiles">${[16,24,40,12,20].map(v=>`<button data-act="tile" data-value="${v}" class="tile ${st.selectedTile===v?'chosen':''}">${v} см²</button>`).join('')}</div><div class="slots">${slots.map(([key,label])=>`<div class="slot-row"><b>${label}</b><button data-act="slot" data-key="${key}" class="slot ${st.slots[key]!==null?'filled':''}">${st.slots[key]===null?'Выбери карточку':st.slots[key]+' см²'}</button></div>`).join('')}</div>`}
function plan(){return `<div class="plans">${st.order.map((id,i)=>`<div class="planrow"><span class="plan-num">${i+1}</span><div class="plan-text">${planSteps[id]}</div><button class="move" data-act="move" data-value="${i}" data-delta="-1" ${i===0?'disabled':''} aria-label="Поднять действие ${i+1}">↑</button><button class="move" data-act="move" data-value="${i}" data-delta="1" ${i===4?'disabled':''} aria-label="Опустить действие ${i+1}">↓</button></div>`).join('')}</div>`}
function stages(){switch(st.idx){
case 0:return {label:'Задача 1 · Управление покрытием',title:'Подготовь коробку для витрины',desc:'Коробка размером 5 × 3 × 2 см будет покрыта плёнкой снаружи. Верхнюю грань оставят открытой для обзора. Отметь на развёртке только те грани, которые нужно покрыть.',body:`<div class="grid2">${model({l:5,w:3,h:2})}${net({l:5,w:3,h:2},st.faces,true)}</div>`};
case 1:return {label:'Задача 2 · Точный расход',title:'Сколько квадратных наклеек потребуется?',desc:'Для той же коробки 5 × 3 × 2 см покрывают все грани, кроме верхней. Каждая наклейка закрывает ровно 1 см². Сколько наклеек понадобится?',body:`<div class="grid2">${model({l:5,w:3,h:2})}${net({l:5,w:3,h:2},faceExceptTop)}</div>${options(['32 наклейки','47 наклеек','62 наклейки','50 наклеек'],st.selected)}`};
case 2:return {label:'Задача 3 · Изменение модели',title:'Какие грани изменились?',desc:'Была закрытая коробка 4 × 3 × 2 см. Увеличь только высоту ровно на 1 см. Затем отметь на развёртке все грани, площадь которых изменилась по сравнению с первоначальной коробкой.',body:`<div class="grid2">${counter('height',st.height,2,4,'Высота коробки')}${model({l:4,w:3,h:st.height})}</div>${net({l:4,w:3,h:st.height},st.faces,true)}`};
case 3:return {label:'Задача 4 · Найди ошибку',title:'Проверь расчёт для коробки без дна',desc:'Для коробки 6 × 3 × 2 см покрывают все стороны, кроме нижней. Проектировщик записал: «Площадь покрытия — 72 см²». Какой результат правильный?',body:`<div class="grid2">${model({l:6,w:3,h:2})}${net({l:6,w:3,h:2},faceExceptTop.filter(f=>f!=='bottom').concat('top'))}</div><div class="callout">В записи проектировщика учтены все шесть граней. Но дно не покрывают.</div>${options(['36 см²','54 см²','72 см²','60 см²'],st.selected)}`};
case 4:return {label:'Задача 5 · Экономный выбор',title:'Подбери упаковку без лишних расходов',desc:'Для коробки 6 × 4 × 2 см нужны наклейки только на четыре боковые стенки. Продаются упаковки с разным количеством квадратных наклеек 1 × 1 см. Какую минимальную достаточную упаковку выбрать?',body:`<div class="grid2">${model({l:6,w:4,h:2})}${net({l:6,w:4,h:2},walls)}</div>${options(['36 наклеек','40 наклеек','48 наклеек','60 наклеек'],st.selected)}`};
case 5:return {label:'Задача 6 · Сборка расчёта',title:'Распредели площади пар граней',desc:'Закрытую коробку 5 × 4 × 2 см покрывают целиком. Выбери карточку с площадью двух одинаковых граней, затем нажми на соответствующую строку. Три карточки должны оказаться на своих местах.',body:`<div class="grid2">${model({l:5,w:4,h:2})}${net({l:5,w:4,h:2},allFaces)}</div>${pairSlots()}`};
case 6:{let choices=[{l:4,w:3,h:2},{l:3,w:3,h:3},{l:6,w:2,h:2}];return {label:'Задача 7 · Сравнение проектов',title:'Какой макет требует меньше материала?',desc:'Для трёх разных закрытых коробок нужно полностью покрыть все шесть граней. Выбери проект, на который потребуется меньше всего наклеек площадью 1 см². Сначала сравни площади поверхностей.',body:`<div class="model-choices">${choices.map((d,i)=>`<button data-act="select" data-value="${i}" class="model-option ${st.selected===i?'selected':''}">${boxSvg(d,true)}<b>Проект ${'АБВ'[i]}</b><span>${d.l} × ${d.w} × ${d.h} см</span></button>`).join('')}</div>`};}
case 7:return {label:'Задача 8 · Алгоритм проектировщика',title:'Восстанови правильный план',desc:'Команды перепутаны. Перемести их кнопками ↑ и ↓ так, чтобы получился разумный порядок расчёта материала для покрытия модели.',body:plan()};
case 8:{let d={l:st.length,w:3,h:2},s=area(d),left=72-s;return {label:'Задача 9 · Финальный проект',title:'Создай максимально длинный футляр',desc:'Для закрытого футляра шириной 3 см и высотой 2 см выделили 72 квадратные наклейки 1 × 1 см. Изменяй только длину (от 3 до 8 см). Найди наибольшую возможную длину, при которой наклеек хватит для покрытия всех шести граней.',body:`<div class="grid2">${counter('length',st.length,3,8,'Длина футляра')}${model(d)}</div><div class="stat-row"><div class="stat"><span>Площадь покрытия</span><strong>${s} см²</strong></div><div class="stat"><span>Запас</span><strong>72 см²</strong></div><div class="stat"><span>Остаток</span><strong>${left>=0?left+' шт.':'Не хватит '+(-left)+' шт.'}</strong></div></div>${net(d,allFaces)}`};}
}}
function check(){if(st.completed[st.idx])return;let valid=false;switch(st.idx){
case 0:valid=st.faces.length===5&&faceExceptTop.every(f=>st.faces.includes(f));break;
case 1:valid=st.selected===1;break;
case 2:valid=st.height===3&&st.faces.length===4&&walls.every(f=>st.faces.includes(f));break;
case 3:valid=st.selected===1;break;
case 4:valid=st.selected===1;break;
case 5:valid=st.slots.top===40&&st.slots.front===20&&st.slots.side===16;break;
case 6:valid=st.selected===0;break;
case 7:valid=st.order.every((x,i)=>x===i);break;
case 8:valid=st.length===6&&area({l:st.length,w:3,h:2})<=72;break;
}
 st.tries[st.idx]++;st.feedbackType=valid?'ok':'err';st.feedback=valid?(st.tries[st.idx]===1?'Верно! Задание выполнено самостоятельно.':'Верно! Ты нашёл решение после дополнительной попытки.'):(st.tries[st.idx]===1?hint1[st.idx]:hint2[st.idx]);if(valid)st.completed[st.idx]=true;persist();render();}
function report(){let independent=st.tries.filter((n,i)=>st.completed[i]&&n===1).length,assisted=st.completed.filter((v,i)=>v&&st.tries[i]>1).length,attempts=st.tries.reduce((a,b)=>a+b,0);return `ПРОЕКТ.ЛАБ — Площадь поверхности, 4 класс\nВыполнено задач: ${st.completed.filter(Boolean).length}/9\nС первой попытки: ${independent}/9\nПосле дополнительных попыток: ${assisted}/9\nВсего проверок: ${attempts}\nФинальный проект: коробка 6 × 3 × 2 см, площадь покрытия 72 см².`;}
function results(){let independent=st.tries.filter((n,i)=>st.completed[i]&&n===1).length,assisted=st.completed.filter((v,i)=>v&&st.tries[i]>1).length;return `<div style="text-align:center"><div class="complete">🏆</div><span class="kicker">Практикум завершён</span><h2>Проектная лаборатория пройдена!</h2><p class="lead">Ты выделял грани на развёртке, изменял модель, исправлял расчёты и находил решение при ограниченном запасе материала.</p></div><div class="scorecards"><div class="scoreitem"><b>9/9</b><span>Выполнено задач</span></div><div class="scoreitem"><b>${independent}/9</b><span>С первой попытки</span></div><div class="scoreitem"><b>${assisted}/9</b><span>После исправления</span></div></div><div class="workbox" style="text-align:center"><h3>Финальный футляр</h3><div class="model">${boxSvg({l:6,w:3,h:2})}</div><div class="bigstat">72 см²</div><p class="lead">Столько материала требуется для покрытия всех шести граней.</p></div><div class="actions"><button class="btn alt" data-act="copy">Скопировать результат</button><button class="btn" data-act="reset">Пройти ещё раз</button></div><p class="subtle" id="copy-status" role="status"></p>`;}
function render(){const screen=document.getElementById('screen'),done=st.completed.filter(Boolean).length;document.getElementById('progress-text').textContent=st.idx>=9?'Практикум завершён':`Задание ${st.idx+1} из 9`;document.getElementById('progress-percent').textContent=Math.round(done/9*100)+'%';document.getElementById('progress-fill').style.width=(done/9*100)+'%';if(st.idx>=9){screen.innerHTML=results();return;}const t=stages();screen.innerHTML=`<span class="kicker">${t.label}</span><h2>${t.title}</h2><p class="lead">${t.desc}</p>${t.body}${st.feedback?`<div role="status" class="feedback ${st.feedbackType}">${st.feedback}</div>`:''}<div class="actions">${st.completed[st.idx]?`<button class="btn" data-act="next">${st.idx===8?'К результатам':'Следующее задание →'}</button>`:`<button class="btn" data-act="check">Проверить решение</button>`}</div>`;}
function update(){st.feedback='';st.feedbackType='';persist();render();}
function copyReport(){let v=report();const status=document.getElementById('copy-status');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>status.textContent='Результат скопирован.').catch(()=>fallback(v));}else fallback(v);}
function fallback(v){const text=document.createElement('textarea');text.value=v;document.body.appendChild(text);text.select();const ok=document.execCommand('copy');text.remove();const status=document.getElementById('copy-status');if(status)status.textContent=ok?'Результат скопирован.':'Не удалось скопировать автоматически.';}
function toggleFace(name){if(st.completed[st.idx]||![0,2].includes(st.idx)||!faces.includes(name))return;st.faces=st.faces.includes(name)?st.faces.filter(x=>x!==name):[...st.faces,name];update();}
document.getElementById('screen').addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(!target){const f=e.target.closest('[data-face]');if(f)toggleFace(f.dataset.face);return;}const act=target.dataset.act;if(st.idx<9&&st.completed[st.idx]&&act!=='next')return;
 if(act==='face'){toggleFace(target.dataset.face);return;}
 if(act==='select'){st.selected=Number(target.dataset.value);update();return;}
 if(act==='adjust'){const key=target.dataset.key,delta=Number(target.dataset.delta);if(key==='height')st.height=Math.max(2,Math.min(4,st.height+delta));if(key==='length')st.length=Math.max(3,Math.min(8,st.length+delta));update();return;}
 if(act==='tile'){st.selectedTile=Number(target.dataset.value);update();return;}
 if(act==='slot'){const key=target.dataset.key;if(st.selectedTile!==null){st.slots[key]=st.selectedTile;st.selectedTile=null;update();}else if(st.slots[key]!==null){st.slots[key]=null;update();}return;}
 if(act==='move'){const i=Number(target.dataset.value),j=i+Number(target.dataset.delta);if(j>=0&&j<st.order.length){[st.order[i],st.order[j]]=[st.order[j],st.order[i]];update();}return;}
 if(act==='check'){check();return;}
 if(act==='next'){if(st.completed[st.idx]){st.idx++;st.selected=null;st.selectedTile=null;st.faces=[];st.feedback='';st.feedbackType='';persist();render();window.scrollTo({top:0,behavior:'smooth'});}return;}
 if(act==='copy'){copyReport();return;}
 if(act==='reset'){if(confirm('Пройти все 9 задач заново? Текущий результат на этом устройстве будет сброшен.')){st=fresh();persist();render();window.scrollTo({top:0,behavior:'smooth'});}return;}
});
document.getElementById('screen').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('g[data-face]');if(el){e.preventDefault();toggleFace(el.dataset.face);}}});
render();
</script>
</body>
</html>
